w_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-26.4(5)", "section": "Article 26 — Respite Camp Session", "subsection": "§26.4 Specific Service Limitations (5)", "text": "Specific Service Limitations: as a full time, summer or day program.", "category": "exception", "applies_to": "agency", "codes": ["RPS"], "creates_user_task": "no", "source": "DHHS91172 SOW §26.4(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-26.5", "section": "Article 26 — Respite Camp Session", "subsection": "§26.5 Outcomes", "text": "Outcomes. (a) The intended outcome of this service is to provide a break to the Person's normal caregiver. (b) Measures: The percentage of Persons who remained living in a community-based setting with their family. (c) Reporting: The Contractor shall create a fiscal year annual report starting fiscal year 2025 (fiscal year 2025 starts July 1, 2024). The fiscal year annual report will be submitted via Google Form by August 30th, 60 days after each fiscal year end. The outcome Google Form will be posted on the DSPD webpage. The Contractor shall explain any quality improvement activities they will undertake in response to their evaluation of the measurement data. The fiscal year annual report must include the following:", "category": "outcome", "applies_to": "agency", "codes": ["RPS"], "creates_user_task": "no", "source": "DHHS91172 SOW §26.5", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-26.5(1)", "section": "Article 26 — Respite Camp Session", "subsection": "§26.5 Outcomes (1)", "text": "Outcomes.: how many Persons received RPS; and", "category": "outcome", "applies_to": "agency", "codes": ["RPS"], "creates_user_task": "no", "source": "DHHS91172 SOW §26.5(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-26.5(2)", "section": "Article 26 — Respite Camp Session", "subsection": "§26.5 Outcomes (2)", "text": "Outcomes.: data reflecting the measure in (b) above.", "category": "outcome", "applies_to": "agency", "codes": ["RPS"], "creates_user_task": "no", "source": "DHHS91172 SOW §26.5(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-27.1", "section": "Article 27 — Supported Employment With A Co-Worker", "subsection": "§27.1 General Description", "text": "General Description. SEC services support Persons in their efforts to obtain, maintain, and advance in Competitive Integrated Employment. Supports are provided to the Person from a co-worker when the Person is at work. SEC is a pass through payment to the Person and their co-worker's Employer.", "category": "definition", "applies_to": "agency", "codes": ["SEC"], "creates_user_task": "no", "source": "DHHS91172 SOW §27.1", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-27.2", "section": "Article 27 — Supported Employment With A Co-Worker", "subsection": "§27.2 Direct Service Requirements", "text": "Direct Service Requirements. The Contractor shall:", "category": "actionable", "applies_to": "agency", "codes": ["SEC"], "creates_user_task": "yes", "source": "DHHS91172 SOW §27.2", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-27.2(1)", "section": "Article 27 — Supported Employment With A Co-Worker", "subsection": "§27.2 Direct Service Requirements (1)", "text": "Direct Service Requirements: arrange with the employer of a private business for a Person employed in Competitive Integrated Employment to have a Person's co-worker provide additional support when the Person is scheduled to work; and", "category": "actionable", "applies_to": "agency", "codes": ["SEC"], "creates_user_task": "yes", "source": "DHHS91172 SOW §27.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-27.2(2)", "section": "Article 27 — Supported Employment With A Co-Worker", "subsection": "§27.2 Direct Service Requirements (2)", "text": "provide the Person's employer and co-worker with training on the Person's support needs. The training must be completed by the Person's job coach who provides the Person with SEI services.", "category": "staff_qualification", "applies_to": "staff", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §27.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-27.3", "section": "Article 27 — Supported Employment With A Co-Worker", "subsection": "§27.3 Direct Service Administrative Requirements", "text": "Direct Service Administrative Requirements. The Contractor shall maintain documentation of the pass through funds and co-worker supports the Person received.", "category": "documentation", "applies_to": "agency", "codes": ["SEC"], "creates_user_task": "yes", "source": "DHHS91172 SOW §27.3", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-27.4", "section": "Article 27 — Supported Employment With A Co-Worker", "subsection": "§27.4 Specific Service Limitations", "text": "Specific Service Limitations. In addition to the General Limitations section of this contract, the Contractor shall NOT:", "category": "exception", "applies_to": "agency", "codes": ["SEC"], "creates_user_task": "no", "source": "DHHS91172 SOW §27.4", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-27.4(1)", "section": "Article 27 — Supported Employment With A Co-Worker", "subsection": "§27.4 Specific Service Limitations (1)", "text": "Specific Service Limitations: bill DSPD for supervisory activities that are provided as a normal part of the employment setting;", "category": "exception", "applies_to": "agency", "codes": ["SEC"], "creates_user_task": "no", "source": "DHHS91172 SOW §27.4(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-27.4(2)", "section": "Article 27 — Supported Employment With A Co-Worker", "subsection": "§27.4 Specific Service Limitations (2)", "text": "Specific Service Limitations: utilize SEC payments to fund incentive payments or unrelated vocational training expenses; and", "category": "exception", "applies_to": "agency", "codes": ["SEC"], "creates_user_task": "no", "source": "DHHS91172 SOW §27.4(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-27.4(3)", "section": "Article 27 — Supported Employment With A Co-Worker", "subsection": "§27.4 Specific Service Limitations (3)", "text": "Specific Service Limitations: bill DSPD for SEC for supporting the Person in a volunteer setting.", "category": "exception", "applies_to": "agency", "codes": ["SEC"], "creates_user_task": "no", "source": "DHHS91172 SOW §27.4(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-27.5", "section": "Article 27 — Supported Employment With A Co-Worker", "subsection": "§27.5 Specific Service Contractor Qualifications", "text": "Specific Service Contractor Qualifications. The Contractor shall provide the Person's SEI services.", "category": "agency_qualification", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §27.5", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-27.6", "section": "Article 27 — Supported Employment With A Co-Worker", "subsection": "§27.6 Outcomes", "text": "Outcomes. (a) The intended outcome of this service is maintenance of Competitive Integrated Employment. (b) Measures: The percentage of Persons who remained in Competitive Integrated Employment. (c) Reporting: The Contractor shall create a fiscal year annual report starting fiscal year 2025 (fiscal year 2025 starts July 1, 2024). The fiscal year annual report will be submitted via Google Form by August 30th, 60 days after each fiscal year end. The outcome Google Form will be posted on the DSPD webpage. The Contractor shall explain any quality improvement activities they will undertake in response to their evaluation of the measurement data. The fiscal year annual report must include the following:", "category": "outcome", "applies_to": "agency", "codes": ["SEC"], "creates_user_task": "no", "source": "DHHS91172 SOW §27.6", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-27.6(1)", "section": "Article 27 — Supported Employment With A Co-Worker", "subsection": "§27.6 Outcomes (1)", "text": "Outcomes.: how many Persons received SEC; and", "category": "outcome", "applies_to": "agency", "codes": ["SEC"], "creates_user_task": "no", "source": "DHHS91172 SOW §27.6(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-27.6(2)", "section": "Article 27 — Supported Employment With A Co-Worker", "subsection": "§27.6 Outcomes (2)", "text": "Outcomes.: data reflecting the measure in (b) above.", "category": "outcome", "applies_to": "agency", "codes": ["SEC"], "creates_user_task": "no", "source": "DHHS91172 SOW §27.6(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-27.7", "section": "Article 27 — Supported Employment With A Co-Worker", "subsection": "§27.7 Rate", "text": "Rate. SEC is a quarter hour rate paid to the Contractor to reimburse the Person's employer for the co-worker support as a pass-through payment.", "category": "billing", "applies_to": "service_record", "codes": ["SEC"], "creates_user_task": "yes", "source": "DHHS91172 SOW §27.7", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-28.1", "section": "Article 28 — Supported Employment In A Group", "subsection": "§28.1 General Description", "text": "General Description. SED supports workgroups of Persons in their efforts to obtain, maintain, and advance in Competitive Integrated Employment.", "category": "definition", "applies_to": "agency", "codes": ["SED"], "creates_user_task": "no", "source": "DHHS91172 SOW §28.1", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-28.2", "section": "Article 28 — Supported Employment In A Group", "subsection": "§28.2 Direct Service Requirements", "text": "Direct Service Requirements. The Contractor shall:", "category": "actionable", "applies_to": "agency", "codes": ["SED"], "creates_user_task": "yes", "source": "DHHS91172 SOW §28.2", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-28.2(1)", "section": "Article 28 — Supported Employment In A Group", "subsection": "§28.2 Direct Service Requirements (1)", "text": "Direct Service Requirements: provide Persons SED in workgroups including enclaves and mobile work crews. Workgroups can include between two and eight Persons;", "category": "actionable", "applies_to": "agency", "codes": ["SED"], "creates_user_task": "yes", "source": "DHHS91172 SOW §28.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-28.2(2)", "section": "Article 28 — Supported Employment In A Group", "subsection": "§28.2 Direct Service Requirements (2)", "text": "Direct Service Requirements: provide workgroup training, supervision and employment at a location not owned by the Contractor in a setting where the Person has opportunity to interact with other individuals who are not part of the SED group and the majority of whom are without disabilities;", "category": "staff_qualification", "applies_to": "staff", "codes": ["SED"], "creates_user_task": "yes", "source": "DHHS91172 SOW §28.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-28.2(3)", "section": "Article 28 — Supported Employment In A Group", "subsection": "§28.2 Direct Service Requirements (3)", "text": "assess the Person's individual skills, interests, preferences, transferable skills, accommodations and potential workplace barriers to prepare them for individual Competitive Integrated Employment. Assessments must take place at an approved facility, employment site, or in the community;", "category": "actionable", "applies_to": "site", "codes": ["SED"], "creates_user_task": "yes", "source": "DHHS91172 SOW §28.2(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-28.2(4)", "section": "Article 28 — Supported Employment In A Group", "subsection": "§28.2 Direct Service Requirements (4)", "text": "Direct Service Requirements: support the Person with Informed Choice experiences, conversations and experiences connected to the Competitive Integrated Employment goal in the Person's PCSP;", "category": "client", "applies_to": "client", "codes": ["SED"], "creates_user_task": "yes", "source": "DHHS91172 SOW §28.2(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-28.2(5)", "section": "Article 28 — Supported Employment In A Group", "subsection": "§28.2 Direct Service Requirements (5)", "text": "provide the Person's transportation during the SED program. The Contractor may bill DSPD for MTP for the Contractor's transportation of the Person to and from the Person's home. The Contractor shall provide any necessary Staff during transportation, to ensure the Person's health and safety; and", "category": "actionable", "applies_to": "agency", "codes": ["MTP", "SED"], "creates_user_task": "yes", "source": "DHHS91172 SOW §28.2(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-28.2(6)", "section": "Article 28 — Supported Employment In A Group", "subsection": "§28.2 Direct Service Requirements (6)", "text": "Direct Service Requirements: maintain written plans, supports and strategies intended to increase on-the-job independence and fade paid employment services.", "category": "actionable", "applies_to": "agency", "codes": ["SED"], "creates_user_task": "yes", "source": "DHHS91172 SOW §28.2(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-28.3", "section": "Article 28 — Supported Employment In A Group", "subsection": "§28.3 Specific Service Limitations", "text": "Specific Service Limitations. In addition to the General Limitations section of this contract, the Contractor shall NOT:", "category": "exception", "applies_to": "agency", "codes": ["SED"], "creates_user_task": "no", "source": "DHHS91172 SOW §28.3", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-28.3(1)", "section": "Article 28 — Supported Employment In A Group", "subsection": "§28.3 Specific Service Limitations (1)", "text": "Specific Service Limitations: utilize SED payments to fund incentive payments, subsidies, or unrelated vocational training expenses, including incentive payments made to an employer or beneficiaries to encourage or subsidize an employer participation in a supported employment program;", "category": "exception", "applies_to": "agency", "codes": ["SED"], "creates_user_task": "no", "source": "DHHS91172 SOW §28.3(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-28.3(2)", "section": "Article 28 — Supported Employment In A Group", "subsection": "§28.3 Specific Service Limitations (2)", "text": "pay Persons less than what is paid to other employees without disabilities performing similar labor. If the Contractor pays a Person less than minimum wage, the DHHS service code EPR must be used; and", "category": "exception", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "no", "source": "DHHS91172 SOW §28.3(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-28.3(3)", "section": "Article 28 — Supported Employment In A Group", "subsection": "§28.3 Specific Service Limitations (3)", "text": "Specific Service Limitations: bill DSPD for SED for the Person's support in a volunteer setting unless prior written approval was obtained from the DSPD Director or designee.", "category": "exception", "applies_to": "agency", "codes": ["SED"], "creates_user_task": "no", "source": "DHHS91172 SOW §28.3(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-28.4", "section": "Article 28 — Supported Employment In A Group", "subsection": "§28.4 Specific Service Contractor Qualifications", "text": "Specific Service Contractor Qualifications. Prior to providing services, the Contractor shall ensure SED Staff have successfully completed:", "category": "staff_qualification", "applies_to": "staff", "codes": ["SED"], "creates_user_task": "yes", "source": "DHHS91172 SOW §28.4", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-28.4(1)", "section": "Article 28 — Supported Employment In A Group", "subsection": "§28.4 Specific Service Contractor Qualifications (1)", "text": "ACRE training through Utah State University or any accredited program available through the ACRE website; or", "category": "staff_qualification", "applies_to": "staff", "codes": ["SED"], "creates_user_task": "yes", "source": "DHHS91172 SOW §28.4(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-28.4(2)", "section": "Article 28 — Supported Employment In A Group", "subsection": "§28.4 Specific Service Contractor Qualifications (2)", "text": "Basic Employment Specialist Training (no longer offered); or", "category": "staff_qualification", "applies_to": "staff", "codes": ["SED"], "creates_user_task": "yes", "source": "DHHS91172 SOW §28.4(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-28.4(3)", "section": "Article 28 — Supported Employment In A Group", "subsection": "§28.4 Specific Service Contractor Qualifications (3)", "text": "Specific Service Contractor Qualifications: be signed up for and complete the next available Workplace Supports Training or Effective Job Coach Training through Utah State University. If the SED Staff completes Workplace Supports Training, they may only do job coaching, and NOT job development, assessments, or Customized Employment. Workplace Supports Training is available here: https://ceiutah.com/workplace-supports-training/", "category": "staff_qualification", "applies_to": "staff", "codes": ["SED"], "creates_user_task": "yes", "source": "DHHS91172 SOW §28.4(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-28.5", "section": "Article 28 — Supported Employment In A Group", "subsection": "§28.5 Outcomes", "text": "Outcomes. (a) The intended outcome of this service is to receive skills building needed to succeed in individual Competitive Integrated Employment (b) Measures:", "category": "outcome", "applies_to": "agency", "codes": ["SED"], "creates_user_task": "no", "source": "DHHS91172 SOW §28.5", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-28.5(1)", "section": "Article 28 — Supported Employment In A Group", "subsection": "§28.5 Outcomes (1)", "text": "Outcomes.: the percentage of Persons who developed skills to move into Competitive Integrated Employment; and", "category": "outcome", "applies_to": "agency", "codes": ["SED"], "creates_user_task": "no", "source": "DHHS91172 SOW §28.5(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-28.5(2)", "section": "Article 28 — Supported Employment In A Group", "subsection": "§28.5 Outcomes (2)", "text": "the percentage of Persons who moved into Competitive Integrated Employment. (c) Reporting: The Contractor shall create a fiscal year annual report starting fiscal year 2025 (fiscal year 2025 starts July 1, 2024). The fiscal year annual report will be submitted via Google Form by August 30th, 60 days after each fiscal year end. The outcome Google Form will be posted on the DSPD webpage. The Contractor shall explain any quality improvement activities they will undertake in response to their evaluation of the measurement data. The fiscal year annual report must include the following:", "category": "outcome", "applies_to": "agency", "codes": ["SED"], "creates_user_task": "no", "source": "DHHS91172 SOW §28.5(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-28.5(1)-2", "section": "Article 28 — Supported Employment In A Group", "subsection": "§28.5 Outcomes (1)", "text": "Outcomes.: how many Persons received SED; and", "category": "outcome", "applies_to": "agency", "codes": ["SED"], "creates_user_task": "no", "source": "DHHS91172 SOW §28.5(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-28.5(2)-2", "section": "Article 28 — Supported Employment In A Group", "subsection": "§28.5 Outcomes (2)", "text": "Outcomes.: data reflecting the measure in (b) above.", "category": "outcome", "applies_to": "agency", "codes": ["SED"], "creates_user_task": "no", "source": "DHHS91172 SOW §28.5(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-28.6", "section": "Article 28 — Supported Employment In A Group", "subsection": "§28.6 Rate", "text": "Rate. SED is a daily rate per Person.", "category": "billing", "applies_to": "service_record", "codes": ["SED"], "creates_user_task": "yes", "source": "DHHS91172 SOW §28.6", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-29.1", "section": "Article 29 — Supported Employment Enterprise", "subsection": "§29.1 General Description", "text": "General Description. SEE services support Persons who are working competitively to establish, maintain, or advance their self-employment in a business enterprise of the Person's creation.", "category": "definition", "applies_to": "agency", "codes": ["SEE"], "creates_user_task": "no", "source": "DHHS91172 SOW §29.1", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-29.2", "section": "Article 29 — Supported Employment Enterprise", "subsection": "§29.2 Direct Service Requirements", "text": "Direct Service Requirements. (a) The Contractor shall conduct assessments with the Person to determine interests, preferences, transferable skills, accommodations and potential workplace barriers of the Person before self-employment. The Contractor shall provide assessments at an approved facility or employment site. (b) The Contractor shall assist the Person in conducting business enterprise development activities, including:", "category": "actionable", "applies_to": "site", "codes": ["SEE"], "creates_user_task": "yes", "source": "DHHS91172 SOW §29.2", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-29.2(1)", "section": "Article 29 — Supported Employment Enterprise", "subsection": "§29.2 Direct Service Requirements (1)", "text": "Direct Service Requirements.: locating potential customers in the community;", "category": "actionable", "applies_to": "agency", "codes": ["SEE"], "creates_user_task": "yes", "source": "DHHS91172 SOW §29.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-29.2(2)", "section": "Article 29 — Supported Employment Enterprise", "subsection": "§29.2 Direct Service Requirements (2)", "text": "Direct Service Requirements.: introducing the Person to specific customers;", "category": "actionable", "applies_to": "agency", "codes": ["SEE"], "creates_user_task": "yes", "source": "DHHS91172 SOW §29.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-29.2(3)", "section": "Article 29 — Supported Employment Enterprise", "subsection": "§29.2 Direct Service Requirements (3)", "text": "Direct Service Requirements.: conducting business development and market analyses;", "category": "actionable", "applies_to": "agency", "codes": ["SEE"], "creates_user_task": "yes", "source": "DHHS91172 SOW §29.2(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-29.2(4)", "section": "Article 29 — Supported Employment Enterprise", "subsection": "§29.2 Direct Service Requirements (4)", "text": "Direct Service Requirements.: arranging for certification, licenses and other related activities that will enhance enterprise development and creation opportunities;", "category": "staff_qualification", "applies_to": "staff", "codes": ["SEE"], "creates_user_task": "yes", "source": "DHHS91172 SOW §29.2(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-29.2(5)", "section": "Article 29 — Supported Employment Enterprise", "subsection": "§29.2 Direct Service Requirements (5)", "text": "Direct Service Requirements.: creating a business plan;", "category": "actionable", "applies_to": "agency", "codes": ["SEE"], "creates_user_task": "yes", "source": "DHHS91172 SOW §29.2(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-29.2(6)", "section": "Article 29 — Supported Employment Enterprise", "subsection": "§29.2 Direct Service Requirements (6)", "text": "Direct Service Requirements.: obtaining business financing;", "category": "actionable", "applies_to": "agency", "codes": ["SEE"], "creates_user_task": "yes", "source": "DHHS91172 SOW §29.2(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-29.2(7)", "section": "Article 29 — Supported Employment Enterprise", "subsection": "§29.2 Direct Service Requirements (7)", "text": "Direct Service Requirements.: establishing and maintaining financial management and accounting systems; and", "category": "actionable", "applies_to": "agency", "codes": ["SEE"], "creates_user_task": "yes", "source": "DHHS91172 SOW §29.2(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-29.2(8)", "section": "Article 29 — Supported Employment Enterprise", "subsection": "§29.2 Direct Service Requirements (8)", "text": "implementing the business. (c) The Contractor shall support the person to grow and maintain self-employment business enterprise including: job coaching, expanding business partners, networking, operations/budgeting tasks, and other duties as approved by DSPD. (d) The Contractor shall transport the Person to and from the Person's home and service related activities. (e) If the Person has indicated a desire to explore other Competitive Integrated Employment, some SEE time may be used to support the Person with Informed Choice conversations and experiences connected to the Competitive Integrated Employment goals and interests.", "category": "client", "applies_to": "client", "codes": ["SEE"], "creates_user_task": "yes", "source": "DHHS91172 SOW §29.2(8)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-29.3", "section": "Article 29 — Supported Employment Enterprise", "subsection": "§29.3 Specific Service Limitations", "text": "Specific Service Limitations. In addition to the General Limitations section of this contract, the Contractor shall NOT:", "category": "exception", "applies_to": "agency", "codes": ["SEE"], "creates_user_task": "no", "source": "DHHS91172 SOW §29.3", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-29.3(1)", "section": "Article 29 — Supported Employment Enterprise", "subsection": "§29.3 Specific Service Limitations (1)", "text": "Specific Service Limitations: bill DSPD for services that are not for adaptations, supervision, and training required by the Person as a result of the Person's disability;", "category": "exception", "applies_to": "agency", "codes": ["SEE"], "creates_user_task": "no", "source": "DHHS91172 SOW §29.3(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-29.3(2)", "section": "Article 29 — Supported Employment Enterprise", "subsection": "§29.3 Specific Service Limitations (2)", "text": "Specific Service Limitations: utilize SEE payments to fund incentive payments, subsidies, or unrelated vocational training expenses, including incentive payments made to an employer or beneficiaries to encourage or subsidize an employer's participation in a supported employment program;", "category": "exception", "applies_to": "agency", "codes": ["SEE"], "creates_user_task": "no", "source": "DHHS91172 SOW §29.3(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-29.3(3)", "section": "Article 29 — Supported Employment Enterprise", "subsection": "§29.3 Specific Service Limitations (3)", "text": "Specific Service Limitations: bill DSPD for SEE for supporting the Person in a volunteer setting unless prior written approval has been obtained from the DSPD Director or designee; and", "category": "exception", "applies_to": "agency", "codes": ["SEE"], "creates_user_task": "no", "source": "DHHS91172 SOW §29.3(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-29.3(4)", "section": "Article 29 — Supported Employment Enterprise", "subsection": "§29.3 Specific Service Limitations (4)", "text": "Specific Service Limitations: bill DSPD for SEE on the same day as SEI.", "category": "exception", "applies_to": "agency", "codes": ["SEE", "SEI"], "creates_user_task": "no", "source": "DHHS91172 SOW §29.3(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-29.4", "section": "Article 29 — Supported Employment Enterprise", "subsection": "§29.4 Specific Service Contractor Qualifications", "text": "Specific Service Contractor Qualifications. The Contractor shall:", "category": "agency_qualification", "applies_to": "agency", "codes": ["SEE"], "creates_user_task": "yes", "source": "DHHS91172 SOW §29.4", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-29.4(1)", "section": "Article 29 — Supported Employment Enterprise", "subsection": "§29.4 Specific Service Contractor Qualifications (1)", "text": "Specific Service Contractor Qualifications: prior to providing services, ensure SEE Staff have successfully completed:", "category": "staff_qualification", "applies_to": "staff", "codes": ["SEE"], "creates_user_task": "yes", "source": "DHHS91172 SOW §29.4(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-29.4(1)(A)", "section": "Article 29 — Supported Employment Enterprise", "subsection": "§29.4 Specific Service Contractor Qualifications (1)(A)", "text": "ACRE training through Utah State University or any accredited program available through the ACRE website; or Basic Employment Specialist Training (no longer offered); and", "category": "staff_qualification", "applies_to": "staff", "codes": ["SEE"], "creates_user_task": "yes", "source": "DHHS91172 SOW §29.4(1)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-29.4(1)(B)", "section": "Article 29 — Supported Employment Enterprise", "subsection": "§29.4 Specific Service Contractor Qualifications (1)(B)", "text": "Customized Employment Training through Utah State University, available here: https://ceiutah.com/ce-training/.", "category": "staff_qualification", "applies_to": "staff", "codes": ["SEE"], "creates_user_task": "yes", "source": "DHHS91172 SOW §29.4(1)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-29.4(2)", "section": "Article 29 — Supported Employment Enterprise", "subsection": "§29.4 Specific Service Contractor Qualifications (2)", "text": "be signed up for and complete the first available Workplace Supports Training or Effective Job Coach Training through Utah State University. Workplace Supports and Effective Job Coaching Training can only be accessed as a minimum training requirement in SEE when Staff is supervised by another ACRE or Customized Employment trained Staff and the individual employment support only requires job coaching to maintain existing business tasks. Direct Service Requirements outlined in 28.2 to learn new tasks and develop and grow business shall be completed by ACRE or Customized Employment trained Staff.", "category": "staff_qualification", "applies_to": "staff", "codes": ["SEE"], "creates_user_task": "yes", "source": "DHHS91172 SOW §29.4(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-29.5", "section": "Article 29 — Supported Employment Enterprise", "subsection": "§29.5 Outcomes", "text": "Outcomes. (a) The intended outcome of this service is to create or maintain competitive and integrated self employment with compensation equal to others without disabilities engaging in similar work. (b) Measures: The percentage of Persons who created or maintained self employment with compensation equal to or greater to others without disabilities engaging in similar work. (c) Reporting: The Contractor shall create a fiscal year annual report starting fiscal year 2025 (fiscal year 2025 starts July 1, 2024). The fiscal year annual report will be submitted via Google Form by August 30th, 60 days after each fiscal year end. The outcome Google Form will be posted on the DSPD webpage. The Contractor shall explain any quality improvement activities they will undertake in response to their evaluation of the measurement data. The fiscal year annual report must include the following:", "category": "outcome", "applies_to": "agency", "codes": ["SEE"], "creates_user_task": "no", "source": "DHHS91172 SOW §29.5", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-29.5(1)", "section": "Article 29 — Supported Employment Enterprise", "subsection": "§29.5 Outcomes (1)", "text": "Outcomes.: how many Persons received SEE; and", "category": "outcome", "applies_to": "agency", "codes": ["SEE"], "creates_user_task": "no", "source": "DHHS91172 SOW §29.5(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-29.5(2)", "section": "Article 29 — Supported Employment Enterprise", "subsection": "§29.5 Outcomes (2)", "text": "Outcomes.: data reflecting the measure in (b) above.", "category": "outcome", "applies_to": "agency", "codes": ["SEE"], "creates_user_task": "no", "source": "DHHS91172 SOW §29.5(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.1", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.1 General Description", "text": "General Description. SEI provides Persons with ongoing one-to-one support to assist in their efforts to , maintain, and advance in Competitive Integrated Employment or self-employment.", "category": "definition", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "no", "source": "DHHS91172 SOW §30.1", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.2", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.2 Direct Service Requirements", "text": "Direct Service Requirements. The Contractor shall:", "category": "actionable", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.2", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.2(1)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.2 Direct Service Requirements (1)", "text": "Direct Service Requirements: provide the Person with job coaching that includes:", "category": "actionable", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.2(1)(A)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.2 Direct Service Requirements (1)(A)", "text": "Direct Service Requirements: analysis of the Person's daily work tasks that will help to teach, train, and provide instructions to the Person to independently complete as many of the tasks as possible;", "category": "actionable", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.2(1)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.2(1)(B)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.2 Direct Service Requirements (1)(B)", "text": "Direct Service Requirements: on-site monitoring and training, or retraining, as needed, for specific job tasks, with the primary goal of reducing the need for support and promoting independence. Training and instruction may include: (i) instructional prompts; (ii) verbal and written instructions; (iii) self-management tools; (iv) role play; (v) modeling and (vi) fading of supports;", "category": "staff_qualification", "applies_to": "staff", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.2(1)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.2(1)(C)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.2 Direct Service Requirements (1)(C)", "text": "Direct Service Requirements: personal assistance with ADL. Although personal assistance may be a component of SEI support, it may not comprise the entirety of the service;", "category": "actionable", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.2(1)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.2(1)(D)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.2 Direct Service Requirements (1)(D)", "text": "supervision of the Person to ensure the Person's health and safety. Employment supervision must not be provided as a part of SEI;", "category": "actionable", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.2(1)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.2(1)(E)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.2 Direct Service Requirements (1)(E)", "text": "direct job support, as needed, to the Person via teleservices to fade paid supports and promote on-the-job independence. Direct job support that is essential for the Person's successful employment must be provided while the Person is on the job. That Contractor shall not provide support via teleservices for the convenience of the Contactor or other members of the team. Teleservices support must be combined with in-person support;", "category": "exception", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "no", "source": "DHHS91172 SOW §30.2(1)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.2(1)(F)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.2 Direct Service Requirements (1)(F)", "text": "Direct Service Requirements: assistance and training on employment related communication, including: (i) schedules and time management; (ii) accommodations and assistive technology; (iii) self-advocacy; (iv) how to interact with supervisors, co-workers, customers and others; (v) work culture; and (vi) employment goals and performance;", "category": "staff_qualification", "applies_to": "staff", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.2(1)(F)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.2(1)(G)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.2 Direct Service Requirements (1)(G)", "text": "Direct Service Requirements: advising or discussing with the Person or others any aspect of the processes of obtaining and maintaining employment; and", "category": "actionable", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.2(1)(G)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.2(1)(H)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.2 Direct Service Requirements (1)(H)", "text": "Direct Service Requirements: developing and implementing guidelines for conduct in line with employer expectations and resolving any workplace problems.", "category": "actionable", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.2(1)(H)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.2(2)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.2 Direct Service Requirements (2)", "text": "Direct Service Requirements: with the informed consent of the Person and the preferred level of disclosure, encourage and provide skills building to the Person and the Person's co-workers, supervisors, and other employer contacts on engagement of natural co-worker support to the Person that is not specifically compensated, with the goal to minimize or eliminate the need for the Person to have continued paid supports;", "category": "actionable", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.2(3)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.2 Direct Service Requirements (3)", "text": "Direct Service Requirements: identify and coordinate provisions for reasonable worksite accessibility and accommodations;", "category": "actionable", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.2(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.2(4)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.2 Direct Service Requirements (4)", "text": "Direct Service Requirements: coordinate with, provide assistance and information to, other Staff and individuals involved in the Person's Employment Plan;", "category": "actionable", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.2(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.2(5)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.2 Direct Service Requirements (5)", "text": "Direct Service Requirements: when applicable, advise the Person on the basic relationship between earned income and benefits, including: SSI, Title 2 benefits, Medicaid, and other benefits. For complex details, refer the Person to the USOR;", "category": "actionable", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.2(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.2(6)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.2 Direct Service Requirements (6)", "text": "Direct Service Requirements: provide the Person with routine transportation for the Person's supported employment, based on the Contractor's and the Person's PCST reasonable and professional judgment;", "category": "actionable", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.2(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.2(7)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.2 Direct Service Requirements (7)", "text": "Direct Service Requirements: maintain written plans, supports and strategies intended to increase on-the-job independence and fade paid employment services; and", "category": "actionable", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.2(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.2(8)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.2 Direct Service Requirements (8)", "text": "Direct Service Requirements: support the Person with Informed Choice experiences and conversations and to explore new or maintain existing Competitive Integrated Employment goals in the Person's PCSP.", "category": "client", "applies_to": "client", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.2(8)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.3", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.3 Direct Service Administrative Requirements", "text": "Direct Service Administrative Requirements. The Contractor shall:", "category": "documentation", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.3", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.3(1)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.3 Direct Service Administrative Requirements (1)", "text": "Direct Service Administrative Requirements: ensure that employment supported through the SEI service is Competitive Integrated Employment in settings where the Person can work alongside other individuals without disabilities to the same extent as similarly situated employees;", "category": "documentation", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.3(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.3(2)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.3 Direct Service Administrative Requirements (2)", "text": "Direct Service Administrative Requirements: ensure that Persons are compensated at a wage commensurate with their level of training and development, but not less than the customary wage and level of benefits paid by the employer for the same or similar work performed by individuals without disabilities, and at rates consistent with federal vocational rehabilitation regulations contained in the Fair Labor Standards Act. Persons who are self-employed may have income less than minimum wage according to their business revenue and expenses if it is in compliance with state and federal law;", "category": "staff_qualification", "applies_to": "staff", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.3(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.3(3)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.3 Direct Service Administrative Requirements (3)", "text": "Direct Service Administrative Requirements: if a Person's job is terminated: (A) notify the Utah State Office of Rehabilitation within one Business Day; and (B) conduct a review of the circumstances of the job loss and modify the PSCP and employment goals to address the new needs;", "category": "documentation", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.3(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.3(4)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.3 Direct Service Administrative Requirements (4)", "text": "Direct Service Administrative Requirements: enter (not upload) monthly summaries into UPI by the 15th of the month following the month of service and include:", "category": "external", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.3(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.3(4)(A)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.3 Direct Service Administrative Requirements (4)(A)", "text": "Direct Service Administrative Requirements: the Person's name;", "category": "documentation", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.3(4)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.3(4)(B)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.3 Direct Service Administrative Requirements (4)(B)", "text": "Direct Service Administrative Requirements: the service provider to the Person (SEI);", "category": "documentation", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.3(4)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.3(4)(C)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.3 Direct Service Administrative Requirements (4)(C)", "text": "Direct Service Administrative Requirements: date range the summary covers;", "category": "documentation", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.3(4)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.3(4)(D)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.3 Direct Service Administrative Requirements (4)(D)", "text": "Direct Service Administrative Requirements: details of all employment activities;", "category": "documentation", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.3(4)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.3(4)(E)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.3 Direct Service Administrative Requirements (4)(E)", "text": "Direct Service Administrative Requirements: the person's response to the services;", "category": "documentation", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.3(4)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.3(4)(F)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.3 Direct Service Administrative Requirements (4)(F)", "text": "Direct Service Administrative Requirements: information that indicates the progress towards the Person's employment goals; and", "category": "documentation", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.3(4)(F)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.3(4)(G)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.3 Direct Service Administrative Requirements (4)(G)", "text": "Direct Service Administrative Requirements: name of the Staff writing the monthly summary.", "category": "reporting", "applies_to": "service_record", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.3(4)(G)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.3(5)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.3 Direct Service Administrative Requirements (5)", "text": "Direct Service Administrative Requirements: enter and maintain the Person's employment data directly into UPI for each Person by the 15th of the month following the month of service; and", "category": "external", "applies_to": "client", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.3(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.3(6)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.3 Direct Service Administrative Requirements (6)", "text": "Direct Service Administrative Requirements: enter employment support strategies into UPI no later than two weeks after the update of the PCSP.", "category": "external", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.3(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.4", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.4 Specific Service Limitations", "text": "Specific Service Limitations. In addition to the General Limitations section of this contract, the Contractor shall NOT:", "category": "exception", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "no", "source": "DHHS91172 SOW §30.4", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.4(1)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.4 Specific Service Limitations (1)", "text": "Specific Service Limitations: bill DSPD for supervision, training, support, and adaptations typically available to other workers without disabilities filling similar positions in the business;", "category": "exception", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "no", "source": "DHHS91172 SOW §30.4(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.4(2)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.4 Specific Service Limitations (2)", "text": "Specific Service Limitations: utilize SEI payments to fund incentive payments, subsidies, or unrelated vocational training expenses including incentive payments made to an employer or beneficiaries to encourage or subsidize an employer's participation in a supported employment program;", "category": "exception", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "no", "source": "DHHS91172 SOW §30.4(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.4(3)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.4 Specific Service Limitations (3)", "text": "provide SEI in employment in which Persons are paid less than what is paid to other employees without disabilities providing similar labor. If the employer or the Contractor pays a Person less than minimum wage, DHHS service code EPR must be used;", "category": "exception", "applies_to": "agency", "codes": ["EPR", "SEI"], "creates_user_task": "no", "source": "DHHS91172 SOW §30.4(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.4(4)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.4 Specific Service Limitations (4)", "text": "Specific Service Limitations: be the Person's direct employment manager; and", "category": "exception", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "no", "source": "DHHS91172 SOW §30.4(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.4(5)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.4 Specific Service Limitations (5)", "text": "Specific Service Limitations: bill DSPD for SEE or Supported Job Development (SJD) on the same day as SEI.", "category": "exception", "applies_to": "agency", "codes": ["SEE", "SEI", "SJD"], "creates_user_task": "no", "source": "DHHS91172 SOW §30.4(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.5", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.5 Specific Training Requirements: Prior to providing services, the Contractor shall ensure at least one Staff has a basic", "text": "Specific Training Requirements: Prior to providing services, the Contractor shall ensure at least one Staff has a basic understanding of the relationship between earned income and benefits, including SSI, Title 2 benefits, Medicaid.", "category": "staff_qualification", "applies_to": "staff", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.5", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.6", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.6 Specific Contractor Qualifications", "text": "Specific Contractor Qualifications. (a) The Contractor shall be an approved vendor with USOR to provide job coaching services. If the Contractor provides SEI services prior to July 1, 2026, it has until January 31, 2027, to become a vendor with USOR and submit supporting documentation to the DHHS Office of Service Review via osrporivider@utah.gov. If the Contractor is awarded SEI services on or after July 1, 2026, it has six months from the award date to become a vendor with USOR and submit supporting documentation to the DHHS Office of Service Review via osrporivider@utah.gov. (b) The Contractor shall ensure that at least one Staff is certified in ACRE training through Utah State University or any accredited program available through the ACRE website. The Contractor shall ensure that all Staff providing SEI services are supervised by a Staff member who is certified in ACRE training. (c) Prior to providing services, the Contractor shall ensure SEI Staff have successfully completed:", "category": "external", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.6", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.6(1)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.6 Specific Contractor Qualifications (1)", "text": "Basic Employment Specialist Training in the past (no longer offered); or", "category": "staff_qualification", "applies_to": "staff", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.6(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.6(2)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.6 Specific Contractor Qualifications (2)", "text": "Workplace Supports Training or Effective Job Coach Training through Utah State University. Workplace Supports Training and Effective Job Coach Training are available here: https://ceiutah.com/workplace-supports-training/.", "category": "staff_qualification", "applies_to": "staff", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.6(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.7", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.7 Outcomes", "text": "Outcomes. (a) The intended outcome of this service is to find or maintain Competitive Integrated Employment. (b) Measures: The Contractor shall maintain documentation on the following measures: (A) the number of Persons receiving SEI; (B) the number of Persons in Competitive Integrated Employment; (C) the average of Persons' wages earned; (E) the average of Persons' weekly hours worked; and (F) the average weekly hours of SEI support provided to Persons. (c) Reporting: The Contractor shall create a fiscal year annual report starting fiscal year 2025 (fiscal year 2025 starts July 1, 2024). The fiscal year annual report will be submitted via Google Form by August 30th, 60 days after each fiscal year end. The outcome Google Form will be posted on the DSPD webpage. The Contractor shall explain any quality improvement activities they will undertake in response to their evaluation of the measurement data. The fiscal year annual report must include data reflecting the measure in (b) above.", "category": "outcome", "applies_to": "agency", "codes": ["SEI"], "creates_user_task": "no", "source": "DHHS91172 SOW §30.7", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.8", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.8 Specific Billing Requirements", "text": "Specific Billing Requirements. The submission of late timesheet records or duplicate timesheet records with overlapping times or services, within the same day, may not be paid by DHHS/DSPD. The Contractor shall:", "category": "billing", "applies_to": "service_record", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.8", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.8(1)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.8 Specific Billing Requirements (1)", "text": "Specific Billing Requirements: comply with the UPI Employee registry to set up a unique identifier for each Staff that will be stamped on each payment belonging to the Staff;", "category": "billing", "applies_to": "service_record", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.8(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.8(2)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.8 Specific Billing Requirements (2)", "text": "Specific Billing Requirements: submit Staff daily timesheet records for each pay period as individual payments directly into UPI system required data fields; and", "category": "external", "applies_to": "service_record", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.8(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-30.8(3)", "section": "Article 30 — Supported Employment For An Individual", "subsection": "§30.8 Specific Billing Requirements (3)", "text": "Specific Billing Requirements: input all UPI data fields as required by DSPD.", "category": "billing", "applies_to": "service_record", "codes": ["SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §30.8(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-31.1", "section": "Article 31 — Supported Living Quarter Hour", "subsection": "§31.1 General Description", "text": "General Description. Supported Living Quarter Hour provides the Person with one-on-one supervision, skills building, and assistance when the Contractor is primarily responsible for maintaining the Person's health and safety. Services must support the Person to live as independent, self-determined, and integrated lives to the extent possible in their community.", "category": "billing", "applies_to": "service_record", "codes": ["SLH"], "creates_user_task": "yes", "source": "DHHS91172 SOW §31.1", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-31.2", "section": "Article 31 — Supported Living Quarter Hour", "subsection": "§31.2 Direct Service Requirements", "text": "Direct Service Requirements. The Contractor shall provide:", "category": "actionable", "applies_to": "agency", "codes": ["SLH"], "creates_user_task": "yes", "source": "DHHS91172 SOW §31.2", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-31.2(1)", "section": "Article 31 — Supported Living Quarter Hour", "subsection": "§31.2 Direct Service Requirements (1)", "text": "Direct Service Requirements: the Person with training, skills development, and assistance with:", "category": "staff_qualification", "applies_to": "staff", "codes": ["SLH"], "creates_user_task": "yes", "source": "DHHS91172 SOW §31.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-31.2(1)(B)", "section": "Article 31 — Supported Living Quarter Hour", "subsection": "§31.2 Direct Service Requirements (1)(B)", "text": "Direct Service Requirements: homemaker skills building;", "category": "actionable", "applies_to": "agency", "codes": ["SLH"], "creates_user_task": "yes", "source": "DHHS91172 SOW §31.2(1)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-31.2(1)(C)", "section": "Article 31 — Supported Living Quarter Hour", "subsection": "§31.2 Direct Service Requirements (1)(C)", "text": "Direct Service Requirements: advocacy and self-help;", "category": "actionable", "applies_to": "agency", "codes": ["SLH"], "creates_user_task": "yes", "source": "DHHS91172 SOW §31.2(1)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-31.2(1)(D)", "section": "Article 31 — Supported Living Quarter Hour", "subsection": "§31.2 Direct Service Requirements (1)(D)", "text": "Direct Service Requirements: accessing the community, communication, and socialization;", "category": "actionable", "applies_to": "agency", "codes": ["SLH"], "creates_user_task": "yes", "source": "DHHS91172 SOW §31.2(1)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-31.2(1)(E)", "section": "Article 31 — Supported Living Quarter Hour", "subsection": "§31.2 Direct Service Requirements (1)(E)", "text": "Direct Service Requirements: personal finances including keeping track of money and bills; and", "category": "actionable", "applies_to": "agency", "codes": ["SLH"], "creates_user_task": "yes", "source": "DHHS91172 SOW §31.2(1)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-31.2(1)(F)", "section": "Article 31 — Supported Living Quarter Hour", "subsection": "§31.2 Direct Service Requirements (1)(F)", "text": "Direct Service Requirements: accessing community services.", "category": "actionable", "applies_to": "agency", "codes": ["SLH"], "creates_user_task": "yes", "source": "DHHS91172 SOW §31.2(1)(F)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-31.2(2)", "section": "Article 31 — Supported Living Quarter Hour", "subsection": "§31.2 Direct Service Requirements (2)", "text": "both direct and indirect services. Indirect services include phone calls or other activities completed on the Person's behalf. The Contractor shall provide reasonable indirect services based on the Contractor's professional judgment. Indirect services provided must be documented in writing;", "category": "actionable", "applies_to": "agency", "codes": ["SLH"], "creates_user_task": "yes", "source": "DHHS91172 SOW §31.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-31.2(3)", "section": "Article 31 — Supported Living Quarter Hour", "subsection": "§31.2 Direct Service Requirements (3)", "text": "Direct Service Requirements: assistance with completing Medicaid eligibility review documents, and ensure they are submitted timely; and", "category": "actionable", "applies_to": "agency", "codes": ["SLH"], "creates_user_task": "yes", "source": "DHHS91172 SOW §31.2(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-31.2(4)", "section": "Article 31 — Supported Living Quarter Hour", "subsection": "§31.2 Direct Service Requirements (4)", "text": "Direct Service Requirements: transportation for the Person.", "category": "actionable", "applies_to": "agency", "codes": ["SLH"], "creates_user_task": "yes", "source": "DHHS91172 SOW §31.2(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-31.3", "section": "Article 31 — Supported Living Quarter Hour", "subsection": "§31.3 Direct Administration Requirements", "text": "Direct Administration Requirements. The Contractor shall:", "category": "actionable", "applies_to": "agency", "codes": ["SLH"], "creates_user_task": "yes", "source": "DHHS91172 SOW §31.3", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-31.3(1)", "section": "Article 31 — Supported Living Quarter Hour", "subsection": "§31.3 Direct Administration Requirements (1)", "text": "Direct Administration Requirements: have primary responsibility for maintaining the Person's health and safety;", "category": "unclear", "applies_to": "agency", "codes": ["SLH"], "creates_user_task": "no", "source": "DHHS91172 SOW §31.3(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-31.3(2)", "section": "Article 31 — Supported Living Quarter Hour", "subsection": "§31.3 Direct Administration Requirements (2)", "text": "Direct Administration Requirements: provide services to Persons who live in the community: (A) alone in their own home; (B) with roommates; (C) with a spouse; or (D) adult Persons living with their parent(s) or other related caregiver(s).", "category": "unclear", "applies_to": "agency", "codes": ["SLH"], "creates_user_task": "no", "source": "DHHS91172 SOW §31.3(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-31.3(3)", "section": "Article 31 — Supported Living Quarter Hour", "subsection": "§31.3 Direct Administration Requirements (3)", "text": "create an inventory of the Person's belongings. The inventory must be maintained in the Person's file and include written documentation of the following:", "category": "client", "applies_to": "client", "codes": ["SLH"], "creates_user_task": "yes", "source": "DHHS91172 SOW §31.3(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-31.3(3)(A)", "section": "Article 31 — Supported Living Quarter Hour", "subsection": "§31.3 Direct Administration Requirements (3)(A)", "text": "Direct Administration Requirements: the inventory completion date and the Staff's name that completed the inventory;", "category": "unclear", "applies_to": "agency", "codes": ["SLH"], "creates_user_task": "no", "source": "DHHS91172 SOW §31.3(3)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-31.3(3)(B)", "section": "Article 31 — Supported Living Quarter Hour", "subsection": "§31.3 Direct Administration Requirements (3)(B)", "text": "Direct Administration Requirements: belongings that have significant value to the Person;", "category": "client", "applies_to": "client", "codes": ["SLH"], "creates_user_task": "yes", "source": "DHHS91172 SOW §31.3(3)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-31.3(3)(C)", "section": "Article 31 — Supported Living Quarter Hour", "subsection": "§31.3 Direct Administration Requirements (3)(C)", "text": "Direct Administration Requirements: belongings with a purchase value of $50.00 or more;", "category": "client", "applies_to": "client", "codes": ["SLH"], "creates_user_task": "yes", "source": "DHHS91172 SOW §31.3(3)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-31.3(3)(D)", "section": "Article 31 — Supported Living Quarter Hour", "subsection": "§31.3 Direct Administration Requirements (3)(D)", "text": "Direct Administration Requirements: all new items added as received by the Person that have significant value to the Person or with a purchase value of $50.00 or more; and", "category": "unclear", "applies_to": "agency", "codes": ["SLH"], "creates_user_task": "no", "source": "DHHS91172 SOW §31.3(3)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-31.3(3)(E)", "section": "Article 31 — Supported Living Quarter Hour", "subsection": "§31.3 Direct Administration Requirements (3)(E)", "text": "discarded items must be removed, including the reason for discard and signature from the Person or their legal guardian.", "category": "actionable", "applies_to": "agency", "codes": ["SLH"], "creates_user_task": "yes", "source": "DHHS91172 SOW §31.3(3)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-31.4", "section": "Article 31 — Supported Living Quarter Hour", "subsection": "§31.4 Specific Service Limitations", "text": "Specific Service Limitations. In addition to the General Limitations section of this contract, the Contractor shall NOT bill DSPD for:", "category": "exception", "applies_to": "agency", "codes": ["SLH"], "creates_user_task": "no", "source": "DHHS91172 SOW §31.4", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-31.4(1)", "section": "Article 31 — Supported Living Quarter Hour", "subsection": "§31.4 Specific Service Limitations (1)", "text": "TFB during the same time a Person receives Supported Living unless an exceptional care need exists and there is written approval by the DSPD director prior to providing TFB;", "category": "exception", "applies_to": "agency", "codes": ["TFB"], "creates_user_task": "no", "source": "DHHS91172 SOW §31.4(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-31.4(2)", "section": "Article 31 — Supported Living Quarter Hour", "subsection": "§31.4 Specific Service Limitations (2)", "text": "Supported Living services provided to Persons who are clients of DCFS;", "category": "exception", "applies_to": "agency", "codes": ["SLH"], "creates_user_task": "no", "source": "DHHS91172 SOW §31.4(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-31.4(3)", "section": "Article 31 — Supported Living Quarter Hour", "subsection": "§31.4 Specific Service Limitations (3)", "text": "more than four hours of Supportive Living if overnight respite services are provided within the same 24-hour period. The Contractor shall document the need for Supportive Living on that day; and", "category": "exception", "applies_to": "agency", "codes": ["SLH"], "creates_user_task": "no", "source": "DHHS91172 SOW §31.4(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-31.4(4)", "section": "Article 31 — Supported Living Quarter Hour", "subsection": "§31.4 Specific Service Limitations (4)", "text": "Specific Service Limitations: time when the Person is asleep.", "category": "exception", "applies_to": "agency", "codes": ["SLH"], "creates_user_task": "no", "source": "DHHS91172 SOW §31.4(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-31.5", "section": "Article 31 — Supported Living Quarter Hour", "subsection": "§31.5 Outcomes", "text": "Outcomes. (a) The intended outcome of this service is a stable living environment that is integrated into the community, promotes Persons goals and community integration. (b) Measures: The percentage of Persons who remained in their community-based living setting. (c) Reporting: The Contractor shall create a fiscal year annual report starting fiscal year 2025 (fiscal year 2025 starts July 1, 2024). The fiscal year annual report will be submitted via Google Form by August 30th, 60 days after each fiscal year end. The outcome Google Form will be posted on the DSPD webpage. The Contractor shall explain any quality improvement activities they will undertake in response to their evaluation of the measurement data. The fiscal year annual report must include the following:", "category": "outcome", "applies_to": "agency", "codes": ["SLH"], "creates_user_task": "no", "source": "DHHS91172 SOW §31.5", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-31.5(1)", "section": "Article 31 — Supported Living Quarter Hour", "subsection": "§31.5 Outcomes (1)", "text": "Outcomes.: how many Persons received Supported Living; and", "category": "outcome", "applies_to": "agency", "codes": ["SLH"], "creates_user_task": "no", "source": "DHHS91172 SOW §31.5(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-31.5(2)", "section": "Article 31 — Supported Living Quarter Hour", "subsection": "§31.5 Outcomes (2)", "text": "Outcomes.: data reflecting the measure in (b) above.", "category": "outcome", "applies_to": "agency", "codes": ["SLH"], "creates_user_task": "no", "source": "DHHS91172 SOW §31.5(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-32", "section": "Article 32 — Supported Living Natural", "subsection": "§32 Supported Living Natural", "text": "SUPPORTED LIVING NATURAL - DHHS SERVICE CODES: SLN, CMP, and CMS", "category": "unclear", "applies_to": "agency", "codes": ["CMP", "CMS", "SLN"], "creates_user_task": "no", "source": "DHHS91172 SOW §32", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-32.1", "section": "Article 32 — Supported Living Natural", "subsection": "§32.1 General Description", "text": "General Description. Support Living Natural provides one-on-one supervision, skills building, and assistance to Persons when the Contractor is not primarily responsible for maintaining the health and safety of the Person. Services will support the Person to live as independent, self-determined lives as possible, integrated into their community.", "category": "definition", "applies_to": "agency", "codes": ["SLN", "CMP", "CMS"], "creates_user_task": "no", "source": "DHHS91172 SOW §32.1", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-32.2", "section": "Article 32 — Supported Living Natural", "subsection": "§32.2 Direct Service Requirements", "text": "Direct Service Requirements. The Contractor shall provide:", "category": "actionable", "applies_to": "agency", "codes": ["SLN", "CMP", "CMS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §32.2", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-32.2(1)", "section": "Article 32 — Supported Living Natural", "subsection": "§32.2 Direct Service Requirements (1)", "text": "Direct Service Requirements: the Person with training, skills development, and assistance with the following:", "category": "staff_qualification", "applies_to": "staff", "codes": ["SLN", "CMP", "CMS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §32.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-32.2(1)(B)", "section": "Article 32 — Supported Living Natural", "su , {"id": "sow-32.3(2)(D)", "section": "Article 32 — Supported Living Natural", "subsection": "§32.3 Direct Administration Requirements (2)(D)", "text": "Direct Administration Requirements: general summary of the service provided, the Person's status and response to the service, and notable events and activities related to the service;", "category": "unclear", "applies_to": "agency", "codes": ["SLN", "CMP", "CMS"], "creates_user_task": "no", "source": "DHHS91172 SOW §32.3(2)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-32.3(2)(E)", "section": "Article 32 — Supported Living Natural", "subsection": "§32.3 Direct Administration Requirements (2)(E)", "text": "Direct Administration Requirements: information that indicates the progress towards the Person's goals; and", "category": "unclear", "applies_to": "agency", "codes": ["SLN", "CMP", "CMS"], "creates_user_task": "no", "source": "DHHS91172 SOW §32.3(2)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-32.3(2)(F)", "section": "Article 32 — Supported Living Natural", "subsection": "§32.3 Direct Administration Requirements (2)(F)", "text": "Direct Administration Requirements: the name of the Staff writing the monthly summary.", "category": "reporting", "applies_to": "service_record", "codes": ["SLN", "CMP", "CMS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §32.3(2)(F)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-32.4", "section": "Article 32 — Supported Living Natural", "subsection": "§32.4 Specific Service Limitations", "text": "Specific Service Limitations. In addition to the General Limitations section of this contract, the Contractor shall NOT bill DSPD for:", "category": "exception", "applies_to": "agency", "codes": ["SLN", "CMP", "CMS"], "creates_user_task": "no", "source": "DHHS91172 SOW §32.4", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-32.4(1)", "section": "Article 32 — Supported Living Natural", "subsection": "§32.4 Specific Service Limitations (1)", "text": "TFB during the same time a Person receives Supported Living unless an exceptional care need exists and there is written approval by the DSPD director prior to providing TFB;", "category": "exception", "applies_to": "agency", "codes": ["TFB"], "creates_user_task": "no", "source": "DHHS91172 SOW §32.4(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-32.4(2)", "section": "Article 32 — Supported Living Natural", "subsection": "§32.4 Specific Service Limitations (2)", "text": "Supported Living services provided to Persons who are clients of DCFS;", "category": "exception", "applies_to": "agency", "codes": ["SLN", "CMP", "CMS"], "creates_user_task": "no", "source": "DHHS91172 SOW §32.4(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-32.4(3)", "section": "Article 32 — Supported Living Natural", "subsection": "§32.4 Specific Service Limitations (3)", "text": "more than four hours of Supportive Living if overnight respite services are provided within the same 24-hour period. The Contractor shall document the need for Supportive Living on that day;", "category": "exception", "applies_to": "agency", "codes": ["SLN", "CMP", "CMS"], "creates_user_task": "no", "source": "DHHS91172 SOW §32.4(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-32.4(4)", "section": "Article 32 — Supported Living Natural", "subsection": "§32.4 Specific Service Limitations (4)", "text": "Specific Service Limitations: more than 40 hours of CMP or CMS a week (Sunday through Saturday) and more than 8 hours a day;", "category": "exception", "applies_to": "agency", "codes": ["CMP", "CMS"], "creates_user_task": "no", "source": "DHHS91172 SOW §32.4(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-32.4(5)", "section": "Article 32 — Supported Living Natural", "subsection": "§32.4 Specific Service Limitations (5)", "text"
