name: Deploy AWS (parallel target)

# Parallel deployment target alongside Lovable/Cloudflare. This workflow never
# touches wrangler.jsonc, src/server.ts's Cloudflare entry point, or anything
# Lovable's GitHub sync manages — it only runs `npm run build:aws` (a separate
# nitro preset, see vite.config.ts) and ships that output to S3 + ECS Fargate.
# See docs/AWS_DEPLOY.md for the one-time AWS console setup this depends on.
#
# Migration note (2026-07-30): previously ran on Lambda (failed with 500s on
# every server-function call due to the Lambda invocation lifecycle), then
# attempted App Runner (shut to new customers April 30 2026). Now on ECS
# Fargate: same node-server container, managed always-on process, no Lambda
# freeze/thaw involved.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy to AWS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (AWS target)
        run: npm run build:aws
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          PUBLIC_SITE_URL: ${{ secrets.AWS_PUBLIC_SITE_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPOSITORY }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build -f deploy/aws/Dockerfile -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      - name: Sync static assets to S3
        run: |
          aws s3 sync dist-aws/client "s3://${{ secrets.AWS_S3_BUCKET }}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" \
            --exclude "*.webmanifest"
          aws s3 cp dist-aws/client/index.html "s3://${{ secrets.AWS_S3_BUCKET }}/index.html" \
            --cache-control "public,max-age=0,must-revalidate" || true
          if [ -f dist-aws/client/manifest.webmanifest ]; then
            aws s3 cp dist-aws/client/manifest.webmanifest "s3://${{ secrets.AWS_S3_BUCKET }}/manifest.webmanifest" \
              --cache-control "public,max-age=0,must-revalidate"
          fi

      # Skipped until AWS_ECS_CLUSTER and AWS_ECS_SERVICE are set — the ECS
      # service must be created manually first (chicken-and-egg: needs an
      # image in ECR before the service can be created). The first CI run
      # just pushes the image; Step 4a in docs/AWS_DEPLOY.md covers creating
      # the service from the console after that image exists.
      - name: Deploy new image to ECS
        if: env.ECS_CLUSTER != '' && env.ECS_SERVICE != ''
        env:
          ECS_CLUSTER: ${{ secrets.AWS_ECS_CLUSTER }}
          ECS_SERVICE: ${{ secrets.AWS_ECS_SERVICE }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPOSITORY }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          # Fetch the current task definition, swap in the new image, strip
          # read-only fields that aws ecs register-task-definition rejects.
          NEW_DEF=$(aws ecs describe-task-definition \
            --task-definition hive-app-server \
            --query 'taskDefinition' \
            | jq --arg img "$IMAGE" '
                .containerDefinitions[0].image = $img
                | del(.taskDefinitionArn, .revision, .status,
                      .requiresAttributes, .placementConstraints,
                      .compatibilities, .registeredAt, .registeredBy)
              ')
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$NEW_ARN"
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      - name: Invalidate CloudFront cache
        if: env.DISTRIBUTION_ID != ''
        env:
          DISTRIBUTION_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
