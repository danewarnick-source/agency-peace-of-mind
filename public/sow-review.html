)", "section": "Article 16 — Professional Medication Monitoring By A Licensed Practical Nurse", "subsection": "§16.2 Direct Service Requirements (6)", "text": "Direct Service Requirements: provide incidental training related to the Person's general care, as needed, to Staff providing other services to the Person;", "category": "staff_qualification", "applies_to": "staff", "codes": ["PM1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §16.2(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-16.2(7)", "section": "Article 16 — Professional Medication Monitoring By A Licensed Practical Nurse", "subsection": "§16.2 Direct Service Requirements (7)", "text": "Direct Service Requirements: review all reported medication errors and determine if it is necessary to consult with additional health care professionals and to report the medication error. When a medication error is determined, do the following:", "category": "actionable", "applies_to": "agency", "codes": ["PM1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §16.2(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-16.2(7)(A)", "section": "Article 16 — Professional Medication Monitoring By A Licensed Practical Nurse", "subsection": "§16.2 Direct Service Requirements (7)(A)", "text": "Direct Service Requirements: document the medication error in the Person's medical data sheet;", "category": "actionable", "applies_to": "agency", "codes": ["PM1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §16.2(7)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-16.2(7)(B)", "section": "Article 16 — Professional Medication Monitoring By A Licensed Practical Nurse", "subsection": "§16.2 Direct Service Requirements (7)(B)", "text": "Direct Service Requirements: determine if a critical incident report needs to be submitted;", "category": "reporting", "applies_to": "service_record", "codes": ["PM1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §16.2(7)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-16.2(7)(C)", "section": "Article 16 — Professional Medication Monitoring By A Licensed Practical Nurse", "subsection": "§16.2 Direct Service Requirements (7)(C)", "text": "Direct Service Requirements: notify the Person's Support Coordinator in writing within one Calendar Day;", "category": "actionable", "applies_to": "agency", "codes": ["PM1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §16.2(7)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-16.2(7)(D)", "section": "Article 16 — Professional Medication Monitoring By A Licensed Practical Nurse", "subsection": "§16.2 Direct Service Requirements (7)(D)", "text": "assess the need for a written Remediation Plan to minimize the reoccurrence of the error and develop a plan if needed. If a plan exists, the PM1 Staff shall assess the adequacy of the plan and revise the plan as needed;", "category": "actionable", "applies_to": "agency", "codes": ["PM1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §16.2(7)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-16.2(7)(E)", "section": "Article 16 — Professional Medication Monitoring By A Licensed Practical Nurse", "subsection": "§16.2 Direct Service Requirements (7)(E)", "text": "Direct Service Requirements: document the medication error and Remediation Plan (if needed) in the Person's medical data sheet; and", "category": "actionable", "applies_to": "agency", "codes": ["PM1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §16.2(7)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-16.2(7)(F)", "section": "Article 16 — Professional Medication Monitoring By A Licensed Practical Nurse", "subsection": "§16.2 Direct Service Requirements (7)(F)", "text": "If the PM1 Staff becomes aware of a medication error on the day of the error, assess the Person's health risk as a result of the error, and if other providers of services to the Person need to be notified. If the medication error was on a prior date, the PM1 Staff shall notify the Contractor's director or designee where the error occurred.", "category": "reporting", "applies_to": "service_record", "codes": ["PM1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §16.2(7)(F)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-16.2(8)", "section": "Article 16 — Professional Medication Monitoring By A Licensed Practical Nurse", "subsection": "§16.2 Direct Service Requirements (8)", "text": "Direct Service Requirements: notify the Person's representative/legal guardian within 24 hours of the development of a Person's medical illness or injury requiring a medical appointment or an emergency room visit. (This does not include medical appointments for general health check-ups.);", "category": "actionable", "applies_to": "agency", "codes": ["PM1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §16.2(8)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-16.2(9)", "section": "Article 16 — Professional Medication Monitoring By A Licensed Practical Nurse", "subsection": "§16.2 Direct Service Requirements (9)", "text": "make regularly scheduled, documented face-to-face visits with the Person to conduct a written assessment of the Person's health and safety regarding the Person's health care professional prescribed medication regimen. If determined necessary by the PM1 Staff, include a review of other health needs as they relate to the overall wellbeing of the individual. If the assessment reveals information necessary to the Person's healthcare professional, the PM1 Staff must relay that information to the Person's healthcare professional. The PM1 Staff must maintain the assessment in the Person's records. The PM1 Staff must ensure the assessment:", "category": "client", "applies_to": "client", "codes": ["PM1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §16.2(9)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-16.2(9)(A)", "section": "Article 16 — Professional Medication Monitoring By A Licensed Practical Nurse", "subsection": "§16.2 Direct Service Requirements (9)(A)", "text": "Direct Service Requirements: is based on data the PM1 Staff has collected through observation, discussion with other Staff providing services to the Person, review of records of other services the Person is receiving, and direct examination of the Person;", "category": "actionable", "applies_to": "agency", "codes": ["PM1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §16.2(9)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-16.2(9)(B)", "section": "Article 16 — Professional Medication Monitoring By A Licensed Practical Nurse", "subsection": "§16.2 Direct Service Requirements (9)(B)", "text": "Direct Service Requirements: includes the following: (i) safety and efficacy of the Person's prescribed medication within the PM1 Staff's scope of practice and training; (ii) demonstrable benefits (or lack thereof) the Person has from their medication regimen; (iii) any adverse medication reactions or side effects the Person is experiencing; (iv) the Person's adherence or lack of adherence with their health care professional's medication related orders; and (v) any barriers to adherence to health care professional's medication related orders that the PM1 Staff identifies;", "category": "staff_qualification", "applies_to": "staff", "codes": ["PM1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §16.2(9)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-16.2(9)(C)", "section": "Article 16 — Professional Medication Monitoring By A Licensed Practical Nurse", "subsection": "§16.2 Direct Service Requirements (9)(C)", "text": "results are documented in a note in the Person's medical data sheet. The PM1 Staff must include the following in the documentation:", "category": "documentation", "applies_to": "agency", "codes": ["PM1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §16.2(9)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-16.2(9)(C)(i)", "section": "Article 16 — Professional Medication Monitoring By A Licensed Practical Nurse", "subsection": "§16.2 Direct Service Requirements (9)(C)(i)", "text": "Direct Service Requirements: a description of the Person's subjective presentation;", "category": "actionable", "applies_to": "agency", "codes": ["PM1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §16.2(9)(C)(i)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-16.2(9)(C)(ii)", "section": "Article 16 — Professional Medication Monitoring By A Licensed Practical Nurse", "subsection": "§16.2 Direct Service Requirements (9)(C)(ii)", "text": "Direct Service Requirements: a description of the PM1 Staff's objective observations after the examination, including a review of records and consultations with other Staff providing other services or supports to the Person or the Person's family/representative;", "category": "actionable", "applies_to": "agency", "codes": ["PM1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §16.2(9)(C)(ii)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-16.2(9)(C)(iii)", "section": "Article 16 — Professional Medication Monitoring By A Licensed Practical Nurse", "subsection": "§16.2 Direct Service Requirements (9)(C)(iii)", "text": "Direct Service Requirements: a description of the Person's status made by the PM1 Staff of the; and", "category": "actionable", "applies_to": "agency", "codes": ["PM1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §16.2(9)(C)(iii)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-16.2(9)(C)(iv)", "section": "Article 16 — Professional Medication Monitoring By A Licensed Practical Nurse", "subsection": "§16.2 Direct Service Requirements (9)(C)(iv)", "text": "Direct Service Requirements: a plan for the Person's continuing care surrounding their health status and medication regimen.", "category": "actionable", "applies_to": "agency", "codes": ["PM1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §16.2(9)(C)(iv)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-16.2(9)(D)", "section": "Article 16 — Professional Medication Monitoring By A Licensed Practical Nurse", "subsection": "§16.2 Direct Service Requirements (9)(D)", "text": "Direct Service Requirements: includes any notes, any known allergies the Person has, any medication errors that occur, and any written Remediation Plans to minimize the reoccurrence of each medication error if an error has occurred.", "category": "actionable", "applies_to": "agency", "codes": ["PM1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §16.2(9)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-16.2(10)", "section": "Article 16 — Professional Medication Monitoring By A Licensed Practical Nurse", "subsection": "§16.2 Direct Service Requirements (10)", "text": "Direct Service Requirements: provide copies of notes, assessment, and education regarding the Person's overall health to contractors providing other services to the Person as determined necessary by the PM1 Staff, the Person's health care professional, and the Person's Support Coordinator; and", "category": "actionable", "applies_to": "agency", "codes": ["PM1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §16.2(10)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-16.2(11)", "section": "Article 16 — Professional Medication Monitoring By A Licensed Practical Nurse", "subsection": "§16.2 Direct Service Requirements (11)", "text": "Direct Service Requirements: have PM1 Staff attend the Person's medical appointment if the appointment is regarding medication needs for stabilization.", "category": "actionable", "applies_to": "agency", "codes": ["PM1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §16.2(11)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-16.3", "section": "Article 16 — Professional Medication Monitoring By A Licensed Practical Nurse", "subsection": "§16.3 Specific Service Limitations", "text": "Specific Service Limitations. In addition to the General Limitations section of this contract, the Contractor shall NOT bill DHHS/DSPD for PM1 if the Person is receiving Professional Nursing Services (PN1or PN2).", "category": "exception", "applies_to": "agency", "codes": ["PM1", "PN2"], "creates_user_task": "no", "source": "DHHS91172 SOW §16.3", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-16.4", "section": "Article 16 — Professional Medication Monitoring By A Licensed Practical Nurse", "subsection": "§16.4 Specific Staff Qualifications", "text": "Specific Staff Qualifications. The Contractor shall ensure that PM1 Staff have a current LPN or higher DOPL license.", "category": "agency_qualification", "applies_to": "agency", "codes": ["PM1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §16.4", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-16.5", "section": "Article 16 — Professional Medication Monitoring By A Licensed Practical Nurse", "subsection": "§16.5 Outcomes", "text": "Outcomes. (a) The intended outcome of this service is the monitoring of medication administration and education efforts that maintain health and treat diseases according to Persons' PCSP. (b) Measures: The percentage of Persons without medication errors. (c) Reporting: The Contractor shall create a fiscal year annual report starting fiscal year 2025 (fiscal year 2025 starts July 1, 2024). The fiscal year annual report will be submitted via Google Form by August 30th, 60 days after each fiscal year end. The outcome Google Form will be posted on the DSPD webpage. The Contractor shall explain any quality improvement activities they will undertake in response to their evaluation of the measurement data. The fiscal year annual report must include the following: :", "category": "outcome", "applies_to": "agency", "codes": ["PM1"], "creates_user_task": "no", "source": "DHHS91172 SOW §16.5", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-16.5(1)", "section": "Article 16 — Professional Medication Monitoring By A Licensed Practical Nurse", "subsection": "§16.5 Outcomes (1)", "text": "Outcomes.: how many Persons received PM1; and", "category": "outcome", "applies_to": "agency", "codes": ["PM1"], "creates_user_task": "no", "source": "DHHS91172 SOW §16.5(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-16.5(2)", "section": "Article 16 — Professional Medication Monitoring By A Licensed Practical Nurse", "subsection": "§16.5 Outcomes (2)", "text": "Outcomes.: data reflecting the measure in (b) above.", "category": "outcome", "applies_to": "agency", "codes": ["PM1"], "creates_user_task": "no", "source": "DHHS91172 SOW §16.5(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-17.1", "section": "Article 17 — Professional Medication Monitoring By A Registered Nurse", "subsection": "§17.1 General Description", "text": "General Description. PM2 by a RN provides medication management services, medication monitoring, and medication and medical equipment education and training to assure a Person's health and safety.", "category": "definition", "applies_to": "agency", "codes": ["PM2"], "creates_user_task": "no", "source": "DHHS91172 SOW §17.1", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-17.2", "section": "Article 17 — Professional Medication Monitoring By A Registered Nurse", "subsection": "§17.2 Direct Service Requirements", "text": "Direct Service Requirements. The Contractor shall:", "category": "actionable", "applies_to": "agency", "codes": ["PM2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §17.2", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-17.2(1)", "section": "Article 17 — Professional Medication Monitoring By A Registered Nurse", "subsection": "§17.2 Direct Service Requirements (1)", "text": "Direct Service Requirements: provide services compliant with Utah Administrative Code, Rule R156-31b;", "category": "actionable", "applies_to": "agency", "codes": ["PM2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §17.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-17.2(2)", "section": "Article 17 — Professional Medication Monitoring By A Registered Nurse", "subsection": "§17.2 Direct Service Requirements (2)", "text": "Direct Service Requirements: provide medication monitoring, including instructing and educating the Person on the prescribed medication regimen from their health care professional;", "category": "actionable", "applies_to": "agency", "codes": ["PM2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §17.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-17.2(3)", "section": "Article 17 — Professional Medication Monitoring By A Registered Nurse", "subsection": "§17.2 Direct Service Requirements (3)", "text": "Direct Service Requirements: review, monitor, and document in the Person's medical data sheet, laboratory testing related to a prescribed medication regimen;", "category": "actionable", "applies_to": "agency", "codes": ["PM2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §17.2(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-17.2(4)", "section": "Article 17 — Professional Medication Monitoring By A Registered Nurse", "subsection": "§17.2 Direct Service Requirements (4)", "text": "Direct Service Requirements: ensure that all pill-dispensing aids are stocked with the correct medication prescribed by the Person's health care professional;", "category": "actionable", "applies_to": "agency", "codes": ["PM2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §17.2(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-17.2(5)", "section": "Article 17 — Professional Medication Monitoring By A Registered Nurse", "subsection": "§17.2 Direct Service Requirements (5)", "text": "during each visit with the Person, ensure that the Person's medication dispensing devices, aids, and medical equipment are functioning properly. If the Person's medication dispensing devices, aids, or medical equipment are not functioning properly, the PM1 Staff must: (1) assist the Person to arrange for maintenance, (2) notify the Person's Staff or guardian of the required maintenance within one Calendar Day, and (3) document the issue and resolution in the Person's medical data sheet;", "category": "actionable", "applies_to": "agency", "codes": ["PM1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §17.2(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-17.2(6)", "section": "Article 17 — Professional Medication Monitoring By A Registered Nurse", "subsection": "§17.2 Direct Service Requirements (6)", "text": "Direct Service Requirements: provide incidental training related to the Person's general care, as needed, to Staff providing other services to the Person;", "category": "staff_qualification", "applies_to": "staff", "codes": ["PM2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §17.2(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-17.2(7)", "section": "Article 17 — Professional Medication Monitoring By A Registered Nurse", "subsection": "§17.2 Direct Service Requirements (7)", "text": "Direct Service Requirements: review all reported medication errors and determine if it is necessary to consult with additional health care professionals and to report the medication error. When a medication error is determined, do the following:", "category": "actionable", "applies_to": "agency", "codes": ["PM2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §17.2(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-17.2(7)(A)", "section": "Article 17 — Professional Medication Monitoring By A Registered Nurse", "subsection": "§17.2 Direct Service Requirements (7)(A)", "text": "Direct Service Requirements: document the medication error in the Person's medical data sheet;", "category": "actionable", "applies_to": "agency", "codes": ["PM2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §17.2(7)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-17.2(7)(B)", "section": "Article 17 — Professional Medication Monitoring By A Registered Nurse", "subsection": "§17.2 Direct Service Requirements (7)(B)", "text": "Direct Service Requirements: determine if a critical incident report needs to be submitted;", "category": "reporting", "applies_to": "service_record", "codes": ["PM2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §17.2(7)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-17.2(7)(C)", "section": "Article 17 — Professional Medication Monitoring By A Registered Nurse", "subsection": "§17.2 Direct Service Requirements (7)(C)", "text": "Direct Service Requirements: notify the Person's Support Coordinator in writing within one Calendar Day;", "category": "actionable", "applies_to": "agency", "codes": ["PM2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §17.2(7)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-17.2(7)(D)", "section": "Article 17 — Professional Medication Monitoring By A Registered Nurse", "subsection": "§17.2 Direct Service Requirements (7)(D)", "text": "assess the need for a written Corrective Action Plan to minimize the reoccurrence of the error and develop a plan if needed. If a plan exists, the PM2 Staff shall assess the adequacy of the plan and revise the plan as needed;", "category": "actionable", "applies_to": "agency", "codes": ["PM2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §17.2(7)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-17.2(7)(E)", "section": "Article 17 — Professional Medication Monitoring By A Registered Nurse", "subsection": "§17.2 Direct Service Requirements (7)(E)", "text": "Direct Service Requirements: document the medication error and Corrective Action Plan (if needed) in the Person's medical data sheet; and", "category": "actionable", "applies_to": "agency", "codes": ["PM2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §17.2(7)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-17.2(7)(F)", "section": "Article 17 — Professional Medication Monitoring By A Registered Nurse", "subsection": "§17.2 Direct Service Requirements (7)(F)", "text": "If the PM2 Staff becomes aware of a medication error on the day of the error, assess the Person's health risk as a result of the error, and if other providers of services to the Person need to be notified. If the medication error was on a prior date, the PM2 Staff shall notify the Contractor's director or designee where the error occurred.", "category": "reporting", "applies_to": "service_record", "codes": ["PM2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §17.2(7)(F)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-17.2(8)", "section": "Article 17 — Professional Medication Monitoring By A Registered Nurse", "subsection": "§17.2 Direct Service Requirements (8)", "text": "Direct Service Requirements: notify the Person's representative/legal guardian within 24 hours of the development of a Person's medical illness or injury requiring a medical appointment or an emergency room visit. (This does not include medical appointments for general health check-ups.)", "category": "actionable", "applies_to": "agency", "codes": ["PM2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §17.2(8)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-17.2(9)", "section": "Article 17 — Professional Medication Monitoring By A Registered Nurse", "subsection": "§17.2 Direct Service Requirements (9)", "text": "make regularly scheduled, documented face-to-face visits with the Person to conduct a written assessment of the Person's health and safety regarding the Person's medication regimen that has been prescribed to the Person from their health care professional. As determined necessary by the PM2 Staff, the assessment may include a review of other health needs as they relate to the overall wellbeing of the individual. If the assessment reveals information that should be relayed to the Person's healthcare professional, the PM2 Staff must relay that information to the Person's healthcare professional. The PM2 Staff shall maintain the assessment in the Person's records. The PM2 Staff shall ensure the assessment:", "category": "client", "applies_to": "client", "codes": ["PM2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §17.2(9)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-17.2(9)(A)", "section": "Article 17 — Professional Medication Monitoring By A Registered Nurse", "subsection": "§17.2 Direct Service Requirements (9)(A)", "text": "Direct Service Requirements: is based on data the PM2 Staff has collected through observation, discussion with other Staff providing services to the Person, review of records of other services the Person is receiving, and direct examination of the Person;", "category": "actionable", "applies_to": "agency", "codes": ["PM2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §17.2(9)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-17.2(9)(B)", "section": "Article 17 — Professional Medication Monitoring By A Registered Nurse", "subsection": "§17.2 Direct Service Requirements (9)(B)", "text": "Direct Service Requirements: includes the following: (i) safety and efficacy of the Person's prescribed medication within the PM2 Staff's scope of practice and training; (ii) benefits that the Person is demonstrating as a result of their medication regimen, or the lack thereof; (iii) any adverse medication reactions or side effects that the Person is experiencing; (iv) the Person's adherence or lack of adherence with their health care professional's medication related orders; and (v) any barriers to adherence to health care professional's medication related orders that the PM2 Staff identifies;", "category": "staff_qualification", "applies_to": "staff", "codes": ["PM2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §17.2(9)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-17.2(9)(C)", "section": "Article 17 — Professional Medication Monitoring By A Registered Nurse", "subsection": "§17.2 Direct Service Requirements (9)(C)", "text": "results are documented in a note in the Person's medical data sheet. The PM2 Staff shall include in the documentation the following:", "category": "documentation", "applies_to": "agency", "codes": ["PM2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §17.2(9)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-17.2(9)(C)(i)", "section": "Article 17 — Professional Medication Monitoring By A Registered Nurse", "subsection": "§17.2 Direct Service Requirements (9)(C)(i)", "text": "Direct Service Requirements: a description of the Person's subjective presentation;", "category": "actionable", "applies_to": "agency", "codes": ["PM2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §17.2(9)(C)(i)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-17.2(9)(C)(ii)", "section": "Article 17 — Professional Medication Monitoring By A Registered Nurse", "subsection": "§17.2 Direct Service Requirements (9)(C)(ii)", "text": "Direct Service Requirements: a description of the objective observations the PM2 Staff has made after the examination, including a review of records and consultations with other Staff providing other services or supports to the Person or the Person's family/representative;", "category": "actionable", "applies_to": "agency", "codes": ["PM2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §17.2(9)(C)(ii)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-17.2(9)(C)(iii)", "section": "Article 17 — Professional Medication Monitoring By A Registered Nurse", "subsection": "§17.2 Direct Service Requirements (9)(C)(iii)", "text": "Direct Service Requirements: a description of the assessment made by the PM2 Staff of the Person's status; and", "category": "actionable", "applies_to": "agency", "codes": ["PM2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §17.2(9)(C)(iii)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-17.2(9)(C)(iv)", "section": "Article 17 — Professional Medication Monitoring By A Registered Nurse", "subsection": "§17.2 Direct Service Requirements (9)(C)(iv)", "text": "Direct Service Requirements: a plan for the continuing care of the Person surrounding their health status and medication regimen.", "category": "actionable", "applies_to": "agency", "codes": ["PM2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §17.2(9)(C)(iv)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-17.2(9)(D)", "section": "Article 17 — Professional Medication Monitoring By A Registered Nurse", "subsection": "§17.2 Direct Service Requirements (9)(D)", "text": "Direct Service Requirements: includes any notes, any known allergies the Person has, any medication errors that occur, and any written corrective action plans to minimize the reoccurrence of each medication error if an error has occurred.", "category": "actionable", "applies_to": "agency", "codes": ["PM2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §17.2(9)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-17.2(10)", "section": "Article 17 — Professional Medication Monitoring By A Registered Nurse", "subsection": "§17.2 Direct Service Requirements (10)", "text": "Direct Service Requirements: provide copies of notes, assessment, and education regarding the Person's overall health to contractors providing other services to the Person as determined necessary by the PM2 Staff, the Person's health care professional, and the Person's Support Coordinator; and", "category": "actionable", "applies_to": "agency", "codes": ["PM2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §17.2(10)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-17.2(11)", "section": "Article 17 — Professional Medication Monitoring By A Registered Nurse", "subsection": "§17.2 Direct Service Requirements (11)", "text": "Direct Service Requirements: have PM2 Staff attend the Person's medical appointment if the appointment is regarding medication needs for stabilization.", "category": "actionable", "applies_to": "agency", "codes": ["PM2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §17.2(11)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-17.3", "section": "Article 17 — Professional Medication Monitoring By A Registered Nurse", "subsection": "§17.3 Specific Service Limitations", "text": "Specific Service Limitations. In addition to the General Limitations section of this contract, the Contractor shall NOT bill DHHS/DSPD for PM2 if the Person is receiving Professional Nursing Services (PN1or PN2).", "category": "exception", "applies_to": "agency", "codes": ["PM2", "PN2"], "creates_user_task": "no", "source": "DHHS91172 SOW §17.3", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-17.4", "section": "Article 17 — Professional Medication Monitoring By A Registered Nurse", "subsection": "§17.4 Specific Staff Qualifications", "text": "Specific Staff Qualifications. The Contractor shall ensure that PM2 Staff have a current RN or higher DOPL license.", "category": "agency_qualification", "applies_to": "agency", "codes": ["PM2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §17.4", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-17.5", "section": "Article 17 — Professional Medication Monitoring By A Registered Nurse", "subsection": "§17.5 Outcomes", "text": "Outcomes. (a) The intended outcome of this service is the monitoring of medication administration and education efforts that maintain health and treat diseases according to Persons' PCSP. (b) Measures: The percentage of Persons without medication errors. (c) Reporting: The Contractor shall create a fiscal year annual report starting fiscal year 2025 (fiscal year 2025 starts July 1, 2024). The fiscal year annual report will be submitted via Google Form by August 30th, 60 days after each fiscal year end. The outcome Google Form will be posted on the DSPD webpage. The Contractor shall explain any quality improvement activities they will undertake in response to their evaluation of the measurement data. The fiscal year annual report must include the following:", "category": "outcome", "applies_to": "agency", "codes": ["PM2"], "creates_user_task": "no", "source": "DHHS91172 SOW §17.5", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-17.5(1)", "section": "Article 17 — Professional Medication Monitoring By A Registered Nurse", "subsection": "§17.5 Outcomes (1)", "text": "Outcomes.: how many Persons received PM2; and", "category": "outcome", "applies_to": "agency", "codes": ["PM2"], "creates_user_task": "no", "source": "DHHS91172 SOW §17.5(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-17.5(2)", "section": "Article 17 — Professional Medication Monitoring By A Registered Nurse", "subsection": "§17.5 Outcomes (2)", "text": "Outcomes.: data reflecting the measure in (b) above.", "category": "outcome", "applies_to": "agency", "codes": ["PM2"], "creates_user_task": "no", "source": "DHHS91172 SOW §17.5(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-18.1", "section": "Article 18 — Professional Nursing Services I", "subsection": "§18.1 General Description", "text": "General Description. PN1 provides medical care for a Person under the delegation of a DOPL licensed RN.", "category": "definition", "applies_to": "agency", "codes": ["PN1"], "creates_user_task": "no", "source": "DHHS91172 SOW §18.1", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-18.2", "section": "Article 18 — Professional Nursing Services I", "subsection": "§18.2 Direct Service Requirements", "text": "Direct Service Requirements. The Contractor shall provide:", "category": "actionable", "applies_to": "agency", "codes": ["PN1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §18.2", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-18.2(1)", "section": "Article 18 — Professional Nursing Services I", "subsection": "§18.2 Direct Service Requirements (1)", "text": "Direct Service Requirements: medical care for a Person under the delegation of the Contractor's Professional Nursing Services II (\"PN2\") Staff. Delegated medical care includes:", "category": "actionable", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §18.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-18.2(1)(A)", "section": "Article 18 — Professional Nursing Services I", "subsection": "§18.2 Direct Service Requirements (1)(A)", "text": "Direct Service Requirements: hands-on care of medical devices such as G-tubes, urinary catheters, and other similar devices; (B ) G-tube feedings, colostomy bag care, oxygen administration and titration, and other nursing services per health care professional prescription; and", "category": "actionable", "applies_to": "agency", "codes": ["PN1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §18.2(1)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-18.2(1)(C)", "section": "Article 18 — Professional Nursing Services I", "subsection": "§18.2 Direct Service Requirements (1)(C)", "text": "Direct Service Requirements: medication management services, medication monitoring, and medication and medical equipment education and training as outlined in DHHS service codes PM1 and PM2.", "category": "staff_qualification", "applies_to": "staff", "codes": ["PM1", "PM2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §18.2(1)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-18.2(2)", "section": "Article 18 — Professional Nursing Services I", "subsection": "§18.2 Direct Service Requirements (2)", "text": "PN1 when:", "category": "actionable", "applies_to": "agency", "codes": ["PN1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §18.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-18.2(2)(A)", "section": "Article 18 — Professional Nursing Services I", "subsection": "§18.2 Direct Service Requirements (2)(A)", "text": "Direct Service Requirements: the Person's medical condition is stable and their response to treatment predictable;", "category": "actionable", "applies_to": "agency", "codes": ["PN1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §18.2(2)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-18.2(2)(B)", "section": "Article 18 — Professional Nursing Services I", "subsection": "§18.2 Direct Service Requirements (2)(B)", "text": "Direct Service Requirements: there are no Natural Supports capable of, or responsible for, providing the services per the Person's PCSP; and", "category": "client", "applies_to": "client", "codes": ["PN1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §18.2(2)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-18.2(2)(C)", "section": "Article 18 — Professional Nursing Services I", "subsection": "§18.2 Direct Service Requirements (2)(C)", "text": "Direct Service Requirements: the Person's medical needs require a minimum of weekly oversight from the Contractor's PN2 Staff.", "category": "actionable", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §18.2(2)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-18.2(3)", "section": "Article 18 — Professional Nursing Services I", "subsection": "§18.2 Direct Service Requirements (3)", "text": "PN1 in compliance with the Person's medical care plan developed by the Contractor's PN2 Staff. The PN1 Staff must submit written reports summarizing service provided to the Person to the Contractor's PN2 Staff as per the Person's Medical Care Plan.", "category": "actionable", "applies_to": "agency", "codes": ["PN1", "PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §18.2(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-18.3", "section": "Article 18 — Professional Nursing Services I", "subsection": "§18.3 Direct Administrative Requirements", "text": "Direct Administrative Requirements. The Contractor shall:", "category": "documentation", "applies_to": "agency", "codes": ["PN1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §18.3", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-18.3(1)", "section": "Article 18 — Professional Nursing Services I", "subsection": "§18.3 Direct Administrative Requirements (1)", "text": "Direct Administrative Requirements: have the option to train multiple Staff to provide PN1. PN1 is a daily rate that includes all PN1 services provided to the Person in a 24 hour period, even when the service is provided by more than one PN1 Staff; and", "category": "billing", "applies_to": "service_record", "codes": ["PN1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §18.3(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-18.3(2)", "section": "Article 18 — Professional Nursing Services I", "subsection": "§18.3 Direct Administrative Requirements (2)", "text": "Direct Administrative Requirements: maintain written billing service documentation that includes:", "category": "billing", "applies_to": "service_record", "codes": ["PN1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §18.3(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-18.3(2)(A)", "section": "Article 18 — Professional Nursing Services I", "subsection": "§18.3 Direct Administrative Requirements (2)(A)", "text": "Direct Administrative Requirements: the name of the service provided (PN1);", "category": "documentation", "applies_to": "agency", "codes": ["PN1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §18.3(2)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-18.3(2)(B)", "section": "Article 18 — Professional Nursing Services I", "subsection": "§18.3 Direct Administrative Requirements (2)(B)", "text": "Direct Administrative Requirements: the service delivery date;", "category": "documentation", "applies_to": "service_record", "codes": ["PN1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §18.3(2)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-18.3(2)(C)", "section": "Article 18 — Professional Nursing Services I", "subsection": "§18.3 Direct Administrative Requirements (2)(C)", "text": "Direct Administrative Requirements: the name of Person receiving the service;", "category": "documentation", "applies_to": "agency", "codes": ["PN1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §18.3(2)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-18.3(2)(D)", "section": "Article 18 — Professional Nursing Services I", "subsection": "§18.3 Direct Administrative Requirements (2)(D)", "text": "Direct Administrative Requirements: the name of the Staff providing the service; and", "category": "documentation", "applies_to": "agency", "codes": ["PN1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §18.3(2)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-18.3(2)(E)", "section": "Article 18 — Professional Nursing Services I", "subsection": "§18.3 Direct Administrative Requirements (2)(E)", "text": "Direct Administrative Requirements: a general summary daily note or shift summary of goals worked on and progress made completed by a Staff that provided the service. The summary should tie back to the Person's PSCP or support strategies and/or be consistent with the service description.", "category": "documentation", "applies_to": "agency", "codes": ["PN1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §18.3(2)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-18.4", "section": "Article 18 — Professional Nursing Services I", "subsection": "§18.4 Specific Service Limitations", "text": "Specific Service Limitations. In addition to the General Limitations section of this contract, the Contractor shall NOT bill DSPD for PN1:", "category": "exception", "applies_to": "agency", "codes": ["PN1"], "creates_user_task": "no", "source": "DHHS91172 SOW §18.4", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-18.4(1)", "section": "Article 18 — Professional Nursing Services I", "subsection": "§18.4 Specific Service Limitations (1)", "text": "Specific Service Limitations: without PN2 Staff oversight;", "category": "exception", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "no", "source": "DHHS91172 SOW §18.4(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-18.4(2)", "section": "Article 18 — Professional Nursing Services I", "subsection": "§18.4 Specific Service Limitations (2)", "text": "unless the Contractor is the Person's residential provider. Residential provider means the Contractor is providing the Person's RHS, HHS, PPS, or SLH; and", "category": "exception", "applies_to": "agency", "codes": ["HHS", "PPS", "RHS", "SLH"], "creates_user_task": "no", "source": "DHHS91172 SOW §18.4(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-18.4(3)", "section": "Article 18 — Professional Nursing Services I", "subsection": "§18.4 Specific Service Limitations (3)", "text": "Specific Service Limitations: if the Person is receiving Professional Medication Monitoring services (PM1 or PM2)", "category": "exception", "applies_to": "agency", "codes": ["PM1", "PM2"], "creates_user_task": "no", "source": "DHHS91172 SOW §18.4(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-18.5", "section": "Article 18 — Professional Nursing Services I", "subsection": "§18.5 Specific Staff Training", "text": "Specific Staff Training. Prior to providing PN1 service, the PN1 Staff shall be trained by the Contractor's PN2 Staff on the medical care tasks that will be provided, and the Person's Medical Care Plan.", "category": "staff_qualification", "applies_to": "staff", "codes": ["PN1", "PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §18.5", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-18.6", "section": "Article 18 — Professional Nursing Services I", "subsection": "§18.6 Outcomes", "text": "Outcomes. (a) The intended outcome of this service is maintained or improved medical outcomes through medical care task support with oversight provided by a RN for people in community based residential services. (b) Measures: The percentage of Persons who were able to remain in a home and community based setting and did not return to a long term care facility for medical reasons. (c) Reporting: The Contractor shall create a fiscal year annual report starting fiscal year 2025 (fiscal year 2025 starts July 1, 2024). The fiscal year annual report will be submitted via Google Form by August 30th, 60 days after each fiscal year end. The outcome Google Form will be posted on the DSPD webpage. The Contractor shall explain any quality improvement activities they will undertake in response to their evaluation of the measurement data. The fiscal year annual report must include the following:", "category": "outcome", "applies_to": "site", "codes": ["PN1"], "creates_user_task": "no", "source": "DHHS91172 SOW §18.6", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-18.6(1)", "section": "Article 18 — Professional Nursing Services I", "subsection": "§18.6 Outcomes (1)", "text": "Outcomes.: how many Persons received PN1; and", "category": "outcome", "applies_to": "agency", "codes": ["PN1"], "creates_user_task": "no", "source": "DHHS91172 SOW §18.6(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-18.6(2)", "section": "Article 18 — Professional Nursing Services I", "subsection": "§18.6 Outcomes (2)", "text": "Outcomes.: data reflecting the measure in (b) above.", "category": "outcome", "applies_to": "agency", "codes": ["PN1"], "creates_user_task": "no", "source": "DHHS91172 SOW §18.6(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.1", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.1 General Description", "text": "General Description. PN2 provides hands-on skilled nursing services for the Person.", "category": "definition", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "no", "source": "DHHS91172 SOW §19.1", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.2", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.2 Direct Service Requirements", "text": "Direct Service Requirements. The Contractor shall ensure:", "category": "actionable", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.2", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.2(1)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.2 Direct Service Requirements (1)", "text": "Direct Service Requirements: a Person's medical care is provided under the authority of the PN2 Staff's DOPL license and may include:", "category": "actionable", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.2(1)(A)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.2 Direct Service Requirements (1)(A)", "text": "Direct Service Requirements: hands-on care of G-tubes, urinary catheters, colostomy bags, and other similar medical devices;", "category": "actionable", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.2(1)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.2(1)(B)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.2 Direct Service Requirements (1)(B)", "text": "Direct Service Requirements: management of tracheostomies, ostomies, injections, g-tube feedings, complex medication administration, oxygen administration and titration, and other similar nursing services per a health care professional's order;", "category": "actionable", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.2(1)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.2(1)(C)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.2 Direct Service Requirements (1)(C)", "text": "Direct Service Requirements: sterile procedures or processes, invasive procedures, injectable medication administration, central line maintenance, and other similar services requiring nursing judgment; and", "category": "actionable", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.2(1)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.2(1)(D)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.2 Direct Service Requirements (1)(D)", "text": "Direct Service Requirements: medication management services, medication monitoring, and medication and medical equipment education and training as outlined in DHHS service codes PM1 and PM2.", "category": "staff_qualification", "applies_to": "staff", "codes": ["PM1", "PM2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.2(1)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.2(2)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.2 Direct Service Requirements (2)", "text": "PN2 is only provided when there are no Natural Supports to provide the services as per the Person's PCSP;", "category": "client", "applies_to": "client", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.2(3)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.2 Direct Service Requirements (3)", "text": "Direct Service Requirements: services are provided in compliance with the requirements in Utah Code §58-31b and Utah Administrative Code R156-31b-701;", "category": "actionable", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.2(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.2(4)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.2 Direct Service Requirements (4)", "text": "Direct Service Requirements: the Person's health care professional's orders are accurately and completely transcribed and implemented;", "category": "actionable", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.2(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.2(5)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.2 Direct Service Requirements (5)", "text": "Direct Service Requirements: correct and complete medical information is shared with the Person's health care professional, including any changes to the Person's medical status;", "category": "actionable", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.2(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.2(6)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.2 Direct Service Requirements (6)", "text": "RN PN2 Staff may delegate skilled nursing tasks to the Contractor's PN1 Staff, or to its LPN PN2 Staff. If skilled nursing tasks are delegated:", "category": "actionable", "applies_to": "agency", "codes": ["PN1", "PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.2(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.2(6)(A)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.2 Direct Service Requirements (6)(A)", "text": "the Person's medical condition must be stable and responsive to treatment is predictable; and", "category": "actionable", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.2(6)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.2(6)(B)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.2 Direct Service Requirements (6)(B)", "text": "Staff delegated to provide nursing services must be trained on the Person's Medical Care Plan by the RN PN2 Staff.", "category": "actionable", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.2(6)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.2(7)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.2 Direct Service Requirements (7)", "text": "RN PN2 Staff develop the Person's Medical Care Plan. When PN2 services start, the initial Medical Care Plan must be approved by a DSPD nurse via email at ctwnurse@utah.gov. Updates to the Medical Care Plan do not need to be approved by the DSPD Nurse. The Medical Care Plan must include:", "category": "actionable", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.2(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.2(7)(A)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.2 Direct Service Requirements (7)(A)", "text": "Direct Service Requirements: the Person's name, medical condition, current medications, and explanation of medical care needed;", "category": "actionable", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.2(7)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.2(7)(B)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.2 Direct Service Requirements (7)(B)", "text": "Direct Service Requirements: specific details on the delegated tasks, including what the tasks are and how to successfully complete the tasks;", "category": "actionable", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.2(7)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.2(7)(C)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.2 Direct Service Requirements (7)(C)", "text": "specific details on adverse reactions the Staff (who the service is being delegated to) must be aware of, and how and when such reactions need be reported to the RN PN2 Staff;", "category": "actionable", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.2(7)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.2(7)(D)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.2 Direct Service Requirements (7)(D)", "text": "how often the Staff (who the services are being delegated to) must meet with the RN PN2 Staff to coordinate the Person's medical care needs. At a minimum, they must meet monthly; and", "category": "actionable", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.2(7)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.2(7)(E)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.2 Direct Service Requirements (7)(E)", "text": "how often the Staff (who services are delegated to) must submit a report summarizing the Person's services, to the RN PN2 Staff. At a minimum, a report must be submitted monthly.", "category": "actionable", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.2(7)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.2(8)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.2 Direct Service Requirements (8)", "text": "the Medical Care Plan is reviewed at least annually by the RN PN2 Staff, unless the Person has substantial medical change. If the Person has a substantial medical change, the RN PN2 Staff must:", "category": "actionable", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.2(8)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.2(8)(A)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.2 Direct Service Requirements (8)(A)", "text": "Direct Service Requirements: review and update the Person's Medical Care Plan, as needed, within seven Calendar Days of discovering the medical change; and", "category": "actionable", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.2(8)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.2(8)(B)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.2 Direct Service Requirements (8)(B)", "text": "Direct Service Requirements: train Staff, who nursing services are being delegated to, on any changes to the Medical Care Plan prior to providing the Person services.", "category": "actionable", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.2(8)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.2(9)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.2 Direct Service Requirements (9)", "text": "if a Person has an immediate health and safety risk, the RN PN2 Staff may provide service through tele-health or via phone call. The RN PN2 Staff must:", "category": "actionable", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.2(9)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.2(9)(A)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.2 Direct Service Requirements (9)(A)", "text": "Direct Service Requirements: provide assistance and training to mitigate or resolve the urgent health and safety risk; and", "category": "staff_qualification", "applies_to": "staff", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.2(9)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.2(9)(B)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.2 Direct Service Requirements (9)(B)", "text": "Direct Service Requirements: document the situation and outcome in the Person's record.", "category": "client", "applies_to": "client", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.2(9)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.2(10)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.2 Direct Service Requirements (10)", "text": "PN2 Staff create a written monthly summary of services for each month services are provided. The monthly summary must include a status note on each item in the Person's Medical Care Plan. The monthly summaries must be submitted to the DSPD nurse and the Person's Support Coordinator the first year the Person is receiving PN2 service and to the Person's Support Coordinator monthly thereafter. The monthly summary must be submitted no later than 15 Calendar Days after the service month ended.", "category": "reporting", "applies_to": "service_record", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.2(10)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.3", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.3 Administrative Requirements", "text": "Administrative Requirements. The Contractor shall maintain written billing service documentation that includes:", "category": "billing", "applies_to": "service_record", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.3", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.3(1)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.3 Administrative Requirements (1)", "text": "Administrative Requirements: the name of the service provided (PN2);", "category": "documentation", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.3(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.3(2)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.3 Administrative Requirements (2)", "text": "Administrative Requirements: the service delivery date;", "category": "documentation", "applies_to": "service_record", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.3(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.3(3)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.3 Administrative Requirements (3)", "text": "Administrative Requirements: the name of Person receiving the service;", "category": "documentation", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.3(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.3(4)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.3 Administrative Requirements (4)", "text": "Administrative Requirements: the name of the Staff providing the service; and", "category": "documentation", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.3(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.3(5)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.3 Administrative Requirements (5)", "text": "Administrative Requirements: a daily note summarizing substantive activities consistent with the service code description.", "category": "documentation", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.3(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.4", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.4 Specific Service Limitations", "text": "Specific Service Limitations. In addition to the General Limitations section of this contract, the Contractor shall NOT:", "category": "exception", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "no", "source": "DHHS91172 SOW §19.4", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.4(1)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.4 Specific Service Limitations (1)", "text": "Specific Service Limitations: request a change of units in the Person's budget without providing documentation and receiving approval from the DSPD RN;", "category": "exception", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "no", "source": "DHHS91172 SOW §19.4(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.4(2)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.4 Specific Service Limitations (2)", "text": "Specific Service Limitations: provide more than three days of PN2 in a week, unless there is a documented need and justification of why the task(s) cannot be delegated to the Contractor's PN1 Staff in the Person's Medical Care Plan;", "category": "exception", "applies_to": "agency", "codes": ["PN1", "PN2"], "creates_user_task": "no", "source": "DHHS91172 SOW §19.4(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.4(3)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.4 Specific Service Limitations (3)", "text": "Specific Service Limitations: bill the daily rate and session rate on the same day;", "category": "exception", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "no", "source": "DHHS91172 SOW §19.4(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.4(4)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.4 Specific Service Limitations (4)", "text": "Specific Service Limitations: allow LPN PN2 Staff to provide delegated services to any PN1 Staff; and", "category": "exception", "applies_to": "agency", "codes": ["PN1", "PN2"], "creates_user_task": "no", "source": "DHHS91172 SOW §19.4(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.4(5)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.4 Specific Service Limitations (5)", "text": "Specific Service Limitations: bill PN2 if the Person is receiving Professional Medication Monitoring services (PM1 or PM2).", "category": "exception", "applies_to": "agency", "codes": ["PM1", "PM2", "PN2"], "creates_user_task": "no", "source": "DHHS91172 SOW §19.4(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.5", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.5 Specific Staff Qualifications", "text": "Specific Staff Qualifications. (a) At least one Staff must have a current RN or higher license through DOPL. (b) If using an LPN PN2 Staff, the LPN PN2 Staff must have a LPN license through DOPL and be working under the delegation and supervision of a RN or higher DOPL licensed PN2 Staff.", "category": "agency_qualification", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.5", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.6", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.6 Outcomes", "text": "Outcomes. (a) The intended outcome of this service is maintained or improved medical outcomes through medical care task support with oversight provided by a RN for people in community based residential services. (b) Measures: The percentage of Persons who were able to remain in a home and community based setting and did not return to a long term care facility for medical reasons. (c) Reporting: The Contractor shall create a fiscal year annual report starting fiscal year 2025 (fiscal year 2025 starts July 1, 2024). The fiscal year annual report will be submitted via Google Form by August 30th, 60 days after each fiscal year end. The outcome Google Form will be posted on the DSPD webpage. The Contractor shall explain any quality improvement activities they will undertake in response to their evaluation of the measurement data. The fiscal year annual report must include the following:", "category": "outcome", "applies_to": "site", "codes": ["PN2"], "creates_user_task": "no", "source": "DHHS91172 SOW §19.6", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.6(1)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.6 Outcomes (1)", "text": "Outcomes.: how many Persons are receiving PN2; and", "category": "outcome", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "no", "source": "DHHS91172 SOW §19.6(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.6(2)", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.6 Outcomes (2)", "text": "Outcomes.: data reflecting the measures in (b) above.", "category": "outcome", "applies_to": "agency", "codes": ["PN2"], "creates_user_task": "no", "source": "DHHS91172 SOW §19.6(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-19.7", "section": "Article 19 — Professional Nursing Services Ii", "subsection": "§19.7 Rate", "text": "Rate. PN2 is a daily and session rate. The daily rate requires an in-person visit. The session rate is only billable on days when the daily rate is not being billed, and when the RN PN2 Staff is coordinating delegations of nursing services during telehealth assistance. The total sessions billed in a day cannot exceed the daily rate.", "category": "billing", "applies_to": "service_record", "codes": ["PN2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §19.7", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.1", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.1 General Description", "text": "General Description. PPS provides a community integrated residential setting in a professional parent family home, providing support and services to Persons below the age of 22. The PPS setting is the Person's primary residence. PPS is provided for up to 24-hours on holidays and weekends and for up to 18-hours per day when the Person is in school, at work, or receiving other daytime support. Subcontracting is allowed under this service code.", "category": "definition", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "no", "source": "DHHS91172 SOW §20.1", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.2", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.2 Direct Service Requirements", "text": "Direct Service Requirements. The Contractor shall:", "category": "actionable", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.2", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.2(1)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.2 Direct Service Requirements (1)", "text": "Direct Service Requirements: maintain the Person's health and safety, including providing supervision.", "category": "actionable", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.2(2)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.2 Direct Service Requirements (2)", "text": "Direct Service Requirements: provide support to the Person aimed at achieving the Person's goals as per the Person's PCSP.", "category": "client", "applies_to": "client", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.2(3)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.2 Direct Service Requirements (3)", "text": "Direct Service Requirements: assist the Person with Activities of Daily Living;.", "category": "actionable", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.2(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.2(4)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.2 Direct Service Requirements (4)", "text": "Direct Service Requirements: assist the Person with acquiring, retaining, and improving skills related to living as independently as possible, participating in community settings of their choice, and avoiding isolation in their home and community;", "category": "actionable", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.2(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.2(5)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.2 Direct Service Requirements (5)", "text": "Direct Service Requirements: assist the Person with accessing community services and obtaining assistance from community and government organizations;", "category": "actionable", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.2(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.2(6)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.2 Direct Service Requirements (6)", "text": "Direct Service Requirements: collaborate and coordinate with schools, public and private child welfare agencies, authorities, other agencies and individuals involved in the Person's care;", "category": "actionable", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.2(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.2(7)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.2 Direct Service Requirements (7)", "text": "Direct Service Requirements: assist the Person with completing any Medicaid eligibility review documents, and ensure they are submitted timely; and", "category": "actionable", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.2(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.2(8)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.2 Direct Service Requirements (8)", "text": "Direct Service Requirements: provide transportation for the Person.", "category": "actionable", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.2(8)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements", "text": "Direct Service Administrative Requirements. The Contractor shall:", "category": "documentation", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(1)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (1)", "text": "Direct Service Administrative Requirements: prior to providing services, individuals who are 12 or older who have resided in the PPS home for any cumulative thirty day period of the past 12 months comply with the background screening requirements in Utah Code §26B-2-120 and Utah Administrative Code R501-14;", "category": "staff_qualification", "applies_to": "staff", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(2)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (2)", "text": "Direct Service Administrative Requirements: ensure the PPS home:", "category": "documentation", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(2)(A)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (2)(A)", "text": "Direct Service Administrative Requirements: is integrated in the community and supports the Person having access to the community;", "category": "documentation", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(2)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(2)(B)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (2)(B)", "text": "Direct Service Administrative Requirements: is physically accessible for the Person;", "category": "documentation", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(2)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(2)(C)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (2)(C)", "text": "Direct Service Administrative Requirements: optimizes autonomy and independence for the Person in making life choices and enables the Person to have control of their schedule, including access to food and visitors;", "category": "documentation", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(2)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(2)(D)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (2)(D)", "text": "Direct Service Administrative Requirements: allows the Person to decorate their personal space;", "category": "documentation", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(2)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(2)(E)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (2)(E)", "text": "Direct Service Administrative Requirements: allows the Person to have privacy, dignity, respect;", "category": "documentation", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(2)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(2)(F)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (2)(F)", "text": "Direct Service Administrative Requirements: ensure the Persons has freedom from coercion and restraint; and", "category": "documentation", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(2)(F)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(2)(G)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (2)(G)", "text": "Direct Service Administrative Requirements: is selected by the Person after all residential setting options are offered.", "category": "documentation", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(2)(G)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(3)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (3)", "text": "provide Direct Support and respite for the Person and support to, and supervision of, the PPS family by Staff that is not the PPS Staff. The required Direct Support hours are determined by the Person's PCPT. The PPSS DSPD Worksheet will contain the number of Direct Support hours required to be provided, as per the PCPT. The Contract
