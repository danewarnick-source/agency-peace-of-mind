: "CMP or CMS unless the Person has a need for the service that exceeds the range of activities that a parent, step parent, legal guardian or spouse would typically perform on behalf of an individual without a disability of the same age; and", "category": "exception", "applies_to": "agency", "codes": ["CMP", "CMS"], "creates_user_task": "no", "source": "DHHS91172 SOW §32.4(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-32.4(6)", "section": "Article 32 — Supported Living Natural", "subsection": "§32.4 Specific Service Limitations (6)", "text": "Specific Service Limitations: for time when the Person is asleep.", "category": "exception", "applies_to": "agency", "codes": ["SLN", "CMP", "CMS"], "creates_user_task": "no", "source": "DHHS91172 SOW §32.4(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-32.5", "section": "Article 32 — Supported Living Natural", "subsection": "§32.5 Specific Service Training Requirements", "text": "Specific Service Training Requirements. Effective July 1, 2026, the Contractor shall ensure its Staff providing CMS and CMP complete the DSPD training \"New Caregiver Compensation\" on the DSPD website, and pass with a score of 80% or higher.", "category": "staff_qualification", "applies_to": "staff", "codes": ["CMP", "CMS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §32.5", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-32.6", "section": "Article 32 — Supported Living Natural", "subsection": "§32.6 Service Code Selection", "text": "Service Code Selection. Supported Living includes SLN, CMS, and CMP. (a) SLN must be used when the service is received from a Staff that is not the Person's parent, step parent, legal guardian or spouse. (b) CMP must be used when the service is received from a Staff that is the Person's parent, step parent, or legal guardian. (c) CMS must be used when the service is received from a Staff that is the Person's spouse.", "category": "actionable", "applies_to": "agency", "codes": ["CMP", "CMS", "SLN"], "creates_user_task": "yes", "source": "DHHS91172 SOW §32.6", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-32.7", "section": "Article 32 — Supported Living Natural", "subsection": "§32.7 Outcomes", "text": "Outcomes. (a) The intended outcome of this service is a stable living environment that is integrated into the community, promotes Persons goals and community integration. (b) Measures: The percentage of Persons who remained in their community-based living setting. (c) Reporting: The Contractor shall create a fiscal year annual report starting fiscal year 2025 (fiscal year 2025 starts July 1, 2024). The fiscal year annual report will be submitted via Google Form by August 30th, 60 days after each fiscal year end. The outcome Google Form will be posted on the DSPD webpage. The Contractor shall explain any quality improvement activities they will undertake in response to their evaluation of the measurement data. The fiscal year annual report must include the following:", "category": "outcome", "applies_to": "agency", "codes": ["SLN", "CMP", "CMS"], "creates_user_task": "no", "source": "DHHS91172 SOW §32.7", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-32.7(1)", "section": "Article 32 — Supported Living Natural", "subsection": "§32.7 Outcomes (1)", "text": "Outcomes.: how many Persons received Supported Living; and", "category": "outcome", "applies_to": "agency", "codes": ["SLN", "CMP", "CMS"], "creates_user_task": "no", "source": "DHHS91172 SOW §32.7(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-32.7(2)", "section": "Article 32 — Supported Living Natural", "subsection": "§32.7 Outcomes (2)", "text": "Outcomes.: data reflecting the measure in (b) above.", "category": "outcome", "applies_to": "agency", "codes": ["SLN", "CMP", "CMS"], "creates_user_task": "no", "source": "DHHS91172 SOW §32.7(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.1", "section": "Article 33 — Supported Job Development", "subsection": "§33.1 General Description", "text": "General Description. SJD provides Persons with one-to-one support to achieve Competitive Integrated Employment that is based on the Person's strengths and interests.", "category": "definition", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "no", "source": "DHHS91172 SOW §33.1", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements", "text": "Direct Service Requirements. (a) The Contractor shall determine if a Discovery Process or a Vocational Assessment should be completed for the Person to obtain Competitive Integrated Employment. The Discovery Process should be completed with the Person, unless the Contractor:", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(1)", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (1)", "text": "Direct Service Requirements.: has coordinated with the Person and their PCST and determined a Vocational Assessment best meets the Person's needs; and", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(2)", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (2)", "text": "has documentation explaining why a Vocational Assessment, instead of a Discovery Process, best meets the needs of the Person. (b) The Contractor shall complete an assessment of the Person's transportation needs related to obtaining and maintaining Competitive Integrated Employment. (c) Unless determined as outlined above in 33.2 (1) that a Vocational Assessment should be completed, the Contractor shall complete a Discovery Process to obtain Customized Employment, using the Individualized Strengths-based Job Discovery Assessment that is posted on the DSPD webpage. The Contractor shall complete the Individualized Strengths-based Job Discovery Assessment within 60 Calendars Days of the start of the assessment. The Contractor shall complete a comprehensive assessment of the Person's interests, goals, existing strengths, existing skills, and conditions for Customized Employment success through activities of the Person's typical life by completing the following activities:", "category": "documentation", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(1)-2", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (1)", "text": "Direct Service Requirements.: interviews with the Person, their family, friends, and other individuals who are familiar with the Person's support needs;", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(2)-2", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (2)", "text": "Direct Service Requirements.: observations of the Person in places and activities that are familiar to them; and", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(3)", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (3)", "text": "if applicable, review assessments about the Person that have previously been completed. (d) As a result of the Discovery Process, the Contractor shall document a detailed employment profile in the Individualized Strengths-based Job Discovery Assessment. The Contractor shall ensure the employment profile includes:", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(1)-3", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (1)", "text": "Direct Service Requirements.: a summary of the Discovery Process;", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(2)-3", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (2)", "text": "Direct Service Requirements.: recommendations for the Person's employment goals; and", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(3)-2", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (3)", "text": "strategies to be used in obtaining Customized Employment. (e) When determined by the PCST that the Person should complete a Vocational Assessment, the Contractor shall use the Vocational Assessment posted on the DSPD webpage, and complete the assessment within 30 calendar days of the start of the assessment. The Vocational Assessment must result in a documented detailed Employment Plan that identifies:", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(1)-4", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (1)", "text": "Direct Service Requirements.: the Person's existing skills and interests that can be transferred into successful Competitive Integrated Employment;", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(2)-4", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (2)", "text": "Direct Service Requirements.: the Person's strengths and where they need support;", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(3)-3", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (3)", "text": "Direct Service Requirements.: the Person's learning strategies; and", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(4)", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (4)", "text": "needed accommodations for the worksite. (f) The Contractor shall conduct job development and connection activities, including:", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(1)-5", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (1)", "text": "Direct Service Requirements.: identifying potential employers and job opportunities in the community that match the Person's employment goals;", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(2)-5", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (2)", "text": "Direct Service Requirements.: supporting the Person in networking with potential employers as identified in either the Individualized Strengths-based Job Discovery Assessment or Vocational Assessment; and", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(3)-4", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (3)", "text": "explaining potential job details to the Person. (g) The Contractor shall develop, implement, and train the Person on job strategies that support the Person with their employment goals identified in their PCSP. The Contractor shall determine which job strategies to use based on the Person's needs, strengths, abilities, interests, and as informed by completed assessment tools relevant to achieving employment. The Contractor shall use one or more of the following job strategies:", "category": "client", "applies_to": "client", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(1)-6", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (1)", "text": "Direct Service Requirements.: job site and analysis, including having Staff visit potential community employment sites to identify job tasks or workflow implementations that may create job task opportunities for the Person;", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(2)-6", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (2)", "text": "Direct Service Requirements.: job shadowing or informational interview, including having Staff visit potential community employment sites to coordinate job shadowing or informational interviews or experiences that provide the Person with a realistic view of job tasks;", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(3)-5", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (3)", "text": "Direct Service Requirements.: paid community-integrated internships or temporary seasonal work experiences;", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(4)-2", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (4)", "text": "Direct Service Requirements.: work-based learning opportunities;", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(5)", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (5)", "text": "Direct Service Requirements.: mock interviews; and", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(6)", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (6)", "text": "visits to local businesses to learn about different companies, products, services, or employment opportunities. (h) The Contractor shall provide skill building and assistance to the Person in the following areas:", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(1)-7", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (1)", "text": "Direct Service Requirements.: how to obtain and retain employment;", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(2)-7", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (2)", "text": "Direct Service Requirements.: job searching;", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(3)-6", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (3)", "text": "Direct Service Requirements.: filling out applications and creating resumes and letters for employment;", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(4)-3", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (4)", "text": "Direct Service Requirements.: marketing the Person's skills to potential employers;", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(5)-2", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (5)", "text": "Direct Service Requirements.: job related time management;", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(6)-2", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (6)", "text": "Direct Service Requirements.: technology skills related to job searching and retainment;", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(7)", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (7)", "text": "Direct Service Requirements.: what workplace accommodations are needed and how to request them;", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(8)", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (8)", "text": "Direct Service Requirements.: self-advocacy and when or how to disclose a disability;", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(8)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(9)", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (9)", "text": "Direct Service Requirements.: work cultures and how to interact with supervisors, co-workers, and customers;", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(9)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(10)", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (10)", "text": "Direct Service Requirements.: setting employment goals and using person-centered planning tools;", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(10)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(11)", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (11)", "text": "Direct Service Requirements.: independently accessing transportation, when determined relevant by the Person's PCST; and", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(11)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(12)", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (12)", "text": "skill building and assistance to the Person with their ADLs (assistance with ADLs may be a component of SJD, but it may not comprise the entirety of the service). (i) The Contractor shall conduct an analysis on potential employment pay and benefits to determine how employment pay and benefits will interact with existing benefits the Person is receiving (i.e. Social Security Income, Title 2 benefits, Medicaid) and advise the Person on potential changes to their existing benefits. (j) The Contractor shall meet in-person with the Person at least weekly to assess progress towards their employment goals. The assessment must be documented in the monthly summary and include the Person's progress on each job strategy and all substantive information from meetings with the Person related to obtaining employment. If the Person is not progressing, the Contractor shall reevaluate the job strategy by:", "category": "reporting", "applies_to": "service_record", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(12)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(1)-8", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (1)", "text": "Direct Service Requirements.: assessing and documenting the job strategy changes needed for the Person to successfully obtain Competitive Integrated Employment; and", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(2)-8", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (2)", "text": "making recommendations to the PCST, if any, of other employment services the Person may need. (k) The Contractor shall provide supervision of the Person during the SJD service to ensure the Person's health and safety. (l) The Contractor shall provide transportation of the Person related to SJD, if needed. (m) After employment has been obtained, the Contractor shall provide 30 days of job retention support to the Person that includes:", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(1)-9", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (1)", "text": "Direct Service Requirements.: onboarding and required employer training;", "category": "staff_qualification", "applies_to": "staff", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(2)-9", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (2)", "text": "Direct Service Requirements.: assessment of the employment setting to evaluate task management, core job skill requirements, identification of the needed skills, and social support necessary for the Person to be successful;", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(3)-7", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (3)", "text": "Direct Service Requirements.: coordinating with the Person and the employer to develop written details of job duties, expectations, and how to resolve workplace problems;", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(4)-4", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (4)", "text": "Direct Service Requirements.: assessment of the employment setting for needed accommodations, including:", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(4)(A)", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (4)(A)", "text": "Direct Service Requirements.: identifying reasonable work site accommodations and accessibility needed for the Person to retain or enhance their employment; and", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(4)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(4)(B)", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (4)(B)", "text": "Direct Service Requirements.: coordinating with the employer, USOR Vocational Rehabilitation Services, the Person's DSPD support coordinator, and providing support to the Person to ensure the Person receives needed accommodations and accessibility that are legally required;", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(4)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(5)-3", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (5)", "text": "Direct Service Requirements.: developing skills to independently access transportation to and from their employment site;", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(6)-3", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (6)", "text": "Direct Service Requirements.: with the Person's informed consent and preferred level of disclosure, encouraging and providing skill building to the Person and the Person's co-workers, supervisors, and other employer contacts on engagement of natural co-worker support to the Person that is not specifically compensated, with the goal to minimize or eliminate the need for the Person to have continued paid supports; and", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.2(7)-2", "section": "Article 33 — Supported Job Development", "subsection": "§33.2 Direct Service Requirements (7)", "text": "Direct Service Requirements.: coordinating with and providing employment information to other individuals involved in the Person's employment goals.", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.2(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.3", "section": "Article 33 — Supported Job Development", "subsection": "§33.3 Direct Service Administrative Requirements", "text": "Direct Service Administrative Requirements. The Contractor shall:", "category": "documentation", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.3", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.3(1)", "section": "Article 33 — Supported Job Development", "subsection": "§33.3 Direct Service Administrative Requirements (1)", "text": "document and verify with the Person monthly if they have received any outreach from USOR (if funding becomes available the Person must transfer the service to USOR Vocational);", "category": "documentation", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.3(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.3(2)", "section": "Article 33 — Supported Job Development", "subsection": "§33.3 Direct Service Administrative Requirements (2)", "text": "Direct Service Administrative Requirements: ensure that employment obtained through SJD services is on a full or part-time basis, during traditional or non-traditional workdays and work hours, and in settings chosen by the person that includes working with others or remotely, the majority of whom are without disabilities;", "category": "documentation", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.3(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.3(3)", "section": "Article 33 — Supported Job Development", "subsection": "§33.3 Direct Service Administrative Requirements (3)", "text": "Direct Service Administrative Requirements: ensure that employment obtained through SJD services is at a wage commensurate with the Person's level of training and development, but not less than the customary wage and level of benefits paid by the employer for the same or similar work performed by individuals without disabilities, and at rates consistent with federal vocational rehabilitation regulations contained in the Fair Labor Standards Act;", "category": "staff_qualification", "applies_to": "staff", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.3(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.3(4)", "section": "Article 33 — Supported Job Development", "subsection": "§33.3 Direct Service Administrative Requirements (4)", "text": "Direct Service Administrative Requirements: enter (not upload) monthly summaries into UPI by the 15th of the month following the month of service, and include:", "category": "external", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.3(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.3(4)(A)", "section": "Article 33 — Supported Job Development", "subsection": "§33.3 Direct Service Administrative Requirements (4)(A)", "text": "Direct Service Administrative Requirements: the Person's name;", "category": "documentation", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.3(4)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.3(4)(B)", "section": "Article 33 — Supported Job Development", "subsection": "§33.3 Direct Service Administrative Requirements (4)(B)", "text": "Direct Service Administrative Requirements: the service provided to the Person;", "category": "documentation", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.3(4)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.3(4)(C)", "section": "Article 33 — Supported Job Development", "subsection": "§33.3 Direct Service Administrative Requirements (4)(C)", "text": "Direct Service Administrative Requirements: date range the summary covers;", "category": "documentation", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.3(4)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.3(4)(D)", "section": "Article 33 — Supported Job Development", "subsection": "§33.3 Direct Service Administrative Requirements (4)(D)", "text": "Direct Service Administrative Requirements: details of all employment activities;", "category": "documentation", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.3(4)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.3(4)(E)", "section": "Article 33 — Supported Job Development", "subsection": "§33.3 Direct Service Administrative Requirements (4)(E)", "text": "Direct Service Administrative Requirements: the Person's response to the service;", "category": "documentation", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.3(4)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.3(4)(F)", "section": "Article 33 — Supported Job Development", "subsection": "§33.3 Direct Service Administrative Requirements (4)(F)", "text": "Direct Service Administrative Requirements: information that indicates the progress towards the Person's employment goals;", "category": "documentation", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.3(4)(F)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.3(4)(G)", "section": "Article 33 — Supported Job Development", "subsection": "§33.3 Direct Service Administrative Requirements (4)(G)", "text": "Direct Service Administrative Requirements: documentation of the data collected from the weekly assessment with the Person as outlined in 33.2(j);", "category": "documentation", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.3(4)(G)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.3(4)(H)", "section": "Article 33 — Supported Job Development", "subsection": "§33.3 Direct Service Administrative Requirements (4)(H)", "text": "Direct Service Administrative Requirements: name of the Staff writing the monthly summary; and", "category": "reporting", "applies_to": "service_record", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.3(4)(H)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.3(4)(I)", "section": "Article 33 — Supported Job Development", "subsection": "§33.3 Direct Service Administrative Requirements (4)(I)", "text": "Direct Service Administrative Requirements: contact date with USOR and the Person's funding status with them.", "category": "documentation", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.3(4)(I)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.3(5)", "section": "Article 33 — Supported Job Development", "subsection": "§33.3 Direct Service Administrative Requirements (5)", "text": "Direct Service Administrative Requirements: enter employment support strategies into UPI no later than two weeks after the update of the PCSP; and", "category": "external", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.3(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.3(6)", "section": "Article 33 — Supported Job Development", "subsection": "§33.3 Direct Service Administrative Requirements (6)", "text": "Direct Service Administrative Requirements: provide SJD services with the Person whenever possible, and may provide the following service elements on behalf of the Person:", "category": "documentation", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.3(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.3(6)(A)", "section": "Article 33 — Supported Job Development", "subsection": "§33.3 Direct Service Administrative Requirements (6)(A)", "text": "Direct Service Administrative Requirements: employment search assistance; and", "category": "documentation", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.3(6)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.3(6)(B)", "section": "Article 33 — Supported Job Development", "subsection": "§33.3 Direct Service Administrative Requirements (6)(B)", "text": "Direct Service Administrative Requirements: outreach with community businesses to research and coordinate available employment opportunities, informal interviews, job shadowing; and work-based learning opportunities;", "category": "documentation", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.3(6)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.3(7)", "section": "Article 33 — Supported Job Development", "subsection": "§33.3 Direct Service Administrative Requirements (7)", "text": "Direct Service Administrative Requirements: enter and maintain the Person's employment data directly into UPI for each Person.", "category": "external", "applies_to": "client", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.3(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.4", "section": "Article 33 — Supported Job Development", "subsection": "§33.4 Specific Service Limitations", "text": "Specific Service Limitations. In addition to the General Limitations section of this contract, the Contractor shall NOT:", "category": "exception", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "no", "source": "DHHS91172 SOW §33.4", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.4(1)", "section": "Article 33 — Supported Job Development", "subsection": "§33.4 Specific Service Limitations (1)", "text": "bill DSPD for supporting the Person in employment, internships, or any other work experiences, paid or unpaid, in a business enterprise owned or operated by the Contractor or a party related to the Contractor; with the exception of when DSPD has granted prior written approval and the Person is competitively hired, and paid wages and benefits equal to similarly hired employees (DSPD written approval must be maintained by the Contractor and be available upon request);", "category": "exception", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "no", "source": "DHHS91172 SOW §33.4(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.4(2)", "section": "Article 33 — Supported Job Development", "subsection": "§33.4 Specific Service Limitations (2)", "text": "Specific Service Limitations: bill DSPD for Persons under the age of 14;", "category": "exception", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "no", "source": "DHHS91172 SOW §33.4(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.4(3)", "section": "Article 33 — Supported Job Development", "subsection": "§33.4 Specific Service Limitations (3)", "text": "Specific Service Limitations: bill DSPD for SEE or SEI on the same day as SJD, and", "category": "exception", "applies_to": "agency", "codes": ["SEE", "SEI", "SJD"], "creates_user_task": "no", "source": "DHHS91172 SOW §33.4(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.4(4)", "section": "Article 33 — Supported Job Development", "subsection": "§33.4 Specific Service Limitations (4)", "text": "Specific Service Limitations: bill DSPD for SJD for more than 80 hours per Person unless the Contractor receives prior authorization from the Request for Services Committee for up to 120 hours (all exemptions to the 80-hour limit will be reviewed by the employment planning and inclusion team and recommendations will be forwarded to the Request for Services Committee).", "category": "exception", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "no", "source": "DHHS91172 SOW §33.4(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.5", "section": "Article 33 — Supported Job Development", "subsection": "§33.5 Specific Contractor Qualifications", "text": "Specific Contractor Qualifications. (a) The Contractor shall be an approved vendor with USOR within 6 months of having a contract with DHHS/DSPD for SJB services and submit proof to the DHHS Office of Service review via osrprovider@utah.gov. (b) The Contractor shall ensure Staff providing SJD are certified in ACRE training through Utah State University or any accredited program available through the ACRE website. The Contractor shall ensure new hires successfully complete ACRE training within 60 days of hire and are supervised by Staff who is ACRE certified until the Staff has successfully completed their ACRE training. (c) The Contractor shall ensure Staff providing SJD have successfully complete Customized Employment Training through Utah State University available here: https://ceiutah.com/ce-training/ or a different accredited Customized Employment training when Staff is completing a Discovery Process as an element of SJD.", "category": "external", "applies_to": "staff", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.5", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.6", "section": "Article 33 — Supported Job Development", "subsection": "§33.6 Outcomes", "text": "Outcomes. (a) The intended outcome of this service is to find and retain Competitive Integrated Employment. (b) Measures: The Contractor shall maintain documentation on the following measures:", "category": "documentation", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.6", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.6(1)", "section": "Article 33 — Supported Job Development", "subsection": "§33.6 Outcomes (1)", "text": "Outcomes.: how many Persons received SJD;", "category": "outcome", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "no", "source": "DHHS91172 SOW §33.6(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.6(2)", "section": "Article 33 — Supported Job Development", "subsection": "§33.6 Outcomes (2)", "text": "Outcomes.: how many Persons found Competitive Integrated Employment;", "category": "outcome", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "no", "source": "DHHS91172 SOW §33.6(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.6(3)", "section": "Article 33 — Supported Job Development", "subsection": "§33.6 Outcomes (3)", "text": "Outcomes.: average starting wage of Persons who obtained Competitive Integrated Employment;", "category": "outcome", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "no", "source": "DHHS91172 SOW §33.6(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.6(4)", "section": "Article 33 — Supported Job Development", "subsection": "§33.6 Outcomes (4)", "text": "Outcomes.: the average starting weekly hours worked per Person; and", "category": "outcome", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "no", "source": "DHHS91172 SOW §33.6(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.6(5)", "section": "Article 33 — Supported Job Development", "subsection": "§33.6 Outcomes (5)", "text": "the average weekly hours the SJD Staff provided SJD service per Person. (c) Reporting: The Contractor shall create a fiscal year annual report starting fiscal year 2027 (fiscal year 2027 starts July 1, 2026). The fiscal year annual report will be submitted via Google Form by August 30th, 60 days after each fiscal year end. The outcome Google Form will be posted on the DSPD webpage. The Contractor shall explain any quality improvement activities they will undertake in response to their evaluation of the measurement data. The fiscal year annual report must include the measures outlined in (b) above.", "category": "outcome", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "no", "source": "DHHS91172 SOW §33.6(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.7", "section": "Article 33 — Supported Job Development", "subsection": "§33.7 Specific Billing Requirements", "text": "Specific Billing Requirements. The submission of late timesheet records or duplicate timesheet records with overlapping times or services, within the same day may not be paid by DHHS/DSPD. The Contractor shall:", "category": "billing", "applies_to": "service_record", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.7", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.7(1)", "section": "Article 33 — Supported Job Development", "subsection": "§33.7 Specific Billing Requirements (1)", "text": "Specific Billing Requirements: comply with the UPI Employee registry to set up a unique identifier for each Staff that will be stamped on each payment belonging to the Staff;", "category": "billing", "applies_to": "service_record", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.7(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.7(2)", "section": "Article 33 — Supported Job Development", "subsection": "§33.7 Specific Billing Requirements (2)", "text": "Specific Billing Requirements: submit Staff daily timesheet records for each pay period as individual payments directly into UPI system required data fields; and", "category": "external", "applies_to": "service_record", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.7(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-33.7(3)", "section": "Article 33 — Supported Job Development", "subsection": "§33.7 Specific Billing Requirements (3)", "text": "Specific Billing Requirements: input all UPI data fields as required by DSPD.", "category": "billing", "applies_to": "service_record", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §33.7(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-34.1", "section": "Article 34 — Supported Initial Job Placement Milestone Payment", "subsection": "§34.1 General Description", "text": "General Description. SJP provides a Contractor with a milestone payment after the Person successfully obtains Competitive Integrated Employment aligned with their strengths, interests, and employment goals as outlined in the Person's Employment Pathway tool and PCSP.", "category": "definition", "applies_to": "agency", "codes": ["SJP"], "creates_user_task": "no", "source": "DHHS91172 SOW §34.1", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-34.2", "section": "Article 34 — Supported Initial Job Placement Milestone Payment", "subsection": "§34.2 Milestone Payment Requirements", "text": "Milestone Payment Requirements. The Contractor shall support the Person through SJD to maintain their job placement in Competitive Integrated Employment for 30 consecutive days.", "category": "actionable", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §34.2", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-34.3", "section": "Article 34 — Supported Initial Job Placement Milestone Payment", "subsection": "§34.3 Milestone Payment Administrative Requirements", "text": "Milestone Payment Administrative Requirements. After the Person has met the milestone payment requirements for SJP, the Contractor shall submit a written request to the Person's Support Coordinator to complete a Request for Services (\"RFS\") for the Contractor to be considered to receive the SJP milestone payment. The Contractor shall provide the Person's Support Coordinator with the following documentation to complete the RFS:", "category": "reporting", "applies_to": "service_record", "codes": ["SJP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §34.3", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-34.3(1)", "section": "Article 34 — Supported Initial Job Placement Milestone Payment", "subsection": "§34.3 Milestone Payment Administrative Requirements (1)", "text": "Milestone Payment Administrative Requirements: verification of the Person's start date of employment;", "category": "documentation", "applies_to": "agency", "codes": ["SJP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §34.3(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-34.3(2)", "section": "Article 34 — Supported Initial Job Placement Milestone Payment", "subsection": "§34.3 Milestone Payment Administrative Requirements (2)", "text": "Milestone Payment Administrative Requirements: a copy of the Person's current pay stub including hours worked and hourly wage;", "category": "documentation", "applies_to": "agency", "codes": ["SJP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §34.3(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-34.3(3)", "section": "Article 34 — Supported Initial Job Placement Milestone Payment", "subsection": "§34.3 Milestone Payment Administrative Requirements (3)", "text": "Milestone Payment Administrative Requirements: electronic documentation uploaded to UPI evidencing the Person had informed choice in obtaining their job placement in Competitive Integrated Employment; and", "category": "client", "applies_to": "client", "codes": ["SJP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §34.3(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-34.3(4)", "section": "Article 34 — Supported Initial Job Placement Milestone Payment", "subsection": "§34.3 Milestone Payment Administrative Requirements (4)", "text": "Milestone Payment Administrative Requirements: a summary including: (A) how the Contractor was the primary source in assisting the Person to obtain Community Integrated Employment; (B) how the Person's employment meets the Person's employment goals; and (C) the Person's satisfaction with their employment.", "category": "documentation", "applies_to": "agency", "codes": ["SJP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §34.3(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-34.4", "section": "Article 34 — Supported Initial Job Placement Milestone Payment", "subsection": "§34.4 Specific Service Limitations", "text": "Specific Service Limitations. In addition to the General Limitations section of this contract:", "category": "exception", "applies_to": "agency", "codes": ["SJP"], "creates_user_task": "no", "source": "DHHS91172 SOW §34.4", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-34.4(1)", "section": "Article 34 — Supported Initial Job Placement Milestone Payment", "subsection": "§34.4 Specific Service Limitations (1)", "text": "the Contractor shall NOT request an SJP payment if the Contractor receives any retention incentive payment from USOR for the same Person and the same job; and", "category": "exception", "applies_to": "agency", "codes": ["SJP"], "creates_user_task": "no", "source": "DHHS91172 SOW §34.4(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-34.4(2)", "section": "Article 34 — Supported Initial Job Placement Milestone Payment", "subsection": "§34.4 Specific Service Limitations (2)", "text": "DSPD will NOT pay for SJP more than once every 12 months per Person.", "category": "exception", "applies_to": "agency", "codes": ["SJP"], "creates_user_task": "no", "source": "DHHS91172 SOW §34.4(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-34.5", "section": "Article 34 — Supported Initial Job Placement Milestone Payment", "subsection": "§34.5 Specific Contractor Qualification", "text": "Specific Contractor Qualification. The Contractor must have a current contract under DHHS91172 for Supported Job Development (SJD).", "category": "agency_qualification", "applies_to": "agency", "codes": ["SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §34.5", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-34.6", "section": "Article 34 — Supported Initial Job Placement Milestone Payment", "subsection": "§34.6 Outcomes", "text": "Outcomes. (a) The intended outcome of this service is for the Person to retain initial job placement for at least 30 days in a position that aligns with their strengths, interests and employment goals as outlined in the Person's Employment Pathway Tool and PCSP. (b) Measure: The total number of Persons who retained initial job placement in Competitive Integrated Employment for at least 30 days. (c) Reporting: The Contractor shall create a fiscal year annual report starting fiscal year 2027 (fiscal year 2027 starts July 1, 2026). The fiscal year annual report will be submitted via Google Form by August 30th, 60 days after each fiscal year end. The outcome Google Form will be posted on the DSPD webpage. The Contractor shall explain any quality improvement activities they will undertake in response to their evaluation of the measurement data. The fiscal year annual report must include the measures outlined (b) above.", "category": "outcome", "applies_to": "agency", "codes": ["SJP"], "creates_user_task": "no", "source": "DHHS91172 SOW §34.6", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-35.1", "section": "Article 35 — Supported Job Retention Milestone Payment", "subsection": "§35.1 General Description", "text": "General Description. SJR provides a Contractor with a milestone payment after the Person successfully retains their Competitive Integrated Employment for a consecutive period of 120 calendar days.", "category": "definition", "applies_to": "agency", "codes": ["SJR"], "creates_user_task": "no", "source": "DHHS91172 SOW §35.1", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-35.2", "section": "Article 35 — Supported Job Retention Milestone Payment", "subsection": "§35.2 Milestone Payment Requirements", "text": "Milestone Payment Requirements. The Contractor shall support the Person through SEI or SEE to retain their job placement in Competitive Integrated Employment for 120 consecutive days.", "category": "actionable", "applies_to": "agency", "codes": ["SEE", "SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §35.2", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-35.3", "section": "Article 35 — Supported Job Retention Milestone Payment", "subsection": "§35.3 Milestone Payment Administrative Requirements", "text": "Milestone Payment Administrative Requirements. After the Person has met the milestone payment requirements for SJR, the Contractor shall submit a written request to the Person's Support Coordinator to complete an RFS for the Contractor to be considered to receive the SJR payment. The Contractor shall provide the Person's Support Coordinator with the following documentation to complete the RFS:", "category": "reporting", "applies_to": "service_record", "codes": ["SJR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §35.3", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-35.3(1)", "section": "Article 35 — Supported Job Retention Milestone Payment", "subsection": "§35.3 Milestone Payment Administrative Requirements (1)", "text": "Milestone Payment Administrative Requirements: verification of the Person's start date of employment;", "category": "documentation", "applies_to": "agency", "codes": ["SJR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §35.3(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-35.3(2)", "section": "Article 35 — Supported Job Retention Milestone Payment", "subsection": "§35.3 Milestone Payment Administrative Requirements (2)", "text": "Milestone Payment Administrative Requirements: a copy of the Person's current pay stub including hours worked and hourly wage;", "category": "documentation", "applies_to": "agency", "codes": ["SJR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §35.3(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-35.3(3)", "section": "Article 35 — Supported Job Retention Milestone Payment", "subsection": "§35.3 Milestone Payment Administrative Requirements (3)", "text": "Milestone Payment Administrative Requirements: electronic documentation in the UPI evidencing the Person had informed choice in retaining their job placement in Competitive Integrated Employment;", "category": "client", "applies_to": "client", "codes": ["SJR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §35.3(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-35.3(4)", "section": "Article 35 — Supported Job Retention Milestone Payment", "subsection": "§35.3 Milestone Payment Administrative Requirements (4)", "text": "Milestone Payment Administrative Requirements: a summary including: (A) how the Person's employment meets the Person's employment goals; (B) hours of employment and if hours have decreased an explanation of why; and (C) the Person's satisfaction with their employment.", "category": "documentation", "applies_to": "agency", "codes": ["SJR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §35.3(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-35.4", "section": "Article 35 — Supported Job Retention Milestone Payment", "subsection": "§35.4 Specific Service Limitations", "text": "Specific Service Limitations. In addition to the General Limitations section of this contract:", "category": "exception", "applies_to": "agency", "codes": ["SJR"], "creates_user_task": "no", "source": "DHHS91172 SOW §35.4", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-35.4(1)", "section": "Article 35 — Supported Job Retention Milestone Payment", "subsection": "§35.4 Specific Service Limitations (1)", "text": "the Contractor shall not request an SJR payment if the Contractor receives any retention incentive payment from USOR for the same Person and same job; and", "category": "exception", "applies_to": "agency", "codes": ["SJR"], "creates_user_task": "no", "source": "DHHS91172 SOW §35.4(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-35.4(2)", "section": "Article 35 — Supported Job Retention Milestone Payment", "subsection": "§35.4 Specific Service Limitations (2)", "text": "DSPD will NOT pay for SJR more than once every 12 months per Person.", "category": "exception", "applies_to": "agency", "codes": ["SJR"], "creates_user_task": "no", "source": "DHHS91172 SOW §35.4(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-35.5", "section": "Article 35 — Supported Job Retention Milestone Payment", "subsection": "§35.5 Specific Contract Qualifications", "text": "Specific Contract Qualifications. The Contractor must have a current contract under DHHS91172 for Supported Employment Enterprise (SEE) or Supported Employment for an Individual (SEI).", "category": "agency_qualification", "applies_to": "agency", "codes": ["SEE", "SEI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §35.5", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-35.6", "section": "Article 35 — Supported Job Retention Milestone Payment", "subsection": "§35.6 Outcomes", "text": "Outcomes. (a) The intended outcome of this service is for the Person to retain Competitive Integrated Employment for 120 consecutive days in a position that aligns with their strengths, interests, and employment goals as outlined in the Person's Employment Pathway Tool and PCSP. (b) Measure: The Contractor shall maintain documentation on the number of Persons who retained Competitive Integrated Employment for at least 120 consecutive days. (c) Reporting: The Contractor shall create a fiscal year annual report starting fiscal year 2027 (fiscal year 2027 starts July 1, 2026). The fiscal year annual report will be submitted via Google Form by August 30th, 60 days after each fiscal year end. The outcome Google Form will be posted on the DSPD webpage. The Contractor shall explain any quality improvement activities they will undertake in response to their evaluation of the measurement data. The fiscal year annual report must include the measures outlined in (2) above.", "category": "outcome", "applies_to": "agency", "codes": ["SJR"], "creates_user_task": "no", "source": "DHHS91172 SOW §35.6", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-36.1", "section": "Article 36 — Family And Individual Training And Preparation- Dhhs Service Code: Tfb", "subsection": "§36.1 General Description", "text": "General Description. TFB provides coaching for Persons and their Immediate Relatives.", "category": "definition", "applies_to": "agency", "codes": ["TFB"], "creates_user_task": "no", "source": "DHHS91172 SOW §36.1", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-36.2", "section": "Article 36 — Family And Individual Training And Preparation- Dhhs Service Code: Tfb", "subsection": "§36.2 Direct Service Requirements", "text": "Direct Service Requirements. The Contractor shall provide:", "category": "actionable", "applies_to": "agency", "codes": ["TFB"], "creates_user_task": "yes", "source": "DHHS91172 SOW §36.2", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-36.2(1)", "section": "Article 36 — Family And Individual Training And Preparation- Dhhs Service Code: Tfb", "subsection": "§36.2 Direct Service Requirements (1)", "text": "assistance to the Person and their Immediate Relatives with acquiring, retaining, and improving skills aimed at safely preserving integration and inclusion of the Person in the community and family unit. Skills building must be based on the Person's and the Person's Family's needs and as per the Person's PCSP;", "category": "client", "applies_to": "client", "codes": ["TFB"], "creates_user_task": "yes", "source": "DHHS91172 SOW §36.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-36.2(2)", "section": "Article 36 — Family And Individual Training And Preparation- Dhhs Service Code: Tfb", "subsection": "§36.2 Direct Service Requirements (2)", "text": "Direct Service Requirements: training on the Person's treatment regimens, the use of adaptive equipment, self-advocacy skills, including instruction and consultation on ways to be as self-sufficient and independent as possible; and", "category": "staff_qualification", "applies_to": "staff", "codes": ["TFB"], "creates_user_task": "yes", "source": "DHHS91172 SOW §36.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-36.2(3)", "section": "Article 36 — Family And Individual Training And Preparation- Dhhs Service Code: Tfb", "subsection": "§36.2 Direct Service Requirements (3)", "text": "Direct Service Requirements: training on the Person's choices, rights and personal responsibilities, social skills development, accessing community activities, identifying, building and maintaining natural supports, family preservation, and other comparable topics.", "category": "staff_qualification", "applies_to": "staff", "codes": ["TFB"], "creates_user_task": "yes", "source": "DHHS91172 SOW §36.2(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-36.3", "section": "Article 36 — Family And Individual Training And Preparation- Dhhs Service Code: Tfb", "subsection": "§36.3 Specific Service Limitations", "text": "Specific Service Limitations. In addition to the General Limitations section of this contract, the Contractor shall not bill DSPD for services:", "category": "exception", "applies_to": "agency", "codes": ["TFB"], "creates_user_task": "no", "source": "DHHS91172 SOW §36.3", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-36.3(1)", "section": "Article 36 — Family And Individual Training And Preparation- Dhhs Service Code: Tfb", "subsection": "§36.3 Specific Service Limitations (1)", "text": "Specific Service Limitations: provided unless there is an exceptional care need that has been approved in writing by the DSPD Director prior to providing services for Persons who are currently receiving the following services: RHS, HHS, PPS; or SLH;", "category": "exception", "applies_to": "agency", "codes": ["HHS", "PPS", "RHS", "SLH"], "creates_user_task": "no", "source": "DHHS91172 SOW §36.3(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-36.3(2)", "section": "Article 36 — Family And Individual Training And Preparation- Dhhs Service Code: Tfb", "subsection": "§36.3 Specific Service Limitations (2)", "text": "Specific Service Limitations: that consist solely of supervision, companionship, or observation of the Person during community activities; and", "category": "exception", "applies_to": "agency", "codes": ["TFB"], "creates_user_task": "no", "source": "DHHS91172 SOW §36.3(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-36.3(3)", "section": "Article 36 — Family And Individual Training And Preparation- Dhhs Service Code: Tfb", "subsection": "§36.3 Specific Service Limitations (3)", "text": "Specific Service Limitations: to Persons who are the clients of DCFS.", "category": "exception", "applies_to": "agency", "codes": ["TFB"], "creates_user_task": "no", "source": "DHHS91172 SOW §36.3(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-36.4", "section": "Article 36 — Family And Individual Training And Preparation- Dhhs Service Code: Tfb", "subsection": "§36.4 Specific Staff Qualifications", "text": "Specific Staff Qualifications. Staff must have at least: 1. a bachelor's degree in social or behavioral sciences; and 2. one year, within the past five years, of work experience providing training to people with ID.RC and/or ABI and their families.", "category": "staff_qualification", "applies_to": "staff", "codes": ["TFB"], "creates_user_task": "yes", "source": "DHHS91172 SOW §36.4", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-36.5", "section": "Article 36 — Family And Individual Training And Preparation- Dhhs Service Code: Tfb", "subsection": "§36.5 Outcomes", "text": "Outcomes. (a) The intended outcome of this service is a stable living environment that is integrated into the community, promotes Persons goals and community integration. (b) Measures: The percentage of Persons who remained in their community-based living setting. (c) Reporting: The Contractor shall create a fiscal year annual report starting fiscal year 2025 (fiscal year 2025 starts July 1, 2024). The fiscal year annual report will be submitted via Google Form by August 30th, 60 days after each fiscal year end. The outcome Google Form will be posted on the DSPD webpage. The Contractor shall explain any quality improvement activities they will undertake in response to their evaluation of the measurement data. The fiscal year annual report must include the following:", "category": "outcome", "applies_to": "agency", "codes": ["TFB"], "creates_user_task": "no", "source": "DHHS91172 SOW §36.5", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-36.5(1)", "section": "Article 36 — Family And Individual Training And Preparation- Dhhs Service Code: Tfb", "subsection": "§36.5 Outcomes (1)", "text": "Outcomes.: how many Persons received TFA; and", "category": "outcome", "applies_to": "agency", "codes": ["TFB"], "creates_user_task": "no", "source": "DHHS91172 SOW §36.5(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-36.5(2)", "section": "Article 36 — Family And Individual Training And Preparation- Dhhs Service Code: Tfb", "subsection": "§36.5 Outcomes (2)", "text": "Outcomes.: data reflecting the measure in (b) above. Effective 7/1/26 [a]@Kai in reading this qualification again, I do believe it covers what is in (c ) and so I did not make any changes to the language", "category": "outcome", "applies_to": "agency", "codes": ["TFB"], "creates_user_task": "no", "source": "DHHS91172 SOW §36.5(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "cst-46-plan", "section": "Client Service Terms — CST 46", "subsection": "Emergency Management Plan", "text": "The Contractor shall keep a current Emergency Management and Business Continuity Plan on file. This is a standing capability required by DHHS Client Service Terms (CST 46), not a recurring class.", "category": "documentation", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "CST 46", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "cst-46-training", "section": "Client Service Terms — CST 46", "subsection": "Annual Emergency Management Plan training", "text": "Staff shall be trained at least annually on the Contractor's Emergency Management and Business Continuity Plan (CST 46). This is separate from the 30-day orientation.", "category": "staff_qualification", "applies_to": "staff", "codes": [], "creates_user_task": "yes", "source": "CST 46", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "cst-9-10", "section": "Client Service Terms — CST 9 & 10", "subsection": "Staff conflict of interest process", "text": "The Contractor shall maintain a written process for addressing staff conflict of interest (CST 9 & 10). Policy on file; not a per-period upload unless the policy changes.", "category": "documentation", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "CST 9 & 10", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "cst-29-36", "section": "Client Service Terms — CST 29–36", "subsection": "Liability insurance", "text": "The Contractor shall maintain current General, Professional, and Automobile liability insurance at contracted minimums (CST 29–36).", "category": "agency_qualification", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "CST 29–36", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "cst-50", "section": "Client Service Terms — CST 50", "subsection": "Internal Quality Management Plan", "text": "The Contractor shall follow an Internal Quality Management Plan that can be externally validated (CST 50).", "category": "documentation", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "CST 50", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "cst-55-56", "section": "Client Service Terms — CST 55 & 56", "subsection": "Timesheets / attendance record", "text": "The Contractor shall keep an accurate attendance / timesheet record (CST 55 & 56; SOW §1.10(7)) including Person, date, service code, staff, summary note, and start/end time for quarter-hour codes.", "category": "documentation", "applies_to": "service_record", "codes": [], "creates_user_task": "yes", "source": "CST 55 & 56", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "cst-76-signed", "section": "Client Service Terms — CST 76", "subsection": "DHHS Code of Conduct — signed", "text": "Staff assigned to SLN, SLH, HHS, or PPS shall have a signed DHHS Code of Conduct on file (CST 76).", "category": "staff_qualification", "applies_to": "staff", "codes": ["SLN", "SLH", "HHS", "PPS"], "creates_user_task": "yes", "source": "CST 76", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "cst-76-posted", "section": "Client Service Terms — CST 76", "subsection": "DHHS Code of Conduct — posted", "text": "The Contractor shall keep the current DHHS Code of Conduct posted at applicable sites (CST 76).", "category": "site", "applies_to": "site", "codes": [], "creates_user_task": "yes", "source": "CST 76", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}];
  const CATEGORIES = ["actionable", "staff_qualification", "agency_qualification", "client", "site", "documentation", "billing", "reporting", "exception", "external", "definition", "outcome", "unclear"];
  const APPLIES = ["agency", "site", "staff", "client", "service_record"];
  const ALL_CODES = ["ACA", "BC1", "BC2", "BC3", "CHA", "CMP", "CMS", "COM", "DSG", "DSP", "DSI", "ELS", "EPR", "HHS", "HSQ", "LPS", "MTP", "PAC", "PBA", "PM1", "PM2", "PN1", "PN2", "PPS", "RHS", "RL6", "RP2", "RP3", "RP4", "RP5", "RPS", "SEC", "SED", "SEE", "SEI", "SJD", "SJP", "SJR", "SLH", "SLN", "TFB"];
  const STORAGE_KEY = "hive-sow-review-v1";
  const UI_KEY = "hive-sow-review-ui-v1";
  const CSV_COLS = [
    "clause_id","sow_version","effective_date","section","subsection","clause_text",
    "category","service_codes","applies_to","extra_facts_needed","creates_user_task",
    "notes","source_page_or_anchor","review_status","dane_override_category","dane_notes"
  ];

  const store = {
    read() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }
      catch { return {}; }
    },
    write(all) { localStorage.setItem(STORAGE_KEY, JSON.stringify(all)); },
    get(id) { return this.read()[id] || {}; },
    patch(id, patch) {
      const all = this.read();
      all[id] = Object.assign({}, all[id] || {}, patch);
      this.write(all);
    }
  };

  function optionList(values, selected) {
    return values.map((v) =>
      `<option value="${v}" ${v === selected ? "selected" : ""}>${v}</option>`
    ).join("");
  }

  function reviewedStatus(id, clause) {
    const saved = store.get(id);
    return saved.review_status || "draft_ai";
  }

  function visibleIds(filter) {
    return CLAUSES.filter((c) => {
      const st = reviewedStatus(c.id, c);
      if (filter === "all") return true;
      if (filter === "unreviewed") return !store.get(c.id).review_status || st === "draft_ai";
      return st === filter;
    }).map((c) => c.id);
  }

  const state = {
    filter: "all",
    index: 0,
  };
  try {
    const ui = JSON.parse(localStorage.getItem(UI_KEY) || "{}");
    if (ui.filter) state.filter = ui.filter;
  } catch { /* ignore */ }

  function currentList() {
    const ids = visibleIds(state.filter);
    return ids.map((id) => CLAUSES.find((c) => c.id === id)).filter(Boolean);
  }

  function merge(clause) {
    const saved = store.get(clause.id);
    const codes = saved.service_codes
      ? String(saved.service_codes).split(",").map((s) => s.trim()).filter(Boolean)
      : clause.codes.slice();
    return {
      category: saved.category || clause.category,
      applies_to: saved.applies_to || clause.applies_to,
      creates_user_task: saved.creates_user_task || clause.creates_user_task,
      review_status: saved.review_status || "draft_ai",
      dane_override_category: saved.dane_override_category || "",
      extra_facts_needed: saved.extra_facts_needed || "",
      notes: saved.notes || "",
      dane_notes: saved.dane_notes || "",
      other_codes: saved.other_codes || "",
      codes,
      all: !!saved.all_codes,
    };
  }

  function collectForm(clause) {
    const root = document.getElementById("cardHost");
    if (!root) return {};
    const codes = [...root.querySelectorAll("input[name=code]:checked")].map((el) => el.value);
    const all = !!root.querySelector("input[name=codeAll]")?.checked;
    const other = (root.querySelector("#otherCodes")?.value || "").trim();
    let service_codes = all ? ["ALL", ...codes] : codes;
    if (other) service_codes = [...service_codes, other];
    return {
      category: root.querySelector("#category")?.value,
      applies_to: root.querySelector("#applies_to")?.value,
      creates_user_task: root.querySelector("#creates_user_task")?.value,
      review_status: root.querySelector("#review_status")?.value,
      dane_override_category: root.querySelector("#dane_override_category")?.value,
      extra_facts_needed: root.querySelector("#extra_facts_needed")?.value,
      notes: root.querySelector("#notes")?.value,
      dane_notes: root.querySelector("#dane_notes")?.value,
      other_codes: other,
      all_codes: all,
      service_codes: service_codes.join(","),
    };
  }

  function persist() {
    const list = currentList();
    const clause = list[state.index];
    if (!clause) return;
    store.patch(clause.id, collectForm(clause));
  }

  function render() {
    const list = currentList();
    const host = document.getElementById("cardHost");
    const prog = document.getElementById("progress");
    document.getElementById("prevBtn").disabled = state.index <= 0;
    document.getElementById("nextBtn").disabled = state.index >= list.length - 1 || list.length === 0;
    if (!list.length) {
      prog.textContent = "0 of 0";
      host.innerHTML = `<div class="empty">No clauses match this filter.</div>`;
      return;
    }
    if (state.index >= list.length) state.index = list.length - 1;
    if (state.index < 0) state.index = 0;
    const clause = list[state.index];
    const m = merge(clause);
    prog.textContent = `${state.index + 1} of ${list.length}`;

    const codeBoxes = ALL_CODES.map((code) => {
      const on = m.all || m.codes.includes(code);
      return `<label><input type="checkbox" name="code" value="${code}" ${on ? "checked" : ""} />${code}</label>`;
    }).join("");

    host.innerHTML = `
      <article class="card">
        <div>
          <span class="badge">${escapeHtml(clause.section)}</span>
          <span class="badge">${escapeHtml(clause.subsection)}</span>
        </div>
        <div class="idline">${escapeHtml(clause.id)}</div>
        <p class="clause">${escapeHtml(clause.text)}</p>
        <p class="hint">Source: ${escapeHtml(clause.source)} · AI draft category <strong>${escapeHtml(clause.category)}</strong></p>

        <label class="field" for="category">Category</label>
        <select id="category">${optionList(CATEGORIES, m.category)}</select>

        <label class="field" for="applies_to">Applies to</label>
        <select id="applies_to">${optionList(APPLIES, m.applies_to)}</select>

        <label class="field" for="creates_user_task">Creates user task</label>
        <select id="creates_user_task">${optionList(["yes","no"], m.creates_user_task)}</select>

        <label class="field" for="review_status">Review status</label>
        <select id="review_status">${optionList(["draft_ai","reviewed_ok","needs_fix","drop"], m.review_status)}</select>

        <label class="field" for="dane_override_category">Dane override category</label>
        <select id="dane_override_category">
          <option value="">(none)</option>
          ${optionList(CATEGORIES, m.dane_override_category)}
        </select>

        <label class="field">Service codes</label>
        <div class="codes">
          <label><input type="checkbox" name="codeAll" ${m.all ? "checked" : ""} />ALL</label>
          ${codeBoxes}
        </div>
        <label class="field" for="otherCodes">Other service codes</label>
