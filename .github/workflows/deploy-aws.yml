name: Deploy AWS (parallel target)

# Parallel deployment target alongside Lovable/Cloudflare. This workflow never
# touches wrangler.jsonc, src/server.ts's Cloudflare entry point, or anything
# Lovable's GitHub sync manages — it only runs `npm run build:aws` (a separate
# nitro preset, see vite.config.ts) and ships that output to S3 + Lambda.
# See docs/AWS_DEPLOY.md for the one-time AWS console setup this depends on.

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy to AWS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (AWS target)
        run: npm run build:aws
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          PUBLIC_SITE_URL: ${{ secrets.AWS_PUBLIC_SITE_URL }}

      - name: Package Lambda function code
        run: |
          cd dist-aws/server
          zip -r ../../hive-lambda.zip . -x '*.map'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync static assets to S3
        run: |
          aws s3 sync dist-aws/client "s3://${{ secrets.AWS_S3_BUCKET }}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" \
            --exclude "*.webmanifest"
          aws s3 cp dist-aws/client/index.html "s3://${{ secrets.AWS_S3_BUCKET }}/index.html" \
            --cache-control "public,max-age=0,must-revalidate" || true
          if [ -f dist-aws/client/manifest.webmanifest ]; then
            aws s3 cp dist-aws/client/manifest.webmanifest "s3://${{ secrets.AWS_S3_BUCKET }}/manifest.webmanifest" \
              --cache-control "public,max-age=0,must-revalidate"
          fi

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name "${{ secrets.AWS_LAMBDA_FUNCTION_NAME }}" \
            --zip-file fileb://hive-lambda.zip \
            --publish

      - name: Wait for Lambda update to finish propagating
        run: |
          aws lambda wait function-updated \
            --function-name "${{ secrets.AWS_LAMBDA_FUNCTION_NAME }}"

      - name: Invalidate CloudFront cache
        if: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
