s_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.22(9)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.22(10)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.22 Person's Discharge Procedure (10)", "text": "all court orders and court obligations. (c) If the Contractor is initiating the discharge of a Person from its services, the Contractor shall:", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.22(10)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.22(1)-3", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.22 Person's Discharge Procedure (1)", "text": "Person's Discharge Procedure.: provide verbal and written notification 30 days prior to the intended discharge date to the Person and the Person's Support Coordinator;", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.22(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.22(2)-3", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.22 Person's Discharge Procedure (2)", "text": "Person's Discharge Procedure.: continue to provide services to the Person for up to an additional 90 days after the Contractor initiates the Person's discharge, if directed to by the DSPD Director or designee. If there are concerns regarding the health and safety of the Person or other people, or if there are other considerations, the Contractor may appeal this extension to the DSPD Director; and", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.22(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.22(3)-3", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.22 Person's Discharge Procedure (3)", "text": "submit a discharge summary to the Person's Support Coordinator no later than seven days after the date the Contractor gave notice of discharge. (d) The Person may choose to discharge from services with the Contractor at any time. The Contractor shall not require the Person to give prior written or verbal notification of discharge from services. If a Person chooses to discharge from the Contractor's services, the Contractor shall submit a discharge summary to the Person's Support Coordinator at the time of discharge.", "category": "exception", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.22(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.23", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.23 Health Support Policies and Procedures", "text": "Health Support Policies and Procedures. The Contractor shall take reasonable measures to ensure the health and safety of Persons and have policies and procedures to support the Persons' health and medical needs. (a) For all services involving Direct Support to Persons, the Contractor shall maintain and document the following in the Person's record:", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.23", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.23(1)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.23 Health Support Policies and Procedures (1)", "text": "Health Support Policies and Procedures: medical concerns, serious illnesses, allergies the Person suffers from, and chronic conditions and complaints;", "category": "documentation", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.23(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.23(2)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.23 Health Support Policies and Procedures (2)", "text": "Health Support Policies and Procedures: swallow reflex issues;", "category": "documentation", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.23(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.23(3)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.23 Health Support Policies and Procedures (3)", "text": "Health Support Policies and Procedures: authorization for any emergency medical treatment needed; and", "category": "documentation", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.23(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.23(4)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.23 Health Support Policies and Procedures (4)", "text": "any advanced directives. (b) If the Contractor supports Persons in their self-directed, self-administration of prescription medication, the Contractor shall have policies and procedures that ensure:", "category": "documentation", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.23(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.23(1)-2", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.23 Health Support Policies and Procedures (1)", "text": "Health Support Policies and Procedures: medications are properly stored according to the Person's needs and capabilities, as determined by the Person's PCPT;", "category": "documentation", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.23(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.23(2)-2", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.23 Health Support Policies and Procedures (2)", "text": "Health Support Policies and Procedures: theft prevention and abuse of medication;", "category": "documentation", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.23(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.23(3)-2", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.23 Health Support Policies and Procedures (3)", "text": "Health Support Policies and Procedures: training and explanation to the Person regarding the prescribed medication indication, the correct dose, how to properly administer the medicine, and the schedule for taking the medication according to the prescription and healthcare professional;", "category": "staff_qualification", "applies_to": "staff", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.23(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.23(4)-2", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.23 Health Support Policies and Procedures (4)", "text": "Health Support Policies and Procedures: supervision of the Person while the Person takes their medication; and", "category": "documentation", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.23(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.23(5)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.23 Health Support Policies and Procedures (5)", "text": "that the Staff that observes or assists the Person with medication documents the following in the Person's record: time and date the medication was taken; medication name; reason the medication was taken if the medication is an \"as needed\" (\"PRN\") medication; the route the medication was administered; and the name of the Staff that observed the medication administration. (c) If the Contractor provides Residential Habilitation Services (\"RHS\"), Professional Parent Supports (\"PPS\"), Host Home Supports (\"HHS\"), Day Supports - Group (\"DSG\"), Day Supports - Partial (\"DSP\"), Day Supports - Individual (\"DSI\"), or Employment Preparation Service (\"EPR\"), or otherwise has primary responsibility for the Person's medication, the Contractor shall ensure that its policies and procedures address the following:", "category": "client", "applies_to": "client", "codes": ["DSG", "DSP", "DSI", "EPR", "HHS", "PPS", "RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.23(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.23(1)-3", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.23 Health Support Policies and Procedures (1)", "text": "the Person's prescription medication must be packaged and dispensed to the Person by a licensed pharmacy using dose packaging when dose packaging is available. If dose packaging is not available, the Contractor may provide medication supports with medication that is dispensed in the original and lawful packaging of the medication with prior written approval from the DSPD Director or designee;", "category": "documentation", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.23(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.23(2)-3", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.23 Health Support Policies and Procedures (2)", "text": "Health Support Policies and Procedures: medication disposal;", "category": "documentation", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.23(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.23(3)-3", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.23 Health Support Policies and Procedures (3)", "text": "Health Support Policies and Procedures: process to ensure the transfer of prescription medication for services provided to the Person by a school or another service provider;", "category": "documentation", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.23(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.23(4)-3", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.23 Health Support Policies and Procedures (4)", "text": "Health Support Policies and Procedures: provisions to report or address the discovery of any prescribed medication errors.; and", "category": "documentation", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.23(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.23(5)-2", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.23 Health Support Policies and Procedures (5)", "text": "enhanced process for monitoring the dispensing, tracking, and written documentation in Person's medical data sheet of Schedule II- IV medication under Title II of the Comprehensive Drug Abuse Prevention and Control Act of 1970, 21 U.S.C., 13, Subchapter I Part B §812,. The enhanced process for monitoring must include provisions for ensuring the medication count is accurate, and for theft and abuse prevention. (d) If the Contractor will support Persons in their self-directed, self-administration of prescription medication, the Contractor shall ensure that the Person's record includes:", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.23(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.23(1)-4", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.23 Health Support Policies and Procedures (1)", "text": "Health Support Policies and Procedures: the name and purpose of each medication the Person is taking;", "category": "documentation", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.23(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.23(2)-4", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.23 Health Support Policies and Procedures (2)", "text": "Health Support Policies and Procedures: instruction regarding routes of administration and dosage for each medication;", "category": "documentation", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.23(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.23(3)-4", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.23 Health Support Policies and Procedures (3)", "text": "Health Support Policies and Procedures: medication adversities, side effects, and indications of an effect or adverse reaction for each medication, including if there is a possibility that medication taken may contribute to swallowing difficulties or enhance the prospects of choking; and", "category": "documentation", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.23(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.23(4)-4", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.23 Health Support Policies and Procedures (4)", "text": "documentation of compliance with medication administration requirements. (e) If the Contractor provides RHS, PPS, or HHS, or has primary responsibility for the Person's health care needs, the Contractor shall ensure the Person receives training for and assistance with identifying primary health care professionals within their Medicaid and private insurance, and seeking and obtaining routine and acute medical, dental, psychiatric, or other health related services as specified in the Person's PCSP and covered by the Person's Medicaid or private insurance plan. (f) If the Contractor provides Supported Living Hourly (\"SLH\"), RHS, PPS, or HHS to the Person, and the Person attends school or receives day supports or overnight respite services from a different provider, the Contractor shall:", "category": "staff_qualification", "applies_to": "staff", "codes": ["HHS", "PPS", "RHS", "SLH"], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.23(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.23(1)-5", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.23 Health Support Policies and Procedures (1)", "text": "Health Support Policies and Procedures: ensure that each school, day services provider, and overnight respite agency receives the Person's current relevant health and medical information, and relevant changes; and", "category": "documentation", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.23(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.23(2)-5", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.23 Health Support Policies and Procedures (2)", "text": "collaborate and communicate with each school, day services provider, and overnight respite agency to receive relevant health and medical changes that have arisen during the services provided by the other agency. (g) If the Contractor provides the Person's day services or overnight respite services and is receiving the Person's health and medical information from the Person's RHS, PPS, HHS, or SLH agency, the Contractor shall:", "category": "documentation", "applies_to": "agency", "codes": ["HHS", "PPS", "RHS", "SLH"], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.23(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.23(1)-6", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.23 Health Support Policies and Procedures (1)", "text": "Health Support Policies and Procedures: ensure relevant health and medical changes that have arisen during services provided are documented in the Person's record, and provided to the other service provider; and", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.23(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.23(2)-6", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.23 Health Support Policies and Procedures (2)", "text": "collaborate and communicate with the other service provider to receive the Person's current health and medical information and relevant changes. (h) The Contractor shall maintain and document the following additional health and medical information in the Person's record if it is providing RHS, PPS, HHS, SLH, overnight respite, or if the Contractor is primarily responsible for the Person's medical needs:", "category": "client", "applies_to": "client", "codes": ["HHS", "PPS", "RHS", "SLH"], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.23(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.23(1)-7", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.23 Health Support Policies and Procedures (1)", "text": "Health Support Policies and Procedures: medical and/or dental examinations performed, including assessments or treatments;", "category": "documentation", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.23(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.23(2)-7", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.23 Health Support Policies and Procedures (2)", "text": "Health Support Policies and Procedures: current condition and diagnoses for which the Person is receiving care from a healthcare professional;", "category": "documentation", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.23(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.23(3)-5", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.23 Health Support Policies and Procedures (3)", "text": "Health Support Policies and Procedures: surgeries, accidents, injuries, and incidents requiring first aid and a referral to a health care professional or a healthcare facility;", "category": "staff_qualification", "applies_to": "staff", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.23(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.23(4)-5", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.23 Health Support Policies and Procedures (4)", "text": "Health Support Policies and Procedures: immunizations; and", "category": "documentation", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.23(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.23(5)-3", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.23 Health Support Policies and Procedures (5)", "text": "Health Support Policies and Procedures: significant changes in health.", "category": "documentation", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.23(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.24", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.24 Person Centered Planning", "text": "Person Centered Planning. The Contractor shall:", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.24", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.24(1)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.24 Person Centered Planning (1)", "text": "Person Centered Planning: be an active member of the PCPT and participate in developing the PCSP;", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.24(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.24(2)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.24 Person Centered Planning (2)", "text": "Person Centered Planning: support the Person and their family to participate in the PCSP to the greatest extent possible and assist the Person, their family, and the Person's Support Coordinator to ensure that the process is anchored in the Person's desires, interests, and needs, and those of their family and legal representative, and the resultant PCSP reflects the Person's priority desires, interests, and needs;", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.24(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.24(3)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.24 Person Centered Planning (3)", "text": "Person Centered Planning: ensure that the Person is supported to lead their own PCSP meeting to the greatest extent possible;", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.24(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.24(4)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.24 Person Centered Planning (4)", "text": "Person Centered Planning: comply with the Person's PCSP;", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.24(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.24(5)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.24 Person Centered Planning (5)", "text": "develop Support Strategies for the Person's PCSP goals and ensure all services are associated with at least one Support Strategy except for the following services: Extended Living Supports (\"ELS\") , Motor Transportation Payment (\"MTP\"), Personal Budget Assistance (\"PBA\"), Professional Medication Monitoring, and Respite. The BSP is the Support Strategy for Behavior Consultation. The Medical Care Plan is the Support Strategy for Professional Nursing Services. The Contractor shall submit Support Strategies to the Person's Support Coordinator within 30 days from the date the PCSP is activated with the exception of the BSP and the Medical Care Plan, which shall be submitted to the Person's Support Coordinator within the timelines outlined in the Behavior Consultation service descriptions;", "category": "reporting", "applies_to": "service_record", "codes": ["ELS", "MTP", "PBA"], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.24(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.24(6)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.24 Person Centered Planning (6)", "text": "Person Centered Planning: implement the applicable portions of the Person's PCSP, Support Strategies, and the BSP;", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.24(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.24(7)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.24 Person Centered Planning (7)", "text": "Person Centered Planning: orient the Person to the portion of the PCSP applicable to the Contractor and ensure the Person is involved in PCSP implementation;", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.24(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.24(8)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.24 Person Centered Planning (8)", "text": "Person Centered Planning: assist with the Person's assessments and conduct assessments; and", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.24(8)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.24(9)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.24 Person Centered Planning (9)", "text": "meet with the PCPT to review the Person's services and support needs and make any necessary adjustments based on the Person's needs. The Contractor shall meet with the PCPT at least annually, within 12 months of the last PCSP meeting, or more often as determined by the Person or other PCPT members.", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.24(9)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.25", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.25 Quarterly Summaries", "text": "Quarterly Summaries. The Contractor may format the quarterly summary as a single summary or multiple summaries. For Supported Living Natural (CMP or CMS), Professional Nursing Services (PN1 or PN2), Supported Employment for an Individual (SEI), and Supported Job Development (SJD), the required monthly summaries replace the quarterly summaries. For Personal Budget Assistance (PBA), the required monthly financial statements replace the quarterly summaries. For Behavior Consultation (BC1, BC2 or BC3), the Contractor shall ensure that the quarterly summary also meets the requirements in the Behavior Consultation specific service description contract section. The Contractor shall submit quarterly summaries to the Person's Support Coordinator no later than 15 Calendar Days after the end of the quarter. The Contractor shall create a written quarterly summary for each Person the Contractor provides services to which includes:", "category": "reporting", "applies_to": "client", "codes": ["BC1", "BC2", "BC3", "CMP", "CMS", "PBA", "PN1", "PN2", "SEI", "SJD"], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.25", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.25(1)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.25 Quarterly Summaries (1)", "text": "Person's name;", "category": "reporting", "applies_to": "service_record", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.25(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.25(2)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.25 Quarterly Summaries (2)", "text": "Quarterly Summaries: each service provided to the Person;", "category": "reporting", "applies_to": "service_record", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.25(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.25(3)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.25 Quarterly Summaries (3)", "text": "Quarterly Summaries: date range the quarterly summary covers;", "category": "reporting", "applies_to": "service_record", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.25(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.25(4)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.25 Quarterly Summaries (4)", "text": "Quarterly Summaries: general summary of services provided, the Person's status and response to services, and notable events and activities related to the services provided;", "category": "reporting", "applies_to": "service_record", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.25(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.25(5)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.25 Quarterly Summaries (5)", "text": "Quarterly Summaries: information that indicates the progress toward each goal except for the following services: ELS, MTP, PBA, Professional Medication Monitoring and Respite; and", "category": "reporting", "applies_to": "service_record", "codes": ["ELS", "MTP", "PBA"], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.25(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.25(6)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.25 Quarterly Summaries (6)", "text": "Quarterly Summaries: name of the Staff writing the quarterly summary.", "category": "reporting", "applies_to": "service_record", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.25(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.26", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.26 Fatality Notifications and Reviews", "text": "Fatality Notifications and Reviews. In addition to the requirements in Attachment A: State of Utah DHHS Client Services Terms, upon discovery of the death of a Person receiving its services, the Contractor shall notify the Person's family as soon as reasonably possible (24 hours at the latest). The Contractor shall notify the Person's Support Coordinator and the DSPD Waiver Manager at waivermanager@utah.gov by the end of the next Calendar Day.", "category": "reporting", "applies_to": "service_record", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.26", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.27", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.27 Critical Incident Reports and Investigations", "text": "Critical Incident Reports and Investigations. The Contractor shall:", "category": "reporting", "applies_to": "service_record", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.27", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.27(1)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.27 Critical Incident Reports and Investigations (1)", "text": "Critical Incident Reports and Investigations: within 24 hours from discovery of an incident requiring an incident report:", "category": "reporting", "applies_to": "service_record", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.27(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.27(1)(A)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.27 Critical Incident Reports and Investigations (1)(A)", "text": "Critical Incident Reports and Investigations: initiate an incident report entry into UPI. This UPI entry will automatically notify the Person's Support Coordinator; and", "category": "external", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.27(1)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.27(1)(B)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.27 Critical Incident Reports and Investigations (1)(B)", "text": "Critical Incident Reports and Investigations: notify the Person's guardian by telephone, email, or face to face contact.", "category": "reporting", "applies_to": "service_record", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.27(1)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.27(2)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.27 Critical Incident Reports and Investigations (2)", "text": "within five Business Days from discovery of the incident, the Contractor shall complete the detailed incident report in UPI, include any additional information available, and report mitigating or follow up actions taken;", "category": "reporting", "applies_to": "service_record", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.27(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.27(3)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.27 Critical Incident Reports and Investigations (3)", "text": "Critical Incident Reports and Investigations: with incidents of actual or suspected abuse, neglect, exploitation, or maltreatment of Persons, document on the incident report in UPI that prevention strategies have been or will be developed and implemented when applicable;", "category": "reporting", "applies_to": "service_record", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.27(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.27(4)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.27 Critical Incident Reports and Investigations (4)", "text": "Critical Incident Reports and Investigations: submit an incident report into UPI per the DHHS Critical Incident Reporting Guide found on the Division of Licensing and Background Checks webpage;", "category": "external", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.27(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.27(5)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.27 Critical Incident Reports and Investigations (5)", "text": "Critical Incident Reports and Investigations: ensure they respond to the Person's Support Coordinator's request for additional information regarding any incident, in writing, within five Business Days of the request; and", "category": "reporting", "applies_to": "service_record", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.27(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.27(6)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.27 Critical Incident Reports and Investigations (6)", "text": "Critical Incident Reports and Investigations: ensure support of any investigation and mitigation activities taken by DHHS, or the Person's Support Coordinator by providing any additional information requested, cooperating with any requests regarding incidents.", "category": "reporting", "applies_to": "service_record", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.27(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.28", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.28 Persons' Personal Funds", "text": "Persons' Personal Funds. The Contractor shall:", "category": "actionable", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.28", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.28(1)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.28 Persons' Personal Funds (1)", "text": "Persons' Personal Funds: if they are a Person's social security representative payee, be in compliance with PBA requirements;", "category": "unclear", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "no", "source": "DHHS91172 SOW §1.28(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.28(2)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.28 Persons' Personal Funds (2)", "text": "ensure Persons have access to and control over their personal funds to the greatest extent possible based on Person's need, as determined by the Person's PCPT. Any restrictions that are in place to control the Person's access and control of their funds must have a Human Rights Committee approval;", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.28(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.28(3)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.28 Persons' Personal Funds (3)", "text": "Persons' Personal Funds: ensure SSA requirements are met when the Contractor is the Person's Social Security representative payee;", "category": "unclear", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.28(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.28(4)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.28 Persons' Personal Funds (4)", "text": "Persons' Personal Funds: if they assist the Person with their personal funds, provide the Person with training, assistance, support, and opportunities to manage finances to the maximum extent possible;", "category": "staff_qualification", "applies_to": "staff", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.28(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.28(5)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.28 Persons' Personal Funds (5)", "text": "If they assist the Person with their personal funds, review the Person's related financial records with the Person at least monthly. The Contractor shall review all related deposits, expenditures, savings, and any other relevant information regarding the Person's finances;", "category": "actionable", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.28(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.28(6)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.28 Persons' Personal Funds (6)", "text": "Persons' Personal Funds: attain written approval from its Human Rights Committee and the Person's Support Coordinator prior to placing any modifications on the Person's access or allowable spending limits;", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.28(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.28(7)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.28 Persons' Personal Funds (7)", "text": "not loan or give money to a Person unless there is an emergency situation. If there is an emergency situation loan, the Contractor shall:", "category": "actionable", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.28(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.28(7)(A)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.28 Persons' Personal Funds (7)(A)", "text": "Persons' Personal Funds: notify the Person's Support Coordinator within 24 hours of resolving the emergency and seek the PCPT's approval;", "category": "unclear", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.28(7)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.28(7)(B)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.28 Persons' Personal Funds (7)(B)", "text": "document and maintain a loan record until the loan is paid in full. loan record must include the PCPT's written approval of the loan; reason for the loan; receipts for amount owed; and current accounting of loan including payments and the current balance;", "category": "actionable", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.28(7)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.28(7)(C)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.28 Persons' Personal Funds (7)(C)", "text": "Persons' Personal Funds: provide the Person's loan record on a monthly basis to the Person, the Person's legal guardian, the Person's Support Coordinator;", "category": "unclear", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.28(7)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.28(7)(D)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.28 Persons' Personal Funds (7)(D)", "text": "Persons' Personal Funds: provide the Person's loan record to other authorized individuals upon request;", "category": "unclear", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.28(7)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.28(7)(E)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.28 Persons' Personal Funds (7)(E)", "text": "Persons' Personal Funds: ensure the Person's current needs for food, shelter, and clothing are met prior to any loan repayments;", "category": "unclear", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.28(7)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.28(7)(F)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.28 Persons' Personal Funds (7)(F)", "text": "Persons' Personal Funds: coordinate and cooperate with the Person's Support Coordinator and legal guardian including providing additional documentation, or access to documentation, to resolve any loan concerns;", "category": "documentation", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.28(7)(F)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.28(7)(G)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.28 Persons' Personal Funds (7)(G)", "text": "Persons' Personal Funds: ensure loans from the Contractor to Persons of $2,000 or more are disclosed to the DHHS Quality Assurance team annually for review;", "category": "unclear", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.28(7)(G)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.28(7)(H)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.28 Persons' Personal Funds (7)(H)", "text": "Persons' Personal Funds: if the Contractor or Support Coordinator no longer provides services to the Person, inform the new Contractor or Support Coordinator of the loan balance. The loan will continue to be part of the DHHS Quality Assurance team annual review for the Contractor where the loan originated until the loan is paid in full; and", "category": "unclear", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.28(7)(H)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.28(7)(I)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.28 Persons' Personal Funds (7)(I)", "text": "Persons' Personal Funds: notify the Person when the loan is paid in full.", "category": "unclear", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.28(7)(I)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.28(8)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.28 Persons' Personal Funds (8)", "text": "avoid purchasing or splitting the cost of durable goods between two or more Persons. The Contractor shall ensure any splitting that occurs is fair, and establish a process to account for the purchase that is agreeable to all parties and includes provisions for fair reconciliation if one Person is no longer able to use the goods;", "category": "actionable", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.28(8)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.28(9)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.28 Persons' Personal Funds (9)", "text": "Persons' Personal Funds: not allow the Person to make purchases for or from the Contractor and its Staff; and", "category": "unclear", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.28(9)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.28(10)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.28 Persons' Personal Funds (10)", "text": "Persons' Personal Funds: not accept or receive money from the Person unless the Contractor has received prior written approval from the Person's PCPT and the money is for: a repayment of an approved loan given to the Person from the Contractor due to an emergency situation; reimbursement to the Contractor for the Person's destruction of property; room and board charges; or reasonable costs to participate in dances, dinners, parties, or similar activities organized by the Contractor.", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.28(10)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.29", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.29 Nutritional Requirements", "text": "Nutritional Requirements. The Contractor shall:", "category": "actionable", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.29", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.29(1)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.29 Nutritional Requirements (1)", "text": "Nutritional Requirements: if providing Persons with SLH, RHS, PPS, HHS, or overnight respite, ensure Persons have kitchen privileges, including access to food and ingredients. The Contractor may only limit kitchen privileges if approved by the Contractor's Human Rights Committee and it is in the best interest of the Person's health; and", "category": "client", "applies_to": "client", "codes": ["HHS", "PPS", "RHS", "SLH"], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.29(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.29(2)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.29 Nutritional Requirements (2)", "text": "Nutritional Requirements: support the Person to meet basic nutritional standards and account for the Persons' special diets, food preferences, appetite, and customs.", "category": "unclear", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.29(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.30", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.30 Transportation", "text": "Transportation. If the Contractor is providing transportation, the Contractor shall:", "category": "actionable", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.30", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.30(1)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.30 Transportation (1)", "text": "Transportation: provide routine transportation and assist the Person in accessing the community;", "category": "unclear", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.30(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.30(2)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.30 Transportation (2)", "text": "prior to Staff providing transportation, the Staff shall be in compliance with the Contractor's driving record policy; have and maintain annually thereafter written documentation of :(A) the transportation Staff's driving record; and (B) their current, valid driver's license; and for Staff providing transportation in their own vehicle, the Staff's current auto insurance that is in compliance with Utah Code Section 31A-22-304 ; and current vehicle registration;", "category": "agency_qualification", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.30(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.30(3)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.30 Transportation (3)", "text": "Transportation: ensure Staff providing transportation are trained to ensure that:", "category": "unclear", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.30(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.30(3)(A)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.30 Transportation (3)(A)", "text": "Transportation: persons are not left unattended in the vehicle;", "category": "unclear", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.30(3)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.30(3)(B)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.30 Transportation (3)(B)", "text": "Transportation: persons use seat belts and remain seated while the vehicle is in motion;", "category": "unclear", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.30(3)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.30(3)(C)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.30 Transportation (3)(C)", "text": "Transportation: keys are removed from the vehicle when the driver is not in the driver's seat unless the driver is actively operating a lift on the vehicle that requires the keys to be in the ignition to operate the lift;", "category": "unclear", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.30(3)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.30(3)(D)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.30 Transportation (3)(D)", "text": "Persons in wheelchairs use seat belts or locking mechanisms to immobilize the wheelchair during travel;", "category": "unclear", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.30(3)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.30(3)(E)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.30 Transportation (3)(E)", "text": "Transportation: vehicles used for transportation of Persons have working door locks, and doors are locked while the vehicle is moving;", "category": "unclear", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.30(3)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.30(3)(F)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.30 Transportation (3)(F)", "text": "Persons arrive safely at the arranged destination and at the scheduled time; and", "category": "unclear", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.30(3)(F)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.30(3)(G)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.30 Transportation (3)(G)", "text": "Transportation: no Persons are left alone to or from their destinations.", "category": "unclear", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.30(3)(G)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.31", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.31 Monitoring and Visits", "text": "Monitoring and Visits. The Contractor shall:", "category": "actionable", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.31", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.31(1)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.31 Monitoring and Visits (1)", "text": "Monitoring and Visits: allow the Person's Support Coordinator to monitor the Contractor's performance including through scheduled and unannounced visits;", "category": "unclear", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.31(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.31(2)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.31 Monitoring and Visits (2)", "text": "Monitoring and Visits: furnish copies of licensing and site certification records to Support Coordinators upon their request; and", "category": "staff_qualification", "applies_to": "staff", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.31(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.31(3)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.31 Monitoring and Visits (3)", "text": "Monitoring and Visits: furnish timesheet records to Support Coordinators within three Calendar Days of request.", "category": "unclear", "applies_to": "service_record", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.31(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.32", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.32 Group Services", "text": "Group Services. (a) Contractors who do not currently meet the Group Services requirements have until February 28, 2026 to submit their \"Group Service Review\" form. (b) For residential services (RHS or HHS) in a certified setting that have adult and minor services together, or that have Persons and individuals not funded by DSPD together, the Contractor shall, prior to placement, obtain written approval from: (A) all Persons and their guardian (when applicable); (B) all associated Support Coordinators; and (C) the DHHS/DSPD Director or designee through the submission of the \"Group Service Review\" form on the DHHS/DSPD website to dspd@utah.gov with the subject line \"Group Service Review\". (c) For any group services in a site that is licensed through the DHHS Office of Licensing, the Contractor shall request a variance through the Division of Licensing and Background Clearance (\"DLBC\") provider portal. The Contractor shall obtain approval from the DHHS Office of Licensing prior to delivering these services.", "category": "external", "applies_to": "agency", "codes": ["HHS", "RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.32", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.33", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.33 DSPD Worksheet", "text": "DSPD Worksheet. The Contractor shall:", "category": "actionable", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.33", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.33(1)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.33 DSPD Worksheet (1)", "text": "DSPD Worksheet: deliver the Staffing hours as outlined in the Person's DSPD Worksheet; and", "category": "unclear", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.33(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.33(2)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.33 DSPD Worksheet (2)", "text": "DSPD Worksheet: ensure rights modifications are approved for a Person when two Staff to one Person (2:1) ratio is documented as a need in their DSPD Worksheet.", "category": "unclear", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.33(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.34", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.34 Licenses and Certifications", "text": "Licenses and Certifications. The Contract shall maintain all required licenses and certifications. The Contractor may be required to repay funds to DHHS/DSPD if licenses and certifications are not maintained.", "category": "agency_qualification", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.34", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.35", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.35 Housemate(s)", "text": "Housemate(s). When providing residential services (HHS, PPS or RHS), the Contractor shall ensure Persons and their guardian (when applicable), have an informed discussion of who the Person lives with and any household living accommodations needed. Each Person should be involved in selecting their housemate. The Contractor shall document the informed discussion in writing and include notes about the discussion. An informed discussion is required anytime a change in housemate occurs on or after July 1, 2026.", "category": "client", "applies_to": "client", "codes": ["HHS", "PPS", "RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.35", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.36", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.36 Transitions to or from the Utah State Developmental Center (\"USDC\")", "text": "Transitions to or from the Utah State Developmental Center (\"USDC\"). (a) When a Person is transitioning into services with the Contractor from USDC, the Contractor may be required to provide the Person with Behavior Supports, Day Supports, Supported Living, or Professional Nursing services as coordinated by the DHHS/DSPD Transition team. This may include allowing the Person to spend time with new Staff so they can learn about the Person. (b) If a Person is admitting into services with USDC, the Contractor shall coordinate with the DHHS/DSPD Transition team and USDC, as needed, to assist with a successful admission. This may include allowing USDC employees to attend service delivery to allow the Person to spend time with new employees so they can learn about the Person prior to admission to USDC.", "category": "actionable", "applies_to": "service_record", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.36", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-2.1", "section": "Article 2 — General Limitations", "subsection": "§2.1 General Limitations", "text": "General Limitations. The Contractor shall NOT:", "category": "exception", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §2.1", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-2.1(1)", "section": "Article 2 — General Limitations", "subsection": "§2.1 General Limitations (1)", "text": "General Limitations: become the legal guardian of any Person within the Contractor's services;", "category": "exception", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §2.1(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-2.1(2)", "section": "Article 2 — General Limitations", "subsection": "§2.1 General Limitations (2)", "text": "General Limitations: provide Direct Support to a Person they are a legal guardian of;", "category": "exception", "applies_to": "agency", "codes": [], "creates_user_task": "no", "sou istance, Professional Nursing Service I and II; and any other service that contains elements of service provision that are billable when provided outside the Person's presence;", "category": "exception", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §2.1(5)(G)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-2.1(5)(H)", "section": "Article 2 — General Limitations", "subsection": "§2.1 General Limitations (5)(H)", "text": "General Limitations: any services in a Nursing Facility or Intermediate Care Facility for People with Intellectual Disabilities;", "category": "exception", "applies_to": "site", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §2.1(5)(H)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-2.1(5)(I)", "section": "Article 2 — General Limitations", "subsection": "§2.1 General Limitations (5)(I)", "text": "General Limitations: the Person's rent, utilities, food, and other personal needs;", "category": "exception", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §2.1(5)(I)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-2.1(5)(J)", "section": "Article 2 — General Limitations", "subsection": "§2.1 General Limitations (5)(J)", "text": "General Limitations: any services: (i) prior to receiving an approved 1056; or (ii) in excess of the 1056;", "category": "billing", "applies_to": "service_record", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §2.1(5)(J)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-2.1(5)(K)", "section": "Article 2 — General Limitations", "subsection": "§2.1 General Limitations (5)(K)", "text": "General Limitations: services on any day that the Person was incarcerated for any time during the 24-hour day; and", "category": "exception", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §2.1(5)(K)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-2.1(5)(L)", "section": "Article 2 — General Limitations", "subsection": "§2.1 General Limitations (5)(L)", "text": "General Limitations: residential services (RHS, HHS, or PPS) when a Person changes Contractors on the day the Person moves to the new Contractor (the on-boarding Contractor can bill the day the Person is moving into their services).", "category": "exception", "applies_to": "agency", "codes": ["HHS", "PPS", "RHS"], "creates_user_task": "no", "source": "DHHS91172 SOW §2.1(5)(L)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.1", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.1 General Description", "text": "General Description. BC1 provides support to Persons with mild behavior problems by developing behavior interventions that increase the Person's ability to be integrated into the community.", "category": "definition", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.1", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.2", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.2 Direct Service Requirements", "text": "Direct Service Requirements. The Contractor shall:", "category": "actionable", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §3.2", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.2(1)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.2 Direct Service Requirements (1)", "text": "Direct Service Requirements: provide services to Persons whose targeted behavior problems are mild aggression, property destruction, problems with eating or toileting. or other comparable behavior problems;", "category": "actionable", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §3.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.2(2)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.2 Direct Service Requirements (2)", "text": "Direct Service Requirements: provide services to Persons whose target behavior is considered emerging, annoying, worrisome, objectionable, singular, but not dangerous, or interfering with learning or social relationships;", "category": "actionable", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §3.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.2(3)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.2 Direct Service Requirements (3)", "text": "Direct Service Requirements: ensure services are based on evidence based positive behavior support and applied behavior analysis principles;", "category": "actionable", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §3.2(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.2(4)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.2 Direct Service Requirements (4)", "text": "Direct Service Requirements: provide services at the Person's residence, a programmatic setting, or another naturally occurring environment in the community;", "category": "actionable", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §3.2(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.2(5)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.2 Direct Service Requirements (5)", "text": "be the Person's sole provider of all behavior consultation services as prescribed in the Person's PCSP unless prior written approval of an exception has been given by the PCPT and documented in the PCSP. The written approval documents justifying the exception must demonstrate how the exception is person-centered; and", "category": "client", "applies_to": "client", "codes": ["BC1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §3.2(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.2(6)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.2 Direct Service Requirements (6)", "text": "Direct Service Requirements: coordinate the Person's services for Persons with multiple BC Staff or services and interventions are consistent across settings.", "category": "actionable", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §3.2(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.3", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.3 Functional Behavior Assessment (\"FBA\")", "text": "Functional Behavior Assessment (\"FBA\"). The Contractor shall:", "category": "actionable", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §3.3", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.3(1)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.3 Functional Behavior Assessment (\"FBA\") (1)", "text": "complete an FBA of the Person's target behavior. The Contractor shall use validated assessment tools and processes to complete the FBA, based on the Person's needs;", "category": "actionable", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §3.3(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.3(2)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.3 Functional Behavior Assessment (\"FBA\") (2)", "text": "Functional Behavior Assessment (\"FBA\"): provide a written FBA that includes:", "category": "unclear", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.3(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.3(2)(A)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.3 Functional Behavior Assessment (\"FBA\") (2)(A)", "text": "Functional Behavior Assessment (\"FBA\"): a description of the assessment tools and process used;", "category": "unclear", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.3(2)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.3(2)(B)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.3 Functional Behavior Assessment (\"FBA\") (2)(B)", "text": "Functional Behavior Assessment (\"FBA\"): a description of the problem behaviors, including an definition for each target behavior;", "category": "unclear", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.3(2)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.3(2)(C)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.3 Functional Behavior Assessment (\"FBA\") (2)(C)", "text": "Functional Behavior Assessment (\"FBA\"): prediction of the circumstances in which the problem behavior is most likely to occur;", "category": "unclear", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.3(2)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.3(2)(D)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.3 Functional Behavior Assessment (\"FBA\") (2)(D)", "text": "Functional Behavior Assessment (\"FBA\"): identification of the function of the problem behavior;", "category": "unclear", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.3(2)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.3(2)(E)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.3 Functional Behavior Assessment (\"FBA\") (2)(E)", "text": "Functional Behavior Assessment (\"FBA\"): assessment date;", "category": "unclear", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.3(2)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.3(2)(F)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.3 Functional Behavior Assessment (\"FBA\") (2)(F)", "text": "Functional Behavior Assessment (\"FBA\"): name of the BC1 Staff completing the assessment;", "category": "unclear", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.3(2)(F)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.3(2)(G)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.3 Functional Behavior Assessment (\"FBA\") (2)(G)", "text": "Functional Behavior Assessment (\"FBA\"): name of others involved, if applicable; and", "category": "unclear", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.3(2)(G)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.3(2)(H)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.3 Functional Behavior Assessment (\"FBA\") (2)(H)", "text": "Functional Behavior Assessment (\"FBA\"): name of the Person being assessed.", "category": "unclear", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.3(2)(H)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.3(3)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.3 Functional Behavior Assessment (\"FBA\") (3)", "text": "Functional Behavior Assessment (\"FBA\"): complete the initial FBA prior to developing the BSP, and within 30 Calendar Days of DSPD approval to provide BC1 services;", "category": "unclear", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.3(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.3(4)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.3 Functional Behavior Assessment (\"FBA\") (4)", "text": "Functional Behavior Assessment (\"FBA\"): complete a reevaluation and update the Person's FBA within 30 Calendar Days of written request from the Person's Support Coordinator, when the PCPT determines it is necessary, or as indicated by the Contractor's quarterly summary;", "category": "reporting", "applies_to": "service_record", "codes": ["BC1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §3.3(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.3(5)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.3 Functional Behavior Assessment (\"FBA\") (5)", "text": "Functional Behavior Assessment (\"FBA\"): submit completed FBAs to the Person's Support Coordinator within 14 Calendar Days of completion;", "category": "reporting", "applies_to": "service_record", "codes": ["BC1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §3.3(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.3(6)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.3 Functional Behavior Assessment (\"FBA\") (6)", "text": "Functional Behavior Assessment (\"FBA\"): maintain the FBA in the Person's file;", "category": "unclear", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.3(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.3(7)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.3 Functional Behavior Assessment (\"FBA\") (7)", "text": "complete an initial FBA for a Person who has had a substantial life change addressing all safety issues while baseline data is being gathered. The Contractor shall complete the full FBA within 60 Calendar Days after the start of the initial FBA; and", "category": "actionable", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §3.3(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.3(8)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.3 Functional Behavior Assessment (\"FBA\") (8)", "text": "Functional Behavior Assessment (\"FBA\"): complete revisions to the FBA, if updates are needed, within 30 Calendar Days of the change.", "category": "unclear", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.3(8)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.4", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.4 BSP", "text": "BSP. The Contractor shall:", "category": "actionable", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §3.4", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.4(1)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.4 BSP (1)", "text": "be responsible for BSP development, implementation, and training. The BSP must emphasize a positive approach with treatment designed to effectively acquire and maintain adaptive behaviors and prevent problem behaviors. The BSP must be in writing and include:", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §3.4(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.4(1)(A)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.4 BSP (1)(A)", "text": "BSP: a summary or hypothesis statement that clarifies the antecedent-behavior-consequence relationships describing the critical problem behavior, predicting the circumstances in which the problem behavior is most likely to occur, and identifying the function of the problem behavior;", "category": "unclear", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.4(1)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.4(1)(B)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.4 BSP (1)(B)", "text": "BSP: baseline data with the date range the data was collected;", "category": "unclear", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.4(1)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.4(1)(C)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.4 BSP (1)(C)", "text": "BSP: behavioral objectives written in measurable and observable terms;", "category": "unclear", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.4(1)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.4(1)(D)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.4 BSP (1)(D)", "text": "BSP: data collection procedures that measure progress toward the BSP objectives that decrease problem behavior and increase replacement behavior;", "category": "unclear", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.4(1)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.4(1)(E)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.4 BSP (1)(E)", "text": "BSP: clearly written and detailed behavioral intervention procedures to ensure consistent implementation by Staff and caregivers addressing the following areas:", "category": "unclear", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.4(1)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.4(1)(E)(i)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.4 BSP (1)(E)(i)", "text": "BSP: prevention procedures to decrease the likelihood of the problem behavior;", "category": "unclear", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.4(1)(E)(i)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.4(1)(E)(ii)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.4 BSP (1)(E)(ii)", "text": "BSP: planned responses for when the problem behavior occurs, including safety issues and efforts to minimize reinforcement of the problem behavior;", "category": "unclear", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.4(1)(E)(ii)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.4(1)(E)(iii)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.4 BSP (1)(E)(iii)", "text": "BSP: teaching or increasing replacement behaviors;", "category": "unclear", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.4(1)(E)(iii)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.4(1)(E)(iv)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.4 BSP (1)(E)(iv)", "text": "BSP: generalization of progress to other settings; and", "category": "unclear", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.4(1)(E)(iv)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.4(1)(E)(v)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.4 BSP (1)(E)(v)", "text": "BSP: maintenance of progress and fading procedures.", "category": "unclear", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.4(1)(E)(v)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.4(1)(F)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.4 BSP (1)(F)", "text": "BSP: name and title of the BC1 Staff who developed the BSP;", "category": "unclear", "applies_to": "ag
