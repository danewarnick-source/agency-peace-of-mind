name: Deploy AWS (parallel target)

# Parallel AWS frontend alongside Tuesday Sep 1 Vercel / Lovable.
# This workflow never touches wrangler.jsonc, src/server.ts's Cloudflare
# entry point, or anything Lovable's GitHub sync manages.
#
# Live host (after the 2026-08 cutover): CloudFront E1BPLMZE2XLSKD
# default behavior serves HTML from Lambda hive-app-server (Function URL,
# Nitro aws-lambda, index.handler). /assets/* is S3 hive-app-static via
# OAC. ECS Fargate is unused — this workflow does not build a Docker
# image, push ECR, or call UpdateService. Do not retarget CloudFront
# back to an ALB.
#
# One `npm run build:lambda` produces matching server + static:
#   1. zip .output/server → update hive-app-server FIRST
#   2. wait until that publish is live
#   3. sync .output/public to S3 (--delete is safe only after step 1–2,
#      so the live HTML already points at the new hashed assets)
#   4. invalidate CloudFront E1BPLMZE2XLSKD
# See docs/AWS_LAMBDA.md. Reuses existing GitHub AWS / Vite secrets.
# Do not create new accounts, buckets, distributions, or Lambdas.
#
# Live JS on hivecertify.com must contain dhrrukdcigiiqksibdfb
# (Hive-Platform). After build:lambda, CI fails the job if
# .output/public still contains the retired Lovable project
# mmknqtdrefbzwfdtykza or a legacy JWT anon key. Copy Vercel
# production VITE_SUPABASE_* into GitHub Actions secrets — never
# the Lovable project. Lambda runtime env must match.
# BEDROCK_MODEL_ID is hive-app-server runtime env (inference profile
# us.anthropic.claude-…), not a GitHub Actions build secret.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy to AWS
    runs-on: ubuntu-latest
    # Job-level env can read secrets. Step `if:` cannot use secrets.*,
    # and step-level env is applied AFTER `if:`, so this must live here.
    env:
      DISTRIBUTION_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Nitro aws-lambda + static)
        run: npm run build:lambda
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          PUBLIC_SITE_URL: ${{ secrets.AWS_PUBLIC_SITE_URL }}

      # hivecertify.com login uses this baked client URL. Wrong project
      # looks like "Invalid username or password". Dane/Tony must set
      # GitHub Actions secrets + Lambda runtime env to Hive-Platform
      # (dhrrukdcigiiqksibdfb) then re-run Deploy AWS.
      - name: Guard client bundle uses Hive-Platform Supabase
        run: node scripts/verify-aws-supabase-bundle.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}

      - name: Verify Lambda output
        run: node scripts/verify-lambda-output.mjs

      - name: Zip .output/server for hive-app-server
        run: bash scripts/package-lambda.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Must finish before S3 --delete. Otherwise CloudFront keeps serving
      # the previous Lambda HTML, which still references hashed /assets/*
      # that the sync would remove (run #130 / PR 192 outage).
      - name: Update Lambda hive-app-server
        run: |
          aws lambda update-function-code \
            --function-name hive-app-server \
            --zip-file fileb://lambda-server.zip
          aws lambda wait function-updated \
            --function-name hive-app-server

      - name: Sync static assets to S3
        run: |
          aws s3 sync .output/public "s3://${{ secrets.AWS_S3_BUCKET }}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" \
            --exclude "*.webmanifest" \
            --exclude "sw.js"
          if [ -f .output/public/index.html ]; then
            aws s3 cp .output/public/index.html "s3://${{ secrets.AWS_S3_BUCKET }}/index.html" \
              --cache-control "public,max-age=0,must-revalidate"
          fi
          if [ -f .output/public/manifest.webmanifest ]; then
            aws s3 cp .output/public/manifest.webmanifest "s3://${{ secrets.AWS_S3_BUCKET }}/manifest.webmanifest" \
              --cache-control "public,max-age=0,must-revalidate"
          fi
          if [ -f .output/public/sw.js ]; then
            aws s3 cp .output/public/sw.js "s3://${{ secrets.AWS_S3_BUCKET }}/sw.js" \
              --cache-control "public,max-age=0,must-revalidate"
          fi

      # Job-level DISTRIBUTION_ID is set before this `if:` is evaluated.
      # Always invalidate /* so hivecertify.com does not keep stale HTML/JS.
      - name: Invalidate CloudFront cache
        if: env.DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
