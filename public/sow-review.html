or shall document Direct Support hours, and respite provided to the Person;", "category": "documentation", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(4)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (4)", "text": "Direct Service Administrative Requirements: provide supervision, training, technical assistance, and other needed support to the PPS family, including on-call after hour support; and", "category": "staff_qualification", "applies_to": "staff", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(5)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (5)", "text": "create an inventory of the Person's belongings. The inventory must be maintained in the Person's file and include written documentation of the following:", "category": "client", "applies_to": "client", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(5)(A)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (5)(A)", "text": "Direct Service Administrative Requirements: the inventory completion date and the Staff's name that completed the inventory;", "category": "documentation", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(5)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(5)(B)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (5)(B)", "text": "Direct Service Administrative Requirements: belongings that have significant value to the Person;", "category": "client", "applies_to": "client", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(5)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(5)(C)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (5)(C)", "text": "Direct Service Administrative Requirements: belongings with a purchase value of $50.00 or more;", "category": "client", "applies_to": "client", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(5)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(5)(D)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (5)(D)", "text": "Direct Service Administrative Requirements: all new items added as received by the Person that have significant value to the Person or with a purchase value of $50.00 or more; and", "category": "documentation", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(5)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(5)(E)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (5)(E)", "text": "discarded items must be removed, including the reason for discard and signature from the Person or their legal guardian.", "category": "documentation", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(5)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(6)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (6)", "text": "Direct Service Administrative Requirements: ensure quarterly evacuation drills with Persons and Staff are conducted and documented at each PPS site;", "category": "site", "applies_to": "site", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(7)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (7)", "text": "Direct Service Administrative Requirements: provide services to only one Person per home, except in the scenarios listed below. The Contractor may provide PPS:", "category": "documentation", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(7)(A)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (7)(A)", "text": "Direct Service Administrative Requirements: to up to three Persons in the same home when the Persons are Immediate Relatives;", "category": "documentation", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(7)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(7)(B)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (7)(B)", "text": "Direct Service Administrative Requirements: to two Persons in the same home when the Persons are not Immediate Relatives after:", "category": "documentation", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(7)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(7)(B)(i)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (7)(B)(i)", "text": "Direct Service Administrative Requirements: assessing the appropriateness of the fit between the two Persons, particularly regarding the safety of the two Persons; and", "category": "documentation", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(7)(B)(i)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(7)(B)(ii)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (7)(B)(ii)", "text": "Direct Service Administrative Requirements: receiving written approval from each Person's Support Coordinator and parent/guardian, if applicable.", "category": "documentation", "applies_to": "client", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(7)(B)(ii)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(7)(C)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (7)(C)", "text": "to three Persons in the same home who are not Immediate Relatives and were approved to receive PPS in the same home prior to July 1, 2023 (during the contracting period of the solicitation DHS90743). If one of the Persons moves out of the home, the Contractor shall not replace that Person with a new third Person who is not an Immediate Relative; and", "category": "exception", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "no", "source": "DHHS91172 SOW §20.3(7)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(7)(D)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (7)(D)", "text": "Direct Service Administrative Requirements: when the Contractor is providing respite to Persons who are NOT receiving PPS from their own PPS family in their own PPS home, and when the following conditions are met:", "category": "documentation", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(7)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(7)(D)(i)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (7)(D)(i)", "text": "Direct Service Administrative Requirements: the Contractor has obtained written approval that another Person may receive respite in their own PPS home from the Persons, their guardians (if applicable), and their Support Coordinators;", "category": "documentation", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(7)(D)(i)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(7)(D)(ii)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (7)(D)(ii)", "text": "Direct Service Administrative Requirements: the Contractor has obtained written approval from the Persons who will be receiving respite in a different PPS home, their guardians (if applicable), and their Support Coordinators;", "category": "documentation", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(7)(D)(ii)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(7)(D)(iii)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (7)(D)(iii)", "text": "Direct Service Administrative Requirements: the Contractor has obtained written documentation that included an assessment of the capacity of the PPS Staff to provide respite to Persons in their PPS home to ensure the prevention of burnout and assure the needs of the existing Persons receiving PPS and the Persons receiving respite can be met;", "category": "documentation", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(7)(D)(iii)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(7)(D)(iv)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (7)(D)(iv)", "text": "Direct Service Administrative Requirements: the respite does not exceed 14 consecutive days;", "category": "documentation", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(7)(D)(iv)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(7)(D)(v)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (7)(D)(v)", "text": "Direct Service Administrative Requirements: the respite does not exceed 21 days per Plan Year for all Persons living in the home; and", "category": "documentation", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(7)(D)(v)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(7)(D)(vi)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (7)(D)(vi)", "text": "all written documentation requirements outlined above must be obtained prior to delivering respite when planned, or within 72 hours of delivering respite when unplanned in an emergency situation.", "category": "documentation", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(7)(D)(vi)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(8)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (8)", "text": "when a PPS Staff is transitioning employment from one DSPD Contractor to another DSPD Contractor, both Contractors shall notify the Support Coordinator of the Person who is receiving PPS from the transitioning PPS home that there is a potential change in the contracted provider. Both Contractors must allow the Support Coordinator to ensure the Person is making an Informed Choice about the Contractor the Person wants to receive services from, prior to any change happening. Neither of the Contractors shall attempt to influence the Person's choice;", "category": "reporting", "applies_to": "service_record", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(8)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(9)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (9)", "text": "Direct Service Administrative Requirements: maintain a current room and board agreement with the Person's legal guardian;", "category": "client", "applies_to": "client", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(9)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(10)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (10)", "text": "Direct Service Administrative Requirements: maintain a written billing service documentation that includes:", "category": "billing", "applies_to": "service_record", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(10)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(10)(A)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (10)(A)", "text": "Direct Service Administrative Requirements: the name of the Person receiving the service;", "category": "documentation", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(10)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(10)(B)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administr irect Support for the PPS Staff);", "category": "documentation", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(11)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(11)(E)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (11)(E)", "text": "Direct Service Administrative Requirements: the name of the Staff providing the service; and", "category": "documentation", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(11)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.3(11)(F)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.3 Direct Service Administrative Requirements (11)(F)", "text": "Direct Service Administrative Requirements: a written summary not of substantive service activities consistent with the individual service description.", "category": "documentation", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.3(11)(F)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.4", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.4 Specific Service Limitations", "text": "Specific Service Limitations. In addition to the General Limitations section of this contract, the Contractor shall NOT:", "category": "exception", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "no", "source": "DHHS91172 SOW §20.4", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.4(1)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.4 Specific Service Limitations (1)", "text": "Specific Service Limitations: allow its professional parents or a family member of its professional parents to act as a conservator or representative payee for approval of the Person's SSA;", "category": "exception", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "no", "source": "DHHS91172 SOW §20.4(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.4(2)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.4 Specific Service Limitations (2)", "text": "Specific Service Limitations: have custody or guardianship of the Person or allow its professional parents or a family member of the professional parents to have custody or guardianship of the Person;", "category": "exception", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "no", "source": "DHHS91172 SOW §20.4(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.4(3)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.4 Specific Service Limitations (3)", "text": "Specific Service Limitations: provide the Person's services in the home of an Immediate Relative or legal guardian;", "category": "exception", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "no", "source": "DHHS91172 SOW §20.4(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.4(4)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.4 Specific Service Limitations (4)", "text": "Specific Service Limitations: bill DSPD for foster care maintenance for Persons in the custody of the State of Utah;", "category": "exception", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "no", "source": "DHHS91172 SOW §20.4(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.4(5)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.4 Specific Service Limitations (5)", "text": "Specific Service Limitations: provide PPS and HHS to separate Persons in the same home at the same time unless the Persons are Immediate Relatives or have lived together for six or more months;", "category": "exception", "applies_to": "agency", "codes": ["HHS", "PPS"], "creates_user_task": "no", "source": "DHHS91172 SOW §20.4(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.4(6)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.4 Specific Service Limitations (6)", "text": "Specific Service Limitations: bill DSPD for TFB, unless an exceptional care need exists, and it has been approved in writing by the DSPD Director or designee prior to providing TFB;", "category": "exception", "applies_to": "agency", "codes": ["TFB"], "creates_user_task": "no", "source": "DHHS91172 SOW §20.4(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.4(7)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.4 Specific Service Limitations (7)", "text": "Specific Service Limitations: provide PPS as a partial-week or partial month service;", "category": "exception", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "no", "source": "DHHS91172 SOW §20.4(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.4(8)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.4 Specific Service Limitations (8)", "text": "Specific Service Limitations: bill DHHS/DSPD for PPS when the Person hasn't slept overnight under the PPS family or Contractor's Staff's supervision in a 24-hour day; and", "category": "exception", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "no", "source": "DHHS91172 SOW §20.4(8)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.4(9)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.4 Specific Service Limitations (9)", "text": "Specific Service Limitations: provide respite for a Person in a PPS setting different from their own PPS home for more than 20 days per Plan Year.", "category": "exception", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "no", "source": "DHHS91172 SOW §20.4(9)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.5", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.5 Specific Contractor Qualifications", "text": "Specific Contractor Qualifications. The Contractor shall:", "category": "agency_qualification", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.5", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.5(1)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.5 Specific Contractor Qualifications (1)", "text": "Specific Contractor Qualifications: have and maintain a current OL Child Placing Foster license as detailed in Utah Administrative Code, Rule R501-12; and", "category": "agency_qualification", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.5(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.5(2)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.5 Specific Contractor Qualifications (2)", "text": "Specific Contractor Qualifications: comply with OL Foster Care Services rules.", "category": "agency_qualification", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.5(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.6", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.6 Specific Staff Qualifications", "text": "Specific Staff Qualifications. PPS Staff must be at least 21 years of age.", "category": "staff_qualification", "applies_to": "staff", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.6", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.7", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.7 Outcomes", "text": "Outcomes. (a) The intended outcome of this service is a stable living environment that is integrated into the community, promotes Persons goals and community integration. (b) Measures: The percentage of Persons who remained in their community-based living setting. (c) Reporting: The Contractor shall create a fiscal year annual report starting fiscal year 2025 (fiscal year 2025 starts July 1, 2024). The fiscal year annual report will be submitted via Google Form by August 30th, 60 days after each fiscal year end. The outcome Google Form will be posted on the DSPD webpage. The Contractor shall explain any quality improvement activities they will undertake in response to their evaluation of the measurement data. The fiscal year annual report must include the following:", "category": "outcome", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "no", "source": "DHHS91172 SOW §20.7", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.7(1)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.7 Outcomes (1)", "text": "Outcomes.: how many Persons received PPS; and", "category": "outcome", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "no", "source": "DHHS91172 SOW §20.7(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.7(2)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.7 Outcomes (2)", "text": "Outcomes.: data reflecting the measure in (b) above.", "category": "outcome", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "no", "source": "DHHS91172 SOW §20.7(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.8", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.8 Rate", "text": "Rate. (a) If the Contractor is providing services to a Person in DCFS or DJJYS custody the DSPD Worksheet will be adjusted to deduct maintenance payments. Maintenance payments will be made using DHHS service code WHX or WRX. Neither WHX nor WRX are reimbursed by DSPD. WHX and WRX are reimbursed through a payment form by the State agency that has custody of the Person. (b) When receiving WHX or WRX payments, the Contractor shall ensure the funds are used to provide the Person's basic care and supervision, including direct costs and administrative costs associated with providing the following: (1) food, (2) clothes, (3) room and board, (4) school supplies, and (5) other like items. (c) When receiving WHX/WRX payments the Contractor shall not:", "category": "client", "applies_to": "client", "codes": ["PPS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §20.8", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.8(1)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.8 Rate (1)", "text": "Rate.: become the Person's social security representative payee or receive the Person's SSI. DCFS or DJJYS is the Person's social security representative payee; and", "category": "unclear", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "no", "source": "DHHS91172 SOW §20.8(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-20.8(2)", "section": "Article 20 — Professional Parent Supports", "subsection": "§20.8 Rate (2)", "text": "Rate.: bill for WHX/WRX on days when the Person has not attended their PPS setting and is not under Direct Support and supervision of the Contractor for the full 24 hours of the day from 12:00 a.m. to 11:59 p.m.", "category": "unclear", "applies_to": "agency", "codes": ["PPS"], "creates_user_task": "no", "source": "DHHS91172 SOW §20.8(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.1", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.1 General Description", "text": "General Description. RHS provides skilled residential assistance that supports a Person to live as independently and self-determined a life as possible, in an integrated community setting. The Person's PCSP identifies the amount of support, which may include up to 24 hours of support and supervision per day. The RHS setting is the Person's primary residence.", "category": "definition", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "no", "source": "DHHS91172 SOW §21.1", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.2", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.2 Direct Service Requirements", "text": "Direct Service Requirements. The Contractor shall:", "category": "actionable", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.2", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.2(1)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.2 Direct Service Requirements (1)", "text": "Direct Service Requirements: assist the Person in acquiring and maintaining skills that enable the Person to live as independently as possible;", "category": "actionable", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.2(2)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.2 Direct Service Requirements (2)", "text": "Direct Service Requirements: ensure the Person is not isolated. Assist the Person in choosing and participating in community, leisure, and entertainment activities based on the Person's interests;", "category": "actionable", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.2(3)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.2 Direct Service Requirements (3)", "text": "Direct Service Requirements: provide supervision and ensure the Person's health and safety;", "category": "actionable", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.2(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.2(4)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.2 Direct Service Requirements (4)", "text": "Direct Service Requirements: assist the Person with ADL;", "category": "actionable", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.2(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.2(5)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.2 Direct Service Requirements (5)", "text": "Direct Service Requirements: assist the Person with accessing community services and obtaining assistance from community and government organizations;", "category": "actionable", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.2(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.2(6)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.2 Direct Service Requirements (6)", "text": "Direct Service Requirements: assist the Person with completing any necessary Medicaid eligibility review documents, and ensure they are submitted timely; and", "category": "actionable", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.2(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.2(7)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.2 Direct Service Requirements (7)", "text": "Direct Service Requirements: provide transportation for the Person.", "category": "actionable", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.2(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements", "text": "Direct Service Administrative Requirements. The Contractor shall:", "category": "documentation", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(1)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (1)", "text": "provide services to Persons who live alone or live with roommates. Each Person receiving RHS must be on a lease agreement or legally enforceable agreement containing detailed terms for the following:", "category": "client", "applies_to": "client", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(1)(A)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (1)(A)", "text": "Direct Service Administrative Requirements: occupancy details and conditions;", "category": "documentation", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(1)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(1)(B)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (1)(B)", "text": "Direct Service Administrative Requirements: payment terms for rent and security deposit;", "category": "documentation", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(1)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(1)(C)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (1)(C)", "text": "Direct Service Administrative Requirements: policies around proper use of the residence;", "category": "documentation", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(1)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(1)(D)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (1)(D)", "text": "Direct Service Administrative Requirements: fair housing and reasonable accommodations and modification disclosures;", "category": "documentation", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(1)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(1)(E)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (1)(E)", "text": "Direct Service Administrative Requirements: service animal and pet policies;", "category": "documentation", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(1)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(1)(F)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (1)(F)", "text": "Direct Service Administrative Requirements: rights to enter the property; and", "category": "documentation", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(1)(F)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(1)(G)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (1)(G)", "text": "Direct Service Administrative Requirements: guest policy", "category": "documentation", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(1)(G)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(2)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (2)", "text": "Direct Service Administrative Requirements: ensure the RHS home:", "category": "documentation", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(2)(A)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (2)(A)", "text": "Direct Service Administrative Requirements: is integrated in the community and supports the Person having access to the community;", "category": "documentation", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(2)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(2)(B)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (2)(B)", "text": "Direct Service Administrative Requirements: is physically accessible for the Person;", "category": "documentation", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(2)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(2)(C)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (2)(C)", "text": "Direct Service Administrative Requirements: optimizes autonomy and independence for the Person in making life choices and enables the Person to have control of their own schedule, including access to food and visitors;", "category": "documentation", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(2)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(2)(D)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (2)(D)", "text": "Direct Service Administrative Requirements: allows for the Person decorate their personal space;", "category": "documentation", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(2)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(2)(E)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (2)(E)", "text": "Direct Service Administrative Requirements: allows the Person to have privacy, dignity, and respect;", "category": "documentation", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(2)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(2)(F)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (2)(F)", "text": "Direct Service Administrative Requirements: ensures the Person to have freedom from coercion and restraint; and", "category": "documentation", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(2)(F)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(2)(G)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (2)(G)", "text": "Direct Service Administrative Requirements: is selected by the Person after all residential setting options are offered.", "category": "documentation", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(2)(G)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(3)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (3)", "text": "allow the Person to use Day Activity Absence Days. A \"Day Activity Absence Day\" is when a Person does not attend and participate in their normal day activities due to sickness, school closure, or other reason. The Contractor shall document the date and reason when a Person uses an absence day. If a Person has exhausted the absence days included in the RHS rate, the Contractor may provide and bill DSPD for ELS for times the Person does not participate in their day activity. The Contractor shall provide to the Person's Support Coordinator the documentation of the absence days included in the RHS rate being exhausted;", "category": "documentation", "applies_to": "agency", "codes": ["ELS", "RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(4)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (4)", "text": "Direct Service Administrative Requirements: have a completed form 930 prior to providing services with enhanced Staffing. Enhanced Staffing includes four or more hours per day of a Staff ratio of one Staff providing Direct Support to one Person;", "category": "documentation", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(5)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (5)", "text": "Direct Service Administrative Requirements: have a Staff that is responsible for the day to day operations of the program at each site that RHS is provided;", "category": "documentation", "applies_to": "site", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(6)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (6)", "text": "Direct Service Administrative Requirements: ensure that quarterly evacuation drills with Persons and Staff at each RHS site are conducted and documented;", "category": "site", "applies_to": "site", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(7)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (7)", "text": "create an inventory of the Person's belongings. The inventory must be maintained in the Person's file and include written documentation of the following:", "category": "client", "applies_to": "client", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(7)(A)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (7)(A)", "text": "Direct Service Administrative Requirements: the inventory completion date and the Staff's name that completed the inventory;", "category": "documentation", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(7)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(7)(B)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (7)(B)", "text": "Direct Service Administrative Requirements: belongings that have significant value to the Person;", "category": "client", "applies_to": "client", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(7)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(7)(C)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (7)(C)", "text": "Direct Service Administrative Requirements: belongings with a purchase value of $50.00 or more;", "category": "client", "applies_to": "client", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(7)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(7)(D)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (7)(D)", "text": "Direct Service Administrative Requirements: all new items added as received by the Person that have significant value to the Person or with a purchase value of $50.00 or more; and", "category": "documentation", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(7)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(7)(E)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (7)(E)", "text": "discarded items must be removed, including the reason for discard and signature from the Person or their legal guardian.", "category": "documentation", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(7)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(8)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (8)", "text": "Direct Service Administrative Requirements: when a Person receives a Public Housing Authority voucher:", "category": "documentation", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(8)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(8)(A)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (8)(A)", "text": "Direct Service Administrative Requirements: meet with the Person and their PCPT when the housing voucher is initially approved and in annual PCPT meetings, to review Public Housing Authority requirements, including the Person's or their guardian's responsibilities, and the Contractor;", "category": "documentation", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(8)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(8)(B)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (8)(B)", "text": "contact the Person's Local Public Housing Authority case manager to coordinate moving the housing voucher if the Person intends to move to a different residence. The Contractor shall contact the Person's Local Public Housing Authority case manager prior to the Person moving. In an emergency situation where contact prior to the move is not possible, the Contractor shall contact the Person's Local Public Housing Authority case manager immediately after the move; and", "category": "documentation", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(8)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(8)(C)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (8)(C)", "text": "prior to terminating a housing voucher, meet with the Person and their PCPT to determine if terminating the voucher is in the Person's best interest. The Contractor shall ensure the Person or their guardian understands that terminating the housing voucher will require the Person to reapply if they need a housing voucher in the future, and they will likely be on a waiting list. If the Person chooses to terminate their housing voucher, the Person or their legal guardian must request to do so in writing to the Public Housing Authority. The Contractor or the Person's Support Coordinator may NOT request to terminate the Person's housing voucher.", "category": "documentation", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(8)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(9)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (9)", "text": "Direct Service Administrative Requirements: maintain a written billing service documentation that includes:", "category": "billing", "applies_to": "service_record", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(9)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(9)(A)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (9)(A)", "text": "Direct Service Administrative Requirements: the name of the Person receiving the service;", "category": "documentation", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(9)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(9)(B)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (9)(B)", "text": "Direct Service Administrative Requirements: the date the service was delivered;", "category": "documentation", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(9)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(9)(C)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (9)(C)", "text": "Direct Service Administrative Requirements: the name of the DHHS service code delivered (RHS);", "category": "documentation", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(9)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(9)(D)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (9)(D)", "text": "Direct Service Administrative Requirements: the name of a Staff providing the services; and", "category": "documentation", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(9)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.3(9)(E)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.3 Direct Service Administrative Requirements (9)(E)", "text": "Direct Service Administrative Requirements: a written daily summary note of substantive service activities consistent with the service code description.", "category": "documentation", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.3(9)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.4", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.4 Specific Service Limitations", "text": "Specific Service Limitations. The Contractor shall NOT:", "category": "exception", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "no", "source": "DHHS91172 SOW §21.4", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.4(1)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.4 Specific Service Limitations (1)", "text": "Specific Service Limitations: bill DSPD for services provided to Persons who live with Immediate Relative or legal guardian;", "category": "exception", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "no", "source": "DHHS91172 SOW §21.4(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.4(2)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.4 Specific Service Limitations (2)", "text": "Specific Service Limitations: bill DSPD for Family and Individual Training and Preparation Services (\"TFB\") during the same time a Person receives RHS, unless an exceptional care need exists, and it has been approved by the DSPD director in writing prior to providing TFB; and", "category": "exception", "applies_to": "agency", "codes": ["RHS", "TFB"], "creates_user_task": "no", "source": "DHHS91172 SOW §21.4(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.4(3)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.4 Specific Service Limitations (3)", "text": "Specific Service Limitations: provide RHS as respite.", "category": "exception", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "no", "source": "DHHS91172 SOW §21.4(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.5", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.5 Specific Contractor Qualifications", "text": "Specific Contractor Qualifications. The Contractor shall have and maintain a current OL:", "category": "agency_qualification", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.5", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.5(1)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.5 Specific Contractor Qualifications (1)", "text": "Residential Support license for each location RHS services are provided for four or more Persons; and", "category": "agency_qualification", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.5(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.5(2)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.5 Specific Contractor Qualifications (2)", "text": "Residential Support certification for each location RHS is provided for three or fewer Persons.", "category": "staff_qualification", "applies_to": "staff", "codes": ["RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.5(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.6", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.6 Outcomes", "text": "Outcomes. (a) The intended outcome of this service is a stable living environment that is integrated into the community, promotes Persons goals and community integration. (b) Measures: The percentage of Persons who remained in their community-based living setting. (c) Reporting: The Contractor shall create a fiscal year annual report starting fiscal year 2025 (fiscal year 2025 starts July 1, 2024). The fiscal year annual report will be submitted via Google Form by August 30th, 60 days after each fiscal year end. The outcome Google Form will be posted on the DSPD webpage. The Contractor shall explain any quality improvement activities they will undertake in response to their evaluation of the measurement data. The fiscal year annual report must include the following:", "category": "outcome", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "no", "source": "DHHS91172 SOW §21.6", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.6(1)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.6 Outcomes (1)", "text": "Outcomes.: how many Persons received RHS; and", "category": "outcome", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "no", "source": "DHHS91172 SOW §21.6(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.6(2)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.6 Outcomes (2)", "text": "Outcomes.: data reflecting the measure in (b) above.", "category": "outcome", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "no", "source": "DHHS91172 SOW §21.6(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.7", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.7 Rate", "text": "Rate. (a) RHS is a daily rate, determined by the DSPD Worksheet and is based on the Person's needs. The DSPD Worksheet includes the number of days absent and the number of built-in ELS days. These fields may not be altered during the Person's annual Plan Year. If in the event the Person changes their RHS Contractor, DSPD may recover funds attributed to the early exhaustion of the days absent. (b) If the Contractor is providing services to a Person in DCFS custody of or DJJYS the DSPD Worksheet will be adjusted to deduct maintenance payments. Maintenance payments will be made using DHHS service code WHX or WRX. WHX /WRX is NOT reimbursed by DSPD. WHX/WRX is reimbursed through a payment form by the State agency that the Person is in custody with, either DCFS or DJJYS. (c) When receiving WHX/WRX payments, the Contractor shall ensure the funds are used to provide basic care and supervision for the Person including direct costs and administrative costs associated with providing the following: (1) food, (2) clothes, (3) room and board, (4) school supplies, and (5) other like items. (d) When receiving WHX/WRX payments the Contractor shall NOT:", "category": "billing", "applies_to": "service_record", "codes": ["ELS", "RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §21.7", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.7(1)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.7 Rate (1)", "text": "Rate.: become the Person's social security representative payee or receive the Person's SSI. DCFS or DJJYS is the Person's social security representative payee; and", "category": "unclear", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "no", "source": "DHHS91172 SOW §21.7(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-21.7(2)", "section": "Article 21 — Residential Habilitation Supports", "subsection": "§21.7 Rate (2)", "text": "Rate.: bill for WHX/WRX on days when the Person has not attended their RHS setting and is not under Direct Support and supervision of the Contractor for the full 24 hours of the day from 12:00 a.m. to 11:59 p.m.", "category": "unclear", "applies_to": "agency", "codes": ["RHS"], "creates_user_task": "no", "source": "DHHS91172 SOW §21.7(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-22.1", "section": "Article 22 — Routine Respite Without Room And Board", "subsection": "§22.1 General Description", "text": "General Description. RP2 provides one-to-one or group care to Persons to give relief to, or during the absence of, the Person's regular caregiver.", "category": "definition", "applies_to": "agency", "codes": ["RP2"], "creates_user_task": "no", "source": "DHHS91172 SOW §22.1", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-22.2", "section": "Article 22 — Routine Respite Without Room And Board", "subsection": "§22.2 Direct Service Requirements", "text": "Direct Service Requirements. The Contractor shall ensure the Person's:", "category": "actionable", "applies_to": "agency", "codes": ["RP2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §22.2", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-22.2(1)", "section": "Article 22 — Routine Respite Without Room And Board", "subsection": "§22.2 Direct Service Requirements (1)", "text": "Direct Service Requirements: health and safety during the Person's regular caregiver's absence. This includes assisting the Person with their Activities of Daily Living; and", "category": "actionable", "applies_to": "agency", "codes": ["RP2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §22.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-22.2(2)", "section": "Article 22 — Routine Respite Without Room And Board", "subsection": "§22.2 Direct Service Requirements (2)", "text": "Direct Service Requirements: regular caregiver provides the Person's necessary personal belongings.", "category": "client", "applies_to": "client", "codes": ["RP2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §22.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-22.3", "section": "Article 22 — Routine Respite Without Room And Board", "subsection": "§22.3 Direct Service Administrative Requirements", "text": "Direct Service Administrative Requirements. The Contractor shall:", "category": "documentation", "applies_to": "agency", "codes": ["RP2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §22.3", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-22.3(1)", "section": "Article 22 — Routine Respite Without Room And Board", "subsection": "§22.3 Direct Service Administrative Requirements (1)", "text": "Direct Service Administrative Requirements: provide RP2 in: (A) a facility with a Staff ratio of one Staff for up to six Persons; (B) in the RP2 Staff's private residence with a Staff ratio of one Staff for up to three Persons (including the Staff's own minor children and other individuals under 14 that reside in the residence); or (C) the Person's residence.", "category": "documentation", "applies_to": "site", "codes": ["RP2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §22.3(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-22.3(2)", "section": "Article 22 — Routine Respite Without Room And Board", "subsection": "§22.3 Direct Service Administrative Requirements (2)", "text": "Direct Service Administrative Requirements: when providing RP2 in the Staff's private residence, prior to providing services, ensure individuals who are 12 or older who reside in the home for any cumulative thirty days of the past 12 months comply with the background screening requirements in Utah Code §26B-2-120 and Utah Administrative Code R501-14;", "category": "staff_qualification", "applies_to": "staff", "codes": ["RP2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §22.3(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-22.3(3)", "section": "Article 22 — Routine Respite Without Room And Board", "subsection": "§22.3 Direct Service Administrative Requirements (3)", "text": "comply with all licensing and certification rules and requirements when providing services that require a license or certification from OL. Regardless of the services being provided, a site-based facility must not exceed its capacity allowed under the license or certification; and", "category": "staff_qualification", "applies_to": "staff", "codes": ["RP2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §22.3(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-22.3(4)", "section": "Article 22 — Routine Respite Without Room And Board", "subsection": "§22.3 Direct Service Administrative Requirements (4)", "text": "Direct Service Administrative Requirements: when providing RP2 daily, maintain written billing service documentation that includes:", "category": "billing", "applies_to": "service_record", "codes": ["RP2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §22.3(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-22.3(4)(A)", "section": "Article 22 — Routine Respite Without Room And Board", "subsection": "§22.3 Direct Service Administrative Requirements (4)(A)", "text": "Direct Service Administrative Requirements: the name of the Person receiving the service;", "category": "documentation", "applies_to": "agency", "codes": ["RP2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §22.3(4)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-22.3(4)(B)", "section": "Article 22 — Routine Respite Without Room And Board", "subsection": "§22.3 Direct Service Administrative Requirements (4)(B)", "text": "Direct Service Administrative Requirements: the date the service was delivered;", "category": "documentation", "applies_to": "agency", "codes": ["RP2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §22.3(4)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-22.3(4)(C)", "section": "Article 22 — Routine Respite Without Room And Board", "subsection": "§22.3 Direct Service Administrative Requirements (4)(C)", "text": "Direct Service Administrative Requirements: the name of the DHHS service code delivered (RP2 daily);", "category": "documentation", "applies_to": "agency", "codes": ["RP2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §22.3(4)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-22.3(4)(D)", "section": "Article 22 — Routine Respite Without Room And Board", "subsection": "§22.3 Direct Service Administrative Requirements (4)(D)", "text": "Direct Service Administrative Requirements: the name of the Staff providing the service; and", "category": "documentation", "applies_to": "agency", "codes": ["RP2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §22.3(4)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-22.3(4)(E)", "section": "Article 22 — Routine Respite Without Room And Board", "subsection": "§22.3 Direct Service Administrative Requirements (4)(E)", "text": "Direct Service Administrative Requirements: a written daily summary note of substantive activities consistent with the service description.", "cat ting with their family. (c) Reporting: The Contractor shall create a fiscal year annual report starting fiscal year 2025 (fiscal year 2025 starts July 1, 2024). The fiscal year annual report will be submitted via Google Form by August 30th, 60 days after each fiscal year end. The outcome Google Form will be posted on the DSPD webpage. The Contractor shall explain any quality improvement activities they will undertake in response to their evaluation of the measurement data. The fiscal year annual report must include the following:", "category": "outcome", "applies_to": "agency", "codes": ["RP2"], "creates_user_task": "no", "source": "DHHS91172 SOW §22.5", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-22.5(1)", "section": "Article 22 — Routine Respite Without Room And Board", "subsection": "§22.5 Outcomes (1)", "text": "Outcomes.: how many Persons received RP2; and", "category": "outcome", "applies_to": "agency", "codes": ["RP2"], "creates_user_task": "no", "source": "DHHS91172 SOW §22.5(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-22.5(2)", "section": "Article 22 — Routine Respite Without Room And Board", "subsection": "§22.5 Outcomes (2)", "text": "Outcomes.: data reflecting the measure in (b) above.", "category": "outcome", "applies_to": "agency", "codes": ["RP2"], "creates_user_task": "no", "source": "DHHS91172 SOW §22.5(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-22.6", "section": "Article 22 — Routine Respite Without Room And Board", "subsection": "§22.6 Rate", "text": "Rate. RP2 is a quarter hour and daily service. The Contractor shall bill for the daily rate if a Person requires six of more hours of RP2 services within a 24-hour period; otherwise, the hourly rate must be used.", "category": "billing", "applies_to": "service_record", "codes": ["RP2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §22.6", "sow_version": "DHHS91172", "effective_date": "2026-07-01" Board", "subsection": "§24.5 Outcomes (1)", "text": "Outcomes.: how many Persons received RP4; and", "category": "outcome", "applies_to": "agency", "codes": ["RP4"], "creates_user_task": "no", "source": "DHHS91172 SOW §24.5(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-24.5(2)", "section": "Article 24 — Routine Respite With Room And Board", "subsection": "§24.5 Outcomes (2)", "text": "Outcomes.: data reflecting the measure in (b) above.", "category": "outcome", "applies_to": "agency", "codes": ["RP4"], "creates_user_task": "no", "source": "DHHS91172 SOW §24.5(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-24.6", "section": "Article 24 — Routine Respite With Room And Board", "subsection": "§24.6 Rate", "text": "Rate. RP4 is a daily rate, 6-24 hours of RP4 is included in the daily rate.", "category": "billing", "applies_to": "service_record", "codes": ["RP4"], "creates_user_task": "yes", "source": "DHHS91172 SOW §24.6", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-25.1", "section": "Article 25 — Exceptional Care Respite With Room And Board", "subsection": "§25.1 General Description", "text": "General Description. RP5 provides overnight one-to-one and group care to Persons that: (1) may require specialized equipment; (2) have exceptional medical or behavioral needs; and (3) need relief for or during the absence of the Person's regular caregiver.", "category": "definition", "applies_to": "agency", "codes": ["RP5"], "creates_user_task": "no", "source": "DHHS91172 SOW §25.1", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-25.2", "section": "Article 25 — Exceptional Care Respite With Room And Board", "subsection": "§25.2 General Requirements", "text": "General Requirements. The Contractor shall:", "category": "actionable", "applies_to": "agency", "codes": ["RP5"], "creates_user_task": "yes", "source": "DHHS91172 SOW §25.2", "sow_version": "DHHS91172", "effec
