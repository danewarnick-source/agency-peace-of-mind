<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#7c2d12" />
  <title>DHHS91172 SOW Reviewer</title>
  <style>
    :root {
      --bg: #fff7ed;
      --ink: #1c1917;
      --muted: #57534e;
      --card: #fffbeb;
      --line: #fed7aa;
      --accent: #9a3412;
      --accent-2: #c2410c;
      --ok: #166534;
      --warn: #b45309;
      --bad: #991b1b;
      --btn: #7c2d12;
      --btn-ink: #fff7ed;
      --chip: #ffedd5;
      --focus: #ea580c;
      --safe-bottom: env(safe-area-inset-bottom, 12px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    body {
      padding: 12px 12px calc(96px + var(--safe-bottom));
      max-width: 44rem;
      margin: 0 auto;
    }
    header.top {
      position: sticky;
      top: 0;
      z-index: 5;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(10px);
      padding: 8px 0 10px;
      border-bottom: 1px solid var(--line);
      margin: -12px -12px 12px;
      padding-left: 12px;
      padding-right: 12px;
    }
    h1 {
      font-size: 1.05rem;
      margin: 0 0 2px;
      letter-spacing: -0.02em;
    }
    .sub {
      color: var(--muted);
      font-size: 0.8rem;
      margin: 0 0 8px;
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .progress {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
    }
    label.field {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      margin: 12px 0 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    select, textarea, input[type="text"], input[type="search"] {
      width: 100%;
      font: inherit;
      padding: 12px 12px;
      min-height: 48px;
      border: 1.5px solid #fdba74;
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
    }
    select:focus, textarea:focus, input:focus {
      outline: 3px solid color-mix(in srgb, var(--focus) 45%, transparent);
      border-color: var(--focus);
    }
    textarea { min-height: 88px; resize: vertical; }
    .card {
      background: var(--card);
      border: 1.5px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 8px 24px rgba(124, 45, 18, 0.06);
    }
    .badge {
      display: inline-block;
      background: var(--chip);
      color: var(--accent);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      margin: 0 6px 8px 0;
    }
    .clause {
      font-size: 1.05rem;
      white-space: pre-wrap;
      margin: 8px 0 0;
    }
    .codes {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .codes label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 44px;
      padding: 6px 10px;
      background: #fff;
      border: 1px solid #fdba74;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .codes input { width: 18px; height: 18px; accent-color: var(--accent); }
    .nav {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      background: #fff7ed;
      border-top: 1.5px solid var(--line);
      padding: 10px 12px var(--safe-bottom);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      max-width: 44rem;
      margin: 0 auto;
    }
    button {
      font: inherit;
      font-weight: 700;
      min-height: 52px;
      border: 0;
      border-radius: 14px;
      padding: 12px 16px;
      background: var(--btn);
      color: var(--btn-ink);
    }
    button.secondary {
      background: #ffedd5;
      color: var(--accent);
    }
    button:disabled { opacity: 0.45; }
    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .hint {
      font-size: 0.8rem;
      color: var(--muted);
      margin: 8px 0 0;
    }
    .empty {
      padding: 28px 8px;
      text-align: center;
      color: var(--muted);
    }
    .idline {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      color: var(--muted);
      word-break: break-all;
    }
  </style>
</head>
<body>
  <header class="top">
    <h1>DHHS91172 SOW reviewer</h1>
    <p class="sub">Temporary Dane tool · no login · drafts stay on this phone · effective 2026-07-01</p>
    <div class="row">
      <span class="progress" id="progress">0 of 0</span>
      <label class="field" style="margin:0;flex:1;text-transform:none;letter-spacing:0">
        Filter
        <select id="filterStatus" aria-label="Filter by review status">
          <option value="all">All clauses</option>
          <option value="draft_ai">draft_ai</option>
          <option value="reviewed_ok">reviewed_ok</option>
          <option value="needs_fix">needs_fix</option>
          <option value="drop">drop</option>
          <option value="unreviewed">Unreviewed (draft_ai / empty)</option>
        </select>
      </label>
    </div>
    <label class="field" for="jumpBox" style="margin-top:8px">Jump to id or number</label>
    <input id="jumpBox" type="search" enterkeyhint="go" placeholder="e.g. 12 or sow-1.8(4)(A)" />
    <div class="toolbar">
      <button type="button" class="secondary" id="nextOpen">Next unreviewed</button>
      <button type="button" class="secondary" id="exportCsv">Export CSV</button>
    </div>
  </header>

  <div id="cardHost"></div>

  <nav class="nav">
    <button type="button" class="secondary" id="prevBtn">Prev</button>
    <button type="button" id="nextBtn">Next</button>
  </nav>

  <script>
  const CLAUSES = [{"id": "sow-1.1", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.1 Definitions", "text": "Definitions. In this contract, the following definitions apply: \"Activities of Daily Living\" means both basic activities of daily living and instrumental activities of daily living. Basic activities of daily living are ambulating, transfers, feeding, personal hygiene, dressing, and toileting. Instrumental activities of daily living are more complex activities related to the ability to live independently in the community. \"BSP\" means Behavior Support Plan. A BSP is a plan developed by a professional to assist Staff and other individuals providing support to a Person with challenging or dangerous behaviors, with individually designed interventions to replace the target behaviors with socially acceptable appropriate behaviors. \"Business Day\" means Monday through Friday, excluding state and federal holidays. \"Calendar Day\" means all days in a month, including weekends and holidays. \"Competitive Integrated Employment\" means work performed by Persons in the community alongside people of all abilities. The employer is not a contracted Department of Health and Human Services, Division of Services for People with Disabilities (\"DSPD\") provider. Persons are compensated at or above minimum wage or comparable to people without disabilities who work in the same place and perform the same or similar work; and with equal access to opportunities for advancement and benefits. \"Customized Employment\" means an individualized process to create a Competitive Integrated Employment opportunity for a Person based on their specific skills and interest that fills an unmet need of an employer. \"Direct Support\" means when Staff provides hands-on assistance, care, and services to Persons. \"Discovery Process\" means a Person-Centered, qualitative approach to finding employment for Persons, focusing on identified strengths, interests, and ideal working conditions. \"DSPD Worksheet\" means an annual Plan Year agreement to determine rates paid to the Contractor for specific service codes. The DSPD Worksheet is individualized for each Person by using variables such as Staff ratios and hours of services. \"Employment Plan\" means an individualized plan detailing the Person's vocational goals, and the supports and services necessary to reach the goals. \"HCBS\" means Home and Community Based Services. HCBS are services provided in the home and community through Medicaid Waivers. \"HCBS Settings Rule\" means a set of rules that providers, Support Coordinators and states must follow regarding HCBS settings and the Person-Centered planning process. \"Human Rights Committee\" means a group of at least three individuals (with at least one of those individuals not being employed by the Contractor), established and maintained by the Contractor or DHHS that provides a recommendation to the Person's PCSP, regarding their human rights. The role of the Human Rights Committee is to promote and protect the rights of Persons. The Human Rights Committee approves or denies any human right modifications. \"Immediate Relatives\" means mother, stepmother, father, stepfather or siblings. \"Informed Choice\" means the Person is provided important information, risks, and benefits about the decision they are making. \"Medicaid Waivers\" means federal and state approved programs developed to meet the needs of Persons who prefer to get their long-term care services and support in their home and community as an alternative to institutional settings. \"Natural Supports\" means individuals willing to provide resources and support for Persons without the expectation of compensation. \"Person\" means an individual who has Intellectual Disabilities, Related Conditions (collectively \"ID.RC\"), or Acquired Brain Injury (\"ABI\") as defined in Utah Administrative Code, Rule R539-1 and found eligible to receive services by DSPD or an individual who is a DHHS client and has been approved by DHHS to receive services. \"Person-Centered\" means focusing on the needs and wants of a Person to provide an individualized approach to planning services and supports. The Person is placed at the center of the planning process as the expert of their life, interests, and talents. It is based on the Person and not their disability. \"PCPT\" means Person Centered Planning Team. A PCPT is composed of individuals including the Person, the Person's legal guardian (if applicable), the Person's parents and other family members, the Person's SC, the Contractor, and any other individuals the Person would like to participate in the PCPT. The PCPT assists the Person to create their PCSP and identify necessary services and supports based on the Person's desired life and support needs. \"PCSP\" means Person Centered Support Plan. A PCSP is a plan developed by a Person's PCPT that includes the services provided to the Person, details of how services will be provided, if applicable, and the Person's goals and the outcomes expected from the services provided. \"Plan Year\" means the 12-month period of a Person's PCSP. Each Person's Plan Year may be different and starts the following month after a Person signs their PCSP and ends 12 consecutive months later. \"Remediation Plan\" means a step-by step plan of action developed to achieve specific outcomes for resolution of identified errors. \"Staff\" means any individual hired by the Contractor to provide services or who has access to the Person's identifying information. \"Support Coordinator\" means a DSPD contracted Support Coordinator or a DHHS employee who assists Persons and their families to develop plans, to find the most appropriate services, and to select the most appropriate service delivery model based on the individual needs of the Person. \"Support Strategy'' means a set of instructions outlining what will be done to assist a Person to achieve a goal in their PCSP or to meet another need identified in their PCSP. It is primarily written to provide direction to Direct Support Staff in supporting the Person in their plan, and typically also identifies required documentation related to the goal. \"USTEPS\" means the DSPD Utah web-based case management system used by DSPD and Support Coordinators for tracking eligibility, planning and services. \"UPI\" means USTEPS Provider Interface. UPI is a DSPD Utah web-based management system used by DSPD contractors for tracking Person's services and submitting billings for services rendered.", "category": "definition", "applies_to": "client", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.1", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.2", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.2 Background", "text": "Background. Services must be focused on inclusion and integration in all facets of community life for people with disabilities to safely lead self-determined lives in the community. Services provided must be delivered in compliance with the Centers for Medicare & Medicaid Services) HCBS Settings Rule.", "category": "staff_qualification", "applies_to": "staff", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.2", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.3", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.3 Population", "text": "Population. The Contractor shall provide services to each Person whom DHHS refers to it for services.", "category": "actionable", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.3", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.4", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.4 General Contractor Qualifications", "text": "General Contractor Qualifications. The Contractor shall:", "category": "agency_qualification", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.4", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.4(1)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.4 General Contractor Qualifications (1)", "text": "General Contractor Qualifications: be an approved Medicaid provider for the Community Support Waiver, Community Transition Waiver and Acquired Brain Injury Waiver with the DHHS, Division of Integrated Healthcare (\"DIH\"). This approval process is administered by the DSPD Medicaid Enrollment Manager;", "category": "agency_qualification", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.4(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.4(2)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.4 General Contractor Qualifications (2)", "text": "General Contractor Qualifications: have a current active USTEPS, and UPI account. Comply with USTEPS/UPI requirements, with electronic access, and process changes as they develop; and", "category": "external", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.4(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.4(3)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.4 General Contractor Qualifications (3)", "text": "General Contractor Qualifications: obtain, or maintain current, all licenses and certificates identified in the individual service code descriptions and as outlined in Utah Administrative Code R501 and Utah Code §58-1 et. seq.", "category": "agency_qualification", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.4(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.5", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.5 General Contractor and Staff Qualifications", "text": "General Contractor and Staff Qualifications. The Contractor's Staff shall be at least 16 years of age unless:", "category": "staff_qualification", "applies_to": "staff", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.5", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.5(1)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.5 General Contractor and Staff Qualifications (1)", "text": "the service requires the Staff to drive the Person and then Staff must be at least 18 years of age to provide transportation;", "category": "staff_qualification", "applies_to": "staff", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.5(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.5(2)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.5 General Contractor and Staff Qualifications (2)", "text": "the Person is a client of DHHS Division of Juvenile Justice and Youth Services (\"DJJYS\") or Division of Child and Family Services (\"DCFS\") in which case the Staff must be at least 18 years of age; or", "category": "staff_qualification", "applies_to": "staff", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.5(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.5(3)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.5 General Contractor and Staff Qualifications (3)", "text": "General Contractor and Staff Qualifications: otherwise specified in the individual service code descriptions.", "category": "staff_qualification", "applies_to": "staff", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.5(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.6", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.6 Volunteers", "text": "Volunteers. Friends of the Person or any individuals the Person chooses as a partner in activities, such as natural supports, scouts, or church groups are not defined as volunteers. The Contractor shall:", "category": "actionable", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.6", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.6(1)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.6 Volunteers (1)", "text": "Volunteers: ensure volunteers comply with all Staff qualifications and requirements;", "category": "unclear", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.6(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.6(2)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.6 Volunteers (2)", "text": "Volunteers: use volunteers in the operations of its services only under the following conditions:", "category": "unclear", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.6(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.6(2)(A)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.6 Volunteers (2)(A)", "text": "a volunteer working in a volunteer position may supplement Staff, but must not replace Staff hours; and", "category": "staff_qualification", "applies_to": "staff", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.6(2)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.6(2)(B)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.6 Volunteers (2)(B)", "text": "written permission from the Person's and their legal guardian, if applicable, must be obtained prior to a volunteer taking a Person overnight.", "category": "staff_qualification", "applies_to": "staff", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.6(2)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.6(3)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.6 Volunteers (3)", "text": "Volunteers: ensure and maintain written documentation that volunteers who work on a regularly scheduled basis complete the following training requirements prior to providing support for Persons:", "category": "staff_qualification", "applies_to": "staff", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.6(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.6(3)(A)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.6 Volunteers (3)(A)", "text": "Volunteers: understanding of the Person's needs;", "category": "unclear", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.6(3)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.6(3)(B)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.6 Volunteers (3)(B)", "text": "Volunteers: requirements for reporting abuse and protecting human rights;", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.6(3)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.6(3)(C)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.6 Volunteers (3)(C)", "text": "Volunteers: confidentiality requirements regarding the Person and the Person's information;", "category": "unclear", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.6(3)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.6(3)(D)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.6 Volunteers (3)(D)", "text": "Voluntee ministrative Requirements", "subsection": "§1.9 Staff Records", "text": "Staff Records. The Contractor shall maintain Staff records for its entire Staff. In addition to other documentation required by this contract, the Contractor shall include the following in each Staff's record:", "category": "documentation", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.9", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.9(1)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.9 Staff Records (1)", "text": "Staff Records: the Staff's name, addresses, and telephone number;", "category": "staff_qualification", "applies_to": "staff", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.9(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.9(2)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.9 Staff Records (2)", "text": "Staff Records: results of background checks completed through the DHHS/Office of Background Processing;", "category": "staff_qualification", "applies_to": "staff", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.9(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.9(3)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.9 Staff Records (3)", "text": "Staff Records: documentation of successfully completed trainings;", "category": "documentation", "applies_to": "agency", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.9(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.9(4)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.9 Staff Records (4)", "text": "Staff Records: copies of educational transcripts, degrees, letters, licenses, and certifications, when applicable, to substantiate Staff qualifications;", "category": "staff_qualification", "applies_to": "staff", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.9(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.9(5)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.9 Staff Records (5)", "text": "Staff Records: copies of regular performance evaluations;", "category": "staff_qualification", "applies_to": "staff", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.9(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.9(6)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.9 Staff Records (6)", "text": "Medicaid Disclosure Forms found on the DSPD webpage; and", "category": "staff_qualification", "applies_to": "staff", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.9(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.9(7)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.9 Staff Records (7)", "text": "evidence of Medicaid Fraud Exclusion check. The Contractor shall complete checks at http://exclusions.oig.hhs.gov/Default.aspx.", "category": "staff_qualification", "applies_to": "staff", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.9(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.10", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.10 Person Records", "text": "Person Records. The Person's records are State and DSPD property. The Contractor shall maintain a separate record for each Person receiving services. The Contractor shall update the Person's record at least annually and upon a material change in the Person's circumstances. In addition to documentation required by this contract, the Person's record must include:", "category": "definition", "applies_to": "client", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.10", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.10(1)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.10 Person Records (1)", "text": "Person Records: the Person's name, address, phone number, birth date, identification number, and, if applicable, Medicaid number;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.10(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.10(2)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.10 Person Records (2)", "text": "Person Records: the Person's Support Coordinator's name, email, and phone number;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.10(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.10(3)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.10 Person Records (3)", "text": "Person Records: a current photograph of the Person taken within the last five years;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.10(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.10(4)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.10 Person Records (4)", "text": "Person Records: the name, address, and phone number of the Person's representative or guardian, if any, and name, address, and phone number for the Person's emergency contacts, including instructions on how to contact them;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.10(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.10(5)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.10 Person Records (5)", "text": "Person Records: the name and phone number of the Person's primary health care professional, medical specialist, health care professional prescribing medication, if any, and medical insurance information;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.10(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.10(6)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.10 Person Records (6)", "text": "Person Records: documentation of approved charges or expenses placed against the Person's funds for reimbursement to the Contractor for property damages for which the Person is held responsible;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.10(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.10(7)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.10 Person Records (7)", "text": "documentation for all services provided to and billed on behalf of the Person. The Contractor shall ensure that documentation for all services provided complies with Medicaid requirements. Unless otherwise specified in the individual DHHS service code description, the Contractor shall ensure that written documentation of service delivery for each service code shall include:", "category": "definition", "applies_to": "service_record", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.10(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.10(7)(A)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.10 Person Records (7)(A)", "text": "Person Records: the name of the Person receiving the service;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.10(7)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.10(7)(B)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.10 Person Records (7)(B)", "text": "Person Records: the date the service was delivered;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.10(7)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.10(7)(C)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.10 Person Records (7)(C)", "text": "Person Records: the start time and end time the service was delivered;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.10(7)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.10(7)(D)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.10 Person Records (7)(D)", "text": "Person Records: the name of the DHHS service code that was delivered;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.10(7)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.10(7)(E)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.10 Person Records (7)(E)", "text": "Person Records: the name of the Staff providing the service; and", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.10(7)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.10(7)(F)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.10 Person Records (7)(F)", "text": "Person Records: a written summary note of substantive service activities consistent with the individual service description.", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.10(7)(F)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.10(8)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.10 Person Records (8)", "text": "Person Centered Planning documentation;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.10(8)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.10(9)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.10 Person Records (9)", "text": "Person Records: the Person's admission and discharge dates;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.10(9)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.10(10)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.10 Person Records (10)", "text": "Person Records: legal documents including: Human Rights Committee and Behavior Peer-Review Committee documentation; guardianship/legal representation appointments; and any other relevant legal documents;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.10(10)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.10(11)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.10 Person Records (11)", "text": "Person Records: a statement signed by the Person and the Person's representative, if applicable, verifying that the Contractor both explained and provided them with a copy of its grievance policy and procedures;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.10(11)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.10(12)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.10 Person Records (12)", "text": "Person Records: the Person's relevant medical information, as per the Health Supports Policies and Procedures section of this contract, and as identified in the individual service code descriptions;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.10(12)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.10(13)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.10 Person Records (13)", "text": "Person Records: all of the Person's individualized plans; and", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.10(13)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.10(14)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.10 Person Records (14)", "text": "DNR orders accessible to Staff in the Person's service settings. The Contractor shall solicit input from the Person on the desired location of their DNR order.", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.10(14)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.11", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.11 Operational Records", "text": "Operational Records. The Contractor shall, when applicable maintain documentation of current compliance with zoning, Life Safety Code, and health and fire safety requirements for licensure.", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.11", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.12", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.12 Electronic Visit Verification", "text": "Electronic Visit Verification. The Contractor shall comply with Electronic Visit Verification requirements as outlined in section 12006 of the 21st Century Cures Act for all instances of service delivery for each of the following services: Companion; Homemaker; Respite (with the exception of RP4, RP5, RPS); Supported Living; and Personal Assistance.", "category": "definition", "applies_to": "service_record", "codes": ["RP4", "RP5", "RPS"], "creates_user_task": "no", "source": "DHHS91172 SOW §1.12", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.13", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.13 Medicaid Provider Requirements", "text": "Medicaid Provider Requirements. The Contractor shall enroll to be a Medicaid provider. DHHS may assist the Contractor to enroll in Medicaid, but the Contractor is responsible to comply with all policies and procedures in the Utah Medicaid provider manual and Medicaid Information Bulletins in effect when services are rendered. The Contractor shall comply with all applicable state and federal rules and regulations. The Contractor shall:", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.13", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.13(1)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.13 Medicaid Provider Requirements (1)", "text": "Medicaid Provider Requirements: provide DSPD with complete and correct Medicaid Provider documents within seven Calendar Days of a written request from DSPD. The written request from DSPD will include a list of the required Medicaid Provider documents;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.13(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.13(2)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.13 Medicaid Provider Requirements (2)", "text": "Medicaid Provider Requirements: notify the DSPD contract team at dspdcontracts@utah.gov within seven Calendar Days of any changes to its: (A) phone number; (B) address; or (C) email address;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.13(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.13(3)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.13 Medicaid Provider Requirements (3)", "text": "Medicaid Provider Requirements: notify the DSPD Contract Program Manager within 30 Calendar Days of any changes to its: (A) ownership; (B) legal corporate name; or (C) employer tax identification number;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.13(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.13(4)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.13 Medicaid Provider Requirements (4)", "text": "Medicaid Provider Requirements: participate in DIH and DSPD Medicaid Provider trainings;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.13(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.13(5)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.13 Medicaid Provider Requirements (5)", "text": "ensure and maintain Staff completion of the Medicaid Disclosure form at time of hire and annually thereafter. If Staff discloses any information on the Medicaid Disclosure form in violation of confidentiality requirements, the Contractor shall immediately notify DSPD; and", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.13(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.13(6)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.13 Medicaid Provider Requirements (6)", "text": "Medicaid Provider Requirements: document the delivery of all services in accordance with the requirements of this contract.", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.13(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.14", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.14 Governing or Policy Making Board", "text": "Governing or Policy Making Board. If the Contractor is governed by a governing or policy-making board, the Contractor shall:", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.14", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.14(1)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.14 Governing or Policy Making Board (1)", "text": "Governing or Policy Making Board: maintain the by-laws of its organization and its governing board;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.14(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.14(2)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.14 Governing or Policy Making Board (2)", "text": "Governing or Policy Making Board: convene meetings of its board at least quarterly or more frequently if the need arises;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.14(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.14(3)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.14 Governing or Policy Making Board (3)", "text": "Governing or Policy Making Board: maintain minutes of the proceedings of that board that include the membership of the board and the attendees at each board meeting; and", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.14(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.14(4)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.14 Governing or Policy Making Board (4)", "text": "Governing or Policy Making Board: disclose its bylaws and minutes within three Calendar Days of request from any state or federal auditor or reviewer, DHHS, or DSPD representative.", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.14(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.15", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.15 Use of UPI", "text": "Use of UPI. The Contractor shall:", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.15", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.15(1)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.15 Use of UPI (1)", "text": "Use of UPI: complete DSPD form \"0-9 USTEPS Provider Interface (UPI) Provider Company Designee Access Form\";", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.15(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.15(2)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.15 Use of UPI (2)", "text": "Use of UPI: complete DSPD form \"0-8 USTEPS Provider Interface (UPI) Individual User Access Form\" for at least one Staff;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.15(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.15(3)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.15 Use of UPI (3)", "text": "Use of UPI: ensure that access to UPI is granted only to Staff that need to know the information in UPI to provide professional treatment or coordinate DSPD services;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.15(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.15(4)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.15 Use of UPI (4)", "text": "Use of UPI: approve or reject the DSPD Service Authorization Form 1056 (\"1056\") through UPI within 15 Calendar Days of the creation of a new or adjusted 1056;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.15(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.15(5)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.15 Use of UPI (5)", "text": "Use of UPI: if the Contractor rejects the 1056, coordinate with the Person's Support Coordinator to either adjust the 1056, or start the process to discharge the Person from receiving Contractor's services and transition to a different contractor;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.15(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.15(6)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.15 Use of UPI (6)", "text": "monitor the use of services by the Person to ensure that the utilization of services complies with the approved 1056. If the Person is at risk of exhausting the units allocated in the 1056, the Contractor shall notify the Person's Support Coordinator and arrange for appropriate changes to be made to the Person's PCSP;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.15(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.15(7)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.15 Use of UPI (7)", "text": "Use of UPI: use the UPI \"Provider Organization\" section to create and maintain a Contractor organizational group structure that will restrict UPI users from seeing Person information not required to provide professional treatment or coordinate DSPD services;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.15(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.15(8)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.15 Use of UPI (8)", "text": "Use of UPI: assign and maintain Staff with UPI access to the appropriate organizational groups;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.15(8)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.15(9)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.15 Use of UPI (9)", "text": "Use of UPI: assign and maintain each Staff with UPI access, email, and notification preference;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.15(9)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.15(10)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.15 Use of UPI (10)", "text": "Use of UPI: assign and maintain each Person to the appropriate organizational groups;", "category": "definition", "applies_to": "client", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.15(10)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.15(11)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.15 Use of UPI (11)", "text": "Use of UPI: remove terminated Staff from the \"Provider Organization\" within one Calendar Day of termination;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.15(11)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.15(12)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.15 Use of UPI (12)", "text": "Use of UPI: remove Staff from an organizational group within one Calendar Day of the Staff no longer needing to know the information in UPI to provide professional treatment or coordinate DSPD services;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.15(12)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.15(13)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.15 Use of UPI (13)", "text": "Use of UPI: remove a Person from the \"Provider Organization\" when the Contractor is no longer providing services to that Person, and has completed all business requiring the Person to remain in the \"Provider Organization\";", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.15(13)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.15(14)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.15 Use of UPI (14)", "text": "Use of UPI: conduct and document an annual review of all staff with UPI access to ensure all Staff with UPI access have the correct UPI access and the UPI Provider Organization is correct and current; and", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.15(14)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.15(15)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.15 Use of UPI (15)", "text": "Use of UPI: notify the DSPD USTEPS team within one Calendar Day of the termination of Staff with UPI access.", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.15(15)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.16", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.16 Marketing", "text": "Marketing. The Contractor shall not:", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.16", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.16(1)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.16 Marketing (1)", "text": "Marketing: engage in any form of false, deceptive, or misleading or coercing advertising practices or conversation to solicit business or induce a Person to engage its services;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.16(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.16(2)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.16 Marketing (2)", "text": "Marketing: engage with the Person in any way that is deceiving, provides mis-information, or is harassment;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.16(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.16(3)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.16 Marketing (3)", "text": "Marketing: represent itself as a DHHS employee, but rather disclose themself as an independent contractor;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.16(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.16(4)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.16 Marketing (4)", "text": "Marketing: solicit or induce a Person to engage its services at the Person's regularly scheduled daytime habilitative or supported employment activities;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.16(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.16(5)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.16 Marketing (5)", "text": "Marketing: independently solicit business or attempt to influence a Person to engage its services once a Person has declined the Contractor's services; and", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.16(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.16(6)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.16 Marketing (6)", "text": "Marketing: attempt to influence a Person's choice of a Support Coordinator.", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.16(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.17", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.17 Personnel Policies and Procedures", "text": "Personnel Policies and Procedures. (a) The Contractor shall have personnel policies and procedures to ensure adequate structure and organization for efficient and effective personnel management, and to comply with all personnel-related provisions of this contract and all state and federal personnel-related regulations. (b) The personal policies and procedures must have written job descriptions for each Staff position that include a statement of duties and responsibilities, and the minimum qualifications for the position.", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.17", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.18", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.18 Operating Policies and Procedures", "text": "Operating Policies and Procedures. The Contractor shall have operating policies and procedures to ensure sufficient structure and organization for the efficient and effective management of services, and to comply with this contract and other state and federal regulations. The Contractor shall include the following in its operating policies and procedures:", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.18", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.18(1)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.18 Operating Policies and Procedures (1)", "text": "Operating Policies and Procedures: clearly defined Staff and supervisory responsibilities during all hours of operation;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.18(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.18(2)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.18 Operating Policies and Procedures (2)", "text": "Operating Policies and Procedures: if providing transportation, provisions that specify all transportation requirements pursuant to this contract and how compliance will be ensured;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.18(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.18(3)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.18 Operating Policies and Procedures (3)", "text": "Operating Policies and Procedures: provisions for the receipt and resolution of Staff grievances and Persons grievances that comply with this contract;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.18(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.18(4)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.18 Operating Policies and Procedures (4)", "text": "Operating Policies and Procedures: emergency procedures for handling the injury, illness, indications of when the Person may be getting sick or experiencing a decline in mental health, or death of a Person and instructions about when and how to notify necessary individuals, including when and how to notify the DSPD Waiver managers according to fatality, critical incident reports, and critical incident investigations sections of this contract;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.18(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.18(5)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.18 Operating Policies and Procedures (5)", "text": "Operating Policies and Procedures: if the Contractor manages or assists with a Person's personal finances, provisions for the management of each Person's personal finances including: compliance with all Person's personal finances requirements ; how the Contractor will ensure compliance with all current regulation and policies of the Social Security Administration (\"SSA\"), if the Contractor is the Person's social security representative payee; and ensuring Persons do not continuously owe the Contractor money due to emergency situations;", "category": "definition", "applies_to": "client", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.18(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.18(6)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.18 Operating Policies and Procedures (6)", "text": "Operating Policies and Procedures: with the exception of Personal Budget Assistance and Homemaker services, how the Contractor will comply with Utah Administrative Code R539-4 with regard to BSPs and behavior intervention procedures; and", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.18(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.18(7)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.18 Operating Policies and Procedures (7)", "text": "Operating Policies and Procedures: if the Contractor provides transportation, a policy that ensures compliance with all transportation requirements pursuant to this contract, and outlines what the Contractor determines to be an acceptable driving record for Staff to transport Persons.", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.18(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.19", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.19 DHHS Quality Monitoring Process", "text": "DHHS Quality Monitoring Process. The Contractor shall cooperate with review and requirements from the DHHS quality management team. If DHHS identifies a deficiency that requires a Remediation Plan from the Contractor, the Contractor shall:", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.19", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.19(1)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.19 DHHS Quality Monitoring Process (1)", "text": "DHHS Quality Monitoring Process: submit to the DHHS quality management team a written Remediation Plan that responds to each identified deficiency according to the instructions provided by the DHHS quality management representative;", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.19(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.19(2)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.19 DHHS Quality Monitoring Process (2)", "text": "DHHS Quality Monitoring Process: submit the response within the required timeframes; and", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.19(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.19(3)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.19 DHHS Quality Monitoring Process (3)", "text": "DHHS Quality Monitoring Process: submit a revised Remediation Plan within seven Calendar Days if the Contractor's response is determined unacceptable by DHHS. If a revised Remediation Plan is determined to be unacceptable by DHHS, the Contractor may receive sanctions pursuant to the terms of this contract. The Contractor may appeal sanctions to DHHS.", "category": "definition", "applies_to": "agency", "codes": [], "creates_user_task": "no", "source": "DHHS91172 SOW §1.19(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.20", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.20 Human Rights Committees", "text": "Human Rights Committees. (a) The Contractor shall establish a human rights committee that is in compliance with rule Utah Administrative Code R539-3-4. (b) The Human Rights Committee will determine and document approval or denial of a Person's human rights modifications. The process for implementing a human rights modification must be Person-Centered. The following are requirements that must be included in the documentation:", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.20", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.20(1)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.20 Human Rights Committees (1)", "text": "Human Rights Committees.: an identification of a specific and individualized assessed need;", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.20(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.20(2)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.20 Human Rights Committees (2)", "text": "Human Rights Committees.: the positive intervention and support used prior to any modifications to the PCSP;", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.20(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.20(3)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.20 Human Rights Committees (3)", "text": "Human Rights Committees.: less intrusive methods of meeting the need that have been tried but did not work", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.20(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.20(4)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.20 Human Rights Committees (4)", "text": "Human Rights Committees.: a clear description of the condition that is directly proportionate to the specific assessed need;", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.20(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.20(5)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.20 Human Rights Committees (5)", "text": "Human Rights Committees.: a regular collection and review of data to measure the ongoing effectiveness of the modification;", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.20(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.20(6)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.20 Human Rights Committees (6)", "text": "Human Rights Committees.: established time limits for periodic reviews to determine if the modification is still necessary or can be terminated;", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.20(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.20(7)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.20 Human Rights Committees (7)", "text": "Human Rights Committees.: informed consent of the Person; and", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.20(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.20(8)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.20 Human Rights Committees (8)", "text": "Human Rights Committees.: an assurance that interventions and supports will cause no harm to the Person.", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.20(8)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.21", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.21 Human Rights Plan", "text": "Human Rights Plan. Unless the Contractor only provides CHA, HSQ, or PBA, the Contractor shall have a human rights plan that is in compliance with the HCBS Settings Rule and includes:", "category": "client", "applies_to": "client", "codes": ["CHA", "HSQ", "PBA"], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.21", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.21(1)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.21 Human Rights Plan (1)", "text": "Human Rights Plan: procedures for training Persons and Staff on Persons' rights. Some examples of human right include but are not limited to: when a Person goes to bed, who/what/where a Person eats or drinks, who a Person talks to, who/when a people visit, free time, relationships, locked doors, access to money, access to community, Informed Choice in Competitive Integrated Employment, alcohol (age 21 or older), access to medication, and age appropriate media content;", "category": "staff_qualification", "applies_to": "staff", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.21(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.21(2)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.21 Human Rights Plan (2)", "text": "Human Rights Plan: procedures for prevention of abuse and rights violations;", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.21(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.21(3)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.21 Human Rights Plan (3)", "text": "Human Rights Plan: processes for modifying rights when necessary;", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.21(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.21(4)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.21 Human Rights Plan (4)", "text": "Human Rights Plan: processes to review supports that have high risk for rights violations;", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.21(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.21(5)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.21 Human Rights Plan (5)", "text": "responsibilities of the Contractor's human rights committee, which include the review of rights issues related to the services and supports the Contractor provides, and recommendations to the Person and the Person's team regarding the Person's human rights. The Contractor's human rights committee shall maintain minutes of its proceedings, and shall disclose those minutes to any state or federal auditor, reviewer, or DHHS representative within 24 hours of request;", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.21(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.21(6)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.21 Human Rights Plan (6)", "text": "Human Rights Plan: provisions for all Persons served by the Contractor to have the right to request a review by the Contractor's Human Rights Committee concerning supports or services to the Person; and", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.21(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.21(7)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.21 Human Rights Plan (7)", "text": "Human Rights Plan: provisions to ensure that the Contractor will support any court ordered human rights modification without violating any other of the Person's human rights unless authorized by the Contractor's Human Rights Committee.", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.21(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.22", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.22 Person's Discharge Procedure", "text": "Person's Discharge Procedure. (a) When a Person is discharged from services with the Contractor, the Contractor shall submit to the Person's Support Coordinator a discharge summary that includes:", "category": "reporting", "applies_to": "service_record", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.22", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.22(1)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.22 Person's Discharge Procedure (1)", "text": "Person's Discharge Procedure.: discharge reason;", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.22(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.22(2)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.22 Person's Discharge Procedure (2)", "text": "Person's Discharge Procedure.: summary of services provided;", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.22(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.22(3)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.22 Person's Discharge Procedure (3)", "text": "Person's Discharge Procedure.: the name of and title of the Staff preparing the summary;", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.22(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.22(4)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.22 Person's Discharge Procedure (4)", "text": "Person's Discharge Procedure.: any obligations the Person may have for liabilities to the Contractor;", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.22(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.22(5)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.22 Person's Discharge Procedure (5)", "text": "Person's Discharge Procedure.: an inventory of any medications being sent with the Person; and", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.22(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.22(6)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.22 Person's Discharge Procedure (6)", "text": "if the Contractor is also the Person's social security representative payee or provides Personal Budget Assistance service, an accounting of the Person's personal finances, including their most recent account reconciliations, outstanding balances owed, funds remaining, and benefit information including items as social security, and Supplemental Nutrition Assistance Program (\"SNAP\"). (b) If the Person is receiving Host Home Supports, Professional Parent Supports, Residential Habilitation Supports, or Supported Living Quarter- Hour service the following information about the Person must also be included in the discharge summary:", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.22(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.22(1)-2", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.22 Person's Discharge Procedure (1)", "text": "Person's Discharge Procedure.: a list of current medication and a plan to continue medications without interruption;", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.22(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.22(2)-2", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.22 Person's Discharge Procedure (2)", "text": "Person's Discharge Procedure.: any evident health and safety issues that led to the discharge or that were addressed while providing services;", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.22(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.22(3)-2", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.22 Person's Discharge Procedure (3)", "text": "Person's Discharge Procedure.: contact information for the behaviorist, social worker, therapist, psychiatrist and any clinician providing support;", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.22(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.22(4)-2", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.22 Person's Discharge Procedure (4)", "text": "Person's Discharge Procedure.: contact information for all current health care providers including primary care, neurologist, and dentist;", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.22(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.22(5)-2", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.22 Person's Discharge Procedure (5)", "text": "Person's Discharge Procedure.: any food or drug allergies;", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.22(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.22(6)-2", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.22 Person's Discharge Procedure (6)", "text": "Staff ratios, including preference regarding when the Person feels they need the most support;", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.22(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.22(7)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.22 Person's Discharge Procedure (7)", "text": "Person's Discharge Procedure.: preferred activities and support needs;", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.22(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.22(8)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.22 Person's Discharge Procedure (8)", "text": "Person's Discharge Procedure.: preferred living location, living environment, roommates (if any) and information regarding housing voucher programs, if applicable;", "category": "client", "applies_to": "client", "codes": [], "creates_user_task": "yes", "source": "DHHS91172 SOW §1.22(8)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-1.22(9)", "section": "Article 1 — General Administrative Requirements", "subsection": "§1.22 Person's Discharge Procedure (9)", "text": "Person's Discharge Procedure.: an inventory of the Person's personal belongings, including such items as their birth certificate, and social security card; and", "category": "client", "applie
