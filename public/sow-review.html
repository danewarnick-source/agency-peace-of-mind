        <input id="otherCodes" type="text" inputmode="text" placeholder="Free text, e.g. custom code" value="${escapeAttr(m.other_codes)}" />

        <label class="field" for="extra_facts_needed">Extra facts needed</label>
        <textarea id="extra_facts_needed" placeholder="What is still unknown?">${escapeHtml(m.extra_facts_needed)}</textarea>

        <label class="field" for="notes">Notes</label>
        <textarea id="notes">${escapeHtml(m.notes)}</textarea>

        <label class="field" for="dane_notes">Dane notes</label>
        <textarea id="dane_notes">${escapeHtml(m.dane_notes)}</textarea>
      </article>
    `;
    host.querySelectorAll("select, textarea, input").forEach((el) => {
      el.addEventListener("change", persist);
      el.addEventListener("blur", persist);
    });
    try {
      localStorage.setItem(UI_KEY, JSON.stringify({ filter: state.filter, lastId: clause.id }));
    } catch { /* ignore */ }
  }

  function escapeHtml(s) {
    return String(s ?? "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function escapeAttr(s) {
    return escapeHtml(s).replace(/"/g, "&quot;");
  }

  function csvEscape(v) {
    const s = String(v ?? "");
    if (/[",\n]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
    return s;
  }

  function exportCsv() {
    persist();
    const all = store.read();
    const lines = [CSV_COLS.join(",")];
    for (const c of CLAUSES) {
      const s = all[c.id] || {};
      const row = {
        clause_id: c.id,
        sow_version: c.sow_version,
        effective_date: c.effective_date,
        section: c.section,
        subsection: c.subsection,
        clause_text: c.text,
        category: s.category || c.category,
        service_codes: s.service_codes || c.codes.join(","),
        applies_to: s.applies_to || c.applies_to,
        extra_facts_needed: s.extra_facts_needed || "",
        creates_user_task: s.creates_user_task || c.creates_user_task,
        notes: s.notes || "",
        source_page_or_anchor: c.source,
        review_status: s.review_status || "draft_ai",
        dane_override_category: s.dane_override_category || "",
        dane_notes: s.dane_notes || "",
      };
      lines.push(CSV_COLS.map((k) => csvEscape(row[k])).join(","));
    }
    const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "dhhs91172-sow-review.csv";
    a.click();
    URL.revokeObjectURL(a.href);
  }

  document.getElementById("prevBtn").addEventListener("click", () => {
    persist();
    state.index -= 1;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  document.getElementById("nextBtn").addEventListener("click", () => {
    persist();
    state.index += 1;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  document.getElementById("filterStatus").addEventListener("change", (e) => {
    persist();
    state.filter = e.target.value;
    state.index = 0;
    render();
  });
  document.getElementById("exportCsv").addEventListener("click", exportCsv);
  document.getElementById("nextOpen").addEventListener("click", () => {
    persist();
    const start = state.filter;
    const list = currentList();
    for (let i = 1; i <= list.length; i++) {
      const idx = (state.index + i) % list.length;
      const st = reviewedStatus(list[idx].id);
      if (!store.get(list[idx].id).review_status || st === "draft_ai") {
        state.index = idx;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
        return;
      }
    }
    alert("No unreviewed clauses in this filter.");
    void start;
  });

  document.getElementById("filterStatus").value = state.filter;
  document.getElementById("jumpBox").addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    persist();
    const q = e.target.value.trim();
    const list = currentList();
    if (/^\d+$/.test(q)) {
      const n = Number(q);
      if (n >= 1 && n <= list.length) state.index = n - 1;
    } else {
      const hit = list.findIndex((c) => c.id === q || c.id.includes(q) || c.subsection.toLowerCase().includes(q.toLowerCase()));
      if (hit >= 0) state.index = hit;
    }
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  let touchX = null;
  document.addEventListener("touchstart", (e) => { touchX = e.changedTouches[0].screenX; }, { passive: true });
  document.addEventListener("touchend", (e) => {
    if (touchX == null) return;
    const dx = e.changedTouches[0].screenX - touchX;
    touchX = null;
    if (Math.abs(dx) < 70) return;
    const t = e.target;
    if (t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT" || t.tagName === "SELECT")) return;
    persist();
    const list = currentList();
    if (dx < 0 && state.index < list.length - 1) state.index += 1;
    if (dx > 0 && state.index > 0) state.index -= 1;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }, { passive: true });
  document.addEventListener("visibilitychange", () => { if (document.hidden) persist(); });
  try {
    const ui = JSON.parse(localStorage.getItem(UI_KEY) || "{}");
    if (ui.lastId) {
      const list = currentList();
      const idx = list.findIndex((c) => c.id === ui.lastId);
      if (idx >= 0) state.index = idx;
    }
  } catch { /* ignore */ }
  render();
  </script>
</body>
</html>
