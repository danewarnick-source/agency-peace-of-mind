he Contractor shall:", "category": "documentation", "applies_to": "agency", "codes": ["ELS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §10.3", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-10.3(1)", "section": "Article 10 — Extended Living Supports", "subsection": "§10.3 Direct Service Administrative Requirements (1)", "text": "Direct Service Administrative Requirements: ensure for each ELS site, there is a Staff who is responsible for the day to day operations.;", "category": "documentation", "applies_to": "agency", "codes": ["ELS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §10.3(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-10.3(2)", "section": "Article 10 — Extended Living Supports", "subsection": "§10.3 Direct Service Administrative Requirements (2)", "text": "Direct Service Administrative Requirements: provide ELS to the Person only when the Person does not attend their normal day activities; and", "category": "documentation", "applies_to": "agency", "codes": ["ELS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §10.3(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-10.3(3)", "section": "Article 10 — Extended Living Supports", "subsection": "§10.3 Direct Service Administrative Requirements (3)", "text": "Direct Service Administrative Requirements: for school age individuals, only use ELS in temporary situations. For ongoing support during traditional school hours documentation from the school district that supports shortened school hours (including a copy of the Individualized Education Plan) will be required.", "category": "documentation", "applies_to": "agency", "codes": ["ELS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §10.3(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-10.4", "section": "Article 10 — Extended Living Supports", "subsection": "§10.4 Specific Service Limitations", "text": "Specific Service Limitations. In addition to the General Limitations section of this contract, the Contractor shall NOT:", "category": "exception", "applies_to": "agency", "codes": ["ELS"], "creates_user_task": "no", "source": "DHHS91172 SOW §10.4", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-10.4(1)", "section": "Article 10 — Extended Living Supports", "subsection": "§10.4 Specific Service Limitations (1)", "text": "bill ELS if the Person does not have a day service program or other day supports. If the Person requires 24-hour supervision from the Contractor, the Contractor shall provide and bill for 24-hour HHS, PPS, or RHS. If the Person's health and safety needs are met, a Person is not required to have 24 hour Staffing;", "category": "exception", "applies_to": "agency", "codes": ["ELS", "HHS", "PPS", "RHS"], "creates_user_task": "no", "source": "DHHS91172 SOW §10.4(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-10.4(2)", "section": "Article 10 — Extended Living Supports", "subsection": "§10.4 Specific Service Limitations (2)", "text": "Specific Service Limitations: bill ELS until all the absence days included in the residential service worksheet have been exhausted;", "category": "exception", "applies_to": "agency", "codes": ["ELS"], "creates_user_task": "no", "source": "DHHS91172 SOW §10.4(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-10.4(3)", "section": "Article 10 — Extended Living Supports", "subsection": "§10.4 Specific Service Limitations (3)", "text": "bill DSPD for more than 260 days of ELS in a Person's PCSP year. If ELS is needed on a regular basis other services must be used; and", "category": "exception", "applies_to": "agency", "codes": ["ELS"], "creates_user_task": "no", "source": "DHHS91172 SOW §10.4(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-10.4(4)", "section": "Article 10 — Extended Living Supports", "subsection": "§10.4 Specific Service Limitations (4)", "text": "Specific Service Limitations: allow the HHS or PPS Staff to deliver ELS unless the Contractor has documentation of the following:", "category": "exception", "applies_to": "agency", "codes": ["ELS", "HHS", "PPS"], "creates_user_task": "no", "source": "DHHS91172 SOW §10.4(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-10.4(4)(A)", "section": "Article 10 — Extended Living Supports", "subsection": "§10.4 Specific Service Limitations (4)(A)", "text": "Specific Service Limitations: the HHS or PPS Staff is willing to deliver ELS;", "category": "exception", "applies_to": "agency", "codes": ["ELS", "HHS", "PPS"], "creates_user_task": "no", "source": "DHHS91172 SOW §10.4(4)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-10.4(4)(B)", "section": "Article 10 — Extended Living Supports", "subsection": "§10.4 Specific Service Limitations (4)(B)", "text": "Specific Service Limitations: the Person (or guardian, if applicable) is choosing the HHS or PPS Staff to deliver ELS;", "category": "exception", "applies_to": "agency", "codes": ["ELS", "HHS", "PPS"], "creates_user_task": "no", "source": "DHHS91172 SOW §10.4(4)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-10.4(4)(C)", "section": "Article 10 — Extended Living Supports", "subsection": "§10.4 Specific Service Limitations (4)(C)", "text": "Specific Service Limitations: the HHS or PPS Staff has the capacity to deliver ELS; and", "category": "exception", "applies_to": "agency", "codes": ["ELS", "HHS", "PPS"], "creates_user_task": "no", "source": "DHHS91172 SOW §10.4(4)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-10.4(4)(D)", "section": "Article 10 — Extended Living Supports", "subsection": "§10.4 Specific Service Limitations (4)(D)", "text": "Specific Service Limitations: it is in the best interest of the Person to receive ELS from the HHS or PPS Staff.", "category": "exception", "applies_to": "agency", "codes": ["ELS", "HHS", "PPS"], "creates_user_task": "no", "source": "DHHS91172 SOW §10.4(4)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-10.5", "section": "Article 10 — Extended Living Supports", "subsection": "§10.5 Specific Contractor Qualifications", "text": "Specific Contractor Qualifications. The Contractor shall have at least one of the following service codes awarded: RHS, PPS, or HHS.", "category": "agency_qualification", "applies_to": "agency", "codes": ["HHS", "PPS", "RHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §10.5", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-10.6", "section": "Article 10 — Extended Living Supports", "subsection": "§10.6 Outcomes", "text": "Outcomes. (a) The intended outcome of this service is to ensure the health and safety of Persons when they can not attend their typical day activity. (b) Measures:", "category": "outcome", "applies_to": "agency", "codes": ["ELS"], "creates_user_task": "no", "source": "DHHS91172 SOW §10.6", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-10.6(1)", "section": "Article 10 — Extended Living Supports", "subsection": "§10.6 Outcomes (1)", "text": "Outcomes.: the percentage of times that a Person who needed ELS was able to receive the service; and", "category": "outcome", "applies_to": "agency", "codes": ["ELS"], "creates_user_task": "no", "source": "DHHS91172 SOW §10.6(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-10.6(2)", "section": "Article 10 — Extended Living Supports", "subsection": "§10.6 Outcomes (2)", "text": "the percentage of incident reports during the provision of ELS. (c) Reporting: The Contractor shall create a fiscal year annual report starting fiscal year 2025 (fiscal year 2025 starts July 1, 2024). The fiscal year annual report will be submitted via Google Form by August 30th, 60 days after each fiscal year end. The outcome Google Form will be posted on the DSPD webpage. The Contractor shall explain any quality improvement activities they will undertake in response to their evaluation of the measurement data. The fiscal year annual report must include the following:", "category": "outcome", "applies_to": "agency", "codes": ["ELS"], "creates_user_task": "no", "source": "DHHS91172 SOW §10.6(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-10.6(1)-2", "section": "Article 10 — Extended Living Supports", "subsection": "§10.6 Outcomes (1)", "text": "Outcomes.: how many Persons received ELS; and", "category": "outcome", "applies_to": "agency", "codes": ["ELS"], "creates_user_task": "no", "source": "DHHS91172 SOW §10.6(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-10.6(2)-2", "section": "Article 10 — Extended Living Supports", "subsection": "§10.6 Outcomes (2)", "text": "Outcomes.: data reflecting the measures in (b) above.", "category": "outcome", "applies_to": "agency", "codes": ["ELS"], "creates_user_task": "no", "source": "DHHS91172 SOW §10.6(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-10.7", "section": "Article 10 — Extended Living Supports", "subsection": "§10.7 Rate", "text": "Rate. ELS is a quarter hour rate and has a maximum of 24 units (6 hours) a day.", "category": "billing", "applies_to": "service_record", "codes": ["ELS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §10.7", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.1", "section": "Article 11 — Host Home Supports", "subsection": "§11.1 General Description", "text": "General Description. HHS provides a community integrated shared living setting with a host family providing support and services to adult Persons in a certified private home. The HHS setting is intended to be the Person's long term primary residence. HHS can include up to 24-hour Direct Support . Generally, however, HHS is provided for 18 hours on days when a Person is in school, work, or participating in daytime supports, and for up to 24 hours on holidays and weekends. Subcontracting is allowed under this service code.", "category": "definition", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "no", "source": "DHHS91172 SOW §11.1", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.2", "section": "Article 11 — Host Home Supports", "subsection": "§11.2 Direct Service Requirements", "text": "Direct Service Requirements. The Contractor shall:", "category": "actionable", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.2", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.2(1)", "section": "Article 11 — Host Home Supports", "subsection": "§11.2 Direct Service Requirements (1)", "text": "Direct Service Requirements: provide HHS only to Persons who are 18 years of age or older;", "category": "actionable", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.2(2)", "section": "Article 11 — Host Home Supports", "subsection": "§11.2 Direct Service Requirements (2)", "text": "Direct Service Requirements: supervise the Person;", "category": "actionable", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.2(3)", "section": "Article 11 — Host Home Supports", "subsection": "§11.2 Direct Service Requirements (3)", "text": "Direct Service Requirements: provide support to the Person aimed at achieving the Person's goals as determined by the Person's PCSP;", "category": "client", "applies_to": "client", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.2(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.2(4)", "section": "Article 11 — Host Home Supports", "subsection": "§11.2 Direct Service Requirements (4)", "text": "Direct Service Requirements: assist the Person with ADL;", "category": "actionable", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.2(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.2(5)", "section": "Article 11 — Host Home Supports", "subsection": "§11.2 Direct Service Requirements (5)", "text": "Direct Service Requirements: assist the Person with acquiring, retaining, and improving skills related to living as independently as possible, participating in community settings of their choice, and avoiding isolation in their home and community;", "category": "actionable", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.2(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.2(6)", "section": "Article 11 — Host Home Supports", "subsection": "§11.2 Direct Service Requirements (6)", "text": "Direct Service Requirements: assist the Person with accessing community services and obtaining assistance from community and government organizations;", "category": "actionable", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.2(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.2(7)", "section": "Article 11 — Host Home Supports", "subsection": "§11.2 Direct Service Requirements (7)", "text": "Direct Service Requirements: assist the Person with completing any Medicaid eligibility review documents, and ensure they are submitted timely; and", "category": "actionable", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.2(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.2(8)", "section": "Article 11 — Host Home Supports", "subsection": "§11.2 Direct Service Requirements (8)", "text": "Direct Service Requirements: provide transportation for the Person.", "category": "actionable", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.2(8)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements", "text": "Direct Service Administrative Requirements. The Contractor shall:", "category": "documentation", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(1)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (1)", "text": "Direct Service Administrative Requirements: prior to providing services, individuals who are 12 or older who have resided in the HHS home for any cumulative thirty day period of the past 12 months comply with the background screening requirements in Utah Code §26B-2-120 and Utah Administrative Code R501-14;", "category": "staff_qualification", "applies_to": "staff", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(2)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (2)", "text": "Direct Service Administrative Requirements: ensure the HHS home:", "category": "documentation", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(2)(A)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (2)(A)", "text": "Direct Service Administrative Requirements: is integrated in the community and supports the Person having access to the community;", "category": "documentation", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(2)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(2)(B)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (2)(B)", "text": "Direct Service Administrative Requirements: is physically accessible for the Person;", "category": "documentation", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(2)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(2)(C)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (2)(C)", "text": "Direct Service Administrative Requirements: optimizes autonomy and independence for the Person in making life choices and enables the Person to have control of their own schedule, including access to food and visitors;", "category": "documentation", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(2)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(2)(D)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (2)(D)", "text": "Direct Service Administrative Requirements: allows the Person to decorate their personal space;", "category": "documentation", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(2)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(2)(E)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (2)(E)", "text": "Direct Service Administrative Requirements: allows the Person to have privacy, dignity, respect;", "category": "documentation", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(2)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(2)(F)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (2)(F)", "text": "Direct Service Administrative Requirements: ensures the Person has freedom from coercion and restraint; and", "category": "documentation", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(2)(F)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(2)(G)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (2)(G)", "text": "Direct Service Administrative Requirements: is selected by the Person after all residential setting options are offered.", "category": "documentation", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(2)(G)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(3)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (3)", "text": "provide Direct Support and respite for the Person and support to, and supervision of, the HHS family by Staff that is not the HHS Staff. The required Direct Support hours are determined by the Person's PCPT. The HHS DSPD Worksheet will contain the number of Direct Support hours required to be provided, as per the PCPT. The Contractor shall document Direct Support hours, and respite provided to the Person;", "category": "documentation", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(4)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (4)", "text": "Direct Service Administrative Requirements: provide supervision, training, technical assistance, and other needed support to the HHS family, including on-call after-hours support;", "category": "staff_qualification", "applies_to": "staff", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(5)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (5)", "text": "create an inventory of the Person's belongings. The inventory must be maintained in the Person's file and include written documentation of the following:", "category": "client", "applies_to": "client", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(5)(A)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (5)(A)", "text": "Direct Service Administrative Requirements: the inventory completion date and the Staff's name that completed the inventory;", "category": "documentation", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(5)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(5)(B)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (5)(B)", "text": "Direct Service Administrative Requirements: belongings that have significant value to the Person;", "category": "client", "applies_to": "client", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(5)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(5)(C)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (5)(C)", "text": "Direct Service Administrative Requirements: belongings with a purchase value of $50.00 or more;", "category": "client", "applies_to": "client", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(5)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(5)(D)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (5)(D)", "text": "Direct Service Administrative Requirements: all new items added as received by the Person that have significant value to the Person or with a purchase value of $50.00 or more; and", "category": "documentation", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(5)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(5)(E)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (5)(E)", "text": "discarded items must be removed, including the reason for discard and signature from the Person or their legal guardian.", "category": "documentation", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(5)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(6)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (6)", "text": "Direct Service Administrative Requirements: ensure that quarterly evacuation drills with Persons and Staff at each site HHS are conducted and documented;", "category": "site", "applies_to": "site", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(7)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (7)", "text": "Direct Service Administrative Requirements: provide services to only one Person per home, except in the scenarios listed below. The Contractor may provide HHS:", "category": "documentation", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(7)(A)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (7)(A)", "text": "Direct Service Administrative Requirements: to up to three Persons in the same home when the Persons are Immediate Relatives;", "category": "documentation", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(7)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(7)(B)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (7)(B)", "text": "Direct Service Administrative Requirements: to two Persons in the same home when the Persons are not Immediate Relatives after:", "category": "documentation", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(7)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(7)(B)(i)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (7)(B)(i)", "text": "Direct Service Administrative Requirements: assessing the appropriateness of the fit between the two Persons, particularly regarding the safety of the two Persons; and", "category": "documentation", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(7)(B)(i)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(7)(B)(ii)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (7)(B)(ii)", "text": "Direct Service Administrative Requirements: receiving written approval from each Person's Support Coordinator and parent/guardian, if applicable.", "category": "documentation", "applies_to": "client", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(7)(B)(ii)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(7)(C)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (7)(C)", "text": "to three Persons in the same home who are not Immediate Relatives and were approved to receive HHS in the same home prior to July 1, 2023 (during the contracting period of the solicitation DHS90743). If one of the Persons moves out of the home, the Contractor shall not replace that Person with a new third Person who is not an Immediate Relative; and", "category": "exception", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "no", "source": "DHHS91172 SOW §11.3(7)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(7)(D)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (7)(D)", "text": "Direct Service Administrative Requirements: when the Contractor is providing respite to Persons who are NOT receiving HHS from their own HHS family in their own HHS home, and when the following conditions are met:", "category": "documentation", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(7)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(7)(D)(i)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (7)(D)(i)", "text": "Direct Service Administrative Requirements: the Contractor has obtained written approval that another Person may receive respite in their own HHS home from the Persons, their guardians (if applicable), and their Support Coordinators;", "category": "documentation", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(7)(D)(i)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(7)(D)(ii)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (7)(D)(ii)", "text": "Direct Service Administrative Requirements: the Contractor has obtained written approval from the Persons who will be receiving respite in a different HHS home, their guardians (if applicable), and their Support Coordinators;", "category": "documentation", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(7)(D)(ii)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(7)(D)(iii)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (7)(D)(iii)", "text": "Direct Service Administrative Requirements: the Contractor has obtained written documentation that included an assessment of the capacity of the HHS Staff to provide respite to Persons in their HHS home to ensure the prevention of burnout and assure the needs of the existing Persons receiving HHS and the Persons receiving respite can be met;", "category": "documentation", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(7)(D)(iii)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(7)(D)(iv)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (7)(D)(iv)", "text": "Direct Service Administrative Requirements: the respite does not exceed 14 consecutive days;", "category": "documentation", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(7)(D)(iv)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(7)(D)(v)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (7)(D)(v)", "text": "Direct Service Administrative Requirements: respite does not exceed 21 days per Plan Year for all Persons living in the home; and", "category": "documentation", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(7)(D)(v)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(7)(D)(vi)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (7)(D)(vi)", "text": "all written documentation requirements outlined above must be obtained prior to delivering respite when planned, or within 72 hours of delivering respite when unplanned in an emergency situation.", "category": "documentation", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(7)(D)(vi)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(8)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (8)", "text": "when a HHS Staff is transitioning employment from one DSPD Contractor to another DSPD Contractor, both Contractors shall notify the Support Coordinator of the Person who is receiving HHS from the transitioning HHS home that there is a potential change in the contracted provider. Both Contractors must allow the Support Coordinator to ensure the Person is making an Informed Choice about the Contractor the Person wants to receive services from, prior to any change happening. Neither of the Contractors shall attempt to influence the Person's choice;", "category": "reporting", "applies_to": "service_record", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(8)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(9)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (9)", "text": ", "source": "DHHS91172 SOW §11.3(11)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(11)(B)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (11)(B)", "text": "Direct Service Administrative Requirements: the date the service was delivered;", "category": "documentation", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(11)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(11)(C)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (11)(C)", "text": "Direct Service Administrative Requirements: the start and end time the service was delivered ;", "category": "documentation", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(11)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(11)(D)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (11)(D)", "text": "Direct Service Administrative Requirements: the name of the DHHS service code delivered (Direct Support for the HHS Staff);", "category": "documentation", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(11)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(11)(E)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (11)(E)", "text": "Direct Service Administrative Requirements: the name of the Staff providing the service; and", "category": "documentation", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(11)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.3(11)(F)", "section": "Article 11 — Host Home Supports", "subsection": "§11.3 Direct Service Administrative Requirements (11)(F)", "text": "Direct Service Administrative Requirements: a written summary note of substantive service activities consistent with the individual service description.", "category": "documentation", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.3(11)(F)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.4", "section": "Article 11 — Host Home Supports", "subsection": "§11.4 Specific Service Limitations", "text": "Specific Service Limitations. In addition to the General Limitations section of this contract, the Contractor shall NOT:", "category": "exception", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "no", "source": "DHHS91172 SOW §11.4", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.4(1)", "section": "Article 11 — Host Home Supports", "subsection": "§11.4 Specific Service Limitations (1)", "text": "Specific Service Limitations: allow hosts or a host family member to act as a conservator or representative payee under the approval of the SSA for the Person;", "category": "exception", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "no", "source": "DHHS91172 SOW §11.4(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.4(2)", "section": "Article 11 — Host Home Supports", "subsection": "§11.4 Specific Service Limitations (2)", "text": "Specific Service Limitations: have custody or guardianship of the Person or allow hosts or a host family member to have custody or guardianship of the Person;", "category": "exception", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "no", "source": "DHHS91172 SOW §11.4(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.4(3)", "section": "Article 11 — Host Home Supports", "subsection": "§11.4 Specific Service Limitations (3)", "text": "Specific Service Limitations: provide services to the Person in the home of an Immediate Relative or legal guardian of the Person;", "category": "exception", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "no", "source": "DHHS91172 SOW §11.4(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.4(4)", "section": "Article 11 — Host Home Supports", "subsection": "§11.4 Specific Service Limitations (4)", "text": "Specific Service Limitations: provide HHS and PPS to separate Persons in the same home at the same time unless the Persons are Immediate Relatives;", "category": "exception", "applies_to": "agency", "codes": ["HHS", "PPS"], "creates_user_task": "no", "source": "DHHS91172 SOW §11.4(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.4(5)", "section": "Article 11 — Host Home Supports", "subsection": "§11.4 Specific Service Limitations (5)", "text": "Specific Service Limitations: bill DSPD for Family and Individual Training and Preparation Services (\"TFB\") unless an exceptional care need exists, and it has been approved by the DSPD Director or designee in writing prior to providing TFB;", "category": "exception", "applies_to": "agency", "codes": ["TFB"], "creates_user_task": "no", "source": "DHHS91172 SOW §11.4(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.4(6)", "section": "Article 11 — Host Home Supports", "subsection": "§11.4 Specific Service Limitations (6)", "text": "be the HHS family. However, if the Contractor is the Person's HHS family pursuant to a previous contract, the Contractor may continue to be the Person's HHS family. The Contractor shall not be any other Person's HHS family. The Contractor shall obtain approval by the DSPD director for any exceptions to this limitation;", "category": "exception", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "no", "source": "DHHS91172 SOW §11.4(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.4(7)", "section": "Article 11 — Host Home Supports", "subsection": "§11.4 Specific Service Limitations (7)", "text": "Specific Service Limitations: provide HHS as respite care;", "category": "exception", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "no", "source": "DHHS91172 SOW §11.4(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.4(8)", "section": "Article 11 — Host Home Supports", "subsection": "§11.4 Specific Service Limitations (8)", "text": "Specific Service Limitations: bill DHHS/DSPD for both HHS days when the Person hasn't stayed overnight under the HHS family or Contractor's Staff's; and", "category": "exception", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "no", "source": "DHHS91172 SOW §11.4(8)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.4(9)", "section": "Article 11 — Host Home Supports", "subsection": "§11.4 Specific Service Limitations (9)", "text": "Specific Service Limitations: provide respite for a Person in an HHS setting different from their own HHS home for more than 20 days per Plan Year.", "category": "exception", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "no", "source": "DHHS91172 SOW §11.4(9)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.5", "section": "Article 11 — Host Home Supports", "subsection": "§11.5 Specific Contractor Qualifications", "text": "Specific Contractor Qualifications. Prior to providing HHS, conduct an initial, and annually thereafter, inspection and certification of each home in which HHS is provided to ensure the home is safe and meets the Person's needs as outlined in the Person's PCSP. The Contractor shall use the \"DSPD Host Home Certification\" form published on the DSPD website or their own certification tool that includes at least all the elements in the \"DSPD Host Home Certification\" form. The Contractor shall maintain certification documentation of each HHS site.", "category": "staff_qualification", "applies_to": "staff", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.5", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.6", "section": "Article 11 — Host Home Supports", "subsection": "§11.6 Specific Staff Qualifications", "text": "Specific Staff Qualifications. The Contractor shall ensure the hosts are at least 21 years of age.", "category": "staff_qualification", "applies_to": "staff", "codes": ["HHS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §11.6", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.7", "section": "Article 11 — Host Home Supports", "subsection": "§11.7 Outcomes", "text": "Outcomes. (a) The intended outcome of this service is a stable living environment that is integrated into the community, promotes Persons goals and community integration. (b) Measures: The percentage of Persons who remained in their community-based living setting. (c) Reporting: The Contractor shall create a fiscal year annual report starting fiscal year 2025 (fiscal year 2025 starts July 1, 2024). The fiscal year annual report will be submitted via Google Form by August 30th, 60 days after each fiscal year end. The outcome Google Form will be posted on the DSPD webpage. The Contractor shall explain any quality improvement activities they will undertake in response to their evaluation of the measurement data. The fiscal year annual report must include the following:", "category": "outcome", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "no", "source": "DHHS91172 SOW §11.7", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.7(1)", "section": "Article 11 — Host Home Supports", "subsection": "§11.7 Outcomes (1)", "text": "Outcomes.: how many Persons received HHS; and", "category": "outcome", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "no", "source": "DHHS91172 SOW §11.7(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-11.7(2)", "section": "Article 11 — Host Home Supports", "subsection": "§11.7 Outcomes (2)", "text": "Outcomes.: data reflecting the measure in (b) above.", "category": "outcome", "applies_to": "agency", "codes": ["HHS"], "creates_user_task": "no", "source": "DHHS91172 SOW §11.7(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-12.1", "section": "Article 12 — Homemaker And Chore", "subsection": "§12.1 General Description", "text": "General Description. HSQ provides assistance with household duties to help maintain a Person's home in a clean and safe environment.", "category": "definition", "applies_to": "agency", "codes": ["HSQ"], "creates_user_task": "no", "source": "DHHS91172 SOW §12.1", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-12.2", "section": "Article 12 — Homemaker And Chore", "subsection": "§12.2 Direct Service Requirements", "text": "Direct Service Requirements. The Contractor shall provide:", "category": "actionable", "applies_to": "agency", "codes": ["HSQ"], "creates_user_task": "yes", "source": "DHHS91172 SOW §12.2", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-12.2(1)", "section": "Article 12 — Homemaker And Chore", "subsection": "§12.2 Direct Service Requirements (1)", "text": "Direct Service Requirements: services to Persons who are unable to complete household duties on their own, and for whom there are no natural supports available to, capable of, or responsible for providing such services, or when the individual regularly responsible for such duties is temporarily absent or is no longer able to perform them as determined by the Person's PCPT; and", "category": "actionable", "applies_to": "agency", "codes": ["HSQ"], "creates_user_task": "yes", "source": "DHHS91172 SOW §12.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-12.2(2)", "section": "Article 12 — Homemaker And Chore", "subsection": "§12.2 Direct Service Requirements (2)", "text": "HSQ including the following: (A) meal preparation; (B) cleaning; (C) laundry; (D) heavy household chores; (E) snow removal; (F) lawn care; (G) securing loose rugs and tiles; (H) moving heavy furniture to provide safe access; and (I) other comparable duties.", "category": "actionable", "applies_to": "agency", "codes": ["HSQ"], "creates_user_task": "yes", "source": "DHHS91172 SOW §12.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-12.3", "section": "Article 12 — Homemaker And Chore", "subsection": "§12.3 Specific Service Limitations", "text": "Specific Service Limitations. In addition to the General Limitations section of this contract, the Contractor shall NOT provide HSQ:", "category": "exception", "applies_to": "agency", "codes": ["HSQ"], "creates_user_task": "no", "source": "DHHS91172 SOW §12.3", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-12.3(1)", "section": "Article 12 — Homemaker And Chore", "subsection": "§12.3 Specific Service Limitations (1)", "text": "Specific Service Limitations: as skills training services for the Person;", "category": "exception", "applies_to": "agency", "codes": ["HSQ"], "creates_user_task": "no", "source": "DHHS91172 SOW §12.3(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-12.3(3)", "section": "Article 12 — Homemaker And Chore", "subsection": "§12.3 Specific Service Limitations (3)", "text": "Specific Service Limitations: if the chore is the responsibility of someone else pursuant to a landlord lease agreement, homeowner's association agreement, or other agreement; and", "category": "exception", "applies_to": "agency", "codes": ["HSQ"], "creates_user_task": "no", "source": "DHHS91172 SOW §12.3(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-12.3(2)", "section": "Article 12 — Homemaker And Chore", "subsection": "§12.3 Specific Service Limitations (2)", "text": "Specific Service Limitations: for Persons who are clients of DCFS or DJJYS.", "category": "exception", "applies_to": "agency", "codes": ["HSQ"], "creates_user_task": "no", "source": "DHHS91172 SOW §12.3(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-12.4", "section": "Article 12 — Homemaker And Chore", "subsection": "§12.4 Specific Service Training Requirements", "text": "Specific Service Training Requirements. The Contractor shall ensure HSQ Staff are trained on maintaining a clean, sanitary, and safe living environment prior to providing HSQ services. The Contractor shall maintain documentation of HSQ training in the Staff's file.", "category": "staff_qualification", "applies_to": "staff", "codes": ["HSQ"], "creates_user_task": "yes", "source": "DHHS91172 SOW §12.4", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-12.5", "section": "Article 12 — Homemaker And Chore", "subsection": "§12.5 Outcomes", "text": "Outcomes. (a) The intended outcome of this service is Persons' homes are clean and safe. (b) Measures: The percentage of Persons satisfied with the completion of the HSQ tasks. (c) Reporting: The Contractor shall create a fiscal year annual report starting fiscal year 2025 (fiscal year 2025 starts July 1, 2024). The fiscal year annual report will be submitted via Google Form by August 30th, 60 days after each fiscal year end. The outcome Google Form will be posted on the DSPD webpage. The Contractor shall explain any quality improvement activities they will undertake in response to their evaluation of the measurement data. The fiscal year annual report must include the following:", "category": "outcome", "applies_to": "agency", "codes": ["HSQ"], "creates_user_task": "no", "source": "DHHS91172 SOW §12.5", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-12.5(1)", "section": "Article 12 — Homemaker And Chore", "subsection": "§12.5 Outcomes (1)", "text": "Ou "DHHS91172 SOW §14.2(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-14.2(5)", "section": "Article 14 — Personal Assistance Services", "subsection": "§14.2 Direct Service Requirements (5)", "text": "Direct Service Requirements: transportation for the Person.", "category": "actionable", "applies_to": "agency", "codes": ["PAC"], "creates_user_task": "yes", "source": "DHHS91172 SOW §14.2(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-14.3", "section": "Article 14 — Personal Assistance Services", "subsection": "§14.3 Direct Service Administrative Requirements", "text": "Direct Service Administrative Requirements. When providing PAC daily the Contractor shall maintain written billing service documentation that includes:", "category": "billing", "applies_to": "service_record", "codes": ["PAC"], "creates_user_task": "yes", "source": "DHHS91172 SOW §14.3", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-14.3(1)", "section": "Article 14 — Personal Assistance Services", "subsection": "§14.3 Direct Service Administrative Requirements (1)", "text": "Direct Service Administrative Requirements: the name of the Person receiving the service;", "category": "documentation", "applies_to": "agency", "codes": ["PAC"], "creates_user_task": "yes", "source": "DHHS91172 SOW §14.3(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-14.3(2)", "section": "Article 14 — Personal Assistance Services", "subsection": "§14.3 Direct Service Administrative Requirements (2)", "text": "Direct Service Administrative Requirements: the date the service was delivered;", "category": "documentation", "applies_to": "agency", "codes": ["PAC"], "creates_user_task": "yes", "source": "DHHS91172 SOW §14.3(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-14.3(3)", "section": "Article 14 — Personal Assistance Services", "subsection": "§14.3 Direct Service Administrative Requirements (3)", "text": "Direct Service Administrative Requirements: the name of the DHHS service code delivered (PAC Daily);", "category": "documentation", "applies_to": "agency", "codes": ["PAC"], "creates_user_task": "yes", "source": "DHHS91172 SOW §14.3(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-14.3(4)", "section": "Article 14 — Personal Assistance Services", "subsection": "§14.3 Direct Service Administrative Requirements (4)", "text": "Direct Service Administrative Requirements: the name of the Staff providing the service; and", "category": "documentation", "applies_to": "agency", "codes": ["PAC"], "creates_user_task": "yes", "source": "DHHS91172 SOW §14.3(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-14.3(5)", "section": "Article 14 — Personal Assistance Services", "subsection": "§14.3 Direct Service Administrative Requirements (5)", "text": "Direct Service Administrative Requirements: a written daily summary note of substantive service activities consistent with the service code description.", "category": "documentation", "applies_to": "agency", "codes": ["PAC"], "creates_user_task": "yes", "source": "DHHS91172 SOW §14.3(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-14.4", "section": "Article 14 — Personal Assistance Services", "subsection": "§14.4 Outcomes", "text": "Outcomes. (a) The intended outcome of this service is Persons are provided assistance with their ADL and access to their community (b) Measures: The percentage of Persons who remained living in a community based setting. (c) Reporting: The Contractor shall create a fiscal year annual report starting fiscal year 2025 (fiscal year 2025 starts July 1, 2024). The fiscal year annual report will be submitted via Google Form by August 30th, 60 days after each fiscal year end. The outcome Google Form will be posted on the DSPD webpage. The Contractor shall explain any quality improvement activities they will undertake in response to their evaluation of the measurement data. The fiscal year annual report must include the following:", "category": "outcome", "applies_to": "agency", "codes": ["PAC"], "creates_user_task": "no", "source": "DHHS91172 SOW §14.4", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-14.4(1)", "section": "Article 14 — Personal Assistance Services", "subsection": "§14.4 Outcomes (1)", "text": "Outcomes.: how many Persons received PAC; and", "category": "outcome", "applies_to": "agency", "codes": ["PAC"], "creates_user_task": "no", "source": "DHHS91172 SOW §14.4(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-14.4(2)", "section": "Article 14 — Personal Assistance Services", "subsection": "§14.4 Outcomes (2)", "text": "Outcomes.: data reflecting the measure in (b) above.", "category": "outcome", "applies_to": "agency", "codes": ["PAC"], "creates_user_task": "no", "source": "DHHS91172 SOW §14.4(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-14.5", "section": "Article 14 — Personal Assistance Services", "subsection": "§14.5 Rate", "text": "Rate. PAC is a quarter hour or daily one-to-one service. The Contractor shall bill for the daily rate if a Person requires more than eight hours of PAC services within a 24-hour day. Otherwise the Contractor shall bill the quarter hour rate.", "category": "billing", "applies_to": "service_record", "codes": ["PAC"], "creates_user_task": "yes", "source": "DHHS91172 SOW §14.5", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.1", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.1 General Description", "text": "General Description. PBA provides Persons support with personal financial matters.", "category": "definition", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "no", "source": "DHHS91172 SOW §15.1", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.2", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.2 Direct Service Requirements", "text": "Direct Service Requirements. The Contractor shall:", "category": "actionable", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "yes", "source": "DHHS91172 SOW §15.2", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.2(1)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.2 Direct Service Requirements (1)", "text": "Direct Service Requirements: serve as a fiduciary with responsibility for handling money on the Person's behalf, either as the Person's Representative Payee through the Social Security Administration, as a conservator, or the Person's voluntarily appointed personal funds manager;", "category": "actionable", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "yes", "source": "DHHS91172 SOW §15.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.2(2)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.2 Direct Service Requirements (2)", "text": "Direct Service Requirements: ensure Persons have access to and control over personal funds to the greatest extent possible based on the Person's need and per the PCSP;", "category": "client", "applies_to": "client", "codes": ["PBA"], "creates_user_task": "yes", "source": "DHHS91172 SOW §15.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.2(3)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.2 Direct Service Requirements (3)", "text": "Direct Service Requirements: manage the Person's major personal business affairs, including ensuring the Person's personal funds are used for the intended purpose. Major personal business affairs include the Person's personal funds, checking and savings accounts, filing and fiscal interaction on the Person's behalf, tax and fiscal record keeping, and other financial matters;", "category": "actionable", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "yes", "source": "DHHS91172 SOW §15.2(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.2(4)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.2 Direct Service Requirements (4)", "text": "Direct Service Requirements: ensure the Person's funds are first used to meet the Person's current needs, including food, shelter, clothing, and medical care. The Contractor may save funds for future use or use funds to repay prior debt only after current needs have been met;", "category": "actionable", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "yes", "source": "DHHS91172 SOW §15.2(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.2(5)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.2 Direct Service Requirements (5)", "text": "Direct Service Requirements: ensure that Medicaid spend downs for the Person are paid on time, if applicable, and provide necessary financial information for periodic Medicaid reviews and other benefits;", "category": "actionable", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "yes", "source": "DHHS91172 SOW §15.2(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.2(6)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.2 Direct Service Requirements (6)", "text": "monitor the Person's assets on at least a monthly basis to ensure that assets do not exceed asset limits. When funds are approaching asset limits, this information must be communicated to the Person, their residential provider, and Support Coordinator;", "category": "actionable", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "yes", "source": "DHHS91172 SOW §15.2(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.2(7)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.2 Direct Service Requirements (7)", "text": "Direct Service Requirements: if the Person's funds are used to purchase life insurance or a prepaid burial plan, ensure that the following conditions are met:", "category": "agency_qualification", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "yes", "source": "DHHS91172 SOW §15.2(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.2(7)(A)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.2 Direct Service Requirements (7)(A)", "text": "Direct Service Requirements: payments do not leave the Person unable to meet current needs;", "category": "actionable", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "yes", "source": "DHHS91172 SOW §15.2(7)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.2(7)(B)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.2 Direct Service Requirements (7)(B)", "text": "Direct Service Requirements: no conflict of interest exists, including that the Contractor or any of its Staff is not the beneficiary of a life insurance or burial plan; and", "category": "staff_qualification", "applies_to": "staff", "codes": ["PBA"], "creates_user_task": "yes", "source": "DHHS91172 SOW §15.2(7)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.2(7)(C)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.2 Direct Service Requirements (7)(C)", "text": "Direct Service Requirements: burial plans purchased clearly identify the Person as the policy owner.", "category": "actionable", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "yes", "source": "DHHS91172 SOW §15.2(7)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.2(8)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.2 Direct Service Requirements (8)", "text": "Direct Service Requirements: ensure the Person's funds are maintained in a separate account belonging to the Person, or a collective account containing funds from multiple Persons receiving services from the Contractor per SSA regulations;", "category": "actionable", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "yes", "source": "DHHS91172 SOW §15.2(8)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.2(9)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.2 Direct Service Requirements (9)", "text": "Direct Service Requirements: collaborate with the Person's Support Coordinator, legal guardian, and any DSPD contracted service provider who supports the Person with their personal spending to resolve any concerns, and provide documentation or access to documentation for review, clarification, and validation; and", "category": "documentation", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "yes", "source": "DHHS91172 SOW §15.2(9)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.2(10)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.2 Direct Service Requirements (10)", "text": "review the Person's financial records with the Person at least monthly. This review may be completed virtually. This review is separate from the administrative review. The Contractor shall review all deposits, expenditures, savings, and any other relevant information regarding the state of the Person's finances.", "category": "actionable", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "yes", "source": "DHHS91172 SOW §15.2(10)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.3", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.3 Direct Service Administrative Requirements", "text": "Direct Service Administrative Requirements. The Contractor shall:", "category": "documentation", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "yes", "source": "DHHS91172 SOW §15.3", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.3(1)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.3 Direct Service Administrative Requirements (1)", "text": "Direct Service Administrative Requirements: develop policies and procedures that ensure established practices do not jeopardize the Person's eligibility for services, that there are provisions for coordination and cooperation with an eligibility worker when necessary to assure services meet eligibility requirements, and there are provisions for lost receipts;", "category": "documentation", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "yes", "source": "DHHS91172 SOW §15.3(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.3(2)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.3 Direct Service Administrative Requirements (2)", "text": "Direct Service Administrative Requirements: ensure pay card systems used in PBA implementation are supervised by an accredited financial institution;", "category": "documentation", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "yes", "source": "DHHS91172 SOW §15.3(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.3(3)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.3 Direct Service Administrative Requirements (3)", "text": "Direct Service Administrative Requirements: ensure fees comply with the following conditions:", "category": "documentation", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "yes", "source": "DHHS91172 SOW §15.3(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.3(3)(A)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.3 Direct Service Administrative Requirements (3)(A)", "text": "the Person is responsible for standard banking fees. The Contractor shall have provisions to minimize the amount of fees;", "category": "documentation", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "yes", "source": "DHHS91172 SOW §15.3(3)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.3(3)(B)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.3 Direct Service Administrative Requirements (3)(B)", "text": "Direct Service Administrative Requirements: card fees are related to the Person's needs and are kept as minimal as possible; and", "category": "documentation", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "yes", "source": "DHHS91172 SOW §15.3(3)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.3(3)(C)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.3 Direct Service Administrative Requirements (3)(C)", "text": "when supporting the Person to pay their bills, pay bills on time. The Contractor shall be responsible to pay any late fees.", "category": "documentation", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "yes", "source": "DHHS91172 SOW §15.3(3)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.3(4)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.3 Direct Service Administrative Requirements (4)", "text": "Direct Service Administrative Requirements: be responsible to pay any insufficient funds fees if they have assumed the role of assuring the Person's funds are accounted for and balanced, unless the Person has stolen or misused their funds;", "category": "documentation", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "yes", "source": "DHHS91172 SOW §15.3(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.3(5)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.3 Direct Service Administrative Requirements (5)", "text": "Direct Service Administrative Requirements: be responsible to repay the Person's funds due to its misuse or neglect;", "category": "documentation", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "yes", "source": "DHHS91172 SOW §15.3(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.3(6)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.3 Direct Service Administrative Requirements (6)", "text": "maintain a current financial record for each Person and allow for an external review by authorized entities and validation of the financial records. Each Person must have a financial record that includes and clearly documents the following: deposits, withdraws and transfers; interest and debts; current account balances; reconciled financial statements; receipts or monthly bank statements to verify all expenditures; receipts for purchases over $50.00 or for multiple items purchased together with a value greater than $50.00; documentation of any items purchased by splitting the cost with any other Person; cash records; and any financial records pertaining to the Person;", "category": "documentation", "applies_to": "client", "codes": ["PBA"], "creates_user_task": "yes", "source": "DHHS91172 SOW §15.3(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.3(7)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.3 Direct Service Administrative Requirements (7)", "text": "ensure the Person's financial records are reviewed at least monthly by administrative Staff not authorized to make expenditures on the Person's behalf. Additionally, a 10% random sample of all Persons receiving PBA during the most recent quarter must be reviewed by a third person at least quarterly each year. Written documentation of all financial records reviews and the results must be kept in the Person's financial record. Copies of any reviews must be submitted to the Person's Support Coordinator as part of the Person's financial statement;", "category": "documentation", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "yes", "source": "DHHS91172 SOW §15.3(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.3(8)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.3 Direct Service Administrative Requirements (8)", "text": "Direct Service Administrative Requirements: provide the Person's Support Coordinator with the Person's financial report no later than 30 Calendar Days following the end of the month they are issued. If requested, provide the Person's guardian with the Person's financial report no later than 30 days following the request date;", "category": "documentation", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "yes", "source": "DHHS91172 SOW §15.3(8)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.3(9)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.3 Direct Service Administrative Requirements (9)", "text": "Direct Service Administrative Requirements: provide a complete, current accounting of the Person's funds to the new Contractor or Representative Payee if the Person changes contractors or selects a different Representative Payee. Ensure that all financial matters are resolved and all remaining funds and accounts are appropriately transferred or closed;", "category": "documentation", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "yes", "source": "DHHS91172 SOW §15.3(9)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.3(10)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.3 Direct Service Administrative Requirements (10)", "text": "Direct Service Administrative Requirements: upon a Person's death, return any unused Social Security funds to the SSA as required by policy. Transfer any remaining funds to the legal representative of the Person's estate, along with a complete and current accounting of the Person's financial status within 90 Calendar Days of death; and", "category": "documentation", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "yes", "source": "DHHS91172 SOW §15.3(10)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.3(11)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.3 Direct Service Administrative Requirements (11)", "text": "Direct Service Administrative Requirements: when providing PBA quarter hour or session, maintain written billing service documentation that verifies each element of the service being completed.", "category": "billing", "applies_to": "service_record", "codes": ["PBA"], "creates_user_task": "yes", "source": "DHHS91172 SOW §15.3(11)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.4", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.4 Specific Service Limitations", "text": "Specific Service Limitations. In addition to the General Limitations section of this contract, the Contractor shall NOT:", "category": "exception", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "no", "source": "DHHS91172 SOW §15.4", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.4(1)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.4 Specific Service Limitations (1)", "text": "Specific Service Limitations: provide PBA unless no other financially competent Natural Support adult is willing to accept representative or protective payee responsibilities;", "category": "exception", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "no", "source": "DHHS91172 SOW §15.4(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.4(2)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.4 Specific Service Limitations (2)", "text": "Specific Service Limitations: engage in any practices that may risk the Person's eligibility for services;", "category": "exception", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "no", "source": "DHHS91172 SOW §15.4(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.4(3)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.4 Specific Service Limitations (3)", "text": "Specific Service Limitations: utilize the Person's funds in any manner that is contrary to the best interest of the Person;", "category": "exception", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "no", "source": "DHHS91172 SOW §15.4(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.4(4)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.4 Specific Service Limitations (4)", "text": "Specific Service Limitations: alter any receipts;", "category": "exception", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "no", "source": "DHHS91172 SOW §15.4(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.4(5)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.4 Specific Service Limitations (5)", "text": "Specific Service Limitations: combine the Person's fund with the Contractor's or Staff's funds; and", "category": "exception", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "no", "source": "DHHS91172 SOW §15.4(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.4(6)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.4 Specific Service Limitations (6)", "text": "Specific Service Limitations: handle the Person's personal funds in a way that is harmful or embarrassing to the Person.", "category": "exception", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "no", "source": "DHHS91172 SOW §15.4(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.5", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.5 Outcomes", "text": "Outcomes. (a) The intended outcome of this service is the improvement or maintenance of the Person's financial stability and timely meeting of the Person's financial obligations. (b) Measures: Financial obligations are met on time. (c) Reporting: The Contractor shall create a fiscal year annual report starting fiscal year 2025 (fiscal year 2025 starts July 1, 2024). The fiscal year annual report will be submitted via Google Form by August 30th, 60 days after each fiscal year end. The outcome Google Form will be posted on the DSPD webpage. The Contractor shall explain any quality improvement activities they will undertake in response to their evaluation of the measurement data. The fiscal year annual report must include the following: :", "category": "outcome", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "no", "source": "DHHS91172 SOW §15.5", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.5(1)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.5 Outcomes (1)", "text": "Outcomes.: how many Persons received PBA; and", "category": "outcome", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "no", "source": "DHHS91172 SOW §15.5(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-15.5(2)", "section": "Article 15 — Personal Budget Assistance", "subsection": "§15.5 Outcomes (2)", "text": "Outcomes.: data reflecting the measure in (b) above.", "category": "outcome", "applies_to": "agency", "codes": ["PBA"], "creates_user_task": "no", "source": "DHHS91172 SOW §15.5(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-16.1", "section": "Article 16 — Professional Medication Monitoring By A Licensed Practical Nurse", "subsection": "§16.1 General Description", "text": "General Description. PM1 by a Licensed Practical Nurse (\"LPN\") provides medication management services, medication monitoring, and medication and medical equipment education and training to assure a Person's health and safety.", "category": "definition", "applies_to": "agency", "codes": ["PM1"], "creates_user_task": "no", "source": "DHHS91172 SOW §16.1", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-16.2", "section": "Article 16 — Professional Medication Monitoring By A Licensed Practical Nurse", "subsection": "§16.2 Direct Service Requirements", "text": "Direct Service Requirements. The Contractor shall:", "category": "actionable", "applies_to": "agency", "codes": ["PM1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §16.2", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-16.2(1)", "section": "Article 16 — Professional Medication Monitoring By A Licensed Practical Nurse", "subsection": "§16.2 Direct Service Requirements (1)", "text": "provide services compliant with Utah Administrative CodeR156-31b and ensure that PM1 services outside of the LPN scope of work pursuant to Utah Administrative Code R156-31b-703b are provided under the supervision and delegation of a RN. The Contractor shall ensure that any delegation is pursuant to Utah Administrative Code, R156-31b-701(a);", "category": "actionable", "applies_to": "agency", "codes": ["PM1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §16.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-16.2(2)", "section": "Article 16 — Professional Medication Monitoring By A Licensed Practical Nurse", "subsection": "§16.2 Direct Service Requirements (2)", "text": "Direct Service Requirements: provide medication monitoring, including instructing and educating the Person on the prescribed medication regimen from their health care professional;", "category": "actionable", "applies_to": "agency", "codes": ["PM1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §16.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-16.2(3)", "section": "Article 16 — Professional Medication Monitoring By A Licensed Practical Nurse", "subsection": "§16.2 Direct Service Requirements (3)", "text": "Direct Service Requirements: review, monitor, and document in the Person's medical data sheet, laboratory testing related to a prescribed medication regimen;", "category": "actionable", "applies_to": "agency", "codes": ["PM1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §16.2(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-16.2(4)", "section": "Article 16 — Professional Medication Monitoring By A Licensed Practical Nurse", "subsection": "§16.2 Direct Service Requirements (4)", "text": "Direct Service Requirements: ensure that all pill-dispensing aids are stocked with the correct medication prescribed by the Person's health care professional;", "category": "actionable", "applies_to": "agency", "codes": ["PM1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §16.2(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-16.2(5)", "section": "Article 16 — Professional Medication Monitoring By A Licensed Practical Nurse", "subsection": "§16.2 Direct Service Requirements (5)", "text": "during each visit with the Person, ensure that the Person's medication dispensing devices, aids, and medical equipment are functioning properly. If the Person's medication dispensing devices, aids, or medical equipment are not functioning properly, the PM1 Staff must: (A) assist the Person to arrange for maintenance; (B) notify the Person's Staff or guardian of the required maintenance within one Calendar Day; and (C) document the issue and resolution in the Person's medical data sheet;", "category": "actionable", "applies_to": "agency", "codes": ["PM1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §16.2(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-16.2(6
