ency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.4(1)(F)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.4(1)(G)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.4 BSP (1)(G)", "text": "BSP: title of the Staff responsible for supervising the implementation of the BSP;", "category": "unclear", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.4(1)(G)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.4(1)(H)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.4 BSP (1)(H)", "text": "BSP: graphed data of the primary problem behaviors, updated at least every three;", "category": "unclear", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.4(1)(H)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.4(1)(I)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.4 BSP (1)(I)", "text": "BSP: provision for monitoring the implementation of the BSP;", "category": "unclear", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.4(1)(I)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.4(1)(J)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.4 BSP (1)(J)", "text": "BSP: provisions for training of family and Staff who provide supports to the Person; and", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §3.4(1)(J)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.4(1)(K)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.4 BSP (1)(K)", "text": "BSP: provisions for monthly evaluation of the effectiveness of the BSP and reassessment of the BSP as needed.", "category": "unclear", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.4(1)(K)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.4(2)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.4 BSP (2)", "text": "BSP: reevaluate the BSP each month to analyze the effectiveness of the interventions, and reassess or adjust the BSP as needed;", "category": "unclear", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.4(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.4(3)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.4 BSP (3)", "text": "BSP: ensure any rights modifications to settings requirements comply with the modification requirements in Utah Administrative Code R414-519-2, 8 (g);", "category": "unclear", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.4(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.4(4)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.4 BSP (4)", "text": "complete the BSP within 30 Calendar Days of FBA completion. If the FBA is completed when a Person has had a substantial life change, and baseline data is being gathered, the Contractor may complete an initial BSP addressing all safety issues. The Contractor shall complete a full BSP within 60 Calendar Days after the initial FBA. If updates are needed, the Contractor shall complete FBA revisions within 30 Calendar Days of the Person's substantial life change;", "category": "actionable", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §3.4(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.4(5)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.4 BSP (5)", "text": "BSP: complete a reevaluation and update to the Person's BSP within 30 Calendar Days of written request from the Person's Support Coordinator, PCPT, or as indicated by the Contractor's quarterly summary;", "category": "reporting", "applies_to": "service_record", "codes": ["BC1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §3.4(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.4(6)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.4 BSP (6)", "text": "submit the completed BSP to the Person's Support Coordinator, family, Staff, or any other individual involved in the implementation of the BSP within 14 Calendar Days of completion. The Contractor shall provide consultation and training on implementation of the BSP to the Person's family, Staff and any other individual involved in the implementation of the BSP; and", "category": "reporting", "applies_to": "service_record", "codes": ["BC1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §3.4(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.4(7)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.4 BSP (7)", "text": "BSP: maintain the BSP in the Person's file.", "category": "unclear", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.4(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.5", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.5 Specific Service Limitations", "text": "Specific Service Limitations. In addition to the General Limitations section of this contract, The Contractor shall NOT:", "category": "exception", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.5", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.5(1)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.5 Specific Service Limitations (1)", "text": "Specific Service Limitations: include any of the following in the BSP:", "category": "exception", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.5(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.5(1)(A)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.5 Specific Service Limitations (1)(A)", "text": "Specific Service Limitations: corporal punishment;", "category": "exception", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.5(1)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.5(1)(B)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.5 Specific Service Limitations (1)(B)", "text": "Specific Service Limitations: use speech to Persons that ridicules or is abusive;", "category": "exception", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.5(1)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.5(1)(C)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.5 Specific Service Limitations (1)(C)", "text": "Specific Service Limitations: locked confinement in a room;", "category": "exception", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.5(1)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.5(1)(D)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.5 Specific Service Limitations (1)(D)", "text": "Specific Service Limitations: use of electric devices or other painful stimuli to manage behavior;", "category": "exception", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.5(1)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.5(1)(E)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.5 Specific Service Limitations (1)(E)", "text": "Specific Service Limitations: denial or restriction of access to assistive technology, except where removal prevents injury to self, others, or property; and", "category": "exception", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.5(1)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.5(1)(F)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.5 Specific Service Limitations (1)(F)", "text": "Specific Service Limitations: withholding of meals as a consequence or punishment for problem behavior.", "category": "exception", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.5(1)(F)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.5(2)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.5 Specific Service Limitations (2)", "text": "Specific Service Limitations: provide Direct Support to the Person; and", "category": "exception", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.5(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.5(3)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.5 Specific Service Limitations (3)", "text": "Specific Service Limitations: provide transportation of the Person.", "category": "exception", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.5(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.6", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.6 Specific Staff Qualifications", "text": "Specific Staff Qualifications. The Contractor shall ensure that the BCI Staff meet the qualifications listed in Option A or B below. (a) Option A - The BC1 Staff must:", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §3.6", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.6(1)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.6 Specific Staff Qualifications (1)", "text": "Specific Staff Qualifications: have at least one year of experience working with people with ID.RC or adults with ABI;", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §3.6(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.6(2)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.6 Specific Staff Qualifications (2)", "text": "Specific Staff Qualifications: have a bachelor's degree in a behaviorally related field; and", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §3.6(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.6(3)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.6 Specific Staff Qualifications (3)", "text": "Specific Staff Qualifications: have a current Utah Division of Professional Licensing (\"DOPL\") license as either:", "category": "agency_qualification", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §3.6(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.6(3)(A)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.6 Specific Staff Qualifications (3)(A)", "text": "Specific Staff Qualifications: a Registered Behavior Specialist (\"RBS\"); or", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §3.6(3)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.6(3)(B)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.6 Specific Staff Qualifications (3)(B)", "text": "a Registered Assistant Behavior Specialist (\"RaBS\"). (b) Option B - The BC1 Staff must:", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §3.6(3)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.6(1)-2", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.6 Specific Staff Qualifications (1)", "text": "Specific Staff Qualifications: have at least one year of experience working with people with ID.RC or adults with ABI;", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §3.6(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.6(2)-2", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.6 Specific Staff Qualifications (2)", "text": "Specific Staff Qualifications: have a bachelor's degree in a behaviorally related field; and", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §3.6(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.6(3)-2", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.6 Specific Staff Qualifications (3)", "text": "Specific Staff Qualifications: be exempt from DOPL licensure as defined by Utah Code §58-61-707.", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC1"], "creates_user_task": "yes", "source": "DHHS91172 SOW §3.6(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.7", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.7 Outcomes", "text": "Outcomes. (a) The intended outcomes of this service will reduce the Persons' maladaptive behaviors and increase the Person's replacement behaviors. (b) Measurement: The percentage of Persons who received BC1 who had an annual average decrease in their target problem behaviors. (c) Reporting: The Contractor shall create a fiscal year annual report starting fiscal year 2025 (fiscal year 2025 starts July 1, 2024). The fiscal year annual report will be submitted via Google Form by August 30th, 60 days after each fiscal year end. The outcome Google Form will be posted on the DSPD webpage. The Contractor shall explain any quality improvement activities they will undertake in response to their evaluation of the measurement data. The fiscal year annual report must include the following:", "category": "outcome", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.7", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.7(1)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.7 Outcomes (1)", "text": "Outcomes.: how many Persons received BC1; and", "category": "outcome", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.7(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-3.7(2)", "section": "Article 3 — Behavior Consultation I", "subsection": "§3.7 Outcomes (2)", "text": "Outcomes.: data reflecting the measurement above.", "category": "outcome", "applies_to": "agency", "codes": ["BC1"], "creates_user_task": "no", "source": "DHHS91172 SOW §3.7(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.1", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.1 General Description", "text": "General Description. BC2 provides support to Persons with serious, non-life-threatening behavior by developing behavior interventions that increase the Person's ability to be integrated into the community.", "category": "definition", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.1", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.2", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.2 Direct Service Requirements", "text": "Direct Service Requirements. The Contractor shall:", "category": "actionable", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.2", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.2(1)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.2 Direct Service Requirements (1)", "text": "Direct Service Requirements: provide services to Persons whose targeted behavior problems are mild aggression; property destruction; problems with eating; problems with toileting; or other comparable behavior problems;", "category": "actionable", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.2(2)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.2 Direct Service Requirements (2)", "text": "Direct Service Requirements: provide services to Persons whose target behavior level is considered emerging, annoying, worrisome, objectionable, singular (but not dangerous) interfering with learning, or social relationships, serious and severe, but not potentially life-threatening, or complicated by medical or other factors;", "category": "actionable", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.2(3)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.2 Direct Service Requirements (3)", "text": "Direct Service Requirements: ensure services are based on evidence based positive behavior support and applied behavior analysis principles;", "category": "actionable", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.2(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.2(4)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.2 Direct Service Requirements (4)", "text": "Direct Service Requirements: provide services at the Person's residence; a programmatic setting; or another naturally occurring environment in the community;", "category": "actionable", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.2(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.2(5)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.2 Direct Service Requirements (5)", "text": "be the Person's sole provider of all behavior consultation services and prescribed in the Person's PCSP unless prior written approval of an exception has been given by the PCPT. The written approval documents justifying the exception must demonstrate how the exception is person-centered; and", "category": "client", "applies_to": "client", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.2(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.2(6)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.2 Direct Service Requirements (6)", "text": "Direct Service Requirements: coordinate the Person's services for Persons with multiple BC Staff or services and interventions are consistent across settings.", "category": "actionable", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.2(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.3", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.3 FBA", "text": "FBA. The Contractor shall:", "category": "actionable", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.3", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.3(1)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.3 FBA (1)", "text": "complete a FBA of the Person's target behavior. The Contractor shall use validated assessment tools and processes to complete the FBA, based on the Person's needs;", "category": "actionable", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.3(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.3(2)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.3 FBA (2)", "text": "FBA: provide a written FBA that includes:", "category": "unclear", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.3(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.3(2)(A)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.3 FBA (2)(A)", "text": "FBA: description of the assessment tools and process used;", "category": "unclear", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.3(2)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.3(2)(B)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.3 FBA (2)(B)", "text": "FBA: description of the problem behaviors, including an operational definition for each target behavior;", "category": "unclear", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.3(2)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.3(2)(C)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.3 FBA (2)(C)", "text": "FBA: prediction of the circumstances in which the problem behavior is most likely to occur;", "category": "unclear", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.3(2)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.3(2)(D)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.3 FBA (2)(D)", "text": "FBA: identification of the function of the problem behavior;", "category": "unclear", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.3(2)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.3(2)(E)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.3 FBA (2)(E)", "text": "FBA: date the assessment was conducted;", "category": "unclear", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.3(2)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.3(2)(F)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.3 FBA (2)(F)", "text": "FBA: name of the BC2 Staff completing the assessment;", "category": "unclear", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.3(2)(F)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.3(2)(G)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.3 FBA (2)(G)", "text": "FBA: name of others involved, if applicable; and", "category": "unclear", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.3(2)(G)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.3(2)(H)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.3 FBA (2)(H)", "text": "FBA: name of the Person being assessed.", "category": "unclear", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.3(2)(H)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.3(3)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.3 FBA (3)", "text": "FBA: complete the initial FBA prior to developing the BSP, and within 30 Calendar Days of DSPD approval to provide BC2 services;", "category": "unclear", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.3(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.3(4)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.3 FBA (4)", "text": "FBA: complete a reevaluation and update to the Person's FBA within 30 Calendar Days of written request from the Person's Support Coordinator, PCPT, or as indicated by the Contractor's quarterly summary;", "category": "reporting", "applies_to": "service_record", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.3(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.3(5)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.3 FBA (5)", "text": "FBA: submit completed FBAs to the Person's Support Coordinator within 14 Calendar Days of completion;", "category": "reporting", "applies_to": "service_record", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.3(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.3(6)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.3 FBA (6)", "text": "complete an initial FBA for a Person who has had a substantial life change addressing all safety issues while baseline data is being gathered. The Contractor shall complete the full FBA within 60 Calendar Days after the start of the initial FBA; and", "category": "actionable", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.3(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.3(7)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.3 FBA (7)", "text": "FBA: complete revisions to the FBA, if updates are needed, within 30 Calendar Days of the change.", "category": "unclear", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.3(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.4", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.4 BSP", "text": "BSP. The Contractor shall:", "category": "actionable", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.4", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.4(1)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.4 BSP (1)", "text": "be responsible for the development, implementation, and training of the BSP. The BSP must emphasize a positive approach with treatment designed to effectively acquire and maintain adaptive behaviors and prevent problem behaviors. The BSP must be in writing and include:", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.4(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.4(1)(A)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.4 BSP (1)(A)", "text": "BSP: a summary or hypothesis statement that clarifies the antecedent-behavior-consequence relationships describing the critical problem behavior, predicting the circumstances in which the problem behavior is most likely to occur, and identifying the function of the problem behavior;", "category": "unclear", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.4(1)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.4(1)(B)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.4 BSP (1)(B)", "text": "BSP: baseline data with the date range the data was collected;", "category": "unclear", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.4(1)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.4(1)(C)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.4 BSP (1)(C)", "text": "BSP: behavioral objectives written in measurable and observable terms;", "category": "unclear", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.4(1)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.4(1)(D)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.4 BSP (1)(D)", "text": "BSP: data collection procedures that measure progress toward the BSP objectives that decrease problem behavior and increase replacement behavior;", "category": "unclear", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.4(1)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.4(1)(E)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.4 BSP (1)(E)", "text": "BSP: clearly written and detailed behavioral intervention procedures to ensure consistent implementation by Staff and caregivers addressing the following areas:", "category": "unclear", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.4(1)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.4(1)(E)(i)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.4 BSP (1)(E)(i)", "text": "BSP: prevention procedures designed to decrease the likelihood of the problem behavior;", "category": "unclear", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.4(1)(E)(i)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.4(1)(E)(ii)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.4 BSP (1)(E)(ii)", "text": "BSP: planned responses for when the problem behavior occurs, including safety issues and efforts to minimize reinforcement of the problem behavior;", "category": "unclear", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.4(1)(E)(ii)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.4(1)(E)(iii)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.4 BSP (1)(E)(iii)", "text": "BSP: teaching or increasing replacement behaviors;", "category": "unclear", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.4(1)(E)(iii)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.4(1)(E)(iv)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.4 BSP (1)(E)(iv)", "text": "BSP: generalization of progress to other settings; and", "category": "unclear", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.4(1)(E)(iv)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.4(1)(E)(v)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.4 BSP (1)(E)(v)", "text": "BSP: maintenance of progress fading procedures.", "category": "unclear", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.4(1)(E)(v)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.4(1)(F)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.4 BSP (1)(F)", "text": "BSP: name and title of the BC2 Staff who developed the BSP;", "category": "unclear", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.4(1)(F)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.4(1)(G)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.4 BSP (1)(G)", "text": "BSP: title of the Staff responsible for supervising the implementation of the BSP;", "category": "unclear", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.4(1)(G)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.4(1)(H)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.4 BSP (1)(H)", "text": "BSP: graphed data of the primary problem behaviors, updated at least every 3 months for visual analysis;", "category": "unclear", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.4(1)(H)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.4(1)(I)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.4 BSP (1)(I)", "text": "BSP: provision for monitoring the implementation of the BSP;", "category": "unclear", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.4(1)(I)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.4(1)(J)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.4 BSP (1)(J)", "text": "BSP: provisions for training of family and Staff who provide supports to the Person; and", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.4(1)(J)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.4(1)(K)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.4 BSP (1)(K)", "text": "BSP: provisions for monthly evaluation of the effectiveness of the BSP and reassessment of the BSP as needed.", "category": "unclear", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.4(1)(K)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.4(2)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.4 BSP (2)", "text": "BSP: reevaluate the BSP each month to analyze the effectiveness of the interventions, and reassess or adjust the BSP as needed;", "category": "unclear", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.4(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.4(3)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.4 BSP (3)", "text": "BSP: ensure any rights modifications to settings requirements comply with the modification requirements in Utah Administrative Code R414-519-2, 8 (g);", "category": "unclear", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.4(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.4(4)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.4 BSP (4)", "text": "complete the BSP within 30 Calendar Days of FBA completion. If the FBA is completed when a Person has had a substantial life change, and baseline data is being gathered, the Contractor may complete an initial BSP addressing all safety issues. The Contractor shall complete a full BSP within 60 Calendar Days after the initial FBA. If updates are needed, the Contractor shall complete FBA revisions within 30 Calendar Days of the Person's substantial life change;", "category": "actionable", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.4(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.4(5)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.4 BSP (5)", "text": "BSP: complete a reevaluation and update to the Person's BSP within 30 days of written request from the Person's Support Coordinator, PCPT, or as indicated by the Contractor's quarterly summary;", "category": "reporting", "applies_to": "service_record", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.4(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.4(6)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.4 BSP (6)", "text": "submit the completed BSP to the Person's Support Coordinator, family, Staff, or any other individual involved in the implementation of the BSP within 14 Calendar Days of completion. The Contractor shall provide consultation and training on implementation of the BSP to the Person's family, Staff and any other individual involved in the implementation of the BSP; and", "category": "reporting", "applies_to": "service_record", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.4(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.4(7)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.4 BSP (7)", "text": "BSP: maintain the BSP in the Person's file.", "category": "unclear", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.4(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.5", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.5 Specific Service Limitations", "text": "Specific Service Limitations. In addition to the General Limitations section of this contract, the Contractor shall NOT:", "category": "exception", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.5", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.5(1)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.5 Specific Service Limitations (1)", "text": "Specific Service Limitations: include any of the following as part of the BSP:", "category": "exception", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.5(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.5(1)(A)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.5 Specific Service Limitations (1)(A)", "text": "Specific Service Limitations: corporal punishment, including slapping, hitting, or pinching;", "category": "exception", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.5(1)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.5(1)(B)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.5 Specific Service Limitations (1)(B)", "text": "Specific Service Limitations: demeaning speech to Persons that ridicules or is abusive;", "category": "exception", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.5(1)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.5(1)(C)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.5 Specific Service Limitations (1)(C)", "text": "Specific Service Limitations: locked confinement in a room;", "category": "exception", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.5(1)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.5(1)(D)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.5 Specific Service Limitations (1)(D)", "text": "Specific Service Limitations: use of electric devices or other painful stimuli to manage behavior;", "category": "exception", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.5(1)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.5(1)(E)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.5 Specific Service Limitations (1)(E)", "text": "Specific Service Limitations: denial or restriction of access to assistive technology, except where removal prevents injury to self, others, or property; and", "category": "exception", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.5(1)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.5(1)(F)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.5 Specific Service Limitations (1)(F)", "text": "Specific Service Limitations: withholding of meals as a consequence or punishment for problem behavior.", "category": "exception", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.5(1)(F)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.5(2)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.5 Specific Service Limitations (2)", "text": "Specific Service Limitations: provide Direct Support to the Person; and", "category": "exception", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.5(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.5(3)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.5 Specific Service Limitations (3)", "text": "Specific Service Limitations: provide transportation of the Person.", "category": "exception", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.5(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.6", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.6 Specific Staff Qualifications", "text": "Specific Staff Qualifications. The Contractor shall ensure that the BC2 Staff meet the qualifications in option A, B, C, or D below. (a) Option A - The BC2 Staff must:", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.6", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.6(1)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.6 Specific Staff Qualifications (1)", "text": "Specific Staff Qualifications: have at least one year of experience working with people with ID.RC or adults with ABI;", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.6(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.6(2)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.6 Specific Staff Qualifications (2)", "text": "Specific Staff Qualifications: be currently certified through the Behavior Analyst Certification Board (\"BACB\") as an Assistant Behavior Analyst BCaBA; and", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.6(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.6(3)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.6 Specific Staff Qualifications (3)", "text": "have a current Utah DOPL license as an LaBA. (b) Option B - The BC2 Staff must:", "category": "agency_qualification", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.6(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.6(1)-2", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.6 Specific Staff Qualifications (1)", "text": "Specific Staff Qualifications: have at least one year of experience working with people with ID.RC or adults with ABI;", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.6(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.6(2)-2", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.6 Specific Staff Qualifications (2)", "text": "Specific Staff Qualifications: have at least a master's degree in a behaviorally related field; and", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.6(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.6(3)-2", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.6 Specific Staff Qualifications (3)", "text": "Specific Staff Qualifications: have a current DOPL license as either:", "category": "agency_qualification", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.6(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.6(3)(A)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.6 Specific Staff Qualifications (3)(A)", "text": "Specific Staff Qualifications: an RBS; or", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.6(3)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.6(3)(B)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.6 Specific Staff Qualifications (3)(B)", "text": "an RaBS. (c) Option C - The BC2 Staff shall:", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.6(3)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.6(1)-3", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.6 Specific Staff Qualifications (1)", "text": "Specific Staff Qualifications: have at least one year of experience working with people with ID.RC or adults with ABI;", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.6(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.6(2)-3", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.6 Specific Staff Qualifications (2)", "text": "be a student enrolled and actively engaged in a BACB approved program leading to certification as a BCaBA. The student shall:", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.6(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.6(2)(A)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.6 Specific Staff Qualifications (2)(A)", "text": "Specific Staff Qualifications: complete and pass all parts of the BCaBA approved course sequence;", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.6(2)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.6(2)(B)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.6 Specific Staff Qualifications (2)(B)", "text": "Specific Staff Qualifications: obtain all of the required supervision hours;", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.6(2)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.6(2)(C)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.6 Specific Staff Qualifications (2)(C)", "text": "Specific Staff Qualifications: apply for the first available BCaBA certification testing date offered by the BACB until the exam is passed;", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.6(2)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.6(2)(D)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.6 Specific Staff Qualifications (2)(D)", "text": "Specific Staff Qualifications: pass the BCaBA exam;", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.6(2)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.6(2)(E)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.6 Specific Staff Qualifications (2)(E)", "text": "Specific Staff Qualifications: obtain a BCaBA certification;", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.6(2)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.6(2)(F)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.6 Specific Staff Qualifications (2)(F)", "text": "Specific Staff Qualifications: obtain DOPL licensure as an LaBA; and", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.6(2)(F)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.6(2)(G)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.6 Specific Staff Qualifications (2)(G)", "text": "Specific Staff Qualifications: be supervised by a BCBA who has a current DOPL Behavior Analyst (\"LBA\") license.", "category": "agency_qualification", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.6(2)(G)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.6(3)-3", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.6 Specific Staff Qualifications (3)", "text": "have a letter from their BCBA supervisor stating the supervisor's name and contact information and that they are willing to supervise the BC2 Staff. (d) Option D - The BC2 Staff shall:", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.6(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.6(1)-4", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.6 Specific Staff Qualifications (1)", "text": "Specific Staff Qualifications: have at least one year of experience working with people with ID.RC and/or adults with ABI;", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.6(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.6(2)-4", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.6 Specific Staff Qualifications (2)", "text": "Specific Staff Qualifications: have at least a master's degree in a behaviorally related field; and", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.6(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.6(3)-4", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.6 Specific Staff Qualifications (3)", "text": "be exempt from DOPL licensure as listed in Utah Code §58-61-707 Exemptions from licensure. The BC2 Staff shall have:", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.6(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.6(3)(A)-2", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.6 Specific Staff Qualifications (3)(A)", "text": "Specific Staff Qualifications: a letter stating the reason for the exemption from DOPL licensure as outlined in Utah Code §58-61-707 Exemptions from Licensure; and", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.6(3)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.6(3)(B)-2", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.6 Specific Staff Qualifications (3)(B)", "text": "Specific Staff Qualifications: the relevant DOPL licensure if required with the exemption.", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC2"], "creates_user_task": "yes", "source": "DHHS91172 SOW §4.6(3)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.7", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.7 Outcomes", "text": "Outcomes. (a) The intended outcomes of this service will reduce the Persons' maladaptive behaviors and increase the Person's replacement behaviors. (b) Measurement: The percentage of Persons who received BC2 who had an annual average decrease in their target problem behaviors. (c) Reporting: The Contractor shall create a fiscal year annual report starting fiscal year 2025 (fiscal year 2025 starts July 1, 2024). The fiscal year annual report will be submitted via Google Form by August 30th, 60 days after each fiscal year end. The outcome Google Form will be posted on the DSPD webpage. The Contractor shall explain any quality improvement activities they will undertake in response to their evaluation of the measurement data. The fiscal year annual report must include the following: :", "category": "outcome", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.7", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.7(1)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.7 Outcomes (1)", "text": "Outcomes.: how many Persons received BC2; and", "category": "outcome", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.7(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-4.7(2)", "section": "Article 4 — Behavior Consultation Ii", "subsection": "§4.7 Outcomes (2)", "text": "Outcomes.: data reflecting the measurement above.", "category": "outcome", "applies_to": "agency", "codes": ["BC2"], "creates_user_task": "no", "source": "DHHS91172 SOW §4.7(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.1", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.1 General Description", "text": "General Description. BC3 provides support to Persons with extremely complex, or dangerous behavior by developing behavior interventions that increase the Person's ability to be integrated into the community.", "category": "definition", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.1", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.2", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.2 Direct Service Requirements", "text": "Direct Service Requirements. The Contractor shall:", "category": "actionable", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.2", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.2(1)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.2 Direct Service Requirements (1)", "text": "Direct Service Requirements: provide services to Persons whose targeted behavior problems include extremely complex or difficult behavior problems;", "category": "actionable", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.2(2)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.2 Direct Service Requirements (2)", "text": "Direct Service Requirements: provide services to Persons whose target behavior is considered dangerous, potentially life-threatening, or resistant to change;", "category": "actionable", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.2(3)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.2 Direct Service Requirements (3)", "text": "Direct Service Requirements: ensure services are based on evidence based positive behavior support and applied behavior analysis principles;", "category": "actionable", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.2(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.2(4)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.2 Direct Service Requirements (4)", "text": "Direct Service Requirements: provide services at the Person's residence; a programmatic setting; or another naturally occurring environment in the community;", "category": "actionable", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.2(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.2(5)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.2 Direct Service Requirements (5)", "text": "be the Person's sole provider of all behavior consultation services and prescribed in the Person's PCSP unless prior written approval of an exception has been given by the PCPT. The written approval documents justifying the exception must demonstrate how the exception is person-centered; and", "category": "client", "applies_to": "client", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.2(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.2(6)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.2 Direct Service Requirements (6)", "text": "Direct Service Requirements: coordinate the Person's services for Persons with multiple BC Staff or services and interventions are consistent across settings.", "category": "actionable", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.2(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.3", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.3 FBA", "text": "FBA. The Contractor shall:", "category": "actionable", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.3", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.3(1)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.3 FBA (1)", "text": "complete a FBA of the Person's target behavior. The Contractor shall use validated assessment tools and processes to complete the FBA, based on the Person's needs;", "category": "actionable", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.3(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.3(2)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.3 FBA (2)", "text": "FBA: provide a written FBA that includes:", "category": "unclear", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.3(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.3(2)(A)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.3 FBA (2)(A)", "text": "FBA: description of the assessment tools and process used;", "category": "unclear", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.3(2)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.3(2)(B)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.3 FBA (2)(B)", "text": "FBA: description of the problem behaviors, including an operational definition for each target behavior;", "category": "unclear", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.3(2)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.3(2)(C)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.3 FBA (2)(C)", "text": "FBA: prediction of the circumstances in which the problem behavior is most likely to occur;", "category": "unclear", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.3(2)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.3(2)(D)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.3 FBA (2)(D)", "text": "FBA: identification of the function of the problem behavior;", "category": "unclear", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.3(2)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.3(2)(E)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.3 FBA (2)(E)", "text": "FBA: date the assessment was conducted;", "category": "unclear", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.3(2)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.3(2)(F)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.3 FBA (2)(F)", "text": "FBA: name of the BC3 Staff completing the assessment;", "category": "unclear", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.3(2)(F)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.3(2)(G)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.3 FBA (2)(G)", "text": "FBA: name of others involved, if applicable; and", "category": "unclear", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.3(2)(G)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.3(2)(H)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.3 FBA (2)(H)", "text": "FBA: name of the Person being assessed.", "category": "unclear", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.3(2)(H)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.3(3)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.3 FBA (3)", "text": "FBA: complete the initial FBA prior to developing the BSP, and within 30 Calendar Days of DSPD approval to provide BC3 services;", "category": "unclear", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.3(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.3(4)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.3 FBA (4)", "text": "FBA: complete a reevaluation and update to the Person's FBA within 30 Calendar Days of written request from the Person's Support Coordinator, PCPT, or as indicated by the Contractor's quarterly summary;", "category": "reporting", "applies_to": "service_record", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.3(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.3(5)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.3 FBA (5)", "text": "FBA: submit completed FBAs to the Person's Support Coordinator within 14 Calendar Days of completion;", "category": "reporting", "applies_to": "service_record", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.3(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.3(6)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.3 FBA (6)", "text": "FBA: maintain the FBA in the Person's file;", "category": "unclear", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.3(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.3(7)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.3 FBA (7)", "text": "complete an initial FBA for a Person who has had a substantial life change addressing all safety issues while baseline data is being gathered. The Contractor shall complete the full FBA within 60 Calendar Days after the start of the initial FBA; and", "category": "actionable", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.3(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.3(8)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.3 FBA (8)", "text": "FBA: complete revisions to the FBA, if updates are needed, within 30 Calendar Days of the change.", "category": "unclear", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.3(8)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.4", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.4 BSP", "text": "BSP. The Contractor shall:", "category": "actionable", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.4", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.4(1)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.4 BSP (1)", "text": "be responsible for the development, implementation, and training of the BSP. The BSP must emphasize a positive approach with treatment designed to effectively acquire and maintain adaptive behaviors and prevent problem behaviors. The BSP must be in writing and include:", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.4(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.4(1)(A)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.4 BSP (1)(A)", "text": "BSP: a summary or hypothesis statement that clarifies the antecedent-behavior-consequence relationships describing the critical problem behavior, predicting the circumstances in which the problem behavior is most likely to occur, and identifying the function of the problem behavior;", "category": "unclear", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.4(1)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.4(1)(B)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.4 BSP (1)(B)", "text": "BSP: baseline data with the date range the data was collected;", "category": "unclear", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.4(1)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.4(1)(C)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.4 BSP (1)(C)", "text": "BSP: behavioral objectives written in measurable and observable terms;", "category": "unclear", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.4(1)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.4(1)(D)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.4 BSP (1)(D)", "text": "BSP: data collection procedures that measure progress toward the BSP objectives that decrease problem behavior and increase replacement behavior;", "category": "unclear", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.4(1)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.4(1)(E)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.4 BSP (1)(E)", "text": "BSP: clearly written and detailed behavioral intervention procedures to ensure consistent implementation by Staff and caregivers addressing the following areas:", "category": "unclear", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.4(1)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.4(1)(E)(i)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.4 BSP (1)(E)(i)", "text": "BSP: prevention procedures designed to decrease the likelihood of the problem behavior;", "category": "unclear", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.4(1)(E)(i)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.4(1)(E)(ii)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.4 BSP (1)(E)(ii)", "text": "BSP: planned responses for when the problem behavior occurs, including safety issues and efforts to minimize reinforcement of the problem behavior;", "category": "unclear", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.4(1)(E)(ii)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.4(1)(E)(iii)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.4 BSP (1)(E)(iii)", "text": "BSP: teaching or increasing replacement behaviors;", "category": "unclear", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.4(1)(E)(iii)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.4(1)(E)(iv)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.4 BSP (1)(E)(iv)", "text": "BSP: generalization of progress to other settings; and", "category": "unclear", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.4(1)(E)(iv)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.4(1)(E)(v)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.4 BSP (1)(E)(v)", "text": "BSP: maintenance of fading procedures.", "category": "unclear", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.4(1)(E)(v)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.4(1)(F)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.4 BSP (1)(F)", "text": "BSP: name and title of the BC3 Staff who developed the BSP;", "category": "unclear", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.4(1)(F)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.4(1)(G)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.4 BSP (1)(G)", "text": "BSP: title of the Staff responsible for supervising the implementation of the BSP;", "category": "unclear", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.4(1)(G)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.4(1)(H)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.4 BSP (1)(H)", "text": "BSP: graphed data of the primary problem behaviors, updated at least every three months for visual analysis;", "category": "unclear", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.4(1)(H)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.4(1)(I)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.4 BSP (1)(I)", "text": "BSP: provision for monitoring the implementation of the BSP;", "category": "unclear", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.4(1)(I)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.4(1)(J)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.4 BSP (1)(J)", "text": "BSP: provisions for training of family and Staff who provide supports to the Person; and", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.4(1)(J)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.4(1)(K)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.4 BSP (1)(K)", "text": "BSP: provisions for monthly evaluation of the effectiveness of the BSP and reassessment of the BSP as needed.", "category": "unclear", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.4(1)(K)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.4(2)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.4 BSP (2)", "text": "BSP: reevaluate the BSP each month to analyze the effectiveness of the interventions, and reassess or adjust the BSP as needed;", "category": "unclear", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.4(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.4(3)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.4 BSP (3)", "text": "BSP: ensure any rights modifications to settings requirements comply with the modification requirements in Utah Administrative Code R414-519-2, 8 (g);", "category": "unclear", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.4(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.4(4)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.4 BSP (4)", "text": "complete the BSP within 30 Calendar Days of FBA completion. If the FBA is completed when a Person has had a substantial life change, and baseline data is being gathered, the Contractor may complete an initial BSP addressing all safety issues. The Contractor shall complete a full BSP within 60 Calendar Days after the initial FBA. If updates are needed, the Contractor shall complete FBA revisions within 30 Calendar Days of the Person's substantial life change;", "category": "actionable", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.4(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.4(5)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.4 BSP (5)", "text": "BSP: complete a reevaluation and update to the Person's BSP within 30 days of written request from the Person's Support Coordinator, PCPT, or as indicated by the Contractor's quarterly summary;", "category": "reporting", "applies_to": "service_record", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.4(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.4(6)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.4 BSP (6)", "text": "submit the completed BSP to the Person's Support Coordinator, family, Staff, or any other individual involved in the implementation of the BSP within 14 Calendar Days of completion. The Contractor shall provide consultation and training on implementation of the BSP to the Person's family, Staff and any other individual involved in the implementation of the BSP; and", "category": "reporting", "applies_to": "service_record", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.4(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.4(7)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.4 BSP (7)", "text": "BSP: maintain the BSP in the Person's file.", "category": "unclear", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.4(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.5", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.5 Specific Service Limitations", "text": "Specific Service Limitations. In addition to the General Limitations section of this contract, the Contractor shall NOT:", "category": "exception", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.5", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.5(1)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.5 Specific Service Limitations (1)", "text": "Specific Service Limitations: include any of the following as part of the BSP:", "category": "exception", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.5(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.5(1)(A)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.5 Specific Service Limitations (1)(A)", "text": "Specific Service Limitations: corporal punishment, including slapping, hitting, or pinching;", "category": "exception", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.5(1)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.5(1)(B)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.5 Specific Service Limitations (1)(B)", "text": "Specific Service Limitations: demeaning speech to Persons that ridicules or is abusive;", "category": "exception", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.5(1)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.5(1)(C)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.5 Specific Service Limitations (1)(C)", "text": "Specific Service Limitations: locked confinement in a room;", "category": "exception", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.5(1)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.5(1)(D)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.5 Specific Service Limitations (1)(D)", "text": "Specific Service Limitations: use of electric devices or other painful stimuli to manage behavior;", "category": "exception", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.5(1)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.5(1)(E)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.5 Specific Service Limitations (1)(E)", "text": "Specific Service Limitations: denial or restriction of access to assistive technology, except where removal prevents injury to self, others, or property; and", "category": "exception", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.5(1)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.5(1)(F)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.5 Specific Service Limitations (1)(F)", "text": "Specific Service Limitations: withholding of meals as a consequence or punishment for problem behavior.", "category": "exception", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.5(1)(F)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.5(2)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.5 Specific Service Limitations (2)", "text": "Specific Service Limitations: provide Direct Support to the Person; and", "category": "exception", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.5(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.5(3)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.5 Specific Service Limitations (3)", "text": "Specific Service Limitations: provide transportation of the Person.", "category": "exception", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "no", "source": "DHHS91172 SOW §5.5(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.6", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.6 Specific Staff Qualifications", "text": "Specific Staff Qualifications. The Contractor shall ensure that the BC3 Staff meet the qualifications in option A, B, C, or D below. (a) Option A - The BC3 Staff must:", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.6", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.6(1)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.6 Specific Staff Qualifications (1)", "text": "Specific Staff Qualifications: have at least one year of experience working with people with ID.RC or adults wit
