h ABI;", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.6(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.6(2)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.6 Specific Staff Qualifications (2)", "text": "Specific Staff Qualifications: be currently certified through the Behavior Analyst Certification Board (\"BACB\") as a BCBA; and", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.6(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.6(3)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.6 Specific Staff Qualifications (3)", "text": "have a current Utah DOPL license as an LBA. (b) Option B - The BC3 Staff must:", "category": "agency_qualification", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.6(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.6(1)-2", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.6 Specific Staff Qualifications (1)", "text": "Specific Staff Qualifications: have at least one year of experience working with people with ID.RC or adults with ABI;", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.6(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.6(2)-2", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.6 Specific Staff Qualifications (2)", "text": "Specific Staff Qualifications: have at least a doctoral degree in a behaviorally related field; and", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.6(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.6(3)-2", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.6 Specific Staff Qualifications (3)", "text": "have a current DOPL Psychologist license. (c) Option C - The BC3 Staff shall:", "category": "agency_qualification", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.6(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.6(1)-3", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.6 Specific Staff Qualifications (1)", "text": "Specific Staff Qualifications: have at least one year of experience working with people with ID.RC or adults with ABI;", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.6(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.6(2)-3", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.6 Specific Staff Qualifications (2)", "text": "be a student enrolled and actively engaged in a BACB approved program leading to certification as a BCBA. The student shall:", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.6(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.6(2)(A)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.6 Specific Staff Qualifications (2)(A)", "text": "Specific Staff Qualifications: complete and pass all parts of the BCBA approved course sequence;", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.6(2)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.6(2)(B)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.6 Specific Staff Qualifications (2)(B)", "text": "Specific Staff Qualifications: obtain all of the required supervision hours;", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.6(2)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.6(2)(C)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.6 Specific Staff Qualifications (2)(C)", "text": "Specific Staff Qualifications: apply for the first available BCBA certification testing date offered by the BACB until the exam is passed;", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.6(2)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.6(2)(D)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.6 Specific Staff Qualifications (2)(D)", "text": "Specific Staff Qualifications: pass the BCBA exam;", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.6(2)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.6(2)(E)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.6 Specific Staff Qualifications (2)(E)", "text": "Specific Staff Qualifications: obtain a BCBA certification;", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.6(2)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.6(2)(F)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.6 Specific Staff Qualifications (2)(F)", "text": "Specific Staff Qualifications: obtain DOPL licensure as an LBA; and", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.6(2)(F)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.6(2)(G)", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.6 Specific Staff Qualifications (2)(G)", "text": "Be supervised by a BCBA who has a current DOPL LBA license.", "category": "agency_qualification", "applies_to": "agency", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.6(2)(G)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.6(3)-3", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.6 Specific Staff Qualifications (3)", "text": "have a letter from their BCBA supervisor stating the supervisor's name and contact information and that they are willing to supervise the BC3 Staff. (d) Option D - The BC3 Staff shall:", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.6(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.6(1)-4", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.6 Specific Staff Qualifications (1)", "text": "Specific Staff Qualifications: have at least one year of experience working with people with ID.RC and/or adults with ABI;", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.6(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.6(2)-4", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.6 Specific Staff Qualifications (2)", "text": "Specific Staff Qualifications: have at least a a doctoral degree in a behaviorally related field; and", "category": "staff_qualification", "applies_to": "staff", "codes": ["BC3"], "creates_user_task": "yes", "source": "DHHS91172 SOW §5.6(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-5.6(3)-4", "section": "Article 5 — Behavior Consultation Iii", "subsection": "§5.6 Specific Staff Qualifications (3)", "text": "be exempt from DOPL licensure as listed in Utah Code §58-61-707 Exemptions iding access to desired social experience;", "category": "actionable", "applies_to": "agency", "codes": ["COM"], "creates_user_task": "yes", "source": "DHHS91172 SOW §6.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-6.2(2)", "section": "Article 6 — Companion Service", "subsection": "§6.2 Direct Service Requirements (2)", "text": "Direct Service Requirements: assistance and supervision with household tasks such as meal preparation, shopping, chores, and laundry;", "category": "actionable", "applies_to": "agency", "codes": ["COM"], "creates_user_task": "yes", "source": "DHHS91172 SOW §6.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-6.2(3)", "section": "Article 6 — Companion Service", "subsection": "§6.2 Direct Service Requirements (3)", "text": "Direct Service Requirements: occasional assistance and supervision with light housekeeping chores;", "category": "actionable", "applies_to": "agency", "codes": ["COM"], "creates_user_task": "yes", "source": "DHHS91172 SOW §6.2(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-6.2(4)", "section": "Article 6 — Companion Service", "subsection": "§6.2 Direct Service Requirements (4)", "text": "Direct Service Requirements: assistance and supervision to access community services and resources;", "category": "actionable", "applies_to": "agency", "codes": ["COM"], "creates_user_task": "yes", "source": "DHHS91172 SOW §6.2(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-6.2(5)", "section": "Article 6 — Companion Service", "subsection": "§6.2 Direct Service Requirements (5)", "text": "Direct Service Requirements: providing transportation; and", "category": "actionable", "applies_to": "agency", "codes": ["COM"], "creates_user_task": "yes", "source": "DHHS91172 SOW §6.2(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-6.2(6)", "section": "Article 6 — Companion Service", "subsection": "§6. ", "codes": ["COM"], "creates_user_task": "no", "source": "DHHS91172 SOW §6.5(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-6.5(2)", "section": "Article 6 — Companion Service", "subsection": "§6.5 Outcomes (2)", "text": "Outcomes.: data reflecting the measure in (b) above.", "category": "outcome", "applies_to": "agency", "codes": ["COM"], "creates_user_task": "no", "source": "DHHS91172 SOW §6.5(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-6.6", "section": "Article 6 — Companion Service", "subsection": "§6.6 Rate", "text": "Rate. COM is a quarter hour and daily service. The Contractor shall bill for the daily rate if the Person requires more than six hours of COM services within a 24-hour day.", "category": "billing", "applies_to": "service_record", "codes": ["COM"], "creates_user_task": "yes", "source": "DHHS91172 SOW §6.6", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.1", "section": "Article 7 — Day Support", "subsection": "§7.1 General Description", "text": "General Description. DSG and DSP provides safe, non-residential habilitation group services to prevent isolation of Persons while providing daily support, supervision, and skills building. DSG/DSP programs support the Person's choice of participating in, and contributing to, their community. The Person may be an adult or a child.", "category": "definition", "applies_to": "agency", "codes": ["DSG", "DSP"], "creates_user_task": "no", "source": "DHHS91172 SOW §7.1", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.2", "section": "Article 7 — Day Support", "subsection": "§7.2 Direct Service Requirements", "text": "Direct Service Requirements. The Contractor shall:", "category": "actionable", "applies_to": "agency", "codes": ["DSG", "DSP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §7.2", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.2(1)", "section": "Article 7 — Day Support", "subsection": "§7.2 Direct Service Requirements (1)", "text": "Direct Service Requirements: provide services according to the Person's preferences and their PCSP;", "category": "client", "applies_to": "client", "codes": ["DSG", "DSP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §7.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.2(2)", "section": "Article 7 — Day Support", "subsection": "§7.2 Direct Service Requirements (2)", "text": "Direct Service Requirements: provide supervision and skill building activities to improve or maintain the Person's functional abilities and life skills. These abilities and life skills are:", "category": "actionable", "applies_to": "agency", "codes": ["DSG", "DSP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §7.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.2(2)(A)", "section": "Article 7 — Day Support", "subsection": "§7.2 Direct Service Requirements (2)(A)", "text": "Direct Service Requirements: the Person's dexterity, stamina, memory, and mobility;", "category": "actionable", "applies_to": "agency", "codes": ["DSG", "DSP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §7.2(2)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.2(2)(B)", "section": "Article 7 — Day Support", "subsection": "§7.2 Direct Service Requirements (2)(B)", "text": "Direct Service Requirements: the Person's personal safety, self help, self-determination, self-advocacy skills and experiences", "category": "actionable", "applies_to": "agency", "codes": ["DSG", "DSP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §7.2(2)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.2(2)(C)", "section": "Article 7 — Day Support", "subsection": "§7.2 Direct Service Requirements (2)(C)", "text": "Direct Service Requirements: problem solving skills to maximize the Person's ability to participate in activities independently or with natural supports;", "category": "actionable", "applies_to": "agency", "codes": ["DSG", "DSP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §7.2(2)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.2(2)(D)", "section": "Article 7 — Day Support", "subsection": "§7.2 Direct Service Requirements (2)(D)", "text": "Direct Service Requirements: a meaningful social life with interpersonal relations, and communication skills that offers opportunities for personal growth, independence, social connection, and natural supports; and", "category": "actionable", "applies_to": "agency", "codes": ["DSG", "DSP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §7.2(2)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.2(2)(E)", "section": "Article 7 — Day Support", "subsection": "§7.2 Direct Service Requirements (2)(E)", "text": "Direct Service Requirements: general employment skills that support the Person's underlying habilitative goals related to Competitive Integrated Employment.", "category": "actionable", "applies_to": "agency", "codes": ["DSG", "DSP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §7.2(2)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.2(3)", "section": "Article 7 — Day Support", "subsection": "§7.2 Direct Service Requirements (3)", "text": "Direct Service Requirements: assist the Person with ADL;", "category": "actionable", "applies_to": "agency", "codes": ["DSG", "DSP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §7.2(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.2(4)", "section": "Article 7 — Day Support", "subsection": "§7.2 Direct Service Requirements (4)", "text": "Direct Service Requirements: support the Person to build community connections, expand existing networks to develop natural supports, engage in community life, and acquire, maintain and improve opportunities for independence, community membership, and meaningful community integration and inclusion; and", "category": "actionable", "applies_to": "agency", "codes": ["DSG", "DSP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §7.2(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.2(5)", "section": "Article 7 — Day Support", "subsection": "§7.2 Direct Service Requirements (5)", "text": "provide transportation of the Person during the DSG/DSP program. The Contractor may bill DSPD for MTP to or from the DSG/DSP program. If needed, the Contractor shall provide Staff during transportation, to ensure the Person's health and safety.", "category": "actionable", "applies_to": "agency", "codes": ["DSG", "DSP", "MTP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §7.2(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.3", "section": "Article 7 — Day Support", "subsection": "§7.3 Direct Service Administrative Requirements", "text": "Direct Service Administrative Requirements. The Contractor shall:", "category": "documentation", "applies_to": "agency", "codes": ["DSG", "DSP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §7.3", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.3(1)", "section": "Article 7 — Day Support", "subsection": "§7.3 Direct Service Administrative Requirements (1)", "text": "provide services in a site-based facility in a building, in a community based setting which means an integrated community setting with individuals without disabilities (not including paid Staff), or a combination of the two. For community based DSG/DSP programs, the Person's residence may be used as a hub for planning and organizing activities related to the Person's preferences, interests, and personal care needs;", "category": "site", "applies_to": "site", "codes": ["DSG", "DSP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §7.3(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.3(2)", "section": "Article 7 — Day Support", "subsection": "§7.3 Direct Service Administrative Requirements (2)", "text": "ensure Staff ratios are determined by the DSPD Worksheet and are individualized based on the Person's need, with a minimum allowable Staff ratio of one Staff to six Persons. DSPD will only consider a Staff ratio of one or more Staff to one Person (1:1) when the Person's PCST has documented such a need in the Person's PCSP. The Contractor shall provide in-person visual and auditory surveillance to ensure the Person's health and safety. A 1:1 ratio means that the Contractor has one Staff to provide direct supervision to one Person. Direct supervision means that the Contractor has uninterrupted in-person visual and auditory surveillance of the Person;", "category": "client", "applies_to": "client", "codes": ["DSG", "DSP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §7.3(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.3(3)", "section": "Article 7 — Day Support", "subsection": "§7.3 Direct Service Administrative Requirements (3)", "text": "ensure that DSG/DSP programs operate on a regular schedule. While the schedule is often Monday through Friday daytime or afternoon hours, the Contractor may offer services any hours or days of the week, including weekends, afterschool, or evenings. The Contractor shall ensure that the regular schedule includes being operational, as needed, before and after the regular start and end time to allow for staggered early arrivals and late departures;", "category": "documentation", "applies_to": "agency", "codes": ["DSG", "DSP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §7.3(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.3(4)", "section": "Article 7 — Day Support", "subsection": "§7.3 Direct Service Administrative Requirements (4)", "text": "Direct Service Administrative Requirements: ensure that each DSG/DSP program has Staff responsible for the day to day operations of the program;", "category": "documentation", "applies_to": "agency", "codes": ["DSG", "DSP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §7.3(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.3(5)", "section": "Article 7 — Day Support", "subsection": "§7.3 Direct Service Administrative Requirements (5)", "text": "comply with all licensing and certification rules and requirements when providing services that require a license or certification from the DHHS Office of Licensing (\"OL\"). Regardless of the services being provided, a site-based facility must not exceed its capacity allowed under the license or certification; and", "category": "staff_qualification", "applies_to": "staff", "codes": ["DSG", "DSP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §7.3(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.3(6)", "section": "Article 7 — Day Support", "subsection": "§7.3 Direct Service Administrative Requirements (6)", "text": "When providing DSG/DSP daily, the Contractor shall maintain written billing service documentation that includes:", "category": "billing", "applies_to": "service_record", "codes": ["DSG", "DSP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §7.3(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.3(6)(A)", "section": "Article 7 — Day Support", "subsection": "§7.3 Direct Service Administrative Requirements (6)(A)", "text": "Direct Service Administrative Requirements: the name of the Person receiving the service;", "category": "documentation", "applies_to": "agency", "codes": ["DSG", "DSP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §7.3(6)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.3(6)(B)", "section": "Article 7 — Day Support", "subsection": "§7.3 Direct Service Administrative Requirements (6)(B)", "text": "Direct Service Administrative Requirements: the date the service was delivered;", "category": "documentation", "applies_to": "agency", "codes": ["DSG", "DSP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §7.3(6)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.3(6)(C)", "section": "Article 7 — Day Support", "subsection": "§7.3 Direct Service Administrative Requirements (6)(C)", "text": "Direct Service Administrative Requirements: the start and end time the service was delivered;", "category": "documentation", "applies_to": "agency", "codes": ["DSG", "DSP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §7.3(6)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.3(6)(D)", "section": "Article 7 — Day Support", "subsection": "§7.3 Direct Service Administrative Requirements (6)(D)", "text": "Direct Service Administrative Requirements: the name of the DHHS service code that was delivered (DSG or DSP);", "category": "documentation", "applies_to": "agency", "codes": ["DSG", "DSP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §7.3(6)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.3(6)(E)", "section": "Article 7 — Day Support", "subsection": "§7.3 Direct Service Administrative Requirements (6)(E)", "text": "Direct Service Administrative Requirements: the name of a Staff providing the service; and", "category": "documentation", "applies_to": "agency", "codes": ["DSG", "DSP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §7.3(6)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.3(6)(F)", "section": "Article 7 — Day Support", "subsection": "§7.3 Direct Service Administrative Requirements (6)(F)", "text": "Direct Service Administrative Requirements: a written summary note of substantive service activities consistent with the service description.", "category": "documentation", "applies_to": "agency", "codes": ["DSG", "DSP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §7.3(6)(F)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.4", "section": "Article 7 — Day Support", "subsection": "§7.4 Specific Service Limitations", "text": "Specific Service Limitations. In addition to the General Limitations section of this contract, the Contractor shall NOT:", "category": "exception", "applies_to": "agency", "codes": ["DSG", "DSP"], "creates_user_task": "no", "source": "DHHS91172 SOW §7.4", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.4(1)", "section": "Article 7 — Day Support", "subsection": "§7.4 Specific Service Limitations (1)", "text": "Specific Service Limitations: pay a Person for any work activities;", "category": "exception", "applies_to": "agency", "codes": ["DSG", "DSP"], "creates_user_task": "no", "source": "DHHS91172 SOW §7.4(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.4(2)", "section": "Article 7 — Day Support", "subsection": "§7.4 Specific Service Limitations (2)", "text": "Specific Service Limitations: provide Day Supports solely or routinely in the Person's residence; and", "category": "exception", "applies_to": "agency", "codes": ["DSG", "DSP"], "creates_user_task": "no", "source": "DHHS91172 SOW §7.4(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.4(3)", "section": "Article 7 — Day Support", "subsection": "§7.4 Specific Service Limitations (3)", "text": "Specific Service Limitations: provide community based Day Supports at a Staff residence or at a location controlled by the Contractor.", "category": "exception", "applies_to": "agency", "codes": ["DSG", "DSP"], "creates_user_task": "no", "source": "DHHS91172 SOW §7.4(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.5", "section": "Article 7 — Day Support", "subsection": "§7.5 Specific Service Contractor Qualifications", "text": "Specific Service Contractor Qualifications. (a) When services are provided solely or partially in a site-based facility, the Contractor shall for each location providing DSG/DSP have and maintain a:", "category": "agency_qualification", "applies_to": "site", "codes": ["DSG", "DSP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §7.5", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.5(1)", "section": "Article 7 — Day Support", "subsection": "§7.5 Specific Service Contractor Qualifications (1)", "text": "Day Treatment license from the DHHS Office of Licensing (\"OL\"), for each location DSG/DSP is provided for four or more Persons; or", "category": "agency_qualification", "applies_to": "agency", "codes": ["DSG", "DSP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §7.5(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.5(2)", "section": "Article 7 — Day Support", "subsection": "§7.5 Specific Service Contractor Qualifications (2)", "text": "Day Support certification from OL, for each location DSG/DSP is provided for three or fewer Persons. (b) When services are provided solely in the community, the Contractor shall have and maintain a:", "category": "staff_qualification", "applies_to": "staff", "codes": ["DSG", "DSP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §7.5(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.5(1)-2", "section": "Article 7 — Day Support", "subsection": "§7.5 Specific Service Contractor Qualifications (1)", "text": "Day Treatment license from OL when the day supports program provides services to four or more Persons in total, whether or not Persons all receive services at the same time, same location, or in the same groups; or[a]", "category": "agency_qualification", "applies_to": "agency", "codes": ["DSG", "DSP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §7.5(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.5(2)-2", "section": "Article 7 — Day Support", "subsection": "§7.5 Specific Service Contractor Qualifications (2)", "text": "Community Based Day Support certification from OL when the day supports program provides services to three or fewer Persons in total. (c) The Contractor may qualify for DSG/DSP if it provided Day Supports under a DHS90743 contract and has applied for a Day Treatment license, Day Support certification, or Community Based Day Support Certification. The Contractor shall obtain the required license or certification by January 1, 2027.", "category": "staff_qualification", "applies_to": "staff", "codes": ["DSG", "DSP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §7.5(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.6", "section": "Article 7 — Day Support", "subsection": "§7.6 Service Code Selection", "text": "Service Code Selection. Day Support includes both DSG and DSP. (a) DSG: The Contractor shall use DSG when a Person participates in a group Day Support program that is typically six hours a day. The actual amount of time may be less or more than six hours based on fluctuations in the Person's schedule, transportation changes, and medical appointments. If this occurs and the monthly average amount of time per day would be more efficient using the DSP code, the Contractor shall coordinate with the Person's Support Coordinator to use DSP or update the Person's DSPD Worksheet. (b) DSP: The Contractor shall use DSP when a Person participates in a group Day Support program and has Day Support needs that may include partial day support needs, typically up to four hours a day, or extended Day Support needs which are typically seven to a maximum of ten hours per day. The Person's DSPD Worksheet will contain the actual number of DSP hours for the Person. If the monthly average amount of hours a Person receives DSP does not align with their DSPD Worksheet, the Contractor shall coordinate with the Person's Support Coordinator to update the DSPD Worksheet. (c) The Contractor may use DSG and DSP together to accommodate varied schedules. (d) DSG and DSP may be used together, including on the same day when a Person has two different Day Support programs.", "category": "actionable", "applies_to": "agency", "codes": ["DSG", "DSP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §7.6", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.7", "section": "Article 7 — Day Support", "subsection": "§7.7 Outcomes", "text": "Outcomes. (a) The intended outcome of this service is maintained or improved skills and social connection. (b) Measures:", "category": "outcome", "applies_to": "agency", "codes": ["DSG", "DSP"], "creates_user_task": "no", "source": "DHHS91172 SOW §7.7", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.7(1)", "section": "Article 7 — Day Support", "subsection": "§7.7 Outcomes (1)", "text": "Outcomes.: the percentage of Persons who engaged in social opportunities;", "category": "outcome", "applies_to": "agency", "codes": ["DSG", "DSP"], "creates_user_task": "no", "source": "DHHS91172 SOW §7.7(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.7(2)", "section": "Article 7 — Day Support", "subsection": "§7.7 Outcomes (2)", "text": "Outcomes.: the percentage of Persons whose skills maintained or improved; and", "category": "outcome", "applies_to": "agency", "codes": ["DSG", "DSP"], "creates_user_task": "no", "source": "DHHS91172 SOW §7.7(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.7(3)", "section": "Article 7 — Day Support", "subsection": "§7.7 Outcomes (3)", "text": "the percentage of Persons who reported being satisfied with their Day Supports. This percentage shall be determined by the Contractor using a survey it creates and provides to Persons. (c) Reporting: The Contractor shall create a fiscal year annual report starting fiscal year 2025 (fiscal year 2025 starts July 1, 2024). The fiscal year annual report will be submitted via Google Form by August 30th, 60 days after each fiscal year end. The outcome Google Form will be posted on the DSPD webpage. The Contractor shall explain any quality improvement activities they will undertake in response to their evaluation of the measurement data. The fiscal year annual report must include the following: :", "category": "outcome", "applies_to": "agency", "codes": ["DSG", "DSP"], "creates_user_task": "no", "source": "DHHS91172 SOW §7.7(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.7(1)-2", "section": "Article 7 — Day Support", "subsection": "§7.7 Outcomes (1)", "text": "Outcomes.: how many Persons received Day Supports services; and", "category": "outcome", "applies_to": "agency", "codes": ["DSG", "DSP"], "creates_user_task": "no", "source": "DHHS91172 SOW §7.7(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-7.7(2)-2", "section": "Article 7 — Day Support", "subsection": "§7.7 Outcomes (2)", "text": "Outcomes.: data reflecting the measure in (b) above.", "category": "outcome", "applies_to": "agency", "codes": ["DSG", "DSP"], "creates_user_task": "no", "source": "DHHS91172 SOW §7.7(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.1", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.1 General Description", "text": "General Description. DSI provides a safe, non-residential habilitation program to prevent isolation of a Person while providing daily support and skills building, supporting the Person's choice of participating in, and contributing to, their community. DSI programs provide a minimum of one Staff-to-one Person support for an individual Person. The Person may be an adult or a child.", "category": "definition", "applies_to": "agency", "codes": ["DSI"], "creates_user_task": "no", "source": "DHHS91172 SOW §8.1", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.2", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.2 Direct Service Requirements", "text": "Direct Service Requirements. The Contractor shall:", "category": "actionable", "applies_to": "agency", "codes": ["DSI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §8.2", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.2(1)", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.2 Direct Service Requirements (1)", "text": "Direct Service Requirements: provide services according to the Person's preferences and their PCSP;", "category": "client", "applies_to": "client", "codes": ["DSI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §8.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.2(2)", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.2 Direct Service Requirements (2)", "text": "Direct Service Requirements: provide supervision and skill building activities to improve or maintain the Person's functional abilities and life skills. These abilities and life skills are:", "category": "actionable", "applies_to": "agency", "codes": ["DSI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §8.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.2(2)(A)", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.2 Direct Service Requirements (2)(A)", "text": "Direct Service Requirements: the Person's dexterity, stamina, memory, and mobility;", "category": "actionable", "applies_to": "agency", "codes": ["DSI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §8.2(2)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.2(2)(B)", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.2 Direct Service Requirements (2)(B)", "text": "Direct Service Requirements: the Person's personal safety, self help, self-determination, self-advocacy skills and experiences;", "category": "actionable", "applies_to": "agency", "codes": ["DSI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §8.2(2)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.2(2)(C)", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.2 Direct Service Requirements (2)(C)", "text": "Direct Service Requirements: problem solving skills to maximize the Person's ability to participate in activities independently or with natural supports;", "category": "actionable", "applies_to": "agency", "codes": ["DSI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §8.2(2)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.2(2)(D)", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.2 Direct Service Requirements (2)(D)", "text": "Direct Service Requirements: a meaningful social life with interpersonal relations, and communication skills that offers opportunities for personal growth, independence, social connection, and natural supports; and", "category": "actionable", "applies_to": "agency", "codes": ["DSI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §8.2(2)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.2(2)(E)", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.2 Direct Service Requirements (2)(E)", "text": "Direct Service Requirements: general employment skills that support the Person's underlying habilitative goals related to Competitive Integrated Employment.", "category": "actionable", "applies_to": "agency", "codes": ["DSI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §8.2(2)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.2(3)", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.2 Direct Service Requirements (3)", "text": "Direct Service Requirements: assist the Person with spending time integrated in the community doing activities that relate to the Person's interests;", "category": "actionable", "applies_to": "agency", "codes": ["DSI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §8.2(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.2(4)", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.2 Direct Service Requirements (4)", "text": "Direct Service Requirements: assist the Person with Activities of Daily Living;", "category": "actionable", "applies_to": "agency", "codes": ["DSI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §8.2(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.2(5)", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.2 Direct Service Requirements (5)", "text": "Direct Service Requirements: support the Person to build community connections, expand existing networks to develop natural supports, engage in community life, and acquire, maintain and improve opportunities for independence, community membership, and meaningful community integration and inclusion; and", "category": "actionable", "applies_to": "agency", "codes": ["DSI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §8.2(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.2(6)", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.2 Direct Service Requirements (6)", "text": "Direct Service Requirements: provide transportation of the Person during the DSI program. This includes transportation of the Person to and from the DSI program.", "category": "actionable", "applies_to": "agency", "codes": ["DSI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §8.2(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.3", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.3 Direct Service Administrative Requirements", "text": "Direct Service Administrative Requirements. The Contractor shall:", "category": "documentation", "applies_to": "agency", "codes": ["DSI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §8.3", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.3(1)", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.3 Direct Service Administrative Requirements (1)", "text": "provide services in a site-based facility in a building, in a community based setting which means an integrated community setting with individuals without disabilities (not including paid Staff), or a combination of the two. For community based DSI programs, the Person's residence may be used as a hub for planning and organizing activities related to the Person's preferences, interests, and personal care needs;", "category": "site", "applies_to": "site", "codes": ["DSI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §8.3(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.3(2)", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.3 Direct Service Administrative Requirements (2)", "text": "meet direct supervision requirements when the Person's PCSP requires direct supervision. Direct supervision means that the Contractor has uninterrupted visual and auditory surveillance of the Person; and", "category": "client", "applies_to": "client", "codes": ["DSI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §8.3(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.3(3)", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.3 Direct Service Administrative Requirements (3)", "text": "comply with all licensing and certification rules and requirements when providing services that require a license or certification from OL. Regardless of the services being provided, a site-based facility must not exceed its capacity allowed under the license or certification.", "category": "staff_qualification", "applies_to": "staff", "codes": ["DSI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §8.3(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.4", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.4 Specific Service Limitations", "text": "Specific Service Limitations. In addition to the General Limitations section of this contract, the Contractor shall NOT:", "category": "exception", "applies_to": "agency", "codes": ["DSI"], "creates_user_task": "no", "source": "DHHS91172 SOW §8.4", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.4(1)", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.4 Specific Service Limitations (1)", "text": "Specific Service Limitations: pay a Person for any work activities;", "category": "exception", "applies_to": "agency", "codes": ["DSI"], "creates_user_task": "no", "source": "DHHS91172 SOW §8.4(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.4(2)", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.4 Specific Service Limitations (2)", "text": "Specific Service Limitations: provide services solely or routinely in a Person's residence;", "category": "exception", "applies_to": "agency", "codes": ["DSI"], "creates_user_task": "no", "source": "DHHS91172 SOW §8.4(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.4(3)", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.4 Specific Service Limitations (3)", "text": "Specific Service Limitations: provide community based DSI at the Staff's residence or a location controlled by the Contractor;", "category": "exception", "applies_to": "agency", "codes": ["DSI"], "creates_user_task": "no", "source": "DHHS91172 SOW §8.4(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.4(4)", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.4 Specific Service Limitations (4)", "text": "Specific Service Limitations: bill DHHS/DSPD for MTP for transportation provided to or from the DSI program; and", "category": "exception", "applies_to": "agency", "codes": ["DSI", "MTP"], "creates_user_task": "no", "source": "DHHS91172 SOW §8.4(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.4(5)", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.4 Specific Service Limitations (5)", "text": "Specific Service Limitations: provide services in a site-based facility for the majority of the time each week (Sunday through Saturday).", "category": "exception", "applies_to": "site", "codes": ["DSI"], "creates_user_task": "no", "source": "DHHS91172 SOW §8.4(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.5", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.5 Specific Service Contractor Qualifications", "text": "Specific Service Contractor Qualifications. (a) When services are provided partially in a site-based facility, the Contractor shall for each location providing DSI have and maintain a:", "category": "agency_qualification", "applies_to": "site", "codes": ["DSI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §8.5", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.5(1)", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.5 Specific Service Contractor Qualifications (1)", "text": "Day Treatment license from OL, for each location DSI is provided for four or more Persons; or", "category": "agency_qualification", "applies_to": "agency", "codes": ["DSI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §8.5(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.5(2)", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.5 Specific Service Contractor Qualifications (2)", "text": "Day Support certification from OL, for each location DSI is provided for three or fewer Persons. (b) When services are provided solely in the community, the Contractor shall have and maintain a:", "category": "staff_qualification", "applies_to": "staff", "codes": ["DSI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §8.5(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.5(1)-2", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.5 Specific Service Contractor Qualifications (1)", "text": "Day Treatment license from OL when the DSI program provides services to four or more Persons in total, regardless if the Persons all receive services at the same time, same location, or in the same groups; or", "category": "agency_qualification", "applies_to": "agency", "codes": ["DSI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §8.5(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.5(2)-2", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.5 Specific Service Contractor Qualifications (2)", "text": "Community Based Day Support certification from OL when the day supports program provides services to three or fewer Persons in total. (c) The Contractor may qualify for DSI if it provided Day Supports under a DHS90743 contract and has applied for a Day Treatment license, Day Support certification, or Community Based Day Support Certification. The Contractor shall obtain the required license or certification by January 1, 2027.", "category": "staff_qualification", "applies_to": "staff", "codes": ["DSI"], "creates_user_task": "yes", "source": "DHHS91172 SOW §8.5(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.6", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.6 Outcomes", "text": "Outcomes. (a) The intended outcome of this service is maintained or improved skills and social connection. (b) Measures:", "category": "outcome", "applies_to": "agency", "codes": ["DSI"], "creates_user_task": "no", "source": "DHHS91172 SOW §8.6", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.6(1)", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.6 Outcomes (1)", "text": "Outcomes.: the percentage of Persons who engaged in social opportunities;", "category": "outcome", "applies_to": "agency", "codes": ["DSI"], "creates_user_task": "no", "source": "DHHS91172 SOW §8.6(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.6(2)", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.6 Outcomes (2)", "text": "Outcomes.: the percentage of Persons whose skills maintained or improved; and", "category": "outcome", "applies_to": "agency", "codes": ["DSI"], "creates_user_task": "no", "source": "DHHS91172 SOW §8.6(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.6(3)", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.6 Outcomes (3)", "text": "the percentage of Persons who reported being satisfied with their Day Supports. This percentage shall be determined by the Contractor using a survey it creates and provides to Persons. (c) Reporting The Contractor shall create a fiscal year annual report starting fiscal year 2025 (fiscal year 2025 starts July 1, 2024). The fiscal year annual report will be submitted via Google Form by August 30th, 60 days after each fiscal year end. The outcome Google Form will be posted on the DSPD webpage. The Contractor shall explain any quality improvement activities they will undertake in response to their evaluation of the measurement data. The fiscal year annual report must include the following::", "category": "outcome", "applies_to": "agency", "codes": ["DSI"], "creates_user_task": "no", "source": "DHHS91172 SOW §8.6(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.6(1)-2", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.6 Outcomes (1)", "text": "Outcomes.: how many Persons received Day Supports services; and", "category": "outcome", "applies_to": "agency", "codes": ["DSI"], "creates_user_task": "no", "source": "DHHS91172 SOW §8.6(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-8.6(2)-2", "section": "Article 8 — Day Support For An Individual", "subsection": "§8.6 Outcomes (2)", "text": "Outcomes.: data reflecting the measure in (b) above.", "category": "outcome", "applies_to": "agency", "codes": ["DSI"], "creates_user_task": "no", "source": "DHHS91172 SOW §8.6(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.1", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.1 General Description", "text": "General Description. Employment Preparation Services (\"EPR\") provides time-limited individualized learning and work experiences in sub-minimum wage and facility-based work for Persons to develop prevocational or general strengths and skills through training by the Contractor that contribute to the Person's ability to succeed in Competitive Integrated Employment.", "category": "definition", "applies_to": "site", "codes": ["EPR"], "creates_user_task": "no", "source": "DHHS91172 SOW §9.1", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.2", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.2 Direct Service Requirements", "text": "Direct Service Requirements. The Contractor shall:", "category": "actionable", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.2", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.2(1)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.2 Direct Service Requirements (1)", "text": "Direct Service Requirements: support the Person in Informed Choice conversations and hands-on experiences connected to the Competitive Integrated Employment goal in the Person's PCSP;", "category": "client", "applies_to": "client", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.2(2)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.2 Direct Service Requirements (2)", "text": "Direct Service Requirements: within the first 60 days of a Person receiving EPR, document in writing an Informed Choice conversation with the Person and their PCST that includes EPR is not a permanent service, Person's goals, and a plan regarding what will occur after EPR ends;", "category": "client", "applies_to": "client", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.2(3)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.2 Direct Service Requirements (3)", "text": "Direct Service Requirements: provide individualized services that assess, plan, and prepare the Person to attain desired Competitive Integrated Employment with a job matched to the Person based on their assessed strengths, needs, and interests;", "category": "actionable", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.2(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.2(4)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.2 Direct Service Requirements (4)", "text": "provide individualized services in one-on-one and small groups that develop and teach general prevocational and employment skills. Services must support the Person's Competitive Integrated Employment goals according to the Person's assessed strengths, needs, interests, and the employment goals in the Person's PCSP. Provide supports that prepare Person to transition to other employment-related services. General employment skills include:", "category": "client", "applies_to": "client", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.2(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.2(4)(A)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.2 Direct Service Requirements (4)(A)", "text": "Direct Service Requirements: the ability to communicate effectively with supervisors, co-workers, and customers;", "category": "actionable", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.2(4)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.2(4)(B)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.2 Direct Service Requirements (4)(B)", "text": "Direct Service Requirements: generally accepted community workplace conduct and dress;", "category": "actionable", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.2(4)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.2(4)(C)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.2 Direct Service Requirements (4)(C)", "text": "Direct Service Requirements: the ability to follow directions and attend to tasks;", "category": "actionable", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.2(4)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.2(4)(D)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.2 Direct Service Requirements (4)(D)", "text": "Direct Service Requirements: workplace problem solving skills and strategies;", "category": "actionable", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.2(4)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.2(4)(E)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.2 Direct Service Requirements (4)(E)", "text": "Direct Service Requirements: stamina, memory, time management, and interpersonal relations;", "category": "actionable", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.2(4)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.2(4)(F)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.2 Direct Service Requirements (4)(F)", "text": "Direct Service Requirements: general workplace safety and mobility training; and", "category": "staff_qualification", "applies_to": "staff", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.2(4)(F)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.2(4)(G)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.2 Direct Service Requirements (4)(G)", "text": "Direct Service Requirements: other similar general employment skills.", "category": "actionable", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.2(4)(G)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.2(5)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.2 Direct Service Requirements (5)", "text": "Direct Service Requirements: support the Person to:", "category": "actionable", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.2(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.2(5)(A)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.2 Direct Service Requirements (5)(A)", "text": "Direct Service Requirements: connect with peers, other community members, and connections with similar interests;", "category": "actionable", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.2(5)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.2(5)(B)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.2 Direct Service Requirements (5)(B)", "text": "Direct Service Requirements: build upon their existing network to develop natural supports;", "category": "actionable", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.2(5)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.2(5)(C)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.2 Direct Service Requirements (5)(C)", "text": "Direct Service Requirements: engage in community life;", "category": "actionable", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.2(5)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.2(5)(D)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.2 Direct Service Requirements (5)(D)", "text": "Direct Service Requirements: acquire, maintain and improve opportunities for independence, community membership, and meaningful integration; and", "category": "actionable", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.2(5)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.2(5)(E)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.2 Direct Service Requirements (5)(E)", "text": "Direct Service Requirements: identify and participate in activities that are effective in assisting the Person to create and realize their goals of obtaining and maintaining Competitive Integrated Employment.", "category": "actionable", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.2(5)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.2(6)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.2 Direct Service Requirements (6)", "text": "Direct Service Requirements: assist the Person with ADL;", "category": "actionable", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.2(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.2(7)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.2 Direct Service Requirements (7)", "text": "provide transportation of the Person during the EPR program. The Contractor may bill DSPD for MTP to or from the EPR program. If needed, the Contractor shall provide Staff during transportation, to ensure the Person's health and safety;", "category": "actionable", "applies_to": "agency", "codes": ["EPR", "MTP"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.2(7)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.2(8)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.2 Direct Service Requirements (8)", "text": "Direct Service Requirements: coordinate with the USOR to ensure the Person receives 511 Career Counseling at least annually, and to prepare the Person to obtain, maintain, advance in, or regain Competitive Integrated Employment; and", "category": "actionable", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.2(8)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.2(9)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.2 Direct Service Requirements (9)", "text": "Direct Service Requirements: comply with 42 C.F.R. § 440.180(c).", "category": "actionable", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.2(9)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.3", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.3 Direct Service Administrative Requirements", "text": "Direct Service Administrative Requirements. The Contractor shall:", "category": "documentation", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.3", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.3(1)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.3 Direct Service Administrative Requirements (1)", "text": "provide EPR in the community (not in a site-based facility setting) at least 20% of the time. Time spent in community must include Informed Choice conversations and experiences connected to Community Integrated Employment interests and training on pre vocational skills in community settings. The Contractor may provide this service in the community less than 20% of the time on a monthly basis if prior written approval is given through the DSPD Request for Services committee;", "category": "staff_qualification", "applies_to": "staff", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.3(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.3(2)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.3 Direct Service Administrative Requirements (2)", "text": "ensure Staff ratios are determined by the DSPD Worksheet and are individualized based on the Person's need, with a minimum allowable Staff ratio of one Staff to six Persons. DSPD will only consider a Staff ratio of one or more Staff to one Person (1:1) when the Person's PCST has documented such a need in the Person's PCSP. The Contractor shall provide visual and auditory surveillance to ensure the Person's health and safety. A 1:1 ratio means that the Contractor has one Staff to provide direct supervision to one Person. Direct supervision means that the Contractor has uninterrupted visual and auditory surveillance of the Person;", "category": "client", "applies_to": "client", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.3(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.3(3)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.3 Direct Service Administrative Requirements (3)", "text": "Direct Service Administrative Requirements: have standard business hours that allow for staggered early arrivals and late departures, to accommodate individual needs and preferences;", "category": "documentation", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.3(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.3(4)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.3 Direct Service Administrative Requirements (4)", "text": "Direct Service Administrative Requirements: ensure that each EPR program has Staff responsible for the day to day operations of the program;", "category": "documentation", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.3(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.3(5)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.3 Direct Service Administrative Requirements (5)", "text": "comply with all licensing and certification rules and requirements when providing services that require a license or certification from the OL. Regardless of the services being provided, a site-based facility must not exceed its capacity allowed under the license or certification; and", "category": "staff_qualification", "applies_to": "staff", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.3(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.3(6)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.3 Direct Service Administrative Requirements (6)", "text": "Direct Service Administrative Requirements: when providing EPR daily, maintain written billing service documentation that includes:", "category": "billing", "applies_to": "service_record", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.3(6)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.3(6)(A)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.3 Direct Service Administrative Requirements (6)(A)", "text": "Direct Service Administrative Requirements: the name of the Person receiving the service;", "category": "documentation", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.3(6)(A)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.3(6)(B)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.3 Direct Service Administrative Requirements (6)(B)", "text": "Direct Service Administrative Requirements: the date the service was delivered;", "category": "documentation", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.3(6)(B)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.3(6)(C)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.3 Direct Service Administrative Requirements (6)(C)", "text": "Direct Service Administrative Requirements: the start and end time the service was delivered;", "category": "documentation", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.3(6)(C)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.3(6)(D)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.3 Direct Service Administrative Requirements (6)(D)", "text": "Direct Service Administrative Requirements: the name of the DHHS service code that was delivered (EPR);", "category": "documentation", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.3(6)(D)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.3(6)(E)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.3 Direct Service Administrative Requirements (6)(E)", "text": "Direct Service Administrative Requirements: the name of a Staff providing the services; and", "category": "documentation", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.3(6)(E)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.3(6)(F)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.3 Direct Service Administrative Requirements (6)(F)", "text": "Direct Service Administrative Requirements: a written summary note of substantive service activities consistent with the service description.", "category": "documentation", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.3(6)(F)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.4", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.4 Specific Service Limitations", "text": "Specific Service Limitations. In addition to the General Limitations section of this contract, the Contractor shall NOT:", "category": "exception", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "no", "source": "DHHS91172 SOW §9.4", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.4(1)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.4 Specific Service Limitations (1)", "text": "Specific Service Limitations: provide services that are primarily directed at teaching specific skills to perform a particular job unless those skills are being taught in relation to, or in preparation for, a Competitive Integrated Employment position;", "category": "exception", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "no", "source": "DHHS91172 SOW §9.4(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.4(2)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.4 Specific Service Limitations (2)", "text": "Specific Service Limitations: provide services to a Person for periods exceeding 24 consecutive months unless the Contractor receives prior authorization from the Request for Services Committee. All exemptions to the 24 month limit will be reviewed by the employment planning and inclusion team and recommendations forwarded to the Request for Services Committee;", "category": "exception", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "no", "source": "DHHS91172 SOW §9.4(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.4(3)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.4 Specific Service Limitations (3)", "text": "Specific Service Limitations: bill DSPD for supervisory Staff activities rendered as a normal part of a business setting;", "category": "exception", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "no", "source": "DHHS91172 SOW §9.4(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.4(4)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.4 Specific Service Limitations (4)", "text": "pay Persons less than what is paid to employees without disabilities performing similar labor. If the Contractor pays a Person less than minimum wage, the Contractor must have a certificate issued under Section 14(c) of the Fair Labor Act from the United States Department of Labor; and", "category": "exception", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "no", "source": "DHHS91172 SOW §9.4(4)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.4(5)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.4 Specific Service Limitations (5)", "text": "Specific Service Limitations: require EPR service as a prerequisite to Competitive Integrated Employment, Vocational Rehabilitation, or other services. EPR is viewed as optional and can be ended in favor of a replacement or alternative service at any time.", "category": "exception", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "no", "source": "DHHS91172 SOW §9.4(5)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.5", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.5 Specific Staff Requirements", "text": "Specific Staff Requirements. The Contractor shall ensure:", "category": "actionable", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.5", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.5(1)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.5 Specific Staff Requirements (1)", "text": "prior to working with Persons, Staff must be trained on best practices for supporting Persons with pre-vocational goals; and", "category": "actionable", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.5(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.5(2)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.5 Specific Staff Requirements (2)", "text": "at least one EPR supervisory Staff at each EPR program has completed Association of Community Rehabilitation Educators (\"ACRE\") training, Utah State University Workplace Supports training, or Effective Job Coach training prior to providing EPR. The Contractor shall ensure that all EPR supervisory Staff complete and maintain either of the required training within 90 days of employment.", "category": "staff_qualification", "applies_to": "staff", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.5(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.6", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.6 Specific Service Contractor Qualifications", "text": "Specific Service Contractor Qualifications. (a) The Contractor shall have and maintain a:", "category": "agency_qualification", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.6", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.6(1)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.6 Specific Service Contractor Qualifications (1)", "text": "Day Treatment license from OL, for each location EPR is provided for four or more Persons; or", "category": "agency_qualification", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.6(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.6(2)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.6 Specific Service Contractor Qualifications (2)", "text": "Day Support certification from OL, for each location EPR is provided for three or fewer Persons. (b) The Contractor may qualify for EPR if it provided Day Supports under a DHS90743 contract and has applied for a Day Treatment license or Day Support certification.", "category": "staff_qualification", "applies_to": "staff", "codes": ["EPR"], "creates_user_task": "yes", "source": "DHHS91172 SOW §9.6(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.7", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.7 Outcomes", "text": "Outcomes. (a) The intended outcome of this service is increased general prevocational skills that will transfer to all Competitive Integrated Employment. (b) Measures: 1. the percentage of Persons who have worked on their pre-employment goals; and 2. the percentage of Persons who moved to Competitive Integrated Employment at the end of this service. (c) Reporting: The Contractor shall create a fiscal year annual report starting fiscal year 2025 (fiscal year 2025 starts July 1, 2024). The fiscal year annual report will be submitted via Google Form by August 30th, 60 days after each fiscal year end. The outcome Google Form will be posted on the DSPD webpage. The Contractor shall explain any quality improvement activities they will undertake in response to their evaluation of the measurement data. The fiscal year annual report must include the following:", "category": "outcome", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "no", "source": "DHHS91172 SOW §9.7", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.7(1)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.7 Outcomes (1)", "text": "Outcomes.: how many Persons received EPR services; and", "category": "outcome", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "no", "source": "DHHS91172 SOW §9.7(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-9.7(2)", "section": "Article 9 — Employment Preparation Services", "subsection": "§9.7 Outcomes (2)", "text": "Outcomes.: data reflecting the measure in (b) above.", "category": "outcome", "applies_to": "agency", "codes": ["EPR"], "creates_user_task": "no", "source": "DHHS91172 SOW §9.7(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-10.1", "section": "Article 10 — Extended Living Supports", "subsection": "§10.1 General Description", "text": "General Description. Extended Living Supports (\"ELS\") provides temporary support and supervision to Persons who receive residential support services pursuant to this contract. ELS is provided, as needed, during times when Persons are unable to participate in their normal day activities such as school, day program and work. ELS supports and functions as an extension of RHS, HHS, or PPS services.", "category": "definition", "applies_to": "agency", "codes": ["ELS", "HHS", "PPS", "RHS"], "creates_user_task": "no", "source": "DHHS91172 SOW §10.1", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-10.2", "section": "Article 10 — Extended Living Supports", "subsection": "§10.2 Direct Service Requirements", "text": "Direct Service Requirements. The Contractor shall:", "category": "actionable", "applies_to": "agency", "codes": ["ELS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §10.2", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-10.2(1)", "section": "Article 10 — Extended Living Supports", "subsection": "§10.2 Direct Service Requirements (1)", "text": "Direct Service Requirements: provide supervision and services that support the Person's goals as per the Person's PCSP;", "category": "client", "applies_to": "client", "codes": ["ELS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §10.2(1)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-10.2(2)", "section": "Article 10 — Extended Living Supports", "subsection": "§10.2 Direct Service Requirements (2)", "text": "Direct Service Requirements: assist the Person with ADL; and", "category": "actionable", "applies_to": "agency", "codes": ["ELS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §10.2(2)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-10.2(3)", "section": "Article 10 — Extended Living Supports", "subsection": "§10.2 Direct Service Requirements (3)", "text": "Direct Service Requirements: provide transportation for the Person.", "category": "actionable", "applies_to": "agency", "codes": ["ELS"], "creates_user_task": "yes", "source": "DHHS91172 SOW §10.2(3)", "sow_version": "DHHS91172", "effective_date": "2026-07-01"}, {"id": "sow-10.3", "section": "Article 10 — Extended Living Supports", "subsection": "§10.3 Direct Service Administrative Requirements", "text": "Direct Service Administrative Requirements. T
